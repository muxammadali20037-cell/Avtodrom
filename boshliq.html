/* ---------- BOSH OYNA ---------- */
function homeScreen(x){
  const { d, a12, avd, c, cmp } = x;
  const keys = keysOf(d);
  const S_ = a12.school?.totals || {}, P = a12.paid?.totals || {}, K = avd.kassa || {};
  const na = '<span style="color:var(--muted);font-size:22px">ulanmagan</span>';
  const card = (path, cls, name, sub, val, dl, sparkVals, color) => `<button class="sc" data-go="${path}"><i class="sw sw-${cls}"></i><span class="sc-in">
    <span class="sc-h"><b>${name}</b>${IC.chev}</span><span class="sc-sub" style="display:block">${sub}</span>
    <span class="sc-row"><span class="sc-v"><b class="num">${val}</b><span>${dl}</span></span>${sparkVals ? spark(sparkVals, color) : ''}</span></span></button>`;
  const ser = a12.series || [];
  let h = '';
  h += `<div class="home">`;
  h += card('school', 'school', 'Avtoshkola', a12.ok ? `${nf(S_.students)} o‘quvchi, ${durShort(S_.minutes)}` : 'avtodrom12', a12.ok ? `${nf(S_.lessons)} dars` : na,
    a12.ok ? `${delta(pct(S_.lessons, a12.school?.previous?.lessons))}` : '', a12.ok ? align(keys, ser, r => r.school_lessons) : null, 'var(--school)');
  h += card('paid', 'paid', 'Platniy', a12.ok ? `${nf(P.sessions)} kirish, ${nf(P.vehicles)} mashina` : 'Oddiy mijoz', a12.ok ? compact(P.revenue) : na,
    a12.ok ? `${delta(pct(P.revenue, a12.paid?.previous?.revenue))}` : '', a12.ok ? align(keys, ser, r => r.paid_revenue) : null, 'var(--paid)');
  h += card('avd', 'avd', 'Avtodrom', `${nf(avd.bookings?.total)} bron, kassa ${(K.registers || []).map(r => esc(r.code)).join(' va ') || 'P1 va P2'}`, compact(K.totals?.total),
    `${delta(K.change)}`, align(keys, K.series, r => r.total), 'var(--avd)');
  h += `</div><div class="home-h">Umumiy</div><div class="home">`;
  h += card('total', 'total', 'Umumiy tushum', esc(cmp), compact(c.revenue), `${delta(c.change)}`,
    align(keys, c.series, r => (r.avtodrom || 0) + (r.paid || 0) + (r.school || 0)), 'var(--total)');
  h += card('exp', 'exp', 'Xarajatlar', c.expenses_known ? `Sof foyda: ${compact(c.net)}` : 'avtodrom12 dan', c.expenses_known ? compact(c.expenses) : na,
    c.expenses_known ? delta(c.expenses_change, { badUp: true }) : '', c.expenses_known && d.bucket !== 'hour' ? align(keys, c.series, r => r.expenses) : null, 'var(--exp)');
  h += `</div>`;
  h += alertsBlock(c.alerts);
  return h;
}

/* ---------- 1. AVTOSHKOLA ---------- */
function schoolScreen(x, p){
  const { d, a12, cmp } = x;
  if (!a12.ok) return { title: 'Avtoshkola', html: title('school', 'Avtoshkola', '') + a12Err(a12) };
  const s = a12.school, t = s.totals, ol = s.over_limit || {}, st = s.students || {};
  const schools = s.schools || [];
  if (p[0] === 's') {
    const sc = schools.find(z => String(z.id) === String(p[1]));
    if (!sc) return { title: 'Avtoshkola', parent: 'school', html: '<div class="empty">Bu avtoshkola bu davrda topilmadi.</div>' };
    let h = title('school', sc.name, `Shu avtoshkola o‘quvchilari avtodromda — ${esc(rangeTitle(x.r))}.`);
    h += hero('Darslar', nf(sc.lessons), 'dars', null, `${nf(sc.sessions)} ta kelish, ${nf(sc.students)} o‘quvchi, ${dur(sc.minutes)}`);
    h += trend(`sch-${sc.id}`, d, 'Darslar dinamikasi', ks => [{ name: 'Darslar', color: 'var(--school)', values: align(ks, sc.series, r => r.lessons) }], { unit: 'n', unitName: 'dars' });
    h += blk('Shartnoma', `<div class="kv">${kvc('Faol o‘quvchilar', nf(sc.active_students))}${kvc('Faol guruhlar', nf(sc.active_groups))}${kvc('Bepul darslar limiti', sc.free_visits ? nf(sc.free_visits) : '9 (standart)')}${kvc('Limitdan oshgan', nf(sc.over_lessons), sc.over_lessons ? 'warn' : '')}</div>
      ${sc.over_lessons ? `<p class="hero-sub" style="color:var(--warn)">Shartnomadagi bepul darsdan oshgan ${nf(sc.over_lessons)} ta dars uchun to‘lov kerak: ${money(sc.over_due)}</p>` : ''}
      ${sc.phone ? `<p class="hero-sub"><a class="lnk" href="tel:${esc(String(sc.phone).replace(/[^\d+]/g, ''))}">${esc(sc.phone)} — qo‘ng‘iroq qilish</a></p>` : ''}`);
    const gr = (sc.groups || []).map(g => ({ name: g.name, v: g.lessons, val: `${nf(g.lessons)} dars`, val2: `${nf(g.students)} o‘quvchi` }));
    h += blk('Guruhlar', rank(`grp-${sc.id}`, gr, 'var(--school)'), gr.length ? `${gr.length} ta` : '', 'Davr ichida kelgan guruhlar, darslar soni bo‘yicha.');
    return { title: sc.name, parent: 'school', html: h };
  }
  if (p[0] === 'schools') {
    const items = schools.map(z => ({ name: z.name, v: z.lessons, go: `school/s/${seg(z.id)}`, val: `${nf(z.lessons)} dars`, val2: `${nf(z.students)} o‘quvchi`,
      sub: [dur(z.minutes), z.over_lessons ? `<span style="color:var(--warn)">limitdan oshgan ${nf(z.over_lessons)}</span>` : ''].filter(Boolean).join(', ') }));
    const top = schools.filter(z => z.lessons).slice(0, 8);
    let h = title('school', 'Avtoshkolalar', 'Har bir avtoshkola bo‘yicha darslar. Bossangiz — o‘sha avtoshkolaning alohida oynasi.');
    if (top.length > 1) h += blk('Darslar ulushi', splitBar(top.map((z, i) => ({ v: z.lessons, c: 'var(--school)', o: 1 - i * 0.1 })), top.reduce((a, z) => a + z.lessons, 0))
      + legendRows(top.map((z, i) => ({ n: z.name, v: z.lessons, c: 'var(--school)', o: 1 - i * 0.1, go: `school/s/${seg(z.id)}` })), top.reduce((a, z) => a + z.lessons, 0), v => `${nf(v)} dars`));
    h += blk('Hammasi', rank('schools', items, 'var(--school)', 30), `${items.length} ta`);
    return { title: 'Avtoshkolalar', parent: 'school', html: h };
  }
  if (p[0] === 'over') {
    const items = schools.filter(z => z.over_lessons).map(z => ({ name: z.name, v: z.over_due || z.over_lessons, go: `school/s/${seg(z.id)}`, val: money(z.over_due), val2: `${nf(z.over_lessons)} dars` }));
    let h = title('school', 'Limitdan oshgan darslar', 'Har bir o‘quvchiga shartnomada bepul darslar soni beriladi (odatda 6 yoki 9). Undan oshgan darslar uchun avtoshkola to‘lashi kerak — summa soat narxi bo‘yicha.');
    h += tiles([tile('Oshgan darslar', nf(ol.lessons), `${nf(ol.students)} o‘quvchi`, ol.lessons ? 'flag' : ''), tile('To‘lov kerak', compact(ol.due), money(ol.due), ol.lessons ? 'flag' : '')]);
    h += blk('Avtoshkolalar bo‘yicha', items.length ? rank('over', items, 'var(--warn)') : '<div class="empty">Bu davrda hamma darslar limit ichida.</div>');
    return { title: 'Limitdan oshgan', parent: 'school', html: h };
  }
  if (p[0] === 'students') {
    let h = title('school', 'O‘quvchilar', 'Avtoshkola o‘quvchilari ro‘yxati bo‘yicha holat.');
    h += blk('Holat', `<div class="kv">${kvc('Faol', nf(st.active))}${kvc('Jami', nf(st.total))}${kvc('Davrda keldi', nf(t.students))}${kvc('Yangi qo‘shilgan', nf(st.new_in_period))}${kvc('Faol guruhlar', nf(st.groups_active))}${kvc('Muddati 7 kunda tugaydi', nf(st.expiring_7d), st.expiring_7d ? 'warn' : '')}</div>`);
    return { title: 'O‘quvchilar', parent: 'school', html: h };
  }
  if (p[0] === 'receipts') {
    const R = s.receipts || {};
    let h = title('school', 'QR cheklar', 'Avtoshkola o‘quvchisiga berilgan QR chek — Avtodrom instruktori skanerlab dars o‘tadi.');
    h += blk('Davr ichida', `<div class="kv">${kvc('Chiqarildi', nf(R.issued))}${kvc('Ishlatildi', nf(R.used))}${kvc('Ochiq (hali ishlatilmagan)', nf(R.open))}${kvc('Bekor', nf(R.cancelled))}</div>`
      + splitBar([{ v: R.used, c: 'var(--school)' }, { v: R.open, c: 'var(--school)', o: .5 }, { v: R.cancelled, c: 'var(--muted)' }], R.issued));
    return { title: 'QR cheklar', parent: 'school', html: h };
  }
  if (p[0] === 'instructors') {
    const ins = (s.instructors || []).map(z => ({ name: z.name, v: z.lessons, val: `${nf(z.lessons)} dars`, val2: dur(z.minutes) }));
    return { title: 'Instruktorlar', parent: 'school', html: title('school', 'Instruktorlar', 'Avtoshkola o‘quvchilari bilan dars o‘tgan instruktorlar.') + blk('Darslar bo‘yicha', rank('sins', ins, 'var(--school)', 30)) };
  }
  if (p[0] === 'live') {
    const lv = s.live?.sessions || [];
    return { title: 'Hozir maydonda', parent: 'school', html: title('school', 'Hozir maydonda', 'Avtoshkola o‘quvchilari — hozir dars o‘tayotganlar.')
      + blk(`${lv.length} ta`, lv.map(z => liveRow(z.student || z.driver || 'O‘quvchi', [z.school, z.instructor].filter(Boolean).join(', '), z)).join('') || '<div class="empty">Hozir avtoshkola o‘quvchisi yo‘q.</div>') };
  }
  /* bo'lim oynasi */
  let h = title('school', 'Avtoshkola', 'Shartnoma bo‘yicha keladigan o‘quvchilar. Avtodromdagi avtoshkola cheki darslari ham shu yerda.');
  h += hero('Darslar', nf(t.lessons), 'dars', pct(t.lessons, s.previous?.lessons), `${nf(t.sessions)} ta kelish, ${dur(t.minutes)}`, { cmp });
  h += trend('school', d, 'Darslar dinamikasi', ks => [{ name: 'Darslar', color: 'var(--school)', values: align(ks, a12.series, r => r.school_lessons) }], { unit: 'n', unitName: 'dars' });
  h += tiles([tile('O‘quvchilar keldi', nf(t.students), `faol: ${nf(st.active)}`), tile('Avtoshkolalar', nf(t.schools), `shartnomada: ${nf(st.schools_active)}`)]);
  const topS = schools.find(z => z.lessons);
  h += navs('Batafsil', [
    nav('school/schools', 'school', 'cap', 'Avtoshkolalar', topS ? `eng faoli: ${esc(topS.name)}` : 'bu davrda dars yo‘q', `${nf(schools.length)} ta`),
    nav('school/over', ol.lessons ? 'warn' : 'school', 'alert', 'Limitdan oshgan darslar', ol.lessons ? `${nf(ol.lessons)} dars uchun to‘lov kerak` : 'hammasi limit ichida', ol.lessons ? compact(ol.due) : '0'),
    nav('school/students', 'school', 'users', 'O‘quvchilar', `yangi ${nf(st.new_in_period)}, muddati tugayotgan ${nf(st.expiring_7d)}`, nf(st.active), 'faol'),
    nav('school/receipts', 'school', 'qr', 'QR cheklar', `ishlatildi ${nf(s.receipts?.used)}, ochiq ${nf(s.receipts?.open)}`, nf(s.receipts?.issued)),
    nav('school/instructors', 'school', 'steer', 'Instruktorlar', (s.instructors || [])[0] ? `eng ko‘p: ${esc(s.instructors[0].name)}` : '', `${nf((s.instructors || []).length)}`),
    nav('school/live', 'school', 'live', 'Hozir maydonda', 'dars o‘tayotgan o‘quvchilar', nf(s.live?.count)),
  ]);
  return { title: 'Avtoshkola', parent: '', html: h };
}

/* ---------- 2. PLATNIY ---------- */
function paidScreen(x, p){
  const { d, a12, cmp } = x;
  if (!a12.ok) return { title: 'Platniy', html: title('paid', 'Platniy', '') + a12Err(a12) };
  const P = a12.paid, t = P.totals;
  const methods = [{ n: 'Naqd', v: t.cash, c: 'var(--paid)', o: 1 }, { n: 'Terminal', v: t.terminal, c: 'var(--paid)', o: .62 }, { n: 'Klik', v: t.click, c: 'var(--paid)', o: .34 }];
  const msum = methods.reduce((a, z) => a + z.v, 0);
  const lv = P.live?.sessions || [];
  if (p[0] === 'money') {
    let h = title('paid', 'To‘lov usullari', 'Platniy mijozlar qanday to‘lagan.');
    h += blk('Ulush', splitBar(methods, msum) + legendRows(methods, msum));
    h += tiles([tile('O‘rtacha chek', compact(t.avg_check), money(t.avg_check)), tile('Qarzga qolgan', compact(t.debt), `${nf(t.debt_sessions)} ta kirishda`, t.debt ? 'flag' : '')]);
    return { title: 'To‘lov usullari', parent: 'paid', html: h };
  }
  if (p[0] === 'live') {
    let h = title('paid', 'Hozir maydonda', 'Vaqt ochib kirgan mashinalar — hozir maydonda.');
    h += tiles([tile('Faol', nf(P.live.active)), tile('To‘xtatilgan', nf(P.live.frozen), P.live.waiting ? `${nf(P.live.waiting)} ta navbatda` : '')]);
    h += blk('Mashinalar', lv.map(z => `<div class="live">${plate(z.plate || z.driver)}<div class="who"><small>${[z.driver && z.plate ? esc(z.driver) : '', z.paid_so_far ? `to‘langan ${compact(z.paid_so_far)}` : 'to‘lanmagan', z.auto_close ? 'vaqti tugasa o‘zi yopiladi' : ''].filter(Boolean).join(', ')}</small></div>
      <div class="tm num">${dur(z.minutes)}<small>${z.status !== 'active' ? 'to‘xtatilgan' : z.planned_minutes ? `${dur(z.planned_minutes)} dan` : `${hm(z.started_at)} dan`}</small></div></div>`).join('') || '<div class="empty">Hozir maydonda platniy mashina yo‘q.</div>');
    return { title: 'Hozir maydonda', parent: 'paid', html: h };
  }
  if (p[0] === 'plates') {
    const plates = P.plates.top || [];
    let h = title('paid', 'Mashina raqamlari', 'Qaysi mashina necha marta kelgan va qancha to‘lagan (tushum bo‘yicha).');
    h += tiles([tile('Mashinalar', nf(P.plates.total), 'davrda kelgan'), tile('Yangi', nf(P.plates.new), `${nf(P.plates.returning)} tasi qaytib kelgan`)]);
    const top = plates.slice(0, 10);
    if (top.length > 1) h += blk('Eng ko‘p to‘laganlar', columns({ title: 'Mashinalar', keys: top.map(z => z.plate), unit: 'som', series: [{ name: 'Tushum', color: 'var(--paid)', values: top.map(z => z.revenue) }],
      fmtKey: k => String(k).replace(/\s+/g, '').slice(-3), fmtKeyLong: k => String(k), hint: 'Ustunni bosing — raqam va summa' }));
    h += blk('Hammasi', list('plates', plates, z => `<div class="prow"><div>${plate(z.plate)}</div><div class="am num">${money(z.revenue)}</div>
      <div class="mid">${nf(z.visits)} marta, ${dur(z.minutes)}${z.driver ? `, ${esc(z.driver)}` : ''}</div>
      <div class="am2">${z.debt ? `<span class="debt">qarz ${compact(z.debt)}</span>` : `oxirgi ${days(x.r) > 1 ? dayName(tkYmd(z.last_at)) + ' ' : ''}${hm(z.last_at)}`}</div></div>`, 20), `${plates.length} ta`);
    return { title: 'Mashina raqamlari', parent: 'paid', html: h };
  }
  if (p[0] === 'debts') {
    let h = title('paid', 'Qarzlar', 'Hozir to‘lanmagan summalar (davrdan qat’i nazar). Kunda bir necha marta kelib, oxirida to‘laydiganlar shu yerda.');
    h += tiles([tile('Jami qarz', compact(P.debts.total), money(P.debts.total), P.debts.total ? 'badc' : ''), tile('Yozuvlar', nf(P.debts.sessions), `${nf(P.debts.vehicles)} mashina`)]);
    h += blk('Mashinalar', list('debts', P.debts.top || [], z => `<div class="prow"><div>${plate(z.plate)}</div><div class="am num debt">${money(z.total)}</div><div class="mid">${nf(z.n)} marta, ${dayName(tkYmd(z.oldest))} dan beri</div><div class="am2"></div></div>`, 20));
    return { title: 'Qarzlar', parent: 'paid', html: h };
  }
  if (p[0] === 'durations') {
    const D = P.durations || {}, rows = [['30 daqiqagacha', D.upto30], ['30 daqiqa — 1 soat', D.upto60], ['1 — 2 soat', D.upto120], ['2 soatdan ko‘p', D.more]];
    const mx = Math.max(...rows.map(z => z[1] || 0));
    let h = title('paid', 'Qancha vaqt qolishadi', 'Bir kirishda mashina maydonda qancha vaqt bo‘lgan.');
    h += tiles([tile('O‘rtacha', durShort(t.avg_minutes)), tile('Vaqti tugab yopilgan', nf(t.auto_closed), '«1 soatga» kabi ochilganlar')]);
    h += blk('Taqsimot', rows.map(([n, v]) => rankRow('var(--paid)', mx)({ name: n, v: v || 0, val: `${nf(v)} ta`, val2: `${pctOf(v || 0, t.sessions)}%` })).join(''));
    return { title: 'Vaqt', parent: 'paid', html: h };
  }
  if (p[0] === 'hours') {
    let h = title('paid', 'Soatlar bo‘yicha', 'Kunning qaysi soatida ko‘p kelishadi va pul qaysi soatda tushadi.');
    h += hourChart(d, 'Kirishlar', a12.hours, z => z.paid, 'var(--paid)', 'n', 'kirish') || blk('Kirishlar', '');
    h += hourChart(d, 'Tushum', a12.hours, z => z.paid_revenue, 'var(--paid)', 'som');
    return { title: 'Soatlar', parent: 'paid', html: h };
  }
  if (p[0] === 'operators') {
    const ops = (P.operators || []).map(z => ({ name: z.name, v: z.revenue, val: money(z.revenue), val2: `${nf(z.paid)} kirish` }));
    return { title: 'Kassirlar', parent: 'paid', html: title('paid', 'Kassirlar', 'avtodrom12 da kim qancha kirish ochgan va pul olgan.') + blk('Tushum bo‘yicha', rank('ops', ops, 'var(--paid)', 20)) };
  }
  let h = title('paid', 'Platniy', 'Oddiy mijoz — vaqt ochib kiradigan mashinalar.');
  h += hero('Tushum', nf(t.revenue), 'so‘m', pct(t.revenue, P.previous?.revenue), `${nf(t.sessions)} kirish, ${dur(t.minutes)}`, { cmp });
  h += trend('paid', d, 'Tushum dinamikasi', ks => [{ name: 'Tushum', color: 'var(--paid)', values: align(ks, a12.series, r => r.paid_revenue) }]);
  h += tiles([tile('Mashinalar', nf(t.vehicles), `${nf(P.plates.new)} yangi`), tile('O‘rtacha chek', compact(t.avg_check), `o‘rtacha ${durShort(t.avg_minutes)}`)]);
  const topHour = (a12.hours || []).reduce((b, z) => (z.paid > (b?.paid || 0) ? z : b), null);
  const topM = methods.slice().sort((a, b) => b.v - a.v)[0];
  h += navs('Batafsil', [
    nav('paid/money', 'paid', 'cash', 'To‘lov usullari', msum ? `${topM.n} ${pctOf(topM.v, msum)}%` : 'to‘lov yo‘q', compact(msum)),
    nav('paid/live', 'paid', 'live', 'Hozir maydonda', P.live.waiting ? `${nf(P.live.waiting)} ta navbatda` : 'vaqt ochilgan mashinalar', nf(P.live.active), P.live.frozen ? `${nf(P.live.frozen)} to‘xtatilgan` : ''),
    nav('paid/plates', 'paid', 'plate', 'Mashina raqamlari', `${nf(P.plates.returning)} tasi qaytib kelgan`, nf(P.plates.total)),
    nav('paid/debts', P.debts.total ? 'bad' : 'paid', 'debt', 'Qarzlar', P.debts.total ? `${nf(P.debts.sessions)} ta yozuv to‘lanmagan` : 'qarz yo‘q', compact(P.debts.total)),
    nav('paid/durations', 'paid', 'clock', 'Qancha vaqt qolishadi', `o‘rtacha ${durShort(t.avg_minutes)}`, ''),
    nav('paid/hours', 'paid', 'bars', 'Soatlar bo‘yicha', topHour ? `eng ko‘p: ${String(topHour.hour).padStart(2, '0')}:00` : '', ''),
    (P.operators || []).length ? nav('paid/operators', 'paid', 'person', 'Kassirlar', esc(P.operators[0].name), nf(P.operators.length)) : '',
  ]);
  return { title: 'Platniy', parent: '', html: h };
}

/* ---------- 3. AVTODROM ---------- */
const STATUS = [['completed', 'Bajarildi'], ['confirmed', 'Tasdiqlangan'], ['pending', 'Kutilmoqda'], ['in_progress', 'Darsda'], ['no_show', 'Kelmadi'], ['cancelled', 'Bekor']];
const methodName = m => m === 'mixed' ? 'aralash' : m === 'card' ? 'karta' : 'naqd';
function receiptRows(id, rec, r, showReg){
  return list(id, rec, z => `<div class="row"><div class="nm">${esc(z.customer || '—')}<small>${days(r) > 1 ? dayName(tkYmd(z.at)) + ', ' : ''}${hm(z.at)}${showReg && z.register ? `, ${esc(z.register)}` : ''}${z.instructor ? `, ${esc(z.instructor)}` : ''}${z.minutes ? `, ${dur(z.minutes)}` : ''}${z.code ? `<br>${esc(z.code)}` : ''}</small></div>
    <div class="am num">${money(z.amount)}<small>${methodName(z.method)}</small></div></div>`, 10);
}
function avdScreen(x, p){
  const { d, avd, cmp, r } = x;
  const k = avd.kassa || { totals: {}, registers: [] }, b = avd.bookings || { by_status: {} }, L = avd.lessons || {};
  const regs = k.registers || [];
  if (p[0] === 'reg') {
    const g = regs.find(z => String(z.id) === String(p[1]));
    if (!g) return { title: 'Kassa', parent: 'avd', html: '<div class="empty">Kassa topilmadi.</div>' };
    const parts = [{ n: 'Naqd', v: g.cash, c: 'var(--avd)' }, { n: 'Karta', v: g.card, c: 'var(--avd)', o: .5 }];
    let h = title('avd', `Kassa ${g.code}`, `${g.name ? esc(g.name) + '. ' : ''}${g.shift?.open ? `Smena ochiq: ${esc(g.shift.cashier || 'kassir')}, ${hm(g.shift.opened_at)} dan.` : 'Smena hozir yopiq.'}`);
    h += hero('Tushum', nf(g.total), 'so‘m', g.change, `${nf(g.receipts)} chek, o‘rtacha ${money(g.avg_check)}`, { cmp, extra: splitBar(parts, g.total) + legendRows(parts, g.total) });
    h += trend(`reg-${g.id}`, d, 'Tushum dinamikasi', ks => [{ name: g.code, color: 'var(--avd)', values: align(ks, g.series, z => z.total) }]);
    if (d.bucket !== 'hour') h += hourChart(d, 'Soatlar bo‘yicha tushum', g.hours, z => z.total, 'var(--avd)', 'som');
    h += blk('Toifalar', rank(`rc-${g.id}`, (g.categories || []).map(z => ({ name: z.name, v: z.total, val: money(z.total), val2: `${nf(z.receipts)} chek` })), 'var(--avd)'));
    h += blk('Oxirgi cheklar', receiptRows(`rr-${g.id}`, g.recent || [], r, false), `${nf((g.recent || []).length)} ta`);
    return { title: `Kassa ${g.code}`, parent: 'avd', html: h };
  }
  if (p[0] === 'ins') {
    const i = (avd.instructors || []).find(z => String(z.id) === String(p[1]));
    if (!i) return { title: 'Instruktor', parent: 'avd/instructors', html: '<div class="empty">Bu davrda instruktor darsi topilmadi.</div>' };
    let h = title('avd', i.name, 'Chek urilgan darslar bo‘yicha (Instruktorlar hisoboti bilan bir xil).');
    h += hero('Darslar', nf(i.lessons), 'dars', null, `${nf(i.paid)} pullik, ${nf(i.school)} avtoshkola, ${dur(i.minutes)}, ${nf(i.students)} o‘quvchi`);
    h += trend(`ins-${i.id}`, d, 'Darslar dinamikasi', ks => [{ name: 'Darslar', color: 'var(--avd)', values: align(ks, i.series, z => z.lessons) }], { unit: 'n', unitName: 'dars' });
    h += blk('Pul', `<div class="kv">${kvc('Tushum', compact(i.revenue))}${kvc('Naqd', compact(i.cash))}${kvc('Karta', compact(i.card))}${kvc('O‘rtacha dars', i.paid ? compact(i.revenue / i.paid) : '—')}</div>`);
    return { title: i.name, parent: 'avd/instructors', html: h };
  }
  if (p[0] === 'bookings') {
    let h = title('avd', 'Bronlar', 'Dars kuni shu davrga to‘g‘ri keladigan bronlar va ularning holati.');
    h += hero('Bronlar', nf(b.total), 'ta', b.change, `${nf(b.customers)} mijoz, ${nf(b.new_customers)} yangi ro‘yxatdan o‘tgan`, { cmp });
    h += trend('bk', d, 'Bronlar dinamikasi', ks => [{ name: 'Bajarildi', color: 'var(--avd)', values: align(ks, b.series, z => z.completed) },
      { name: 'Boshqa', color: 'color-mix(in srgb, var(--avd) 45%, var(--card))', values: align(ks, b.series, z => z.total - z.completed - z.no_show - z.cancelled).map(v => Math.max(0, v)) },
      { name: 'Kelmadi va bekor', color: 'var(--muted)', values: align(ks, b.series, z => z.no_show + z.cancelled) }], { unit: 'n', unitName: 'bron' });
    h += blk('Holatlar', `<div class="stats">${STATUS.map(([key, n]) => `<div><span>${n}</span><b class="num">${nf(b.by_status[key])}</b></div>`).join('')}</div>
      <div class="kv" style="margin-top:8px">${kvc('Kelmaganlar ulushi', `${nf(b.no_show_rate)}%`, b.no_show_rate >= 20 ? 'warn' : '')}${kvc('Bekor ulushi', `${nf(b.cancel_rate)}%`)}</div>`);
    h += blk('Toifalar', rank('bcat', (b.by_category || []).map(z => ({ name: z.name, v: z.n, val: `${nf(z.n)} ta`, val2: `${pctOf(z.n, b.total)}%` })), 'var(--avd)'));
    return { title: 'Bronlar', parent: 'avd', html: h };
  }
  if (p[0] === 'sources') {
    const src = b.by_source || [];
    let h = title('avd', 'Bron qayerdan keldi', 'Mijoz bronni qaysi yo‘l bilan qilgan: Mini App’da o‘zi, admin/Excel/bot orqali, operator qo‘lda yoki kassada bronsiz.');
    h += blk('Manbalar', splitBar(src.map((z, i) => ({ v: z.n, c: 'var(--avd)', o: 1 - i * 0.18 })), b.total) + legendRows(src.map((z, i) => ({ n: z.name, v: z.n, c: 'var(--avd)', o: 1 - i * 0.18 })), b.total, v => `${nf(v)} ta`));
    return { title: 'Manbalar', parent: 'avd', html: h };
  }
  if (p[0] === 'lessons') {
    let h = title('avd', 'Darslar', 'Instruktor chekni urgan darslar — hisobning asosi. Urilmagan chek: pul to‘langan, lekin dars hali boshlanmagan.');
    h += hero('O‘tilgan darslar', nf(L.paid), 'dars', null, `${dur(L.minutes)}, ${nf(L.students)} o‘quvchi`);
    h += trend('ls', d, 'Darslar dinamikasi', ks => [{ name: 'Pullik', color: 'var(--avd)', values: align(ks, L.series, z => z.paid) }, { name: 'Avtoshkola cheki', color: 'var(--school)', values: align(ks, L.series, z => z.school) }], { unit: 'n', unitName: 'dars' });
    h += blk('Cheklar', `<div class="kv">${kvc('Urilmagan chek', nf(L.unscanned?.receipts), L.unscanned?.receipts ? 'warn' : '')}${kvc('Ularning puli', compact(L.unscanned?.amount))}${kvc('Avtoshkola cheki darslari', nf(L.school))}${kvc('Avtoshkola soati', durShort(L.school_minutes))}</div>
      ${L.school ? '<p class="hero-sub">Avtoshkola cheki darslari umumiy hisobda Avtoshkola bo‘limidan sanaladi (ikki marta emas).</p>' : ''}`);
    return { title: 'Darslar', parent: 'avd', html: h };
  }
  if (p[0] === 'instructors') {
    const ins = (avd.instructors || []).filter(z => z.lessons);
    const items = ins.map(z => ({ name: z.name, v: z.lessons, go: z.id !== '-' ? `avd/ins/${seg(z.id)}` : '', val: `${nf(z.lessons)} dars`, val2: z.revenue ? compact(z.revenue) : '',
      sub: [z.paid ? `${nf(z.paid)} pullik` : '', z.school ? `${nf(z.school)} avtoshkola` : '', dur(z.minutes)].filter(Boolean).join(', ') }));
    let h = title('avd', 'Instruktorlar', 'Kim nechta dars o‘tgan. Bossangiz — instruktorning alohida oynasi.');
    const top = ins.slice(0, 10);
    if (top.length > 1) h += blk('Darslar', columns({ title: 'Instruktorlar', keys: top.map(z => z.name), unit: 'n', unitName: 'dars', series: [{ name: 'Darslar', color: 'var(--avd)', values: top.map(z => z.lessons) }],
      fmtKey: kk => String(kk).split(' ')[0].slice(0, 6), fmtKeyLong: kk => String(kk), hint: 'Ustunni bosing — ism va darslar' }));
    h += blk('Hammasi', rank('ains', items, 'var(--avd)', 30), `${items.length} kishi`);
    return { title: 'Instruktorlar', parent: 'avd', html: h };
  }
  if (p[0] === 'cats') {
    let h = title('avd', 'Toifalar va davomiylik', 'Kassa tushumi toifa (A, B, C) va dars davomiyligi bo‘yicha.');
    h += blk('Toifalar', rank('cat', (k.categories || []).map(z => ({ name: z.name, v: z.total, val: money(z.total), val2: `${nf(z.receipts)} chek` })), 'var(--avd)'));
    h += blk('Dars davomiyligi', rank('durs', (k.durations || []).map(z => ({ name: z.name, v: z.total, val: money(z.total), val2: `${nf(z.receipts)} chek` })), 'var(--avd)'));
    return { title: 'Toifalar', parent: 'avd', html: h };
  }
  if (p[0] === 'live') {
    const lv = avd.live || {}, ip = lv.in_progress || [];
    let h = title('avd', 'Hozir', 'Ayni paytdagi holat: darsdagilar, kutayotgan bronlar, ochiq smenalar.');
    h += blk('Holat', `<div class="kv">${kvc('Darsda', nf(ip.length))}${kvc('Bugun qolgan', nf(lv.upcoming_today))}${kvc('Tasdiq kutmoqda', nf(lv.pending), lv.pending ? 'warn' : '')}${kvc('Ochiq smena', nf((lv.open_shifts || []).length))}</div>`);
    h += blk('Darsda', ip.map(z => liveRow(z.customer || 'Mijoz', [z.instructor, z.category ? `${z.category} toifa` : ''].filter(Boolean).join(', '), { ...z, status: 'active' })).join('') || '<div class="empty">Hozir dars yo‘q.</div>');
    h += blk('Ochiq smenalar', (lv.open_shifts || []).map(z => `<div class="row"><div class="nm">${esc(z.register || 'Kassa')}<small>${esc(z.cashier || '')}</small></div><div class="am num">${hm(z.opened_at)} dan</div></div>`).join('') || '<div class="empty">Ochiq smena yo‘q.</div>');
    return { title: 'Hozir', parent: 'avd', html: h };
  }
  if (p[0] === 'receipts') {
    let h = title('avd', 'Oxirgi cheklar', 'Kassada chiqarilgan oxirgi cheklar (ikkala kassa).');
    h += blk('Cheklar', receiptRows('rec', k.recent || [], r, true));
    if (d.bucket !== 'hour') h += hourChart(d, 'Soatlar bo‘yicha tushum', k.hours, z => z.total, 'var(--avd)', 'som');
    return { title: 'Cheklar', parent: 'avd', html: h };
  }
  /* bo'lim oynasi */
  let h = title('avd', 'Avtodrom', 'Bronlar, kassa P1 va P2, instruktorlar.');
  h += hero('Kassa tushumi', nf(k.totals.total), 'so‘m', k.change, `${nf(k.totals.receipts)} chek, o‘rtacha ${money(k.avg_check)}. Naqd ${compact(k.totals.cash)}, karta ${compact(k.totals.card)}.`, { cmp });
  if (regs.length) h += `<div class="regs" style="margin-top:10px">${regs.map(g => `<button class="reg" data-go="avd/reg/${esc(seg(g.id))}"><div class="reg-h"><b>${esc(g.code)}</b>${g.shift?.open ? `<span class="pill on">smena ochiq</span>` : `<span class="pill">smena yopiq</span>`}</div>
      <div class="v num">${compact(g.total)}</div><div class="s">${nf(g.receipts)} chek ${delta(g.change)}<br>naqd ${compact(g.cash)}, karta ${compact(g.card)}</div><div class="open">Ochish ${IC.chev.replace('<svg', '<svg width="14" height="14"')}</div></button>`).join('')}</div>`;
  if (k.unassigned?.receipts) h += `<div class="alert info" style="margin-top:10px">${IC.info}<div>Kassaga bog‘lanmagan to‘lovlar: ${nf(k.unassigned.receipts)} ta, ${money(k.unassigned.total)}</div></div>`;
  h += `<div style="margin-top:10px"></div>` + trend('avd', d, 'Tushum dinamikasi', ks => regs.length > 1
    ? regs.map((g, i) => ({ name: g.code, color: 'var(--avd)', values: align(ks, g.series, z => z.total), o: i }))
      .map((s, i) => ({ ...s, color: i ? 'color-mix(in srgb, var(--avd) 45%, var(--card))' : 'var(--avd)' }))
    : [{ name: 'Tushum', color: 'var(--avd)', values: align(ks, k.series, z => z.total) }]);
  const ins = (avd.instructors || []).filter(z => z.lessons);
  const topSrc = (b.by_source || [])[0];
  const lv = avd.live || {};
  h += navs('Batafsil', [
    nav('avd/bookings', 'avd', 'cal', 'Bronlar', `${nf(b.by_status.completed)} bajarildi, ${nf(b.by_status.no_show)} kelmadi`, nf(b.total), `${delta(b.change)}`),
    nav('avd/sources', 'avd', 'share', 'Bron qayerdan keldi', topSrc ? `${esc(topSrc.name)} ${pctOf(topSrc.n, b.total)}%` : '', ''),
    nav('avd/lessons', L.unscanned?.receipts ? 'warn' : 'avd', 'receipt', 'Darslar', L.unscanned?.receipts ? `${nf(L.unscanned.receipts)} ta chek hali urilmagan` : 'urilgan chek bo‘yicha', nf(L.paid), durShort(L.minutes)),
    nav('avd/instructors', 'avd', 'steer', 'Instruktorlar', ins[0] ? `eng ko‘p: ${esc(ins[0].name)}` : '', nf(ins.length), 'kishi'),
    nav('avd/cats', 'avd', 'tag', 'Toifalar va davomiylik', (k.categories || [])[0] ? esc(k.categories[0].name) : '', ''),
    nav('avd/live', lv.pending ? 'warn' : 'avd', 'live', 'Hozir', `${nf((lv.in_progress || []).length)} darsda, ${nf(lv.pending)} tasdiq kutmoqda`, ''),
    nav('avd/receipts', 'avd', 'list', 'Oxirgi cheklar', 'ikkala kassa', nf(k.totals.receipts)),
  ]);
  return { title: 'Avtodrom', parent: '', html: h };
}

/* ---------- UMUMIY ---------- */
function totalScreen(x, p){
  const { d, c, cmp, a12, avd } = x;
  const P = c.by_part || {}, PP = c.previous_by_part || {};
  const parts = [
    { n: 'Avtodrom', v: P.avtodrom || 0, c: 'var(--avd)', go: 'avd', pv: PP.avtodrom || 0 },
    { n: 'Platniy', v: P.paid || 0, c: 'var(--paid)', go: 'paid', pv: PP.paid || 0 },
    { n: 'Avtoshkola', v: P.school || 0, c: 'var(--school)', go: 'school', pv: PP.school || 0 },
  ];
  const sum = parts.reduce((a, z) => a + z.v, 0);
  const M = c.by_method || {}, msum = (M.cash || 0) + (M.card || 0) + (M.click || 0);
  const methods = [{ n: 'Naqd', v: M.cash || 0, c: 'var(--total)' }, { n: 'Karta va terminal', v: M.card || 0, c: 'var(--total)', o: .6 }, { n: 'Klik', v: M.click || 0, c: 'var(--total)', o: .3 }];
  const V = c.visits || {};
  if (p[0] === 'parts') {
    let h = title('total', 'Bo‘limlar ulushi', 'Tushum qaysi bo‘limdan kelgan. Bossangiz — o‘sha bo‘lim ochiladi.');
    h += blk('Ulush', splitBar(parts, sum) + legendRows(parts, sum));
    h += blk('Oldingi davr bilan', parts.map(z => `<button class="row" data-go="${z.go}"><div class="nm">${z.n}<small>oldin ${money(z.pv)}</small></div><div class="am num">${money(z.v)}<small>${delta(pct(z.v, z.pv))}</small></div></button>`).join(''));
    h += trend('parts', d, 'Dinamika', ks => [
      { name: 'Avtodrom', color: 'var(--avd)', values: align(ks, c.series, z => z.avtodrom) },
      { name: 'Platniy', color: 'var(--paid)', values: align(ks, c.series, z => z.paid) },
      { name: 'Avtoshkola', color: 'var(--school)', values: align(ks, c.series, z => z.school) }]);
    return { title: 'Ulush', parent: 'total', html: h };
  }
  if (p[0] === 'methods') {
    let h = title('total', 'To‘lov usuli', 'Uchala bo‘limning puli qanday tushgan.');
    h += blk('Ulush', splitBar(methods, msum) + legendRows(methods, msum));
    h += blk('Bo‘limlar bo‘yicha', `<div class="kv">${kvc('Avtodrom naqd', compact(avd.kassa?.totals?.cash))}${kvc('Avtodrom karta', compact(avd.kassa?.totals?.card))}${kvc('Platniy naqd', compact(a12.paid?.totals?.cash))}${kvc('Platniy terminal', compact(a12.paid?.totals?.terminal))}${kvc('Platniy Klik', compact(a12.paid?.totals?.click))}</div>`);
    return { title: 'To‘lov usuli', parent: 'total', html: h };
  }
  if (p[0] === 'profit') {
    let h = title('total', 'Sof foyda', 'Tushumdan xarajat ayrilgandagi qoldiq.');
    h += blk('Hisob', `<div class="row"><div class="nm">Tushum</div><div class="am num">${money(c.revenue)}</div></div>
      <div class="row"><div class="nm">Xarajat</div><div class="am num">${c.expenses_known ? '− ' + money(c.expenses) : 'noma’lum'}</div></div>
      <div class="row"><div class="nm"><b>Sof foyda</b></div><div class="am num" style="font-size:20px;color:${c.net < 0 ? 'var(--bad)' : 'var(--ink)'}">${c.expenses_known ? (c.net < 0 ? '− ' : '') + money(Math.abs(c.net)) : '—'}</div></div>`);
    if (c.expenses_known) h += tiles([tile('Oldingi davr', compact(c.previous_net), 'sof foyda'), tile('O‘zgarish', delta(c.net_change), esc(cmp))]);
    h += trend('profit', d, 'Tushum va xarajat', ks => [{ name: 'Tushum', color: 'var(--total)', values: align(ks, c.series, z => (z.avtodrom || 0) + (z.paid || 0) + (z.school || 0)) }],
      { line: d.bucket !== 'hour' && c.expenses_known ? { name: 'Xarajat', values: align(ks, c.series, z => z.expenses) } : null });
    return { title: 'Sof foyda', parent: 'total', html: h };
  }
  if (p[0] === 'alerts') {
    return { title: 'E’tibor bering', parent: 'total', html: title('total', 'E’tibor talab qiladi', 'Hisobotdagi muammoli joylar.') + (alertsBlock(c.alerts) || '<div class="empty">Hammasi joyida.</div>') };
  }
  let h = title('total', 'Umumiy', 'Uchala bo‘lim birga: Avtodrom, Platniy, Avtoshkola.');
  h += hero('Jami tushum', nf(c.revenue), 'so‘m', c.change, a12.ok ? '' : 'Faqat Avtodrom — avtodrom12 ulanmagan', { cmp, extra: splitBar(parts, sum) + legendRows(parts, sum) });
  h += trend('total', d, 'Tushum va xarajat dinamikasi', ks => [
    { name: 'Avtodrom', color: 'var(--avd)', values: align(ks, c.series, z => z.avtodrom) },
    { name: 'Platniy', color: 'var(--paid)', values: align(ks, c.series, z => z.paid) },
    { name: 'Avtoshkola', color: 'var(--school)', values: align(ks, c.series, z => z.school) }],
    { line: d.bucket !== 'hour' && c.expenses_known ? { name: 'Xarajat', values: align(ks, c.series, z => z.expenses) } : null });
  h += tiles([tile('Kirish va darslar', nf(V.total), `Avtodrom ${nf(V.avtodrom)}, platniy ${nf(V.paid)}, avtoshkola ${nf(V.school)}`), tile('Maydonda jami', durShort(c.minutes), 'uchala bo‘lim')]);
  const topM = methods.slice().sort((a, b) => b.v - a.v)[0];
  h += navs('Batafsil', [
    nav('total/parts', 'total', 'pie', 'Bo‘limlar ulushi', `Avtodrom ${pctOf(P.avtodrom, sum)}%, platniy ${pctOf(P.paid, sum)}%`, ''),
    nav('total/methods', 'total', 'cash', 'To‘lov usuli', msum ? `${topM.n} ${pctOf(topM.v, msum)}%` : '', ''),
    nav('total/profit', c.expenses_known && c.net < 0 ? 'bad' : 'total', 'debt', 'Sof foyda', c.expenses_known ? `tushum − xarajat, ${delta(c.net_change)}` : 'xarajatlar ma’lum emas', c.expenses_known ? compact(c.net) : '—'),
    nav('total/alerts', (c.alerts || []).length ? 'warn' : 'total', 'alert', 'E’tibor talab qiladi', (c.alerts || []).length ? esc(c.alerts[0].text.slice(0, 60)) + (c.alerts[0].text.length > 60 ? '…' : '') : 'hammasi joyida', nf((c.alerts || []).length)),
  ]);
  return { title: 'Umumiy', parent: '', html: h };
}

/* ---------- XARAJATLAR ---------- */
function expScreen(x, p){
  const { d, a12, c, cmp, r } = x;
  if (!a12.ok) return { title: 'Xarajatlar', html: title('exp', 'Xarajatlar', '') + a12Err(a12) };
  const e = a12.expenses || {};
  const M = e.by_method || {};
  const methods = [{ n: 'Naqd', v: M.cash || 0, c: 'var(--exp)' }, { n: 'Karta', v: M.card || 0, c: 'var(--exp)', o: .55 }, { n: 'Klik', v: M.click || 0, c: 'var(--exp)', o: .25 }];
  const cats = e.categories || [];
  const recRow = z => `<div class="row"><div class="nm">${esc(z.category)}<small>${dayName(z.day)}${z.person ? `, ${esc(z.person)}` : ''}${z.vehicle ? `, ${esc(z.vehicle)}` : ''}${z.liters ? `, ${nf(z.liters)} l` : ''}${z.note ? `. ${esc(z.note)}` : ''}</small></div>
    <div class="am num">${money(z.amount)}<small>${z.method === 'card' ? 'karta' : z.method === 'click' ? 'Klik' : 'naqd'}</small></div></div>`;
  if (!c.expenses_known) return { title: 'Xarajatlar', html: title('exp', 'Xarajatlar', '') + `<div class="err"><b>Xarajatlar yuklanmadi</b>avtodrom12 dagi «Rasxod» jadvali o‘qilmadi — sof foyda hisoblanmaydi.</div>` };
  if (p[0] === 'cat') {
    const g = cats.find(z => String(z.name) === String(p[1]));
    if (!g) return { title: 'Xarajat', parent: 'exp/cats', html: '<div class="empty">Bu tur bo‘yicha xarajat topilmadi.</div>' };
    const rows = (e.recent || []).filter(z => String(z.category) === String(g.name));
    let h = title('exp', g.name, `Shu turdagi xarajatlar — ${esc(rangeTitle(r))}.`);
    h += hero('Jami', nf(g.total), 'so‘m', null, `${nf(g.n)} ta yozuv, jami xarajatning ${pctOf(g.total, e.total)}%${g.liters ? `, ${nf(g.liters)} litr` : ''}`);
    if (d.bucket !== 'hour') h += trend(`ec-${g.name}`, d, 'Dinamika', ks => [{ name: g.name, color: 'var(--exp)', values: align(ks, g.series, z => z.total) }]);
    h += blk('Yozuvlar', list(`ecr-${g.name}`, rows, recRow, 12), rows.length < g.n ? `oxirgi ${nf(rows.length)} ta` : `${nf(rows.length)} ta`);
    return { title: g.name, parent: 'exp/cats', html: h };
  }
  if (p[0] === 'cats') {
    let h = title('exp', 'Xarajat turlari', 'Pul nimaga ketgan. Bossangiz — o‘sha turning alohida oynasi.');
    const top = cats.slice(0, 6);
    if (top.length > 1) h += blk('Ulush', splitBar(top.map((z, i) => ({ v: z.total, c: 'var(--exp)', o: 1 - i * 0.14 })), e.total) + legendRows(top.map((z, i) => ({ n: z.name, v: z.total, c: 'var(--exp)', o: 1 - i * 0.14, go: `exp/cat/${seg(z.name)}` })), e.total));
    h += blk('Hammasi', rank('ecat', cats.map(z => ({ name: z.name, v: z.total, go: `exp/cat/${seg(z.name)}`, val: money(z.total), val2: `${pctOf(z.total, e.total)}%`, sub: `${nf(z.n)} ta${z.liters ? `, ${nf(z.liters)} litr` : ''}` })), 'var(--exp)', 30), `${cats.length} ta`);
    return { title: 'Turlari', parent: 'exp', html: h };
  }
  if (p[0] === 'methods') {
    const ms = methods.reduce((a, z) => a + z.v, 0);
    return { title: 'To‘lov usuli', parent: 'exp', html: title('exp', 'Qanday to‘langan', 'Xarajatlar naqd, karta yoki Klik bilan.') + blk('Ulush', splitBar(methods, ms) + legendRows(methods, ms)) };
  }
  if (p[0] === 'vehicles') {
    const vs = e.vehicles || [];
    let h = title('exp', 'Mashinalar bo‘yicha', 'Yoqilg‘i va ta’mir — qaysi mashinaga qancha ketgan (spidometr — oxirgi yozilgan).');
    h += blk('Mashinalar', list('eveh', vs, z => `<div class="prow"><div>${plate(z.name)}</div><div class="am num">${money(z.total)}</div><div class="mid">${nf(z.n)} ta xarajat${z.liters ? `, ${nf(z.liters)} litr` : ''}${z.odometer ? `, spidometr ${nf(z.odometer)} km` : ''}</div><div class="am2"></div></div>`, 20));
    return { title: 'Mashinalar', parent: 'exp', html: h };
  }
  if (p[0] === 'people') {
    return { title: 'Kim orqali', parent: 'exp', html: title('exp', 'Kim orqali', 'Xarajatni kim qilgan yoki kimga berilgan.') + blk('Odamlar', rank('eper', (e.people || []).map(z => ({ name: z.name, v: z.total, val: money(z.total), val2: `${nf(z.n)} ta` })), 'var(--exp)', 30)) };
  }
  if (p[0] === 'recent') {
    return { title: 'Yozuvlar', parent: 'exp', html: title('exp', 'Barcha yozuvlar', `Davr ichidagi xarajatlar, eng yangisi tepada${(e.recent || []).length < e.count ? ` (oxirgi ${nf((e.recent || []).length)} ta)` : ''}.`) + blk(`${nf(e.count)} ta`, list('erec', e.recent || [], recRow, 25)) };
  }
  let h = title('exp', 'Xarajatlar', 'avtodrom12 dagi «Rasxod» yozuvlari.');
  h += hero('Jami xarajat', nf(e.total), 'so‘m', pct(e.total, e.previous_total), `${nf(e.count)} ta yozuv${e.liters ? `, yoqilg‘i ${nf(e.liters)} litr` : ''}`, { cmp, badUp: true });
  if (d.bucket !== 'hour') h += trend('exp', d, 'Xarajat dinamikasi', ks => [{ name: 'Xarajat', color: 'var(--exp)', values: align(ks, e.series, z => z.total) }]);
  h += tiles([tile('Sof foyda', compact(c.net), `tushum ${compact(c.revenue)} − xarajat`, c.net < 0 ? 'badc' : ''), tile('Eng katta tur', cats[0] ? esc(cats[0].name) : '—', cats[0] ? `${money(cats[0].total)}, ${pctOf(cats[0].total, e.total)}%` : '')]);
  const ms = methods.reduce((a, z) => a + z.v, 0), topM = methods.slice().sort((a, b) => b.v - a.v)[0];
  h += navs('Batafsil', [
    nav('exp/cats', 'exp', 'tag', 'Xarajat turlari', cats.slice(0, 2).map(z => esc(z.name)).join(', '), nf(cats.length), 'tur'),
    nav('exp/methods', 'exp', 'cash', 'Qanday to‘langan', ms ? `${topM.n} ${pctOf(topM.v, ms)}%` : '', ''),
    (e.vehicles || []).length ? nav('exp/vehicles', 'exp', 'fuel', 'Mashinalar bo‘yicha', e.liters ? `yoqilg‘i ${nf(e.liters)} litr` : '', nf(e.vehicles.length)) : '',
    (e.people || []).length ? nav('exp/people', 'exp', 'person', 'Kim orqali', esc(e.people[0].name), nf(e.people.length)) : '',
    nav('exp/recent', 'exp', 'list', 'Barcha yozuvlar', 'eng yangisi tepada', nf(e.count)),
    nav('total/profit', c.net < 0 ? 'bad' : 'total', 'debt', 'Sof foyda', 'tushum − xarajat', compact(c.net)),
  ]);
  return { title: 'Xarajatlar', parent: '', html: h };
}

const SCREENS = { school: schoolScreen, paid: paidScreen, avd: avdScreen, total: totalScreen, exp: expScreen };

/* ======================================================================
   Chizish
   ====================================================================== */
function paint(fromCache, errMsg, anim){
  const d = S.d; if (!d) return;
  chartSeq = 0; for (const k in CHARTS) delete CHARTS[k];
  const r = d._range || range(S.per);
  let sc;
  try { sc = screen(d); }
  catch (e) { console.error(e); sc = { title: 'Xato', html: `<div class="err"><b>Bu oyna ko‘rsatilmadi</b>Ilovani yangilang yoki orqaga qayting.</div>` }; }
  const isHome = !route().length;
  $('btnBack').classList.toggle('hidden', isHome);
  $('hdrTitle').textContent = isHome ? 'AVTODROM BOSHQARUV' : (sc.title || '');
  $('hdrLogo').classList.toggle('hidden', !isHome);
  $('hdrDate').textContent = rangeTitle(r);
  let h = '';
  if (isHome) {
    if (isIOS() && !isStandalone() && !LS.get('boss_inst_hide')) h += `<div class="inst">${IC.phone}<div>Ilova qilib o‘rnating: ${SHARE_I} Ulashish → «Ekranga qo‘shish».</div><button class="x" id="instX" aria-label="Yopish">×</button></div>`;
    else if (deferredInstall && !isStandalone()) h += `<div class="inst">${IC.phone}<div>Telefonga ilova qilib o‘rnatish mumkin.</div><button class="lnk" id="btnInstall" style="margin-left:auto">O‘rnatish</button></div>`;
  }
  if (errMsg) h += `<div class="alert bad" style="margin-bottom:12px">${IC.alert}<div>Yangilab bo‘lmadi: ${esc(errMsg)}. Oxirgi saqlangan raqamlar ko‘rsatilmoqda.</div></div>`;
  h += sc.html;
  const m = $('main');
  m.innerHTML = h;
  if (anim) { m.classList.remove('fwd', 'bck'); void m.offsetWidth; m.classList.add(anim); }
  const a12 = d.avtodrom12 || {};
  const t = d._fetched ? new Date(d._fetched) : new Date(d.generated_at);
  $('foot').innerHTML = `Yangilandi: ${tkYmd(t.toISOString()) === today() ? '' : dayName(tkYmd(t.toISOString())) + ', '}${hm(t.toISOString())}${fromCache && S.loading ? ' — yangilanmoqda…' : ''}<br>
    ${a12.ok ? `avtodrom12 ulangan${a12.host ? ` (${esc(a12.host)})` : ''}` : 'avtodrom12 ulanmagan'}${isHome ? '<br><button id="btnLogout">Chiqish</button>' : ''}`;
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g && g.dataset.go) { go(g.dataset.go); return; }
  const m = e.target.closest('[data-more]');
  if (m) { S.open[m.dataset.more] = !S.open[m.dataset.more]; paint(); return; }
  const tb = e.target.closest('[data-table]');
  if (tb) { S.tables[tb.dataset.table] = !S.tables[tb.dataset.table]; paint(); return; }
  const c = e.target.closest('[data-ci]');
  if (c) { chartTap(c.closest('[data-chart]'), Number(c.dataset.ci)); return; }
  if (e.target.closest('#btnLogout')) { logout(); return; }
  if (e.target.closest('#btnInstall') && deferredInstall) { deferredInstall.prompt(); deferredInstall = null; return; }
  if (e.target.closest('#instX')) { LS.set('boss_inst_hide', '1'); paint(); }
});
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const c = e.target.closest && e.target.closest('[data-ci]');
  if (c) chartTap(c.closest('[data-chart]'), Number(c.dataset.ci));
});

boot();
</script>
</body>
</html>
