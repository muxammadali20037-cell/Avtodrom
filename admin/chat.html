<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVTODROM — Admin Chat</title><style>body{margin:0;background:#f4f7f5;font-family:Inter,Arial;color:#15231c}.wrap{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #dfe8e3;border-radius:18px;padding:16px;box-shadow:0 10px 30px #16382712}.head{display:flex;justify-content:space-between;align-items:center}.msgs{height:65vh;overflow:auto;background:#f7faf8;border-radius:14px;padding:12px;margin:12px 0}.m{max-width:72%;background:#fff;border:1px solid #dfe8e3;border-radius:14px;padding:9px 11px;margin:7px 0;font-size:13px}.m.admin{margin-left:auto;background:#087443;color:#fff;border-color:#087443}.m small{display:block;opacity:.65;font-size:9px;margin-top:4px}.compose{display:flex;gap:8px}.compose input{flex:1;padding:12px;border:1px solid #dfe8e3;border-radius:12px}.btn{padding:11px 15px;border:0;border-radius:12px;background:#087443;color:#fff;font-weight:900}</style></head><body><div class="wrap"><div class="card"><div class="head"><div><h2>💬 AVTODROM — Admin Chat</h2><small>Mijozlar bilan umumiy aloqa</small></div><button class="btn" onclick="load()">↻</button></div><div id="msgs" class="msgs"></div><div class="compose"><input id="input" placeholder="Javob yozing..." onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">Yuborish</button></div></div></div><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function fmt(v){try{return new Date(v).toLocaleString('uz-UZ',{timeZone:'Asia/Tashkent',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})}catch{return v}}async function load(){const r=await fetch('/api/admin/chat/messages',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Chat yuklanmadi');document.getElementById('msgs').innerHTML=(d.messages||[]).map(m=>`<div class="m ${m.sender_role==='admin'?'admin':''}"><b>${m.sender_role==='admin'?'Admin':'Mijoz'}</b><br>${esc(m.message)}<small>${esc(fmt(m.created_at))}</small></div>`).join('')||'<p>Hozircha xabar yo‘q.</p>';const x=document.getElementById('msgs');x.scrollTop=x.scrollHeight}async function send(){const i=document.getElementById('input'),text=i.value.trim();if(!text)return;const r=await fetch('/api/admin/chat/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});const d=await r.json();if(!r.ok){alert(d.error||'Xabar yuborilmadi');return}i.value='';await load()}load().catch(e=>document.getElementById('msgs').textContent=e.message);setInterval(()=>load().catch(()=>{}),5000)</script></body></html>
