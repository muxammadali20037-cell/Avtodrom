<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Avtodrom — Instruktor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#07111f;color:#eef5ff}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(760px,100%);margin:auto;min-height:100vh;padding:16px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-weight:900;font-size:21px}.badge{border:1px solid #24507d;background:#102b49;color:#8dceff;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800}.card{background:#0d1b2e;border:1px solid #1b3452;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 12px 35px #0003}.center{min-height:calc(100vh - 32px);display:flex;align-items:center;justify-content:center}..auth{width:100%;max-width:460px}.logo{width:64px;height:64px;border-radius:20px;background:#12345b;display:grid;place-items:center;font-size:32px;margin:0 auto 16px}.auth h1{text-align:center;margin:0 0 7px;font-size:25px}.muted{color:#91a7c0;font-size:13px;line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#091526;padding:5px;border-radius:14px;margin:18px 0}.tabs button{border:0;border-radius:10px;padding:10px;background:transparent;color:#8fa6bf}.tabs button.on{background:#17385d;color:#fff;font-weight:800}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;color:#b9c9da;margin-bottom:6px}.input,.select,.textarea{width:100%;border:1px solid #294461;background:#091726;color:#fff;border-radius:12px;padding:12px;outline:none}.textarea{min-height:95px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:#54b7ff}.phone{display:flex;gap:7px}.phone span{display:flex;align-items:center;padding:0 11px;border:1px solid #294461;border-radius:12px;background:#10243c;color:#9cc9ed;font-weight:800}.btn{border:0;border-radius:12px;padding:12px 15px;background:#1768a8;color:#fff;font-weight:800;width:100%}.btn.secondary{background:#17385d}.btn.ok{background:#15734b}.btn.danger{background:#71313b}.btn.small{width:auto;padding:9px 12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.hero h1{margin:0 0 5px;font-size:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.stat{background:#10243c;border-radius:14px;padding:12px}.stat b{display:block;font-size:22px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.section-title h2{font-size:18px;margin:0}.booking{background:#0a1728;border:1px solid #1b3452;border-radius:16px;padding:14px;margin-bottom:9px}.time{font-size:19px;font-weight:900}.status{padding:6px 9px;border-radius:999px;background:#20334a;font-size:11px;font-weight:800}.pending{color:#ffd36e}.confirmed{color:#72e0a5}.in_progress{color:#70c7ff}.cancelled,.no_show{color:#ff8d8d}.completed{color:#c0a9ff}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.actions .btn{width:auto}.empty{text-align:center;padding:25px;color:#8096ae}.nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(728px,calc(100% - 20px));background:#0d1b2eec;backdrop-filter:blur(12px);border:1px solid #1b3452;border-radius:18px;padding:7px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;z-index:10}.nav button{border:0;background:transparent;color:#9bb0c8;border-radius:12px;padding:10px 5px;font-size:12px}.nav button.active{background:#17385d;color:#fff}.notice{padding:11px 12px;border-radius:12px;background:#10243c;border:1px solid #244866;color:#b8cee2;font-size:12px;line-height:1.5}.error{color:#ff9b9b}.success{color:#72e0a5}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#142b45;color:#fff;padding:12px 15px;border:1px solid #2a4c6d;border-radius:12px;display:none;z-index:20;max-width:90%;text-align:center}.avatar{width:48px;height:48px;border-radius:50%;background:#17385d;display:grid;place-items:center;font-size:23px}.profile-head{display:flex;gap:12px;align-items:center}.divider{height:1px;background:#1b3452;margin:16px 0}@media(max-width:420px){.app{padding:12px 12px 90px}.stats{gap:6px}.stat{padding:10px}.stat b{font-size:20px}.actions .btn{flex:1}}
</style>
</head>
<body>
<div id="root"></div><div id="toast" class="toast"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
'use strict';
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){tg.ready();tg.expand();tg.setHeaderColor('#07111f');tg.setBackgroundColor('#07111f');}
const API=window.AVTODROM_API_URL||'';
const state={mode:'login',screen:'auth',profile:null,bookings:[],notifications:[],filter:'all',loading:false};
const root=document.getElementById('root');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(v){const e=document.getElementById('toast');e.textContent=v;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
function headers(){const h={'Content-Type':'application/json'};if(tg&&tg.initData)h['x-telegram-init-data']=tg.initData;return h}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||'Server xatosi');return d}
function tgUser(){return tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user:null}
function authGate(){
 const u=tgUser();
 if(!u&&!tg?.initData){return `<div class="center"><section class="card auth"><div class="logo">🚗</div><h1>Avtodrom Instruktor</h1><p class="muted" style="text-align:center">Bu sahifa Telegram Mini App sifatida ochilishi kerak. Bot orqali ilovani oching.</p></section></div>`}
 if(state.screen==='profile')return profileForm();
 if(state.screen==='pending')return pending();
 return `<div class="center"><section class="card auth"><div class="logo">👨‍🏫</div><h1>Instruktor paneli</h1><p class="muted" style="text-align:center">Telegram akkauntingiz bilan xavfsiz kirish. Birinchi kirishda instruktor profilini to‘ldirish majburiy.</p><div class="tabs"><button class="${state.mode==='login'?'on':''}" onclick="state.mode='login';render()">Kirish</button><button class="${state.mode==='register'?'on':''}" onclick="state.mode='register';render()">Ro‘yxatdan o‘tish</button></div>${state.mode==='register'?registerForm():loginForm()}</section></div>`
}
function loginForm(){const u=tgUser();return `<div class="notice">👤 Telegram: <b>${esc(u?.first_name||'Foydalanuvchi')}</b><br><span class="muted">Telegram identifikatsiyasi backend tomonidan tekshiriladi. Parol demo sifatida saqlanmaydi.</span></div><div class="field"><label>Telefon raqami</label><div class="phone"><span>+998</span><input id="loginPhone" class="input" inputmode="numeric" maxlength="9" placeholder="90 123 45 67"></div></div><button class="btn" onclick="login()">Kirish</button><p id="authError" class="error"></p><p class="muted" style="text-align:center;margin-top:12px">Hisobingiz bo‘lmasa, yuqoridagi “Ro‘yxatdan o‘tish”ni tanlang.</p>`}
function registerForm(){return `<div class="notice">📋 Ro‘yxatdan o‘tishdan keyin profilingiz <b>Admin tasdig‘iga</b> yuboriladi. Tasdiqlanmaguncha instruktor paneliga kira olmaysiz.</div><div class="field"><label>Ism *</label><input id="rFirst" class="input" autocomplete="given-name" placeholder="Ismingiz"></div><div class="field"><label>Familiya *</label><input id="rLast" class="input" autocomplete="family-name" placeholder="Familiyangiz"></div><div class="field"><label>Telefon *</label><div class="phone"><span>+998</span><input id="rPhone" class="input" inputmode="numeric" maxlength="9" placeholder="90 123 45 67"></div></div><div class="field"><label>Haydovchilik toifasi *</label><select id="rCategory" class="select"><option value="">Tanlang</option><option>A</option><option>B</option><option>C</option><option>D</option><option>BE</option><option>CE</option></select></div><div class="field"><label>Tajriba (yil) *</label><input id="rExperience" class="input" type="number" min="0" max="60" placeholder="5"></div><div class="field"><label>Ixtisoslashuv *</label><input id="rSpecialization" class="input" placeholder="Avtodrom, parkovka, shahar haydash"></div><div class="field"><label>Qisqacha bio *</label><textarea id="rBio" class="textarea" placeholder="O‘quvchilarga o‘zingiz haqingizda qisqacha ma’lumot..."></textarea></div><button class="btn ok" onclick="registerInstructor()">Ro‘yxatdan o‘tish</button><p id="authError" class="error"></p>`}
function profileForm(){return `<div class="center"><section class="card auth"><div class="logo">🧑‍🏫</div><h1>Profilni to‘ldiring</h1><p class="muted" style="text-align:center">Panelga kirishdan oldin barcha majburiy ma’lumotlar to‘ldirilishi kerak.</p>${registerForm()}</section></div>`}
function pending(){return `<div class="center"><section class="card auth" style="text-align:center"><div class="logo">⏳</div><h1>Admin tasdig‘i kutilmoqda</h1><p class="muted">Ro‘yxatdan o‘tishingiz qabul qilindi. Admin profilingizni tekshiradi. Tasdiqlangandan keyin Telegram orqali xabar olasiz va Mini App’ga to‘liq kira olasiz.</p><div class="notice" style="text-align:left;margin-top:15px">🔐 Status: <b>pending_approval</b><br>Profilingiz va shaxsiy ma’lumotlaringiz tasdiqsiz holatda boshqa foydalanuvchilarga ko‘rsatilmaydi.</div><button class="btn secondary" style="margin-top:14px" onclick="checkMe()">Statusni tekshirish</button><button class="btn" style="margin-top:8px" onclick="state.screen='auth';state.mode='login';render()">Kirishga qaytish</button></section></div>`}
async function login(){const phone=(document.getElementById('loginPhone')?.value||'').replace(/\D/g,'');if(phone.length!==9)return err('Telefon raqamini to‘g‘ri kiriting.');try{state.loading=true;const d=await api('/api/instructor/login',{method:'POST',body:JSON.stringify({phone})});if(d.status==='pending_approval'){state.screen='pending';render();return}if(d.status==='profile_required'||!d.profile_complete){state.screen='profile';render();return}if(d.status==='active'||d.profile){await checkMe();return}throw Error('Instruktor hisobi topilmadi.');}catch(e){err(e.message)}}
async function registerInstructor(){const data={first_name:v('rFirst'),last_name:v('rLast'),phone:v('rPhone').replace(/\D/g,''),category:v('rCategory'),experience:Number(v('rExperience')||0),specialization:v('rSpecialization'),bio:v('rBio'),telegram_id:tgUser()?.id};if(!data.first_name||!data.last_name||data.phone.length!==9||!data.category||data.experience<0||!data.specialization||!data.bio)return err('Barcha majburiy maydonlarni to‘ldiring.');try{const d=await api('/api/instructor/register',{method:'POST',body:JSON.stringify(data)});if(d.status==='pending_approval'||d.ok){state.screen='pending';render();toast('Ro‘yxatdan o‘tish qabul qilindi');return}if(d.status==='profile_required'){state.screen='profile';render();return}throw Error(d.message||'Ro‘yxatdan o‘tishda xatolik');}catch(e){err(e.message)}}
async function checkMe(){try{const d=await api('/api/me');if(!d.profile){state.screen='auth';render();return}state.profile=d.profile;if(d.profile.role!=='instructor')return err('Bu Telegram akkauntiga instruktor roli berilmagan.');if(d.profile.status==='pending_approval'||d.profile.approval_status==='pending'){state.screen='pending';render();return}if(d.profile.profile_complete===false){state.screen='profile';render();return}state.screen='app';await loadApp();render();}catch(e){state.screen='auth';render();err(e.message)}}
function err(x){const e=document.getElementById('authError');if(e)e.textContent=x;else toast(x)}
function v(id){return document.getElementById(id)?.value.trim()||''}
function app(){const p=state.profile||{};return `<header class="top"><div class="brand">🚗 Avtodrom</div><div class="badge">INSTRUKTOR</div></header><section class="card"><div class="profile-head"><div class="avatar">👨‍🏫</div><div style="flex:1"><h1 class="hero h1" style="margin:0;font-size:22px">${esc(p.first_name||'Instruktor')} ${esc(p.last_name||'')}</h1><div class="muted">${esc(p.specialization||'Instruktor')} · ${Number(p.experience||0)} yil tajriba</div></div><button class="btn small secondary" onclick="openProfile()">Profil</button></div><div class="stats"><div class="stat"><b>${todayCount()}</b><span class="muted">Bugun</span></div><div class="stat"><b>${upcomingCount()}</b><span class="muted">Kutilmoqda</span></div><div class="stat"><b>${doneCount()}</b><span class="muted">Yakunlangan</span></div></div></section><div class="section-title"><h2>${state.filter==='notifications'?'🔔 Ogohlantirishlar':'📅 Mashg‘ulotlar'}</h2><button class="badge" onclick="loadApp()">Yangilash</button></div><section class="card">${state.filter==='notifications'?notificationsView():bookingsView()}</section><nav class="nav"><button class="${state.filter==='all'?'active':''}" onclick="state.filter='all';render()">📅 Barchasi</button><button class="${state.filter==='today'?'active':''}" onclick="state.filter='today';render()">☀️ Bugun</button><button class="${state.filter==='notifications'?'active':''}" onclick="state.filter='notifications';render()">🔔 Xabarlar</button></nav>`}
function bookingsView(){let a=[...state.bookings];if(state.filter==='today'){const n=new Date();a=a.filter(b=>new Date(b.start_at).toDateString()===n.toDateString())}if(!a.length)return '<div class="empty">Hozircha mashg‘ulot yo‘q.</div>';return a.map(b=>{const c=b.customer||{};const car=b.car||{};return `<article class="booking"><div class="row"><div><div class="time">${fmt(b.start_at)}</div><div class="muted">${fmt(b.start_at)} — ${fmt(b.end_at)}</div></div><span class="status ${esc(b.status)}">${statusText(b.status)}</span></div><div style="margin-top:10px"><b>👤 ${esc((c.first_name||'')+' '+(c.last_name||'')||'O‘quvchi')}</b><div class="muted">🚗 ${esc(car.model||'Avtomobil')} ${esc(car.plate_number||'')}</div></div>${actions(b)}</article>`}).join('')}
function actions(b){if(['cancelled','completed','no_show'].includes(b.status))return '';let h='<div class="actions">';if(b.status==='pending')h+=`<button class="btn ok" onclick="setStatus('${esc(b.id)}','confirmed')">✓ Tasdiqlash</button>`;if(b.status==='confirmed')h+=`<button class="btn ok" onclick="setStatus('${esc(b.id)}','in_progress')">▶ Boshlash</button><button class="btn" onclick="setStatus('${esc(b.id)}','no_show')">Kelmagan</button>`;if(b.status==='in_progress')h+=`<button class="btn ok" onclick="setStatus('${esc(b.id)}','completed')">✓ Yakunlash</button>`;h+=`<button class="btn danger" onclick="setStatus('${esc(b.id)}','cancelled')">Bekor qilish</button></div>`;return h}
function notificationsView(){if(!state.notifications.length)return '<div class="empty">🔔 Hozircha ogohlantirish yo‘q.</div>';return state.notifications.map(n=>`<div class="booking"><b>${esc(n.title||'Avtodrom ogohlantirishi')}</b><div class="muted" style="margin-top:5px">${esc(n.body||n.message||'')}</div><div class="muted" style="margin-top:7px">${n.created_at?fmt(n.created_at):''}</div></div>`).join('')}
function statusText(s){return({pending:'Kutilmoqda',confirmed:'Tasdiqlangan',in_progress:'Boshlangan',completed:'Yakunlangan',cancelled:'Bekor qilingan',no_show:'Kelmagan'})[s]||s}
function fmt(d){return new Date(d).toLocaleString('uz-UZ',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function todayCount(){const n=new Date().toDateString();return state.bookings.filter(b=>new Date(b.start_at).toDateString()===n).length}
function upcomingCount(){return state.bookings.filter(b=>new Date(b.start_at)>new Date()&&!['cancelled','completed','no_show'].includes(b.status)).length}
function doneCount(){return state.bookings.filter(b=>b.status==='completed').length}
async function loadApp(){try{const [b,n]=await Promise.all([api('/api/bookings'),api('/api/notifications')]);state.bookings=b.bookings||[];state.notifications=n.notifications||[];render()}catch(e){toast(e.message)}}
async function setStatus(id,status){if(!confirm('Bron holatini “'+statusText(status)+'” qilishni tasdiqlaysizmi?'))return;try{await api('/api/bookings/'+encodeURIComponent(id)+'/status',{method:'PATCH',body:JSON.stringify({status})});toast('Bron holati yangilandi');await loadApp()}catch(e){toast(e.message)}}
function openProfile(){state.screen='profile';render()}
function render(){root.innerHTML=state.screen==='app'?`<main class="app">${app()}</main>`:`<main class="app">${authGate()}</main>`}
async function boot(){render();if(tg?.initData){await checkMe()}}
boot();
</script>
</body>
</html>
