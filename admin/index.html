<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#232883">
<meta name="format-detection" content="telephone=no">
<title>TASH INDEX AVTODROM — Boshqaruv</title>
<style>
/* =========================================================================
   TASH INDEX AVTODROM — SODDA BOSHQARUV PANELI
   Mijozlar bron qiladigan ilova uslubida: katta tugmalar, bosqichma-
   bosqich tanlov, har bir ish 2–3 bosishda. Kassa, operator va
   administrator — bitta sahifa, rolga qarab o'z menyusi.
   Eski to'liq panel: /admin/full («Kengaytirilgan»).
   ========================================================================= */
:root{
  --accent:#2b2f8f;--accent-press:#22257a;--accent-soft:#eceefb;--on-accent:#fff;
  --bg:#f1f3f8;--card:#fff;--card-2:#f4f5fa;--text:#141833;--hint:#6b7188;--line:rgba(20,24,51,.10);
  --danger:#d14343;--danger-soft:#fdeeee;--warn:#8a5d00;--warn-soft:#fff4d6;--info:#1f6fbf;--info-soft:#e8f2fc;
  --ok:#1b8356;--ok-soft:#e6f5ee;--star:#f5b400;
  --hero:linear-gradient(140deg,#0f1340 0%,#232883 55%,#3a40ae 100%);
  --green:linear-gradient(135deg,#0f9d58,#16a34a 55%,#22c55e);
  --shadow:0 1px 2px rgba(16,20,48,.04),0 6px 20px rgba(16,20,48,.06);
  --sb:env(safe-area-inset-bottom,0px);
  --nav-h:66px;--rail:264px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{overflow-x:hidden;font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
a{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}
.hidden{display:none!important}
.muted{color:var(--hint)}
.tnum{font-variant-numeric:tabular-nums}
.ok-t{color:var(--ok)}.bad-t{color:var(--danger)}

/* ---------- kirish ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--hero)}
.login-card{width:100%;max-width:400px;background:var(--card);border-radius:26px;padding:26px 22px 22px;box-shadow:0 30px 70px rgba(5,8,40,.35)}
.login-card .logo{width:74px;height:74px;margin:0 auto 12px}
.login-card h1{margin:0;text-align:center;font-size:22px;letter-spacing:-.4px}
.login-card p.lead{margin:4px 0 18px;text-align:center;color:var(--hint);font-size:14px}
.pass{position:relative}
.pass .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--hint)}
.login .foot{margin-top:14px;text-align:center;font-size:12.5px;color:var(--hint)}

/* ---------- ilova qobig'i ---------- */
.logo{display:block;flex:none;width:42px;height:42px;border-radius:50%;background:#fff;object-fit:contain;box-shadow:0 0 0 1px var(--line),0 2px 8px rgba(16,20,48,.08)}
.topbar{position:sticky;top:0;z-index:50;background:rgba(241,243,248,.88);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  padding-top:env(safe-area-inset-top,0px)}
.tb-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.tb-in .who{flex:1;min-width:0}
.tb-in h1{font-size:18px;margin:0;font-weight:750;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-in .sub{font-size:12.5px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--card);display:grid;place-items:center;position:relative;box-shadow:var(--shadow);flex:none}
.icon-btn:active{transform:scale(.95)}
.me-btn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;flex:none;position:relative}
.live{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 2.5px var(--bg)}
.live.off{background:#d14343}
.wrap{max-width:760px;margin:0 auto;padding:6px 16px calc(var(--nav-h) + var(--sb) + 28px)}
.wrap.wide{max-width:1500px}
.wrap.has-bar{padding-bottom:calc(var(--nav-h) + var(--sb) + 116px)}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.offline{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:130;background:#b93434;color:#fff;border-radius:12px;padding:9px 14px;font-size:13.5px;font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.2)}

/* pastki menyu (telefon) → chap ustun (kompyuter) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button,.nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:650;color:var(--hint);text-decoration:none}
.nav button.on{color:var(--accent)}
.nav .badge{position:absolute;top:7px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}
.nav .fab .fb{width:58px;height:58px;margin-top:-26px;border-radius:50%;background:var(--hero);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(35,40,131,.42),0 0 0 4px var(--card)}
.nav .fab.green .fb{background:var(--green);box-shadow:0 8px 22px rgba(22,163,74,.38),0 0 0 4px var(--card)}
.nav .fab:active .fb{transform:scale(.93)}
.nav .fab span{color:var(--text)}
/* ---------- yon menyu: kompyuterda doim ochiq, telefonda «Menyu» bilan ---------- */
.side{position:fixed;top:0;bottom:0;left:0;width:var(--rail);max-width:86vw;z-index:95;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;transform:translateX(-104%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;padding-top:env(safe-area-inset-top,0px)}
.side.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 24px 70px rgba(0,0,0,.28)}
.side-bg{position:fixed;inset:0;z-index:92;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .2s}
.side-bg.show{opacity:1;pointer-events:auto}
.side-top{display:flex;align-items:center;gap:12px;padding:18px 16px 14px}
.side-top .logo{width:48px;height:48px}
.side-top .nm{min-width:0}
.side-top b{display:block;font-size:15px;letter-spacing:-.2px;line-height:1.2}
.side-top .role{display:inline-block;margin-top:5px;font-size:11px;font-weight:800;letter-spacing:.5px;padding:3px 9px;border-radius:7px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase}
.side-top .role.k{background:#dcfce7;color:#15803d}
.side-top .role.o{background:var(--info-soft);color:var(--info)}
.side-cta{display:grid;gap:8px;padding:0 14px 8px}
.side-cta.two{grid-template-columns:1fr 1fr}
.side-cta .btn{min-height:46px;font-size:14.5px;border-radius:13px;padding:0 10px}
.side-scroll{flex:1;overflow-y:auto;padding:2px 10px 14px;scrollbar-width:thin}
.side-grp{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--hint);text-transform:uppercase;padding:16px 10px 6px}
.side-item{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:9px 10px;border-radius:12px;font-size:14.5px;font-weight:600;color:var(--text);text-decoration:none;text-align:left;transition:background .12s}
.side-item svg{color:var(--hint);flex:none}
.side-item:hover{background:var(--card-2)}
.side-item.on{background:var(--accent-soft);color:var(--accent)}
.side-item.on svg{color:var(--accent)}
.side-item .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--card-2);color:var(--hint);font-size:12px;font-weight:800;display:grid;place-items:center}
.side-item .cnt.hot{background:var(--danger);color:#fff}
.side-item .cnt.info{background:var(--info-soft);color:var(--info)}
.reg-sw{display:inline-flex;gap:2px;background:var(--card-2);padding:3px;border-radius:9px;text-transform:none;letter-spacing:0}
.reg-sw button{font-size:12px;font-weight:800;padding:3px 10px;border-radius:7px;color:var(--hint)}
.reg-sw button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.side-user{display:flex;align-items:center;gap:10px;padding:12px 14px calc(12px + var(--sb));border-top:1px solid var(--line)}
.side-user .who{flex:1;min-width:0;text-align:left}
.side-user .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .who small{display:block;font-size:12px;color:var(--hint)}
.side-user .ava{position:relative}
.side-user .out{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--danger);background:var(--danger-soft);flex:none}
@media (min-width:960px){
  .side{transform:none;visibility:visible;max-width:none}
  .side-bg{display:none}
  .nav{display:none}
  #app{padding-left:var(--rail)}
  #meBtn,#tbLogo{display:none!important}
  body.wide .tb-in{max-width:1500px}
  .wrap{padding-bottom:40px}
  .wrap.has-bar{padding-bottom:130px}
  .bar{left:var(--rail)!important;bottom:0!important}
  .toast{margin-left:calc(var(--rail) / 2)}
}
/* ---------- kompyuter: ikki ustun, o'ngda xulosa paneli ---------- */
.home-side,.wz-side{display:none}
.side-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px}
.side-card + .side-card{margin-top:14px}
.side-card h3{margin:0 0 6px;font-size:16px;letter-spacing:-.2px}
.side-card .sec-h{margin:0 0 4px}.side-card .sec-h h2{font-size:16px}
.side-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:100%;padding:11px 0;border-top:1px solid var(--line);font-size:14px;text-align:left}
.side-rows .side-row:first-child{border-top:0}
.side-row span{color:var(--hint);flex:none}
.side-row b{text-align:right;font-weight:650;min-width:0}
button.side-row:hover b{color:var(--accent)}
.side-row.cur span,.side-row.cur b{color:var(--accent)}
.side-row.todo b{color:var(--hint);font-weight:500}
.side-total{margin:6px 0 14px;padding-top:12px;border-top:1.5px dashed var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.side-total span{color:var(--hint);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.side-total b{font-size:24px;letter-spacing:-.6px}
.side-hint{margin-top:12px;font-size:12.5px;color:var(--hint);text-align:center}
.kbd{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--card);box-shadow:inset 0 -1px 0 var(--line),0 0 0 1px var(--line);font-size:11.5px;font-weight:800;color:var(--text)}
.mini-list .mini-row:first-child{border-top:0}
.mini-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mini-row .ava{width:36px;height:36px;font-size:12.5px}
.mini-row .tm{width:46px;flex:none;font-weight:750;font-size:13px;color:var(--accent)}
.mini-row .tx{flex:1;min-width:0}
.mini-row .tx b{display:block;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-row .tx small{display:block;font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-row .rt{font-weight:750;font-size:13.5px;text-align:right;flex:none}
.mini-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.mini-btn.yes{background:#16a34a;color:#fff}.mini-btn.no{background:var(--danger-soft);color:var(--danger)}
@media (min-width:1100px){
  .wrap,.tb-in{max-width:1180px}.composer-in{max-width:1156px}
  .home-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
  .home-side{display:block;position:sticky;top:84px;margin-top:4px}
  .wz-grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:28px;align-items:start}
  .wz-side{display:block;position:sticky;top:84px}
  .wz-grid .crumbs{display:none}
  .bar{display:none!important}
  .wrap.has-bar{padding-bottom:40px}
  .cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .cards2 .bk + .bk{margin-top:0}
  .times{grid-template-columns:repeat(6,minmax(0,1fr))}
  .wz-grid .wz-sum{display:none}
  .view > .seg{max-width:560px}
}
@media (max-width:959px){
  body.focus .nav{display:none}
  body.focus .bar{bottom:0;padding-bottom:calc(10px + var(--sb))}
  body.focus .wrap{padding-bottom:calc(var(--sb) + 28px)}
  body.focus .wrap.has-bar{padding-bottom:calc(var(--sb) + 112px)}
}

/* ---------- umumiy bloklar ---------- */
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px}
.sec-h h2{font-size:17px;margin:0;font-weight:750;letter-spacing:-.2px}
.sec-h .link{font-size:14px}
.link{color:var(--accent);font-weight:650;font-size:14px}
.note{padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.45}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.err{background:var(--danger-soft);color:var(--danger)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:15px;padding:0 18px;font-weight:700;font-size:16px;width:100%;transition:transform .08s,background .15s,opacity .15s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:active{background:var(--accent-press)}
.btn-green{background:#16a34a;color:#fff}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-soft{background:var(--card-2);color:var(--text)}
.btn-white{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-sm{min-height:40px;font-size:14px;border-radius:12px;padding:0 14px;width:auto}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{flex:1}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:13px;font-weight:650;color:var(--hint);margin:0 2px 6px}
.input{width:100%;min-height:50px;border-radius:14px;border:0;background:var(--card);padding:13px 14px;font-size:16px;outline:none;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .15s}
.card .input,.sheet .input{background:var(--card-2)}
.input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
textarea.input{min-height:84px;resize:vertical;line-height:1.4}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--hint) 50%),linear-gradient(135deg,var(--hint) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.input::placeholder{color:var(--hint);opacity:.8}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--hint)}
.search .input{padding-left:44px;min-height:54px;font-size:16.5px;border-radius:16px;box-shadow:var(--shadow),inset 0 0 0 1.5px var(--line)}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--hint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(20,24,51,.07);border-radius:14px;padding:3px;gap:2px}
.seg button{min-height:40px;border-radius:11px;font-weight:700;font-size:14px;color:var(--hint);white-space:nowrap;padding:0 8px;position:relative;text-align:center}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg .n{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;margin-left:5px;vertical-align:1px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff}
.chip input[type=date]{border:0;background:transparent;font-weight:700;font-size:14px;outline:0;width:128px}
.chip .n{font-size:12px;opacity:.75}

.list{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;min-height:62px;text-decoration:none}
.row + .row{border-top:1px solid var(--line)}
button.row:active,a.row:active{background:var(--card-2)}
.row .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none;font-weight:800}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--hint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;flex:none;font-weight:750;font-size:14.5px}
.row .rt small{display:block;font-weight:600;color:var(--hint);font-size:12px;margin-top:2px}
.row .chev{color:var(--hint)}
.ava{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.ava.lg{width:54px;height:54px;font-size:18px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--card-2);color:var(--hint);white-space:nowrap;vertical-align:1px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.pkg{background:#dcfce7;color:#15803d}
.empty{text-align:center;padding:34px 20px}
.empty .ill{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
.empty b{display:block;font-size:17px}
.empty p{color:var(--hint);margin:6px 0 16px}
.empty .btn{max-width:280px;margin:0 auto}
.sk{border-radius:16px;min-height:62px;background:linear-gradient(90deg,var(--card-2) 25%,var(--card) 50%,var(--card-2) 75%);background-size:200% 100%;animation:sk 1.1s infinite linear}
.sk + .sk{margin-top:10px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.more{margin-top:12px}

/* ---------- bosh sahifa ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 18px;color:#fff;background:var(--hero);margin-top:4px}
.hero::before{content:"";position:absolute;right:-60px;top:-80px;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 68%)}
.hero>*{position:relative}
.hero small{display:block;font-size:12px;font-weight:800;letter-spacing:.6px;opacity:.8;text-transform:uppercase}
.hero h2{margin:6px 0 2px;font-size:25px;line-height:1.15;letter-spacing:-.5px}
.hero .clock{font-size:14px;opacity:.85}
.hero .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 14px}
.hero .stats div{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 10px 9px}
.hero .stats b{display:block;font-size:19px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .stats span{display:block;font-size:11.5px;opacity:.8;font-weight:600}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn-light{background:#fff;color:#232883;font-weight:750;border-radius:15px;min-height:52px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;flex:1}
.btn-light.ghost{background:rgba(255,255,255,.14);color:#fff}
.hero .acts .btn-light{flex:1 1 150px;white-space:nowrap;min-width:0}
@media (max-width:420px){.hero .acts .btn-light{font-size:15px;padding:0 12px;gap:6px}}
.btn-light:active{transform:scale(.98)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;padding:15px 14px 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);text-align:left;min-height:118px;text-decoration:none;transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile .ti{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile b{display:block;font-size:15.5px;letter-spacing:-.2px;line-height:1.2}
.tile small{display:block;color:var(--hint);font-size:12.5px;margin-top:2px;line-height:1.3}
.tile .num{position:absolute;right:14px;top:14px;font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--text)}
.tile.hot{box-shadow:inset 0 0 0 2px var(--danger),var(--shadow)}
.tile.hot .num{color:var(--danger)}
.tile.hot .ti{background:var(--danger-soft);color:var(--danger)}
.tile.g .ti{background:var(--ok-soft);color:var(--ok)}
.tile.o .ti{background:var(--warn-soft);color:var(--warn)}
.tile.b .ti{background:var(--info-soft);color:var(--info)}
.tile.dark{background:var(--card-2);box-shadow:none}

/* ---------- bosqichlar (wizard) ---------- */
.wz-top{display:flex;align-items:center;gap:12px;padding:4px 0 14px}
.wz-prog{flex:1;display:flex;gap:5px}
.wz-prog i{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .25s}
.wz-prog i.done{background:var(--accent)}
.wz-prog i.cur{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%)}
.wz-count{font-size:13px;font-weight:750;color:var(--hint);min-width:30px;text-align:right}
.wz-h{font-size:26px;line-height:1.15;letter-spacing:-.6px;margin:2px 2px 6px}
.wz-sub{color:var(--hint);margin:0 2px 18px;font-size:14.5px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.crumbs button{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700}
.opt-list{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);text-align:left;transition:transform .1s,background .15s,box-shadow .15s}
.opt:active{transform:scale(.985)}
.opt.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.opt:disabled{opacity:.5}
.opt .lt{width:54px;height:54px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:26px;font-weight:800;flex:none}
.opt.on .lt{background:var(--accent);color:#fff}
.opt .tx{flex:1;min-width:0}
.opt .tx b{display:block;font-size:17px;letter-spacing:-.2px}
.opt .tx small{display:block;color:var(--hint);font-size:13.5px;margin-top:2px}
.opt .rt{text-align:right;font-weight:800;font-size:15px;flex:none}
.opt .rt small{display:block;font-weight:600;color:var(--hint);font-size:12px}
.opt.now{background:var(--green);color:#fff;box-shadow:0 10px 24px rgba(22,163,74,.28)}
.opt.now .lt{background:rgba(255,255,255,.2);color:#fff}
.opt.now .tx small{color:rgba(255,255,255,.88)}
.opt.now.on{box-shadow:0 0 0 3px #fff,0 0 0 5px #16a34a}
.dur-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dur{padding:16px 12px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);text-align:left;transition:transform .1s}
.dur:active{transform:scale(.97)}
.dur b{display:block;font-size:20px;letter-spacing:-.4px}
.dur small{display:block;color:var(--hint);font-weight:650;font-size:13px;margin-top:3px}
.dur.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.dur.on b,.dur.on small{color:var(--accent)}
.pkg-card{position:relative;display:block;width:100%;margin-top:12px;padding:18px 16px 16px;border-radius:22px;text-align:left;background:var(--green);color:#fff;box-shadow:0 10px 26px rgba(22,163,74,.32);overflow:hidden}
.pkg-card:active{transform:scale(.985)}
.pkg-card.on{box-shadow:0 0 0 3px #fff,0 0 0 5px #16a34a,0 10px 26px rgba(22,163,74,.32)}
.pkg-card .badge{display:inline-block;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.22);font-size:12px;font-weight:800}
.pkg-card .ttl{display:block;font-size:23px;font-weight:800;letter-spacing:-.4px;margin-top:8px}
.pkg-card .sub{display:block;font-size:13.5px;opacity:.92;margin-top:3px}
.pkg-card .pr{position:relative;z-index:1;display:flex;align-items:baseline;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.25)}
.pkg-card .pr s{font-size:14px;opacity:.8;font-weight:600}
.pkg-card .pr b{font-size:23px;font-weight:800}
.pkg-card::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.split-list{display:grid;gap:10px;margin-top:6px}
.split{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:18px;background:var(--card-2);text-align:left}
.split.on{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok)}
.split .bars{display:flex;gap:3px;flex:none;width:74px}
.split .bars i{height:26px;border-radius:6px;background:var(--ok);opacity:.85}
.split .tx{flex:1;min-width:0}
.split .tx b{display:block;font-size:16px}
.split .tx small{display:block;color:var(--hint);font-size:13px;margin-top:2px}
.sess-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;scrollbar-width:none}
.sess-tabs::-webkit-scrollbar{display:none}
.sess-tab{flex:none;padding:9px 12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);text-align:left;font-size:12.5px;line-height:1.25}
.sess-tab b{display:block;font-size:13.5px}
.sess-tab.on{background:var(--accent);color:#fff}
.sess-tab.set:not(.on){box-shadow:inset 0 0 0 2px var(--ok)}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:3px 16px 5px}
.scroller::-webkit-scrollbar{display:none}
.day{flex:none;width:62px;padding:9px 0 10px;border-radius:15px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);text-align:center}
.day .w{display:block;font-size:12px;color:var(--hint);font-weight:700}
.day .d{display:block;font-size:20px;font-weight:800;margin-top:1px}
.day .m{display:block;font-size:11.5px;color:var(--hint)}
.day.on{background:var(--accent);box-shadow:none;color:#fff}
.day.on .w,.day.on .m{color:inherit;opacity:.85}
.day:disabled{opacity:.4}
.times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (min-width:620px){.times{grid-template-columns:repeat(6,minmax(0,1fr))}}
.time{min-height:52px;border-radius:13px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:750;font-size:15.5px;font-variant-numeric:tabular-nums;text-align:center;line-height:1.1}
.time small{display:block;font-size:10.5px;font-weight:650;color:var(--ok);margin-top:2px}
.time.on{background:var(--accent);color:#fff;box-shadow:none}
.time.on small{color:#fff;opacity:.85}
.time:disabled{color:var(--hint);opacity:.55;box-shadow:none;background:var(--card-2)}
.time:disabled small{color:var(--hint)}
.sum-card{padding:4px 16px}
.sum-row{display:flex;align-items:center;gap:10px;width:100%;padding:14px 0;text-align:left;font-size:15px}
.sum-row + .sum-row{border-top:1px solid var(--line)}
.sum-row span{color:var(--hint);flex:none}
.sum-row b{flex:1;text-align:right;min-width:0;font-weight:650}
.sum-row .ed{color:var(--accent);flex:none}
.pay-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pay{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-weight:750;font-size:14.5px}
.pay .pi{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.pay.on{background:var(--accent);color:#fff;box-shadow:none}
.pay.on .pi{background:rgba(255,255,255,.18);color:#fff}
.total-card{text-align:center;padding:20px 16px}
.total-card .lbl{font-size:12.5px;font-weight:800;letter-spacing:.5px;color:var(--hint);text-transform:uppercase}
.total-card .big{font-size:34px;font-weight:850;letter-spacing:-1px;margin-top:4px}
.total-card s{color:var(--hint);font-size:15px;font-weight:600}
.total-card .save{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:99px;background:#dcfce7;color:#15803d;font-weight:800;font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--sb));z-index:55;padding:10px 12px 8px;background:linear-gradient(to top,var(--bg) 62%,transparent)}
.bar-in{max-width:736px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:9px 9px 9px 16px;box-shadow:0 10px 32px rgba(0,0,0,.14)}
.bar .sum{flex:1;min-width:0}
.bar .sum b{display:block;font-size:18px;letter-spacing:-.3px;white-space:nowrap}
.bar .sum span{display:block;font-size:12.5px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .btn{width:auto;min-width:160px;min-height:52px}
.done-hero{text-align:center;padding:26px 16px 8px}
.done-hero .ok{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}
.done-hero h2{margin:0;font-size:24px;letter-spacing:-.5px}
.done-hero p{margin:6px 0 0;color:var(--hint)}
.code-big{display:inline-block;margin-top:8px;font-size:26px;font-weight:850;letter-spacing:.12em;padding:8px 16px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}

/* ---------- chek chiqarish: hammasi bitta oynada ---------- */
.co-form .co-sec{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px 16px;margin-top:12px;scroll-margin-top:84px}
.co-form .co-sec:first-child{margin-top:4px}
.co-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-width:0;min-height:26px}
.co-h i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.co-h i.todo{background:var(--accent-soft);color:var(--accent)}
.co-h b{font-size:16px;letter-spacing:-.2px;flex:none}
.co-h span{margin-left:auto;font-size:13px;color:var(--hint);font-weight:650;text-align:right;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchips{display:flex;flex-wrap:wrap;gap:8px}
.cch{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:54px;padding:8px 14px;border-radius:14px;background:var(--card-2);text-align:left;transition:background .12s,box-shadow .12s}
.cch b{display:flex;align-items:center;gap:6px;font-size:15.5px;letter-spacing:-.2px;line-height:1.2}
.cch small{font-size:12px;color:var(--hint);font-weight:600;margin-top:3px}
.cch.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cch.on b,.cch.on small{color:var(--accent)}
.cch:disabled{opacity:.45}
.cch.cat{min-width:110px}
.cch.pkg{background:#dcfce7}.cch.pkg b,.cch.pkg small{color:#15803d}
.cch.pkg.on{background:#16a34a;box-shadow:none}.cch.pkg.on b,.cch.pkg.on small{color:#fff}
.cch.pkg s{opacity:.7}
.cch.now{background:var(--ok-soft)}.cch.now b{color:var(--ok)}
.cch.now.on{background:#16a34a;box-shadow:none}.cch.now.on b,.cch.now.on small{color:#fff}
.cch.pay-ch{min-width:110px;align-items:center}
.co-sec .day,.co-sec .time{background:var(--card-2);box-shadow:none}
.co-sec .day.on,.co-sec .time.on{background:var(--accent);color:#fff}
.co-sec .time:disabled{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.co-sec .sess-tab{background:var(--card-2);box-shadow:none}
.co-sec .sess-tab.on{background:var(--accent)}
.insg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.insc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card-2);text-align:left;min-width:0;transition:background .12s,box-shadow .12s}
.insc .ava{width:40px;height:40px;font-size:14px;background:var(--card)}
.insc .tx{min-width:0}
.insc b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insc small{display:block;font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insc.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.insc.on b{color:var(--accent)}
.co-booked{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--accent-soft)}
.co-total{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--line)}
.co-total .big{font-size:28px;font-weight:850;letter-spacing:-.8px}
.co-form .co-sel{padding:0;overflow:hidden}
.co-selh{display:flex;align-items:center;gap:10px;width:100%;min-height:62px;padding:12px 16px;text-align:left}
.co-selh i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.co-selh i.todo{background:var(--accent-soft);color:var(--accent)}
.co-selh .lb{font-size:16px;font-weight:750;letter-spacing:-.2px;flex:none}
.co-selh .vl{margin-left:auto;font-size:15px;font-weight:750;text-align:right;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-selh .vl.ph{color:var(--accent)}
.co-selh .vl.warn{color:var(--warn)}
.rem-checks{display:grid;gap:6px;margin-top:10px}
@media (min-width:960px){.rem-checks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rem-c{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--card-2);min-width:0}
.rem-c i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:12px;margin-top:1px}
.rem-c i.ok{background:var(--ok-soft);color:var(--ok)}.rem-c i.bad{background:var(--warn-soft);color:var(--warn)}
.tg-add{display:flex;gap:8px;margin-top:10px}.tg-add .input{flex:1;min-width:0}.tg-add .btn{flex:none}
.tg-row{min-height:60px}.tg-row .sw{margin-left:4px}.tg-del{width:38px;height:38px;border-radius:11px;box-shadow:none;background:var(--card-2);color:var(--hint)}
.rem-c span{min-width:0}.rem-c b{display:block;font-size:13px}.rem-c small{display:block;font-size:12px;color:var(--hint);line-height:1.35}
.co-selh .cv{color:var(--hint);transition:transform .2s;flex:none;display:grid}
.co-sel.open .co-selh .cv{transform:rotate(90deg);color:var(--accent)}
.co-fixed .co-selh{cursor:default;min-height:58px;padding-bottom:6px}
.co-fixed .vl{display:inline-flex;align-items:center;gap:8px;color:var(--ok)}
.co-fixed .co-now-t{font-variant-numeric:tabular-nums}
.co-fixed-note{padding:0 16px 13px;font-size:12.5px;color:var(--hint);line-height:1.4}
.live-dot{width:9px;height:9px;border-radius:50%;background:#16a34a;flex:none;animation:livep 1.8s infinite}
@keyframes livep{0%{box-shadow:0 0 0 0 rgba(22,163,74,.45)}70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
.co-sec .sess-tab.fixed{cursor:default;background:var(--ok-soft);color:var(--ok);box-shadow:none}
.co-sel.open .co-selh{background:var(--card-2)}
@media (hover:hover){.co-selh:hover .vl{color:var(--accent)}}
.co-body{padding:12px 16px 16px;border-top:1px solid var(--line)}
.co-opts{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.co-opt{min-width:0}
.co-opt{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:14px;background:var(--card-2);text-align:left;min-height:58px;transition:background .12s,box-shadow .12s}
.co-opt .lt{width:42px;height:42px;border-radius:12px;background:var(--card);color:var(--accent);display:grid;place-items:center;font-weight:850;font-size:17px;flex:none}
.co-opt .tx{flex:1;min-width:0}
.co-opt .tx b{display:block;font-size:15.5px;letter-spacing:-.2px}
.co-opt .tx small{display:block;font-size:12.5px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-opt .rt{text-align:right;font-weight:800;font-size:14.5px;flex:none}
.co-opt .rt small{display:block;font-size:11.5px;color:var(--hint);font-weight:600}
.co-opt .rt s{color:var(--hint);font-weight:600;font-size:12.5px}
.co-opt .ok{width:20px;flex:none;color:var(--accent);display:grid}
.co-opt .ok{display:none}
/* tanlangani — to'liq bo'yalgan (belgisiz): bir qarashda ko'rinadi */
.co-opt.on{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(43,47,143,.28)}
.co-opt.on .lt,.co-opt.pkg.on .lt,.co-opt.krug.on .lt{background:rgba(255,255,255,.18);color:#fff}
.co-opt.on .tx small,.co-opt.on .rt small,.co-opt.on .rt s{color:rgba(255,255,255,.78)}
.co-opt:disabled{opacity:.5}
.co-opt.pkg .lt{background:#dcfce7;color:#15803d}.co-opt.pkg.on .lt{background:#16a34a;color:#fff}
.co-opt.krug .lt{background:#fff4d6;color:#8a5d00}.co-opt.krug.on .lt{background:#e0a100;color:#fff}
.co-opt.ins .lt{border-radius:50%;font-size:14px}
@media (min-width:1100px){.co-sel .co-opts{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}}
/* Toifa va davomiylik — BITTA QATORDA yonma-yon (telefonda 3 tadan) */
.co-opts.one-row{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}
.co-opts.one-row .co-opt{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;padding:12px 12px 11px;min-height:0;align-self:stretch;height:100%}
.co-opts.one-row .co-opt .lt{width:34px;height:34px;border-radius:10px;font-size:15px}
.co-opts.one-row .co-opt .tx{flex:none;width:100%}

/* ---------- pastdan chiquvchi oyna ---------- */

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;
  padding:10px 18px calc(18px + var(--sb));transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}

  background:#1c2150;color:#fff;border-radius:14px;padding:11px 16px;font-size:14.5px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}

/* ---------- chek (termal printer) ---------- */
#receiptPaper{width:76mm;max-width:100%;margin:auto;font-family:ui-monospace,"Courier New",monospace;color:#000;font-size:14px;line-height:1.55;font-weight:600;background:#fff;padding:10px 8px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);-webkit-print-color-adjust:exact;print-color-adjust:exact}

#receiptPaper .c{text-align:center;color:#000}
#receiptPaper .hr{border-top:2px dashed #000;margin:9px 0}
#receiptPaper .rcbreak{border-top:3px dashed #000;margin:16px 0;break-after:page;page-break-after:always}
#receiptPaper .rrow{display:flex;justify-content:space-between;gap:8px;color:#000}
#receiptPaper .rrow b{font-weight:900;text-align:right}
#receiptPaper .big{font-size:19px;font-weight:900;margin:4px 0}

@media print{
  #app,#login,.sheet-bg,.toast,.offline{display:none!important}
  html,body{background:#fff!important}
  .sheet{position:static!important;transform:none!important;visibility:visible!important;max-height:none!important;overflow:visible!important;padding:0!important;margin:0!important;box-shadow:none!important;border-radius:0!important;max-width:none!important}
  .sheet>:not(#receiptPaper){display:none!important}
  #receiptPaper{width:76mm;padding:2mm;box-shadow:none;border-radius:0}
  @page{size:80mm auto;margin:2mm}
}

/* ---------- ISH GRAFIGI ---------- */
.schtab td.sx{background:#eef0f4;color:#3d4360;font-weight:700;font-size:11px;padding:0 5px;box-shadow:inset 3px 0 0 #8a90a2;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56px}
.schtab td.so{background:repeating-linear-gradient(135deg,#ece6f8 0 6px,#f7f4fd 6px 12px);color:#6b5a97;text-align:center;font-weight:700;font-size:11px}
.in-grafik{width:40px;height:40px;border-radius:12px;box-shadow:none;background:var(--accent-soft);color:var(--accent);margin-left:auto}
.in-grafik + .sw{margin-left:6px}
.wp-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--hint);font-weight:650;margin:0 2px 10px}
.wp-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px;background:var(--ok-soft);box-shadow:inset 0 0 0 1px #9be3b5}
.wp-legend i.def{background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line)}
.wp-legend i.off{background:var(--danger-soft);box-shadow:inset 0 0 0 1px #f3b4b4}
.wp-row{align-items:flex-start}
.wp-row .tx{flex:1;min-width:0}
.wp-row .tx>b{display:block}
.wp-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.wp-c{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:9px;background:var(--ok-soft);color:var(--ok);font-size:11px;line-height:1.15;min-width:0}
.wp-c em{font-style:normal;font-weight:700;color:var(--hint);font-size:10.5px}
.wp-c b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wp-c.def{background:var(--card-2);color:var(--hint)}
.wp-c.off{background:var(--danger-soft);color:var(--danger)}
.wp-c.td{box-shadow:inset 0 0 0 1.5px var(--accent)}
.wp-head{display:flex;gap:14px;align-items:center}
.wp-head .ava.lg{width:56px;height:56px;font-size:18px}
.wp-head .tx{min-width:0;flex:1}
.wp-head .tx>b{display:block;font-size:18px}
.wp-head .tx small{display:block;color:var(--hint);font-size:13px;margin-top:2px}
.wp-today{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 10px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-size:13px;font-weight:650}
.wp-today b{font-weight:800}
.chip.wp-day{flex-direction:column;min-height:54px;line-height:1.1;gap:3px;padding:6px 13px;justify-content:center}
.chip.wp-day small{font-size:11px;font-weight:700;color:var(--ok)}
.chip.wp-day.off small{color:var(--danger)}
.chip.wp-day.def small{color:var(--hint)}
.chip.wp-day.on small{color:rgba(255,255,255,.85)}
.wp-dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wp-dayhead h2{font-size:19px;margin:0 0 3px;font-weight:800;letter-spacing:-.2px}
.wp-dayhead .muted{font-size:13.5px;font-weight:650}
.wp-onoff{display:flex;align-items:center;gap:10px;font-weight:750;font-size:13.5px;flex:none;padding:4px 0}
.wp-quick{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:14px;padding:12px;border-radius:14px;background:var(--card-2)}
.wp-quick label span{display:block;font-size:12px;font-weight:700;color:var(--hint);margin:0 2px 5px}
.wp-quick .input{min-height:46px;background:var(--card);padding:10px 12px}
.wp-quick .btn{min-height:46px;width:auto;padding:0 14px;background:var(--card);box-shadow:var(--shadow);color:var(--accent)}
.wp-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.wp-sum div{border-radius:14px;padding:10px 12px;font-size:12.5px;font-weight:700;display:flex;align-items:baseline;gap:6px}
.wp-sum b{font-size:22px;font-weight:850;letter-spacing:-.3px}
.wp-sum .f{background:var(--ok-soft);color:var(--ok)}
.wp-sum .c{background:var(--warn-soft);color:var(--warn)}
.wp-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.wp-acts .btn{width:auto;flex:1 1 0;min-width:0;white-space:nowrap;font-size:13.5px;padding:0 10px}
.wp-hint{font-size:12.5px;margin:12px 2px 8px;line-height:1.45}
.wp-slots{display:grid;gap:8px}
@media (min-width:700px){.wp-slots{grid-template-columns:1fr 1fr}}
.wp-slot{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:9px 12px;border-radius:14px;text-align:left;background:var(--card-2);box-shadow:inset 0 0 0 1.5px var(--line);transition:background .12s,box-shadow .12s}
.wp-slot .h{width:66px;flex:none;font-weight:850;font-size:16px;line-height:1.1}
.wp-slot .h small{display:block;font-size:11.5px;font-weight:650;color:var(--hint)}
.wp-slot .s{flex:1;min-width:0;line-height:1.25}
.wp-slot .s b{display:block;font-size:14px}
.wp-slot .s small{display:block;font-size:12px;color:var(--hint);overflow:hidden;text-overflow:ellipsis}
.wp-slot.open{background:var(--ok-soft);box-shadow:inset 0 0 0 1.5px #9be3b5}
.wp-slot.open .s b{color:var(--ok)}
.wp-slot.shut{background:#fff7e6;box-shadow:inset 0 0 0 1.5px #f6d89a}
.wp-slot.shut .s b{color:var(--warn)}
.wp-slot.dis{opacity:.55}
.wp-slot.bk{background:var(--info-soft);box-shadow:inset 0 0 0 1.5px #b9d6f4}
.wp-slot.bk .s b{color:var(--info)}
.wp-slot.bk.warn{background:var(--danger-soft);box-shadow:inset 0 0 0 1.5px #f3b4b4}
.wp-slot.bk.warn .s small{color:var(--danger);font-weight:700;white-space:normal}
.wp-slot.own{background:#f1ecfb;box-shadow:inset 0 0 0 1.5px #d6c9f2;color:#5b47a0}
.wp-slot.own .s b{color:#5b47a0}
.wp-slot.past{opacity:.5}
.wp-slot:is(button):active{transform:scale(.985)}
.wp-copy{display:flex;flex-wrap:wrap;gap:8px}
.wp-copy .chip{min-width:62px;justify-content:center}
.wp-save{position:sticky;bottom:calc(var(--nav-h) + var(--sb) + 10px);z-index:40;margin-top:16px}
.wp-save-in{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 10px 32px rgba(0,0,0,.14)}
.wp-save .tx{flex:1;min-width:0;line-height:1.25}
.wp-save .tx b{display:block;font-size:14.5px}
.wp-save .tx small{display:block;font-size:12px;color:var(--hint)}
.wp-save .btn{width:auto;min-height:48px;padding:0 16px}
.wp-save.on .wp-save-in{box-shadow:0 10px 32px rgba(0,0,0,.16),inset 0 0 0 2px var(--warn)}
.wp-save.on .tx b{color:var(--warn)}
@media (min-width:960px){.wp-save{bottom:16px}}
@media (max-width:420px){.wp-quick{grid-template-columns:1fr 1fr}.wp-quick .btn{grid-column:span 2;width:100%}.wp-save .tx small{display:none}}

/** Xato matni: satr yoki { message } obyekt — hech qachon «[object Object]» emas. */
const errMsg = v => !v ? '' : typeof v === 'string' ? v : String(v.message || v.error || v.code || '');
async function api(path, opt = {}){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 20000);
  const writing = !['GET', 'HEAD'].includes(String(opt.method || 'GET').toUpperCase());
  try{
    const r = await fetch(path, { ...opt, signal: ctl.signal, credentials: 'include', cache: 'no-store',
      headers: { Accept: 'application/json', ...(opt.body ? { 'Content-Type': 'application/json' } : {}), ...(opt.headers || {}) } });
    const raw = await r.text();
    let d = {};
    try { d = raw ? JSON.parse(raw) : {}; }
    catch { throw Error('Serverdan noto‘g‘ri javob keldi. ' + (writing ? 'Amal bajarilgan bo‘lishi mumkin — ro‘yxatni tekshiring.' : 'Qayta urinib ko‘ring.')); }
    setOnline(true);
    /* Kassa tokeni eskirgan (sessiya emas) — hisobdan chiqarmaymiz, tokenni yangilaymiz */
    if (r.status === 401 && REG_PATHS.test(String(path))) {
      regRefresh();
      const e = Error(errMsg(d.error) || 'Kassa muddati tugagan — qayta urinib ko‘ring'); e.status = 401; throw e;
    }
    if (r.status === 401 && !String(path).endsWith('/login') && !/\/registers\/[^/]+\/(unlock|token)$/.test(String(path))) {
      showLogin(); const e = Error('Sessiya tugagan. Qayta kiring.'); e.silent = true; throw e;
    }
    if (!r.ok || d.ok === false) {
      /* Vercel o'zi qaytargan 404 ({ error: { code: 'NOT_FOUND' } }) — server bu manzilni bilmaydi */
      const noRoute = r.status === 404 && d.error && typeof d.error === 'object';
      const e = Error(noRoute ? `Server bu bo‘limni topmadi (404): ${String(path).split('?')[0]}. Yangilanish to‘liq yuklanmagan bo‘lishi mumkin.`
        : errMsg(d.error) || errMsg(d.message) || `Xato (${r.status})`);
      e.status = r.status; throw e;
    }
    return d;
  }catch(e){
    if (e.name === 'AbortError' || e instanceof TypeError) {
      setOnline(false);
      throw Error(writing ? 'Server javob bermadi. Amal bajarilgan bo‘lishi mumkin — qayta yuborishdan oldin ro‘yxatni tekshiring.' : 'Aloqa yo‘q. Internetni tekshiring.');
    }
    throw e;
  }finally{ clearTimeout(timer); }
}

function sv(key){ const v = S.set[key]; return v == null ? null : (v && typeof v === 'object' && 'value' in v ? v.value : v); }
const DEF_T = { A: { half: 200000, hour: 350000 }, B: { half: 150000, hour: 250000 }, C: { half: 250000, hour: 400000 } };
function tariffFor(cat){
  const k = String(cat || 'B').toUpperCase(), d = DEF_T[k] || DEF_T.B;
  const half = Number(sv('half_' + k.toLowerCase())), hour = Number(sv('rate_' + k.toLowerCase()));
  return { half: half > 0 ? half : d.half, hour: hour > 0 ? hour : d.hour };
}
const PKG_MIN = 300;
/** 5 soatlik paket — faqat B toifa. Sozlama bo'lmasa 1 100 000; 0 — o'chiq. */
function pkgPrice(cat){
  if (String(cat || '').toUpperCase() !== 'B') return 0;
  const v = sv('paket5_b');
  if (v === null || v === undefined || v === '') return 1100000;
  const n = Number(v); return n > 0 ? Math.round(n) : 0;
}
/** 1 krug (avtodrom bo'ylab bir aylana): sozlamadan narx (standart 80 000; 0 — o'chiq) va vaqt (15 daq) */
function krugPrice(){ const v = sv('krug_price'); if (v === null || v === undefined || v === '') return 80000; const n = Number(v); return n > 0 ? Math.round(n) : 0; }
function krugMin(){ const n = Number(sv('krug_min')); return n >= 15 && n <= 60 ? Math.round(n) : 15; }
function listPrice(cat, min){ const t = tariffFor(cat), m = Math.max(1, Math.round(Number(min) || 0)); return m === 30 ? Math.round(t.half) : Math.round(t.hour * m / 60); }
function priceOf(cat, min){ if (Math.round(min) === PKG_MIN) { const p = pkgPrice(cat); if (p > 0) return p; } return listPrice(cat, min); }
/** Paket ulushlari — server bilan bir xil (proporsional, qoldiq birinchisiga). */
function shares(total, mins){
  const sum = mins.reduce((a, b) => a + b, 0) || 1;
  const out = mins.map(m => Math.floor(total * m / sum));
  out[0] += Math.round(total) - out.reduce((a, b) => a + b, 0);
  return out;
}

const REG_KEY = 'avtodrom_reg_tokens', REG_PICK = 'avtodrom_simple_reg';
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
const regValid = t => { if (!t) return false; const exp = Number(String(t).split('.')[1]); return !exp || exp > Date.now() + 60000; };

}

function showReceipts(r, { autoPrint = false, onNew = null, title = '' } = {}){
  const list = (Array.isArray(r) ? r : [r]).filter(Boolean);

  const total = list.reduce((a, x) => a + (Number(x.amount) || 0), 0);

    <div id="receiptPaper">${list.map(receiptHtml).join('<div class="rcbreak"></div>')}</div>

  $('rcPrint').onclick = () => window.print();

async function reprint(code, btn){

function go(r){ const h = '#/' + r; if (location.hash === h) render(); else location.hash = h; }
function parseHash(){
  const m = /^#\/([^/?]*)\/?(.*)$/.exec(location.hash || '');
  return { name: m?.[1] || 'home', arg: decodeURIComponent(m?.[2] || '') };
}
window.addEventListener('hashchange', () => { if (sheetOpen()) closeSheet(); render(); });
function render(){
  if (!S.me) return;
  let { name, arg } = parseHash();
  let R = ROUTES[name];
  if (!R || !R.roles.includes(role())) { name = 'home'; arg = ''; R = ROUTES.home; history.replaceState(null, '', '#/home'); }
  const changed = name !== S.routeName || arg !== S.routeArg;
  S.routeName = name; S.routeArg = arg;
  $('tbTitle').textContent = R.t;
  $('tbSub').textContent = subline();
  $('backBtn').classList.toggle('hidden', name === 'home');
  /* Bosqichli ishda (2-qadamdan boshlab) telefon menyusi yashiriladi —
     diqqat bitta ishda. Yuqoridagi tugma «yopish» bo'ladi (bosh sahifaga).
     Qaysi qadamda ekanini wzRender o'zi belgilaydi. */
  document.body.classList.remove('focus');
  document.body.classList.toggle('wide', !!R.wide);
  $('backBtn').innerHTML = R.focus ? I('x', 22, 2.2) : I('back', 22, 2.2);
  $('backBtn').setAttribute('aria-label', R.focus ? 'Yopish' : 'Orqaga');
  $('tbLogo').classList.toggle('hidden', name !== 'home');
  const v = $('view');
  v.className = 'wrap' + (R.wide ? ' wide' : '');
  paintNav();
  if (changed) window.scrollTo(0, 0);
  closeSide();
  R.render(arg);
}
function parentOf(){ const R = ROUTES[S.routeName]; return R?.parent ? R.parent(S.routeArg) : 'home'; }
$('backBtn').onclick = () => go(parentOf());

function showLogin(){

  setTimeout(() => { try { ($('loginUser').value ? $('loginPass') : $('loginUser')).focus(); } catch {} }, 60);

let OPEN_AFTER = (() => { try { const o = new URLSearchParams(location.search).get('open') || ''; return /^[a-z]+(\/[a-z0-9-]+)?$/.test(o) ? o : ''; } catch { return ''; } })();
const NO_REG = 'Bu kassir hisobiga kassa biriktirilmagan. Administrator «Xodimlar» bo‘limida kassani belgilasin.';
async function enter(me){
  S.me = me;
  if (me.role === 'cashier') {
    if (!me.register_token || !me.register) {
      try { await post('/api/admin/logout'); } catch {}
      showLogin(); $('loginErr').textContent = NO_REG; $('loginErr').classList.remove('hidden');
      return;
    }
    saveReg(me.register_token, me.register);
  } else if (me.role === 'admin') restoreAdminReg();
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('meIni').textContent = ini(me.full_name || me.login);

  /* Admin botidagi tugma: /admin?open=bookings/new — kirgandan keyin
     to'g'ri shu bo'lim ochiladi (rol ruxsat bermasa — bosh sahifa). */
  if (OPEN_AFTER) { const o = OPEN_AFTER; OPEN_AFTER = ''; history.replaceState(null, '', location.pathname + '#/' + o); }
  render();
  refreshCounts();
  pulse();
}
$('passEye').onclick = () => { const p = $('loginPass'); p.type = p.type === 'password' ? 'text' : 'password'; };
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('loginErr'); err.classList.add('hidden');
  const login = $('loginUser').value.trim(), password = $('loginPass').value;
  if (!login || !password) { err.textContent = 'Login va parolni kiriting'; err.classList.remove('hidden'); return; }
  const btn = $('loginBtn'); busyBtn(btn, true, 'Kirilmoqda');
  try{
    const d = await post('/api/admin/login', { login, password });
    $('loginPass').value = '';
    await enter({ login: d.login, role: d.role, register_id: d.register_id, full_name: d.full_name, register: d.register, register_token: d.register_token });

let pulseBusy = false;
async function pulse(force = false){
  if (!S.me || pulseBusy) return;
  pulseBusy = true;

let rcBusy = null, rcAgain = false, rcLast = 0;
async function refreshCounts(){
  if (!S.me) return;
  if (rcBusy) { rcAgain = true; return rcBusy; }
  const wait = Math.max(0, 2000 - (Date.now() - rcLast));
  rcBusy = (async () => { if (wait) await new Promise(r => setTimeout(r, wait)); await doRefreshCounts(); rcLast = Date.now(); })();
  try { await rcBusy; } finally { rcBusy = null; if (rcAgain) { rcAgain = false; refreshCounts(); } }
}
async function doRefreshCounts(){
  if (!S.me) return;
  if (isCashier() && !regOk()) await regRefresh();
  if (!S.coursesOk || !S.setOk) loadBase();
  const c = S.counts, jobs = [];
  if (canDesk()) {
    jobs.push(api('/api/admin/bookings?status=pending&per_page=8&order=asc').then(d => { c.pending = Number(d.total) || 0; S.pendRows = d.bookings || []; }).catch(() => {}));
    jobs.push(api('/api/admin/cancellation-requests').then(d => { c.cancels = (d.requests || []).length; }).catch(() => {}));
    jobs.push(api('/api/admin/support').then(d => { c.chat = (d.threads || []).reduce((a, t) => a + (Number(t.unread) || 0), 0); }).catch(() => {}));
  }
  if (canKassa()) jobs.push(api('/api/admin/in-progress').then(d => { c.live = Number(d.counts?.active) || 0; c.liveRed = Number(d.counts?.red) || 0; }).catch(() => {}));
  /* Administrator bosh sahifada HAMMA kassaning bugungi cheklarini ko'radi; kassir — o'zinikini */
  if (isAdmin() || (canKassa() && regOk())) jobs.push(api(`/api/admin/cashier/receipts?${isAdmin() ? 'register=all' : 'token=' + encodeURIComponent(S.reg.t)}&date=${kToday()}`)
    .then(d => { const s = d.summary || {}; c.receipts = (Number(s.total) || 0) - (Number(s.cancelled) || 0); c.amount = Number(s.amount) || 0; S.rcRows = d.receipts || []; }).catch(() => {}));
  if (isAdmin() && (!S.appsAt || Date.now() - S.appsAt > 5 * 60000 || ['home', 'instructors'].includes(S.routeName))) {
    S.appsAt = Date.now();
    jobs.push(api('/api/admin/applications').then(d => { c.apps = (d.applications || []).filter(a => String(a.status || '').toUpperCase() === 'PENDING').length; }).catch(() => {}));
  }
  if (isAdmin() && S.routeName === 'home') {
    jobs.push(api(`/api/admin/analytics?period=day&date=${kToday()}`).then(d => { S.today = d.totals || {}; }).catch(() => {}));
    /* Ikkala kassaning bugungi hisobi — faqat administrator ko'radi */
    jobs.push(api('/api/admin/register-report?period=day').then(d => { S.regRep = d; }).catch(() => {}));
  }
  await Promise.all(jobs);
  paintNav();
  if (S.routeName === 'home') paintHomeCounts();
}

function wzRender(W){

  document.body.classList.toggle('focus', W.step !== 'cust' && !W.done);
  if (W.done) return mbDone(W);
  const keepDays = $('wzDays')?.scrollLeft || 0;
  let body = '', bar = '';
  switch (W.step) {
    case 'cust': body = stepCust(W); break;
    case 'cat': body = stepCat(W); break;
    case 'dur': body = stepDur(W); break;
    case 'time': [body, bar] = stepTime(W); break;
    case 'ins': [body, bar] = stepIns(W); break;
    case 'pay': [body, bar] = stepPay(W); break;
    case 'ok': [body, bar] = stepOk(W); break;

      if (W.found?.length === 1) ACT.wzbook(document.querySelector('[data-act="wzbook"]'));
    });
    $('wzName').addEventListener('input', e => { W.name = e.target.value; });
    $('wzPhone').addEventListener('input', e => { W.phone = e.target.value; });

function wzNext(W){
  const st = wzSteps(W), i = st.indexOf(W.step);
  if (i < st.length - 1) { W.step = st[i + 1]; if (W.step === 'time') wzEnterTime(W); if (W.step === 'ins') W.insRes = null; }
  wzRender(W); window.scrollTo(0, 0);
}
ACT.wzback = () => {
  const W = curW();
  if (ONE(W)) { if (W.booking) return ACT.conobook(); if (W.q) return ACT.wzclr(); return; }
  if (MB1(W)) { if (W.done) { MB_reset(); return render(); } if (W.q) return ACT.wzclr(); return; }
  if (W.done) { W.kind === 'mb' ? MB_reset() : CO_reset(); return render(); }
  const st = wzSteps(W), i = st.indexOf(W.step);
  if (i <= 0) return go(parentOf());
  W.step = st[i - 1];
  if (W.step === 'cust' && W.booking) { W.booking = null; }
  if (W.step === 'ins') W.insRes = null;
  wzRender(W); window.scrollTo(0, 0);
};
ACT.wzgo = el => { const W = curW(); W.step = el.dataset.s; if (W.step === 'time') wzEnterTime(W); if (W.step === 'ins') W.insRes = null; wzRender(W); window.scrollTo(0, 0); };
ACT.wznext = () => wzNext(curW());

/* ---------- Kompyuterda o'ng panel: tanlanganlar, narx va asosiy tugma ---------- */
function wzSide(W){
  const co = W.kind === 'co', b = W.booking, cur = W.step;
  const row = (k, v, s, raw) => {
    const has = !!v, on = s && s === cur;
    const val = has ? (raw ? v : esc(v)) : on ? 'tanlanmoqda…' : '—';
    const cls = `side-row ${on ? 'cur' : ''} ${has ? '' : 'todo'}`;
    return has && s && !on ? `<button class="${cls}" data-act="wzgo" data-s="${s}"><span>${k}</span><b>${val}</b></button>` : `<div class="${cls}"><span>${k}</span><b>${val}</b></div>`;
  };
  let rows;
  if (b) rows = [row('Mijoz', W.name, ''), row('Bron kodi', b.pickup_code || '—', ''), row('Toifa', W.cat + ' toifa', ''),
    row('Vaqt', whenText(b.start_at), ''), row('Davomiylik', fmtDur(b.duration_minutes), ''), row('Instruktor', b.instructor?.profile?.full_name || '—', '')];
  else {
    const set = W.sess.filter(x => x.t);
    const vaqt = set.length ? W.sess.map((x, i) => esc((W.sess.length > 1 ? `${i + 1}) ` : '') + (x.t ? sessText(x) : '…'))).join('<br>') : '';
    rows = [row('Mijoz', W.name + (W.phone ? ` · ${W.phone}` : ''), 'cust'), row('Toifa', W.cat ? W.cat + ' toifa' : '', 'cat'),
      row('Davomiylik', isPkg(W) ? `5 soatlik paket · ${W.split.k}` : W.min ? fmtDur(W.min) : '', 'dur'),
      row('Vaqt', vaqt, 'time', true), row('Instruktor', W.ins?.name || '', 'ins')];
  }
  const price = b || (W.cat && W.min) ? (co ? totalOf(W) : priceOf(W.cat, W.min)) : 0;
  const total = price ? `<div class="side-total"><span>${co ? 'To‘lanadi' : 'Narxi'}</span><b id="sideTotal">${nf(price)} so‘m</b></div>` : '';
  let btn = '';
  if (cur === 'time' && W.sess.length && W.sess.every(x => x.t)) btn = `<button class="btn btn-primary" data-act="wznext">Davom etish</button>`;
  else if (cur === 'ins' && W.ins) btn = `<button class="btn btn-primary" data-act="wznext">Davom etish</button>`;
  else if (cur === 'pay') btn = `<button class="btn btn-green" data-act="wzissue">${I('receipt', 20)} Chek chiqarish</button>`;
  else if (cur === 'ok') btn = `<button class="btn btn-primary" data-act="wzsave">${I('check', 20, 2.4)} Bronni saqlash</button>`;
  else btn = `<div class="note info" style="font-size:13.5px">Chap tomondan tanlang — keyingi qadam o‘zi ochiladi.</div>`;
  return `<aside class="wz-side"><div class="side-card"><h3>${co ? (b ? 'Bron bo‘yicha to‘lov' : 'Yangi chek') : 'Yangi bron'}</h3>
    <div class="side-rows">${rows.join('')}</div>${total}${btn}</div>
    <div class="side-hint"><span class="kbd">Esc</span> orqaga &nbsp;·&nbsp; <span class="kbd">F2</span> yangi ${co ? 'chek' : 'bron'}</div></aside>`;
}

function foundHtml(W){

  return h;
}
async function wzSearch(W){
  const q = W.q.trim(), seq = ++W.seq;
  if (q.length < 2) { W.found = null; W.custs = null; W.searching = false; paintFound(W); return; }
  W.searching = true; paintFound(W);
  const enc = encodeURIComponent(q);
  const [custs, found] = await Promise.all([
    api('/api/admin/cashier/search?q=' + enc).then(d => d.customers || []).catch(() => []),
    W.kind === 'co' ? api('/api/admin/cashier/find?q=' + enc).then(d => d.bookings || []).catch(() => []) : Promise.resolve(null),
  ]);
  if (seq !== W.seq) return;
  W.searching = false; W.custs = custs; W.found = found; paintFound(W);
}
const wzSearchD = debounce(W => wzSearch(W), 320);
function paintFound(W){
  if (ONE(W)) { const el = $('coFound'); if (el && S.routeName === 'issue') el.innerHTML = coFoundHtml(W); return; }
  if (MB1(W)) { const el = $('mbFound'); if (el && S.routeName === 'manual') el.innerHTML = mbFoundHtml(W); return; }
  const el = $('wzFound'); if (el && curW() === W && W.step === 'cust') el.innerHTML = foundHtml(W);
}
ACT.wzclr = () => { const W = curW(); W.q = ''; W.found = null; W.custs = null; W.seq++; wzRender(W); $('wzQ')?.focus(); };
ACT.wzcust = el => {
  const W = curW(), c = W.custs?.[Number(el.dataset.i)]; if (!c) return;
  W.customer = c; W.name = c.full_name || ''; W.phone = c.phone || ''; W.booking = null;
  wzNext(W);
};
ACT.wzcustok = () => {
  const W = curW();
  W.name = ($('wzName')?.value ?? W.name).trim(); W.phone = ($('wzPhone')?.value ?? W.phone).trim();
  const q = W.q.trim();
  if (!W.name && q && !/\d{4,}/.test(q)) W.name = q;
  if (!W.phone && /^\+?[\d\s()-]{7,}$/.test(q)) W.phone = q;
  if (W.name.length < 2) { toast('Mijozning ismini yozing', true); $('wzName')?.focus(); if ($('wzName')) $('wzName').value = W.name; return; }
  if (W.kind === 'mb' && W.phone && !/^\+?[\d\s()-]{7,}$/.test(W.phone)) { toast('Telefon raqami noto‘g‘ri', true); $('wzPhone')?.focus(); return; }
  if (W.customer && W.customer.full_name !== W.name) W.customer = null;
  W.booking = null;
  wzNext(W);
};
ACT.wzbook = el => {
  const W = curW(), b = W.found?.[Number(el?.dataset.i)]; if (!b) return;
  W.booking = b; W.name = b.customer?.full_name || 'Mijoz'; W.phone = b.customer?.phone || '';
  W.cat = String(b.category || 'B').toUpperCase(); W.min = Number(b.duration_minutes) || 60;
  const unpaid = (b.package?.sessions || []).filter(s => !s.paid);
  W.payPkg = unpaid.length > 1;
  W.manual = null; W.priceEdit = false; W.pay = 'cash'; W.cash = null; W.card = null;
  W.step = 'pay'; wzRender(W); window.scrollTo(0, 0);
};

function stepCat(W){
  const cats = ['A', 'B', 'C'];

     «yo'q» deb o'chirib qo'ymaymiz, qayta yuklab olamiz. */

/* ---------- 4. Vaqt ---------- */
const SCHC = new Map();   // kun -> { d } | { p }
function schedLoad(day){
  const c = SCHC.get(day);
  if (c?.d) return Promise.resolve(c.d);
  if (c?.p) return c.p;
  const p = api('/api/admin/schedule?date=' + day).then(d => { SCHC.set(day, { d }); return d; }).catch(e => { SCHC.delete(day); throw e; });
  SCHC.set(day, { p });
  return p;
}
function busyMap(d){
  if (d._bm) return d._bm;
  const m = new Map();
  const add = (id, a, b) => { const k = String(id); if (!m.has(k)) m.set(k, []); m.get(k).push([Date.parse(a), Date.parse(b)]); };
  (d.bookings || []).forEach(b => b.instructor_id && add(b.instructor_id, b.start_at, b.end_at));
  (d.blocks || []).forEach(b => add(b.instructor_id, b.start_at, b.end_at));
  return (d._bm = m);
}
function freeIns(d, cat, startMs, min){
  const bm = busyMap(d), e = startMs + min * 60000;
  return (d.instructors || []).filter(i => i.active && (i.categories || ['B']).includes(cat)
    && !(bm.get(String(i.id)) || []).some(([a, b]) => startMs < b && e > a));
}
function wzEnterTime(W){
  if (!W.sess.length) W.sess = [{ m: W.min || 60, day: '', t: '', now: false }];
  const firstOpen = W.sess.findIndex(x => !x.t);
  W.si = firstOpen >= 0 ? firstOpen : Math.min(W.si, W.sess.length - 1);
  W.day = defaultDay(W, W.si);
  if (W.pref && W.si === 0 && !W.sess[0].t && W.pref.day) W.day = W.pref.day;
}
function defaultDay(W, i){
  const s = W.sess[i];
  if (s?.day) return s.day;
  const used = new Set(W.sess.filter((x, j) => j !== i && x.day).map(x => x.day));
  let d = i > 0 && W.sess[i - 1]?.day ? dayAdd(W.sess[i - 1].day, 1) : kToday();
  for (let k = 0; k < 30 && used.has(d); k++) d = dayAdd(d, 1);
  return d;
}
function stepTime(W){
  const s = W.sess[W.si], multi = W.sess.length > 1, day = W.day || kToday();
  const used = new Set(W.sess.filter((x, j) => j !== W.si && x.day).map(x => x.day));
  const t0 = kToday();
  const days = Array.from({ length: 21 }, (_, k) => dayAdd(t0, k)).map((d, k) => {
    const [, m, dd] = ymdParts(d), u = used.has(d);
    return `<button class="day ${d === day ? 'on' : ''}" data-act="wzday" data-v="${d}" ${u ? 'disabled' : ''}>
      <span class="w">${k === 0 ? 'Bugun' : k === 1 ? 'Ertaga' : WDS[wdOf(d)]}</span><span class="d">${dd}</span><span class="m">${u ? 'band' : MONS[m - 1]}</span></button>`;
  }).join('');
  const tabs = multi ? `<div class="sess-tabs">${W.sess.map((x, i) => `<button class="sess-tab ${i === W.si ? 'on' : ''} ${x.t ? 'set' : ''}" data-act="wzsess" data-i="${i}">
      <b>${i + 1}-mashg‘ulot · ${esc(fmtDur(x.m))}</b>${x.t ? esc(sessText(x)) : 'vaqt tanlanmagan'}</button>`).join('')}</div>` : '';
  const nowOk = W.kind === 'co' && W.si === 0 && day === t0;
  const nowOpt = nowOk ? `<button class="opt now ${s.now ? 'on' : ''}" data-act="wznow"><span class="lt">${I('play', 28)}</span>
      <span class="tx"><b>Hozir — ${esc(nowHM())}</b><small>Mijoz shu yerda — darhol boshlaydi</small></span>${I('chev')}</button>
      <div class="sec-h" style="margin-top:18px"><h2>yoki boshqa vaqt</h2></div>` : '';
  const all = W.sess.every(x => x.t);
  const body = `${wzCrumbs(W)}<h1 class="wz-h">${multi ? `${W.si + 1}-mashg‘ulot qachon?` : 'Qachon?'}</h1>
    <p class="wz-sub">${multi ? 'Har mashg‘ulot alohida kunda. ' : ''}Yashil yozuv — shu vaqtda nechta instruktor bo‘sh.</p>
    ${tabs}<div class="scroller" id="wzDays">${days}</div>
    <div class="sec" style="margin-top:14px">${nowOpt}<div id="wzTimes">${timesHtml(W, day)}</div></div>`;
  const bar = all ? `<div class="bar"><div class="bar-in"><div class="sum"><b>${multi ? W.sess.length + ' ta vaqt tanlandi' : esc(sessText(W.sess[0]))}</b><span>${esc(fmtDur(W.min))} · ${esc(W.cat)} toifa</span></div>
    <button class="btn btn-primary" data-act="wznext">Davom etish</button></div></div>` : '';
  return [body, bar];
}
function timesHtml(W, day){
  const c = SCHC.get(day);
  if (!c?.d) return `<div class="times">${Array.from({ length: 8 }, () => '<div class="sk" style="min-height:52px;margin:0"></div>').join('')}</div>`;
  const d = c.d, s = W.sess[W.si], m = s.m;
  const st = toMin(d.work_start) ?? 420, en = toMin(d.work_end) ?? 1140, cut = Date.now();
  const out = [];
  for (let t = st; t + m <= en; t += 30) {
    const at = atTk(day, fromMin(t)).getTime(), past = at < cut;
    out.push({ t: fromMin(t), past, n: past ? 0 : freeIns(d, W.cat, at, m).length });
  }
  if (!out.length) return `<div class="note warn">Ish vaqti ${esc(d.work_start)}–${esc(d.work_end)} — bu davomiylik sig‘maydi.</div>`;
  const hidden = out.filter(x => x.past).length;
  out.splice(0, out.length, ...out.filter(x => !x.past));
  if (!out.length) return `<div class="note warn">${esc(dayLabel(day))} uchun vaqt qolmadi — boshqa kunni tanlang.</div>`;
  const any = out.some(x => x.n);
  const sel = s.day === day && !s.now ? s.t : (W.pref && W.si === 0 && W.pref.day === day && !s.t ? W.pref.t : '');
  return `<div class="times">${out.map(x => `<button class="time ${x.t === sel ? 'on' : ''}" data-act="wztime" data-v="${x.t}" ${x.past || !x.n ? 'disabled' : ''}>
    ${x.t}<small>${x.past ? 'o‘tdi' : x.n ? x.n + ' bo‘sh' : 'band'}</small></button>`).join('')}</div>
    ${any ? '' : `<div class="note warn" style="margin-top:12px">Bu kunda bo‘sh vaqt qolmagan — boshqa kunni tanlang.</div>`}
    ${hidden ? `<p class="muted" style="font-size:12.5px;margin:10px 2px 0">O‘tib ketgan ${hidden} ta vaqt ko‘rsatilmadi.</p>` : ''}`;
}
function ensureTimes(W, day){
  if (SCHC.get(day)?.d) return;
  schedLoad(day).then(() => paintTimes(W)).catch(e => { const el = $('wzTimes') || $('coTimes') || $('mbTimes'); if (el) el.innerHTML = `<div class="note err">${esc(e.message)}</div>`; });
}
function paintTimes(W){
  if (ONE(W)) {
    const el = $('coTimes'); if (!el || S.routeName !== 'issue') return;
    if (!SCHC.get(W.day)?.d) return ensureTimes(W, W.day);
    el.innerHTML = coTimesHtml(W); return;
  }
  if (MB1(W)) {
    const el = $('mbTimes'); if (!el || S.routeName !== 'manual' || MB !== W) return;
    if (!SCHC.get(W.day)?.d) return ensureTimes(W, W.day);

ACT.wzday = el => { const W = curW(); W.day = el.dataset.v; wzRender(W); };
ACT.wzsess = el => { const W = curW(); W.si = Number(el.dataset.i); W.day = defaultDay(W, W.si); wzRender(W); };
function afterTime(W){
  const n = W.sess.length;
  let next = -1;
  for (let k = 1; k <= n; k++) { const j = (W.si + k) % n; if (!W.sess[j].t) { next = j; break; } }
  if (next < 0) { W.step = 'time'; return wzNext(W); }
  W.si = next; W.day = defaultDay(W, next);
  wzRender(W); window.scrollTo(0, 0);
  toast(`${next + 1}-mashg‘ulot vaqtini tanlang`);
}

ACT.wztime = el => { const W = curW(), s = W.sess[W.si]; Object.assign(s, { day: W.day, t: el.dataset.v, now: false }); afterTime(W); };
const sessAt = x => x.now ? new Date() : atTk(x.day, x.t);

/* ---------- 5. Instruktor ---------- */
async function loadIns(W){
  const seq = ++W.insSeq;
  if (!ONE(W) && !MB1(W)) W.insRes = null;
  W.insErr = '';
  try{
    const res = await Promise.all(W.sess.map(x => api(`/api/admin/cashier/free-instructors?at=${encodeURIComponent(sessAt(x).toISOString())}&minutes=${x.m}&category=${encodeURIComponent(W.cat)}`)));
    if (seq !== W.insSeq) return;
    let free = res[0].free || [];
    for (const r of res.slice(1)) { const ids = new Set((r.free || []).map(i => String(i.id))); free = free.filter(i => ids.has(String(i.id))); }
    const ids = new Set(free.map(i => String(i.id)));
    const busy = [...(res[0].busy || []), ...(res[0].free || []).filter(i => !ids.has(String(i.id))).map(i => ({ ...i, other: true }))];
    W.insRes = { free, busy };
    if (W.ins && !ids.has(String(W.ins.id))) { W.ins = null; }
    if (!W.ins && W.pref?.ins && ids.has(String(W.pref.ins))) W.ins = free.find(i => String(i.id) === String(W.pref.ins));
  }catch(e){ if (seq !== W.insSeq) return; W.insErr = e.message; W.insRes = { free: [], busy: [] }; }
  if (ONE(W)) {
    if (!W.ins && !W.noIns && W.insRes?.free?.length) { W.ins = W.insRes.free[0]; W.insAuto = true; }
    if (S.routeName === 'issue' && CO === W) coPaintIns();
    return;
  }
  if (MB1(W)) {
    if (!W.ins && W.insRes?.free?.length) { W.ins = W.insRes.free[0]; W.insAuto = true; }
    if (MB === W) mbPaintIns();
    return;
  }
  if (curW() === W && W.step === 'ins') wzRender(W);
}

/* ---------- 6a. To'lov va chek (kassa) ---------- */
function pkgUnpaid(W){ return (W.booking?.package?.sessions || []).filter(s => !s.paid); }
function autoPrice(W){
  if (W.booking) {
    if (W.payPkg && pkgUnpaid(W).length > 1) return pkgUnpaid(W).reduce((a, x) => a + (Number(x.price) || 0), 0);
    return Math.round(Number(W.booking.price) || 0);
  }
  if (W.krug) return krugPrice();
  return priceOf(W.cat, W.min);
}
const totalOf = W => W.manual != null ? W.manual : autoPrice(W);
function payParts(W){
  const t = totalOf(W);
  if (W.pay === 'cash') return { cash: t, card: 0 };
  if (W.pay === 'card') return { cash: 0, card: t };
  const cash = W.cash ?? 0, card = W.card ?? Math.max(0, t - cash);
  return { cash, card };
}

      ${pk && un.length > 1 ? `<button class="card" data-act="wzpaypkg" style="display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;text-align:left">
        <span style="flex:1;min-width:0"><b style="display:block;font-size:15.5px">Butun paketni to‘lash</b>
        <small class="muted">${un.length} ta to‘lanmagan mashg‘ulot · har biriga alohida chek</small></span><span class="sw ${W.payPkg ? 'on' : ''}"></span></button>` : ''}
      ${pk ? `<div class="note ok" style="margin-top:10px">5 soatlik paket · ${esc(pk.n)}/${esc(pk.of)}-mashg‘ulot</div>` : ''}`;
  } else sum = sumRows(W);
  const pk = !b && isPkg(W), lp = listPrice(W.cat, PKG_MIN);
  const body = `${b ? '' : wzCrumbs(W)}<h1 class="wz-h">To‘lov</h1><p class="wz-sub">Tekshiring — kerak bo‘lsa istalgan qatorni bosib o‘zgartiring.</p>
    ${sum}
    <div class="card total-card" style="margin-top:12px"><div class="lbl">To‘lanadi</div><div class="big" id="wzTotal">${nf(total)} so‘m</div>
      ${pk && W.manual == null ? `<div><s>${nf(lp)} so‘m</s> <span class="save">${nf(lp - auto)} so‘m tejaldi</span></div>` : ''}
      ${W.manual != null ? `<div class="muted" style="font-size:13px">Avtomatik narx: ${nf(auto)} so‘m</div>` : ''}
      ${pk && W.sess.length > 1 ? `<div class="muted" style="font-size:13px;margin-top:6px" id="wzShares">${W.sess.length} ta chek: ${shares(total, W.sess.map(x => x.m)).map(nf).join(' + ')}</div>` : ''}
      <div id="wzPriceBox" class="${W.priceEdit ? '' : 'hidden'}" style="margin-top:12px"><input class="input" id="wzPrice" inputmode="numeric" value="${W.manual ?? ''}" placeholder="Yangi summa, so‘m" style="text-align:center;font-size:20px;font-weight:700"></div>
      <button class="link" data-act="wzprice" style="margin-top:10px">${W.manual != null ? 'Avtomatik narxga qaytarish' : W.priceEdit ? 'Yopish' : 'Narxni qo‘lda o‘zgartirish'}</button></div>
    <div class="sec-h" style="margin-top:20px"><h2>To‘lov turi</h2></div>
    <div class="pay-grid">${[['cash', 'Naqd', 'cash'], ['card', 'Karta', 'card'], ['mixed', 'Aralash', 'mix']].map(([k, l, ic]) => `

    ${W.pay === 'mixed' ? `<div class="card" style="margin-top:10px"><div class="grid2">
      <label class="field" style="margin:0"><span>Naqd</span><input class="input" id="wzCash" inputmode="numeric" value="${payParts(W).cash || ''}" placeholder="0"></label>
      <label class="field" style="margin:0"><span>Karta (terminal)</span><input class="input" id="wzCard" inputmode="numeric" value="${payParts(W).card || ''}" placeholder="0"></label></div>

function payBind(W){
  const pr = $('wzPrice');
  if (pr) pr.addEventListener('input', () => {
    const v = Math.round(Number(pr.value.replace(/\D/g, '')) || 0);
    W.manual = v > 0 ? v : null;
    if (W.pay === 'mixed') { W.card = null; }
    paintTotal(W);
  });
  const ca = $('wzCash'), cd = $('wzCard');
  if (ca) ca.addEventListener('input', () => { W.cash = Math.round(Number(ca.value.replace(/\D/g, '')) || 0); W.card = Math.max(0, totalOf(W) - W.cash); cd.value = W.card || ''; paintMix(W); });
  if (cd) cd.addEventListener('input', () => { W.card = Math.round(Number(cd.value.replace(/\D/g, '')) || 0); W.cash = Math.max(0, totalOf(W) - W.card); ca.value = W.cash || ''; paintMix(W); });
  paintMix(W);
}
function paintTotal(W){
  const t = totalOf(W);
  if ($('wzTotal')) $('wzTotal').textContent = nf(t) + ' so‘m';
  if ($('barTotal')) $('barTotal').textContent = nf(t) + ' so‘m';
  if ($('sideTotal')) $('sideTotal').textContent = nf(t) + ' so‘m';
  if ($('wzShares')) $('wzShares').textContent = `${W.sess.length} ta chek: ${shares(t, W.sess.map(x => x.m)).map(nf).join(' + ')}`;
  if (W.pay === 'mixed' && $('wzCash')) { W.cash = Math.min(W.cash ?? 0, t); W.card = t - W.cash; $('wzCash').value = W.cash || ''; $('wzCard').value = W.card || ''; paintMix(W); }
}
function paintMix(W){
  const el = $('wzMix'); if (!el) return;
  const { cash, card } = payParts(W), d = totalOf(W) - cash - card;
  el.innerHTML = d === 0 ? `<span class="ok-t">Naqd ${nf(cash)} + karta ${nf(card)} = ${nf(cash + card)} ✓</span>` : `<span class="bad-t">${d > 0 ? 'Yetishmayapti' : 'Ortiqcha'}: ${nf(Math.abs(d))} so‘m</span>`;
}
/* NARXNI O'ZGARTIRISH — faqat maxsus parol bilan. Parol to'g'ri bo'lsa
   server 15 daqiqalik token beradi (shu xodim uchun); chek chiqarishda

const priceTokOk = () => !!(S.priceTok && S.priceTok.exp > Date.now() + 30000);
function priceEditOpen(W){

ACT.wzpay = el => { const W = curW(); W.pay = el.dataset.v; if (W.pay === 'mixed') { W.cash = null; W.card = null; } if (ONE(W)) return coPatch('pay', ['pay']); wzRender(W); };
