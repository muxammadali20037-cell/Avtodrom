<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVTODROM — Foydalanuvchi</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{margin:0;background:#f5f7f6;color:#14221b;font:14px Arial}.app{max-width:540px;margin:auto;min-height:100vh;background:#fff}.top{padding:14px 16px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}.brand{font-weight:900;font-size:19px}.content{padding:16px 16px 80px}.page{display:none}.page.active{display:block}.card{border:1px solid #e1e8e4;border-radius:15px;padding:15px;margin:12px 0}.field{display:grid;gap:5px;margin:10px 0}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d8e1dc;border-radius:9px;box-sizing:border-box}.btn{border:1px solid #d8e1dc;background:#fff;border-radius:10px;padding:11px 13px;font-weight:800}.primary{background:#087443;color:#fff;border-color:#087443}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;padding:9px;font-size:11px}.status{padding:5px 8px;border-radius:99px;background:#eef7f1;display:inline-block;font-weight:800}.err{background:#fff0ef;color:#a32118;padding:10px;border-radius:9px}.muted{color:#6e7b74}.ai{position:fixed;right:18px;bottom:70px;border:0;border-radius:99px;background:#087443;color:white;padding:13px;font-weight:900}.chat{position:fixed;right:16px;bottom:125px;width:min(390px,calc(100% - 32px));height:430px;background:white;border:1px solid #ddd;border-radius:18px;box-shadow:0 10px 40px #0002;display:none;z-index:10}.chat.open{display:flex;flex-direction:column}.chathead{padding:12px;background:#087443;color:white;border-radius:18px 18px 0 0}.messages{flex:1;overflow:auto;padding:10px}.msg{padding:9px 11px;border-radius:12px;margin:6px 0;max-width:85%;background:#f1f5f3}.mine{margin-left:auto;background:#087443;color:white}.chatinput{display:flex;padding:8px;gap:6px}.chatinput input{flex:1;padding:10px;border:1px solid #ddd;border-radius:9px}</style></head><body><div class="app"><header class="top"><div class="brand">🚗 AVTODROM</div><button class="btn" onclick="toggleAI()">🤖 Yordam</button></header><main class="content"><section id="home" class="page active"><div class="card"><h2 id="hello">Xush kelibsiz!</h2><p>Real bronlaringiz va bildirishnomalaringiz shu yerda.</p><button class="btn primary" style="width:100%" onclick="show('book')">Dars bron qilish</button></div><div class="card"><b>Bildirishnomalar</b><div id="notifications" class="muted">Yuklanmoqda...</div></div></section><section id="book" class="page"><h2>Dars bron qilish</h2><div id="bookError"></div><div class="card"><div class="field"><label>Instruktor</label><select id="instructor"></select></div><div class="field"><label>Sana va vaqt</label><input id="start" type="datetime-local"></div><div class="field"><label>Dars davomiyligi</label><select id="duration"><option value="30">30 daqiqa</option><option value="60">60 daqiqa</option><option value="90">90 daqiqa</option></select></div><div class="field"><label>Izoh</label><textarea id="note" rows="3"></textarea></div><button class="btn primary" style="width:100%" onclick="createBooking()">Bron yuborish</button></div></section><section id="bookings" class="page"><h2>Bronlarim</h2><div id="bookingList">Yuklanmoqda...</div></section><section id="profile" class="page"><h2>Profilim</h2><div class="card"><div class="field"><label>Ism *</label><input id="first"></div><div class="field"><label>Familiya *</label><input id="last"></div><div class="field"><label>Telefon *</label><input id="phone" placeholder="+998 90 123 45 67"></div><button class="btn primary" onclick="saveProfile()">Saqlash</button></div></section></main><nav class="nav"><button onclick="show('home')">🏠<br>Bosh sahifa</button><button onclick="show('book')">＋<br>Bron</button><button onclick="show('bookings')">📋<br>Bronlarim</button><button onclick="show('profile')">👤<br>Profil</button></nav></div><button class="ai" onclick="toggleAI()">🤖 AI</button><div id="chat" class="chat"><div class="chathead"><b>AVTODROM AI yordamchi</b><button style="float:right" onclick="toggleAI()">×</button></div><div id="messages" class="messages"><div class="msg">Assalomu alaykum! Savolingizni yozing.</div></div><div class="chatinput"><input id="q" placeholder="Savolingiz..." onkeydown="if(event.key==='Enter')sendQ()"><button class="btn primary" onclick="sendQ()">Yuborish</button></div></div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const API=window.AVTODROM_API_URL||location.origin;const initData=tg?.initData||'';let profile=null;function headers(){return{'Content-Type':'application/json','X-Telegram-Init-Data':initData}}async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Server xatosi');return d}async function boot(){try{const d=await api('/api/me');profile=d.profile;hello.textContent='Xush kelibsiz, '+(profile.first_name||'foydalanuvchi')+'!';first.value=profile.first_name||'';last.value=profile.last_name||'';phone.value=profile.phone||'';loadNotifications()}catch(e){document.querySelector('.content').innerHTML='<div class="card err">Telegram orqali Mini Appni botdan oching.</div>'}}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='book')loadInstructors();if(id==='bookings')loadBookings();if(id==='home')loadNotifications()}async function loadInstructors(){try{const d=await api('/api/instructors');instructor.innerHTML=d.instructors.length?d.instructors.map(x=>`<option value="${x.id}">${x.profile?.first_name||''} ${x.profile?.last_name||''} — ${x.profile?.phone||''}</option>`).join(''):'<option value="">Tasdiqlangan instruktor yo‘q</option>'}catch(e){bookError.innerHTML='<div class="err">'+e.message+'</div>'}}async function createBooking(){try{bookError.innerHTML='';if(!profile?.first_name||!profile?.last_name||!profile?.phone){show('profile');alert('Avval profilni to‘ldiring.');return}if(!start.value||!instructor.value)throw Error('Instruktor va sana-vaqtni tanlang');const s=new Date(start.value),e=new Date(s.getTime()+Number(duration.value)*60000);await api('/api/bookings',{method:'POST',body:JSON.stringify({instructor_id:instructor.value,start_at:s.toISOString(),end_at:e.toISOString(),customer_note:note.value})});alert('Bron yuborildi. Admin tasdiqlashini kuting.');show('bookings');loadBookings()}catch(e){bookError.innerHTML='<div class="err">'+e.message+'</div>'}}async function loadBookings(){try{const d=await api('/api/bookings');bookingList.innerHTML=d.bookings.length?d.bookings.map(b=>`<div class="card"><b>${new Date(b.start_at).toLocaleString('uz-UZ')}</b><p>👨‍🏫 ${b.instructor?.profile?.first_name||'Belgilanmagan'} ${b.instructor?.profile?.last_name||''}</p><p>📞 ${b.instructor?.profile?.phone||''}</p><span class="status">${({pending:'Tasdiqlash kutilmoqda',confirmed:'Tasdiqlangan',in_progress:'Dars jarayonida',completed:'Tugagan',cancelled:'Bekor qilingan',no_show:'Kelmagan'})[b.status]||b.status}</span></div>`).join(''):'<div class="card muted">Hozircha bronlar yo‘q.</div>'}catch(e){bookingList.innerHTML='<div class="err">'+e.message+'</div>'}}async function loadNotifications(){try{const d=await api('/api/notifications');notifications.innerHTML=d.notifications.length?d.notifications.slice(0,5).map(n=>`<div class="card"><b>${n.title}</b><p>${n.body}</p></div>`).join(''):'Hozircha bildirishnoma yo‘q.'}catch(e){notifications.textContent=e.message}}async function saveProfile(){try{const d=await api('/api/me',{method:'PATCH',body:JSON.stringify({first_name:first.value,last_name:last.value,phone:phone.value})});profile=d.profile;alert('Profil saqlandi')}catch(e){alert(e.message)}}function toggleAI(){chat.classList.toggle('open')}function addMsg(t,c){const x=document.createElement('div');x.className='msg '+c;x.textContent=t;messages.appendChild(x);messages.scrollTop=messages.scrollHeight}function sendQ(){const x=q.value.trim();if(!x)return;addMsg(x,'mine');q.value='';setTimeout(()=>addMsg(answer(x),''),200)}function answer(x){const s=x.toLowerCase();if(s.includes('bron'))return'Bron qilish bo‘limida faqat Admin tasdiqlagan faol instruktorlar chiqadi. Sana va vaqtni tanlab bron yuborasiz.';if(s.includes('instruktor'))return'Instruktor Admin tomonidan tasdiqlangan bo‘lishi kerak. Tasdiqlangan instruktorlar bron oynasida avtomatik chiqadi.';if(s.includes('holat'))return'Bronlarim bo‘limida broningiz holatini ko‘rasiz.';if(s.includes('bekor'))return'Bronni bekor qilish bo‘yicha Admin bilan bog‘laning.';return'Savolingiz qabul qilindi. Operator bilan bog‘lanish uchun Admin xizmatidan foydalaning.'}boot();</script></body></html>
