<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16A34A"><title>AVTODROM — Media</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8f7;color:#17211c;font-family:Inter,Arial,sans-serif}.wrap{width:min(900px,100% - 24px);margin:24px auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.head h1{margin:0;font-size:25px}.card{background:#fff;border:1px solid #e2e8e5;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}}label{display:block;font-size:13px;font-weight:800;margin:0 0 6px}input,textarea{width:100%;border:1px solid #d5dfda;border-radius:11px;padding:11px;font:inherit}textarea{min-height:80px;resize:vertical}.btn{border:0;border-radius:11px;padding:11px 15px;background:#16A34A;color:#fff;font-weight:850;cursor:pointer}.btn.gray{background:#eef2f0;color:#17211c}.btn.red{background:#fff0ef;color:#b42318}.bar{display:flex;gap:8px;flex-wrap:wrap}.msg{padding:11px;border-radius:11px;margin:10px 0;background:#eef8f1}.err{background:#fff0ef;color:#b42318}.video{width:100%;max-width:560px;border-radius:14px;background:#000}.item{display:grid;grid-template-columns:180px 1fr auto;gap:14px;align-items:center;border-top:1px solid #edf1ef;padding:14px 0}@media(max-width:680px){.item{grid-template-columns:1fr}.item .video{max-width:100%}}.muted{color:#6d7a73;font-size:13px}.tag{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eaf7ef;color:#087443;font-size:11px;font-weight:900}
</style></head><body><div class="wrap"><div class="head"><div><h1>🎬 Media boshqaruvi</h1><div class="muted">Customer Mini App uchun video qo‘llanmalarni boshqaring.</div></div><button class="btn gray" onclick="location.href='/admin/'">← Admin</button></div>
<div class="card"><h3>Yangi video yuklash</h3><div class="grid"><div><label>Video nomi</label><input id="title" value="Video qo‘llanma"></div><div><label>Video fayl</label><input id="file" type="file" accept="video/mp4,video/webm,video/quicktime"></div></div><div style="margin-top:12px"><label>Tavsif</label><textarea id="description" placeholder="Customerlar uchun qisqa izoh..."></textarea></div><div class="bar" style="margin-top:12px"><button class="btn" id="upload">⬆️ Videoni yuklash</button><button class="btn gray" id="refresh">↻ Yangilash</button></div><div id="msg"></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="margin:0">Joylangan media</h3><span class="tag">LIVE</span></div><div id="list" class="muted" style="margin-top:10px">Yuklanmoqda...</div></div></div>
<script>
const API=location.origin;
const $=id=>document.getElementById(id);
function msg(text,error=false){$('msg').innerHTML=text?'<div class="msg '+(error?'err':'')+'">'+text+'</div>':''}
async function api(path,opt={}){const r=await fetch(API+path,{credentials:'include',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
async function init(){try{await api('/api/admin/content/storage/init',{method:'POST'})}catch(e){}}
async function load(){try{const d=await api('/api/content');const a=Array.isArray(d.media)?d.media:[];$('list').innerHTML=a.length?a.map(x=>'<div class="item"><div>'+((x.media_type==='video'&&x.public_url)?'<video class="video" controls preload="metadata" src="'+esc(x.public_url)+'"></video>':'📎')+'</div><div><b>'+esc(x.title||'Media')+'</b><div class="muted">'+esc(x.description||'')+'</div><div class="tag" style="margin-top:7px">'+(x.active!==false?'Faol':'Yashirilgan')+'</div></div><div><button class="btn red" onclick="removeMedia(\''+esc(x.id)+'\')">O‘chirish</button></div></div>').join(''):'<div class="muted">Hozircha video yo‘q.</div>'}catch(e){$('list').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function upload(){const f=$('file').files[0];if(!f)return msg('Video fayl tanlang.',true);if(f.size>150*1024*1024)return msg('Video 150 MB dan katta bo‘lmasin.',true);const b=$('upload');b.disabled=true;msg('Video yuklanmoqda...');try{await init();const sign=await api('/api/admin/content/sign',{method:'POST',body:JSON.stringify({filename:f.name,contentType:f.type||'video/mp4'})});if(!sign.token)throw new Error('Storage upload token olinmadi');const up=await fetch(sign.public_url.replace('/object/public/','/object/upload/').replace(sign.path,encodeURIComponent(sign.path)),{method:'PUT',headers:{Authorization:'Bearer '+sign.token,'Content-Type':f.type||'video/mp4'},body:f});if(!up.ok)throw new Error('Video Storage ga yuklanmadi');await api('/api/admin/content',{method:'POST',body:JSON.stringify({key:'guide_video',title:$('title').value.trim()||'Video qo‘llanma',description:$('description').value.trim(),media_type:'video',public_url:sign.public_url,active:true})});msg('Video muvaffaqiyatli joylandi. Customer panelda ko‘rinadi.');$('file').value='';await load()}catch(e){msg(e.message||'Xatolik',true)}finally{b.disabled=false}}
async function removeMedia(id){if(!confirm('Bu videoni o‘chirasizmi?'))return;try{await api('/api/admin/content/'+encodeURIComponent(id),{method:'DELETE'});await load()}catch(e){msg(e.message,true)}}
$('upload').onclick=upload;$('refresh').onclick=load;load();
</script></body></html>
