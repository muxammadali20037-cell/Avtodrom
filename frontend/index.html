var WD = ["sun","mon","tue","wed","thu","fri","sat"];
function uid(p){ return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7); }
function toMin(s){ var a=s.split(":"); return (+a[0])*60+(+a[1]); }
function fromMin(m){ return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function ds(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function money(n){ return (n||0).toLocaleString("ru-RU").replace(/,/g," ")+" "+t("soum"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function wdOf(d){ return WD[d.getDay()]; }
function fmtDate(str){
  var p = str.split("-"); return (+p[2])+" "+t("mon")[(+p[1])-1];
}
function toast(msg){
  var el = document.getElementById("toast");
  el.innerHTML = I.check + " " + esc(msg);
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove("show"); }, 2300);
}

/* ---- AVAILABILITY: real slot generation ---- */
var availabilityService = {
  // Instruktor shu kunda umuman ishlaydimi?
  isAvailableOn:function(ins, dateStr){
    if(!ins || ins.status!=="active") return false;
    if(ins.dayOff && ins.dayOff[dateStr]) return false;
    return true;
  },
  getSlots:function(instructorId, dateStr, courseId){
    var ins = instructorService.get(instructorId);
    if(!this.isAvailableOn(ins, dateStr)) return [];
    var d = new Date(dateStr+"T00:00:00");
    var day = ins.schedule[wdOf(d)];
    if(!day || !day.working) return [];

    var course = courseService.get(courseId);
    var dur = (course && course.duration) || day.duration || 90;
    var cursor = toMin(day.start), endM = toMin(day.end);
    var bS = day.breakStart ? toMin(day.breakStart) : null;
    var bE = day.breakEnd ? toMin(day.breakEnd) : null;

    var blocks = (ins.blocks && ins.blocks[dateStr]) ? ins.blocks[dateStr] : [];
    var booked = DB.bookings.filter(function(b){
      return b.instructorId===instructorId && b.date===dateStr && b.status!=="cancelled";
    });

    var now = new Date(), isToday = dateStr===ds(now), nowM = now.getHours()*60+now.getMinutes();
    var out = [];
    while(cursor + dur <= endM){
      var e = cursor + dur, skip = false;
      if(bS!=null && cursor < bE && e > bS){ cursor = bE; continue; }
      for(var i=0;i<blocks.length;i++){
        if(cursor < toMin(blocks[i].end) && e > toMin(blocks[i].start)){ skip=true; break; }
      }
      if(!skip) for(var j=0;j<booked.length;j++){
        var bs2 = toMin(booked[j].time), be2 = bs2 + (booked[j].duration||90);
        if(cursor < be2 && e > bs2){ skip=true; break; }
      }
      if(!skip && isToday && cursor <= nowM) skip = true;
      if(!skip) out.push(fromMin(cursor));
      cursor += dur;
    }
    return out;
  },
  countFreeToday:function(){
    var today = ds(new Date()), n=0, self=this;
    instructorService.active().forEach(function(i){ n += self.getSlots(i.id, today, null).length; });
    return n;
  }
};

/* ---- BOOKING with slot lock ---- */
var bookingService = {
  all:function(){ return DB.bookings; },
  get:function(id){ return DB.bookings.find(function(b){ return b.id===id; }); },
  forCustomer:function(id){ return DB.bookings.filter(function(b){ return b.customerId===id; }); },
  forInstructor:function(id){ return DB.bookings.filter(function(b){ return b.instructorId===id; }); },
  isSlotFree:function(instructorId, dateStr, time, courseId){
    return availabilityService.getSlots(instructorId, dateStr, courseId).indexOf(time) >= 0;
  },
  create:function(data){
    // LOCK: qayta tekshirish — oradan vaqt o'tgan bo'lishi mumkin
    if(!this.isSlotFree(data.instructorId, data.date, data.time, data.courseId)){
      return { ok:false, reason:"taken" };
    }
    var b = Object.assign({
      id:uid("bkg"), status:"pending", paymentStatus:"pending",
      paymentMethod:null, deposit:0, customerConfirmed:false, customerConfirmedAt:null,
      createdAt:Date.now(), reviewed:false
    }, data);
    DB.bookings.push(b);
    notificationService.push(b.customerId, "confirmed", b);
    return { ok:true, booking:b };
  },
  setStatus:function(id, status, extra){
    var b = this.get(id); if(!b) return;
    var wasTerminal = ["completed","no_show","cancelled"].indexOf(b.status)>=0;
    Object.assign(b, extra||{}, {status:status});
    var nowTerminal = ["completed","no_show","cancelled"].indexOf(status)>=0;
    if(!wasTerminal && nowTerminal){
      var c = customerService.get(b.customerId);
      if(c){
        if(status==="completed"){ c.completed=(c.completed||0)+1; c.lastLesson=b.date; }
        if(status==="no_show") c.noShow=(c.noShow||0)+1;
        if(status==="cancelled") c.cancelled=(c.cancelled||0)+1;
      }
      if(status==="completed"){
        var ins = instructorService.get(b.instructorId);
        if(ins) ins.lessonsCompleted=(ins.lessonsCompleted||0)+1;
      }
    }
    commit();
  },
  setPayment:function(id, ps){ var b=this.get(id); if(b){ b.paymentStatus=ps; commit(); } }
};

   7. BOOKING FLOW (real, 8 steps)
============================================================ */
function openBooking(presetInstructorId){
  cState.bookingOpen = true;
  cState.step = 1;
  cState.sel = { instructorId: presetInstructorId || null };
  cState.agree = false;
  cState.busy = false;
  if(presetInstructorId){
    // instruktordan boshlangan bo'lsa: uning birinchi kursi bilan boshlaymiz
    var ins = instructorService.get(presetInstructorId);
    if(ins && ins.courses.length===1){ cState.sel.courseId = ins.courses[0]; cState.step = 3; }
  }
  renderBooking();
}
function closeBooking(){ cState.bookingOpen=false; closeModal(); render(); }

var STEP_KEYS = ["step_course","step_instructor","step_date","step_time","step_summary","step_confirm"];

function renderBooking(){
  var s = cState.step, sel = cState.sel;
  var body = '<div class="progressbar">'+STEP_KEYS.map(function(_,i){ return '<span class="'+(i<s?"on":"")+'"></span>'; }).join("")+'</div>';
  if(s===1) body += bkStepCourse();
  else if(s===2) body += bkStepInstructor();
  else if(s===3) body += bkStepDate();
  else if(s===4) body += bkStepTime();
  else if(s===5) body += bkStepSummary();
  else if(s===6) body += bkStepDone();
  openModal(t(STEP_KEYS[s-1]), body);
}

function bkStepCourse(){
  var list = courseService.active();
  if(!list.length) return UI.empty(I.book, t("noCourses"));
  return '<p style="font-size:.8rem;color:var(--secondary);margin-bottom:.7rem">'+t("chooseCourse")+'</p>'+list.map(function(c){
    return '<div class="course-pick '+(cState.sel.courseId===c.id?"sel":"")+'" data-act="bk-course" data-v="'+c.id+'">'+
      '<span><span class="nm">'+esc(c.name)+'</span><span class="meta">'+esc(c.description)+'</span><span class="meta">'+t("duration")+': '+c.duration+' '+t("minutes")+' · '+c.lessons+' '+t("lessons")+'</span></span>'+
      '<span class="pr">'+money(c.price)+'</span></div>'; }).join("");
}

function bkStepInstructor(){
  var list = instructorService.forCourse(cState.sel.courseId);
  var course = courseService.get(cState.sel.courseId);
  if(!list.length) return UI.empty(I.users, t("noInstructors")) + bkBack(1);
  return '<p style="font-size:.8rem;color:var(--secondary);margin-bottom:.7rem">'+t("chooseInstructor")+'</p>'+list.map(function(i){
    var p = instructorService.priceFor(i, course);
    return '<div class="ins-card" data-act="bk-ins" data-v="'+i.id+'" style="'+(cState.sel.instructorId===i.id?"border-color:var(--primary);background:var(--primary-light)":"")+'">'+
      '<span class="av">'+i.avatar+'</span><span style="flex:1"><span class="nm">'+esc(instructorService.fullName(i))+'</span><span class="meta">'+I.star+' '+i.rating.toFixed(1)+' ('+i.reviewCount+') · '+i.experience+' '+t("experience")+'</span><span class="meta">'+i.lessonsCompleted+' '+t("lessons")+'</span></span><span class="pr">'+money(p.price)+'</span></div>'; }).join("")+bkBack(1);

  var days=[], today=new Date(); for(var i=0;i<7;i++) days.push(addDays(today,i));

  cState.busy=true; renderBooking();

    var r=bookingService.create({customerId:me.id,customerName:me.name,phone:me.phone,instructorId:sel.instructorId,courseId:sel.courseId,locationId:ins.locations[0],date:sel.date,time:sel.time,duration:c.duration,price:p.price,deposit:0,paymentMethod:null,paymentStatus:"pending",customerConfirmed:false,customerConfirmedAt:null});

    cState.err=null;cState.lastBooking=r.booking;cState.step=6;storageService.save(DB);renderBooking();

}

  var blocks = [];
  Object.keys(i.blocks||{}).forEach(function(d){ (i.blocks[d]||[]).forEach(function(b){ blocks.push([d,b]); }); });
  Object.keys(i.dayOff||{}).forEach(function(d){ blocks.push([d,{id:"off_"+d,start:"—",end:"—",reason:i.dayOff[d],off:true}]); });

function aAnalytics(){
  var done = DB.bookings.filter(function(b){return b.status==="completed";}).length;
  var ns = DB.bookings.filter(function(b){return b.status==="no_show";}).length;
  var cn = DB.bookings.filter(function(b){return b.status==="cancelled";}).length;
  var rev = DB.bookings.filter(function(b){return b.paymentStatus==="paid";}).reduce(function(s,b){return s+b.price;},0);

  var h = '<div class="a-title-row"><h2>'+t("nav_ad_analytics")+'</h2></div>'+
    '<div class="stat-grid">'+
    [[I.wallet,t("revenue"),money(rev)],[I.check,t("st_completed"),done],
     [I.xc,t("st_no_show"),ns],[I.x,t("st_cancelled"),cn]].map(function(c){
      return '<div class="stat-card"><div class="ic">'+c[0]+'</div><b>'+esc(String(c[2]))+'</b><span>'+esc(c[1])+'</span></div>';
    }).join("")+'</div>';

  // last 7 days bar chart (pure CSS)
  var days=[], max=1;
  for(var i=6;i>=0;i--){
    var d = ds(addDays(new Date(),-i));
    var n = DB.bookings.filter(function(b){return b.date===d;}).length;
    if(n>max) max=n;
    days.push([d,n]);
  }
  h += '<div class="card"><b style="font-size:.9rem">'+t("nav_ad_bookings")+' · 7</b>'+
    '<div style="display:flex;align-items:flex-end;gap:.5rem;height:150px;margin-top:1rem">'+
    days.map(function(x){
      var pct = Math.round(x[1]/max*100);
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:.4rem;height:100%">'+
        '<div style="flex:1;width:100%;display:flex;align-items:flex-end">'+
        '<div style="width:100%;height:'+Math.max(pct,3)+'%;background:var(--primary);border-radius:6px 6px 0 0" title="'+x[1]+'"></div></div>'+
        '<span style="font-size:.66rem;color:var(--secondary)">'+x[0].slice(8)+'</span>'+
        '<span style="font-size:.72rem;font-weight:700">'+x[1]+'</span></div>';
    }).join("")+'</div></div>';

  // instructor utilization
  h += '<div class="card" style="margin-top:1rem"><b style="font-size:.9rem">'+t("nav_ad_instructors")+'</b><div style="margin-top:.8rem">'+
    DB.instructors.map(function(i){
      var n = DB.bookings.filter(function(b){return b.instructorId===i.id && b.status!=="cancelled";}).length;
      var pc = Math.min(100, n*10);
      return '<div style="margin-bottom:.6rem"><div style="display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:.2rem">'+
        '<span>'+esc(instructorService.fullName(i))+'</span><b>'+n+'</b></div>'+
        '<div style="height:7px;background:#F1F5F9;border-radius:4px;overflow:hidden">'+
        '<div style="height:100%;width:'+pc+'%;background:var(--primary)"></div></div></div>';
    }).join("")+'</div></div>';
  return h;
}

function iDashboard(me){
  var today = ds(new Date());
  var mine = bookingService.forInstructor(me.id);
  var tb = mine.filter(function(b){ return b.date===today; }).sort(function(a,b){ return a.time.localeCompare(b.time); });
  var done = tb.filter(function(b){return b.status==="completed";}).length;
  var ns = tb.filter(function(b){return b.status==="no_show";}).length;
  var nx = mine.filter(function(b){ return ["pending","confirmed","in_progress"].indexOf(b.status)>=0; })
            .sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); })[0];

  var h = '<div class="a-title-row"><h2>'+t("hello")+', '+esc(me.firstName)+' 👋</h2></div>'+
    '<div class="stat-grid">'+
    [[I.clip,t("myLessonsToday"),tb.length],[I.check,t("finished"),done],
     [I.xc,t("noShows"),ns],[I.star,t("myRating"),me.rating.toFixed(1)]].map(function(c){
      return '<div class="stat-card"><div class="ic">'+c[0]+'</div><b>'+esc(String(c[2]))+'</b><span>'+esc(c[1])+'</span></div>';
    }).join("")+'</div>';

  if(nx){
    var c = courseService.get(nx.courseId), cu = customerService.get(nx.customerId);
    h += '<div class="card" style="margin-bottom:1rem"><div style="font-size:.74rem;font-weight:700;color:var(--secondary);margin-bottom:.5rem">'+t("nextLesson")+'</div>'+
      '<div style="display:flex;align-items:center;gap:.8rem;flex-wrap:wrap">'+
      '<b style="font-family:var(--display);font-size:1.3rem">'+esc(nx.time)+'</b>'+
      '<span><b style="font-size:.9rem;display:block">'+esc(nx.customerName)+'</b>'+
      '<span style="font-size:.78rem;color:var(--secondary)">'+esc(c?c.name:"")+' · '+esc(fmtDate(nx.date))+'</span></span>'+
      '<span style="margin-left:auto">'+UI.statusBadge(nx.status)+'</span></div></div>';
  }

  h += '<div class="card"><b style="font-size:.9rem">'+t("nav_in_schedule")+' · '+t("today")+'</b><div style="margin-top:.6rem">';
  var slots = availabilityService.getSlots(me.id, today, null);
  var rows = tb.map(function(b){ return {time:b.time, b:b}; })
    .concat(slots.map(function(s){ return {time:s, b:null}; }))
    .sort(function(a,b){ return a.time.localeCompare(b.time); });
  if(!rows.length) h += UI.empty(I.cal, t("noSlots"));
  else h += rows.map(function(r){
    return '<div class="timeline-row"><span class="tm">'+esc(r.time)+'</span>'+
      (r.b ? '<span style="flex:1"><b style="font-size:.86rem">'+esc(r.b.customerName)+'</b></span>'+UI.statusBadge(r.b.status)
           : '<span style="flex:1;font-size:.82rem;color:#CBD5E1">'+t("freeSlot")+'</span>')+'</div>';
  }).join("");
  h += '</div></div>';
  return h;
}

    if(iState.bkFilter==="week") return b.date>=tds && b.date<=ds(addDays(today,6));
    return b.date.slice(0,7)===tds.slice(0,7);
  }).sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });

  var h = '<div class="a-title-row"><h2>'+t("nav_in_bookings")+'</h2></div>'+

      .map(function(x){
        return '<button class="chip '+(iState.bkFilter===x[0]?"on":"")+'" data-act="i-bkf" data-v="'+x[0]+'">'+esc(x[1])+'</button>';
      }).join("")+'</div>';

  if(!f.length) return h + UI.empty(I.clip, t("noBookings"));
  h += '<div class="grid-cards">'+f.map(function(b){
    var c=courseService.get(b.courseId), l=locationService.get(b.locationId);
    return '<div class="entity-card"><div class="head"><span style="flex:1">'+
      '<span class="nm">'+esc(b.customerName)+'</span>'+

      '<div style="font-size:.8rem;color:var(--secondary);display:grid;gap:.2rem;margin-bottom:.6rem">'+
      '<span>'+I.clock+' '+esc(fmtDate(b.date))+' · '+esc(b.time)+'</span>'+
      '<span>'+I.book+' '+esc(c?c.name:"—")+'</span>'+
      '<span>'+I.pin+' '+esc(l?l.name:"—")+'</span></div>'+
      '<div>'+UI.payBadge(b.paymentStatus)+'</div>'+
      '<div class="foot">'+
      (me.permissions.viewCustomerPhone?'<a class="btn btn-outline btn-sm" href="tel:'+esc(b.phone)+'">'+I.phone+t("contactCustomer")+'</a>':'')+
      (me.permissions.markCompleted && ["completed","cancelled"].indexOf(b.status)<0 ?
        '<button class="btn btn-sm" data-act="i-complete" data-v="'+b.id+'">'+t("complete")+'</button>':'')+
      (me.permissions.markNoShow && ["completed","cancelled","no_show"].indexOf(b.status)<0 ?
        '<button class="btn btn-danger btn-sm" data-act="i-noshow" data-v="'+b.id+'">'+t("noShow")+'</button>':'')+
      '</div></div>';
  }).join("")+'</div>';
  return h;

function iSchedule(me){
  var h = '<div class="a-title-row"><h2>'+t("nav_in_schedule")+'</h2></div>';
  var days=[]; for(var i=0;i<7;i++) days.push(addDays(new Date(),i));
  h += '<div class="grid-cards">'+days.map(function(d){
    var v = ds(d), bs = bookingService.forInstructor(me.id).filter(function(b){ return b.date===v && b.status!=="cancelled"; })

function iStats(me){
  if(!me.permissions.viewAnalytics) return '<div class="a-title-row"><h2>'+t("nav_in_stats")+'</h2></div>'+noAccess();
  var mine = bookingService.forInstructor(me.id);
  var tds = ds(new Date()), wkStart = ds(addDays(new Date(),-6));
  var wk = mine.filter(function(b){ return b.date>=wkStart && b.date<=tds; });
  var mo = mine.filter(function(b){ return b.date.slice(0,7)===tds.slice(0,7); });
  function sum(l){ return {
    total:l.length,
    done:l.filter(function(b){return b.status==="completed";}).length,
    ns:l.filter(function(b){return b.status==="no_show";}).length,
    cn:l.filter(function(b){return b.status==="cancelled";}).length,
    earn:l.filter(function(b){return b.status==="completed" && b.paymentStatus==="paid";}).reduce(function(s,b){return s+b.price;},0)
  };}
  var W=sum(wk), M=sum(mo);

  var h = '<div class="a-title-row"><h2>'+t("nav_in_stats")+'</h2></div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-bottom:1rem">'+
    box(t("thisWeek"),W)+box(t("thisMonth"),M)+'</div>';

  h += '<div class="card"><b style="font-size:.9rem">'+t("myEarnings")+'</b>';
  if(me.permissions.viewEarnings){
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.8rem">'+
      '<div><div style="font-family:var(--display);font-size:1.4rem;font-weight:800;color:var(--primary-dark)">'+money(W.earn)+'</div>'+
      '<span style="font-size:.78rem;color:var(--secondary)">'+t("thisWeek")+'</span></div>'+
      '<div><div style="font-family:var(--display);font-size:1.4rem;font-weight:800;color:var(--primary-dark)">'+money(M.earn)+'</div>'+
      '<span style="font-size:.78rem;color:var(--secondary)">'+t("thisMonth")+'</span></div></div>';
  } else h += '<p style="font-size:.82rem;color:var(--secondary);margin-top:.5rem">'+t("earningsHidden")+'</p>';
  h += '</div>';
  return h;

  function box(title,s){
    return '<div class="card"><b style="font-size:.9rem">'+esc(title)+'</b>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.7rem">'+
      m(t("lessons"),s.total)+m(t("st_completed"),s.done)+m(t("st_cancelled"),s.cn)+m(t("st_no_show"),s.ns)+
      '</div></div>';
    function m(l,v){ return '<div style="background:var(--bg);border-radius:10px;padding:.5rem .7rem">'+
      '<b style="font-family:var(--display);font-size:1.1rem;display:block">'+v+'</b>'+
      '<span style="font-size:.7rem;color:var(--secondary)">'+esc(l)+'</span></div>'; }
  }
}

// FORCE_ROLE bo'sh bo'lsa — hash orqali yo'naltiriladi (birlashgan fayl).
// Alohida fayllarda bu qiymat belgilanadi: "admin" yoki "instructor".
var FORCE_ROLE = null;
function route(){
  if(FORCE_ROLE) return FORCE_ROLE;
  var h = location.hash.replace(/^#/,"");
  if(h.indexOf("/dashboard")===0) return "admin";
  if(h.indexOf("/instructor")===0) return "instructor";
  return "customer";
}

function render(){
  var r = route();
  var app = document.getElementById("app");
  if(r==="admin") app.innerHTML = adminView();
  else if(r==="instructor") app.innerHTML = instructorView();
  else app.innerHTML = customerView();
}

window.addEventListener("hashchange", function(){
  MODAL = null; renderModal();
  cState.bookingOpen = false;
  render();
});

/* ============================================================
   11. EVENT DELEGATION — barcha tugmalar shu yerda
============================================================ */
document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act]");
  if(!el) return;
  var act = el.dataset.act, v = el.dataset.v;

  /* ---- global ---- */
  if(act==="lang"){ setLang(v); if(MODAL) closeModal(); return; }
  if(act==="modal-close"){ closeModal(); if(cState.bookingOpen) cState.bookingOpen=false; return; }
  if(act==="modal-back"){ if(ev.target===el){ closeModal(); cState.bookingOpen=false; } return; }

  /* ---- customer nav ---- */
  if(act==="c-tab"){ cState.tab=v; render(); return; }
  if(act==="bk-tab"){ cState.bkTab=v; render(); return; }
  if(act==="c-logout"){ authService.logoutCustomer(); return; }

if(act==="onboard"){
  var nameInput = document.getElementById("onbName");
  var phoneInput = document.getElementById("onbPhone");
  var errorBox = document.getElementById("onbErr");

  var n = nameInput.value.trim();
  var p = phoneInput.value.trim();

  errorBox.textContent = "";

  /* =========================
     ISM VALIDATSIYASI
  ========================= */

  if(!n){
    errorBox.textContent = "Ismingizni kiriting.";
    nameInput.focus();
    return;
  }

  if(n.length < 2 || n.length > 50){
    errorBox.textContent = "Ism 2–50 ta belgidan iborat bo‘lishi kerak.";
    nameInput.focus();
    return;
  }

  /*
    Faqat:
    - harflar
    - bo‘sh joy
    - apostrof
    - tire
  */
  var nameRegex = /^[\p{L}][\p{L}'’\- ]{1,48}$/u;

  if(!nameRegex.test(n)){
    errorBox.textContent = "Iltimos, haqiqiy ism va familiyangizni kiriting.";
    nameInput.focus();
    return;
  }

  var letterCount = (n.match(/\p{L}/gu) || []).length;

  if(letterCount < 2){
    errorBox.textContent = "Iltimos, haqiqiy ism kiriting.";
    nameInput.focus();
    return;
  }

  /* =========================
     TELEFON VALIDATSIYASI
  ========================= */

  /*
    Bo‘sh joy, tire va qavslarni olib tashlaymiz.
    Masalan:
    +998 90 123 45 67
    ->
    +998901234567
  */
  var phone = p.replace(/[\s\-\(\)]/g,"");

  if(!phone){
    errorBox.textContent = "Telefon raqamingizni kiriting.";
    phoneInput.focus();
    return;
  }

  /*
    Faqat O‘zbekiston:
    +998 + 9 ta raqam
  */
  if(!/^\+998\d{9}$/.test(phone)){
    errorBox.textContent =
      "Faqat O‘zbekiston telefon raqami kiriting: +998 90 123 45 67";
    phoneInput.focus();
    return;
  }

  /*
    O‘zbekiston mobil operator kodlari.
  */
  var operatorCode = phone.substring(4,6);

  var allowedOperators = [
    "90",
    "91",
    "93",
    "94",
    "95",
    "97",
    "98",
    "99",
    "88",
    "33",
    "50",
    "55",
    "77"
  ];

  if(allowedOperators.indexOf(operatorCode) === -1){
    errorBox.textContent = "Telefon raqami noto‘g‘ri.";
    phoneInput.focus();
    return;
  }

  /* =========================
     MAVJUD ACCOUNT
  ========================= */

  var ex = customerService.byPhone(phone);

  if(ex){
    authService.loginCustomer(ex.id);
    return;
  }

  /* =========================
     YANGI ACCOUNT
  ========================= */

  var telegramId = "";

  if(
    TG &&
    TG.initDataUnsafe &&
    TG.initDataUnsafe.user &&
    TG.initDataUnsafe.user.id
  ){
    telegramId = String(TG.initDataUnsafe.user.id);
  }

  var c = customerService.create({
    name: n,
    phone: phone,
    telegram: telegramId
  });

  authService.loginCustomer(c.id);

  return;
}
  if(act==="pf-save"){
    var me = authService.customer();
    me.name = document.getElementById("pfName").value.trim() || me.name;
    me.phone = document.getElementById("pfPhone").value.trim() || me.phone;
    customerService.save(me); toast(t("saved")); return;
  }
  if(act==="show-rules"){ openModal(t("rulesTitle"), '<p style="font-size:.88rem;line-height:1.6">'+esc(settingsService.policy())+'</p>'); return; }

  /* ---- instructor profile (customer side) ---- */
  if(act==="ins-profile"){ insProfileModal(v); return; }
  if(act==="book-with"){ closeModal(); openBooking(v); return; }

  /* ---- booking flow ---- */
  if(act==="open-booking"){ openBooking(null); return; }
  if(act==="bk-course"){ cState.sel.courseId=v; cState.sel.instructorId=null; cState.step=2; renderBooking(); return; }
  if(act==="bk-ins"){ cState.sel.instructorId=v; cState.step=3; renderBooking(); return; }
  if(act==="bk-date"){ cState.sel.date=v; cState.sel.time=null; cState.err=null; cState.step=4; renderBooking(); return; }
  if(act==="bk-time"){ cState.sel.time=v; cState.step=5; renderBooking(); return; }
  if(act==="bk-step"){ cState.step=+v; renderBooking(); return; }
  if(act==="bk-agree"){ cState.agree=el.checked; renderBooking(); return; }
  if(act==="bk-submit"){ submitBooking(); return; }
  if(act==="bk-goto-bookings"){ closeBooking(); cState.tab="bookings"; render(); return; }

  /* ---- review ---- */
  if(act==="review"){ reviewModal(v); return; }
  if(act==="star"){
    cState.reviewStars = +v;
    var btns = document.querySelectorAll('#starPick [data-act="star"]');
    btns.forEach(function(b,i){
      b.querySelector("svg").setAttribute("fill", (i+1)<=cState.reviewStars ? "currentColor" : "none");
    });
    return;
  }
  if(act==="review-send"){
    var b = bookingService.get(v);
    var me2 = authService.customer();
    reviewService.add({
      bookingId:b.id, instructorId:b.instructorId, customerId:me2.id,
      customerName:me2.name, stars:cState.reviewStars||5,
      comment:(document.getElementById("revText")||{}).value||"", date:ds(new Date())
    });
    b.reviewed = true;
    storageService.save(DB);
    closeModal(); toast(t("reviewThanks")); render();
    return;
  }

  /* ---- admin nav ---- */
  if(act==="a-sec"){ aState.section=v; aState.q=""; render(); return; }
  if(act==="c-booking-confirm"){
    var cb=bookingService.get(v), me=authService.customer();
    if(cb && me && cb.customerId===me.id && cb.status==="confirmed"){
      cb.customerConfirmed=true; cb.customerConfirmedAt=Date.now(); commit(); toast("Kelishingiz tasdiqlandi");
    }
    return;
  }
  if(act==="bk-status"){ bookingService.setStatus(v, el.dataset.s); toast(t("saved")); return; }
  if(act==="bk-pay-set"){ bookingService.setPayment(v, el.dataset.s); toast(t("saved")); return; }

  /* ---- admin instructors ---- */
  if(act==="ins-form"){ insFormModal(v||null); return; }
  if(act==="chip"){ el.classList.toggle("on"); return; }
  if(act==="ins-save"){
    var courses=[], locs=[];
    document.querySelectorAll('#ifCourses .chip.on').forEach(function(c){ courses.push(c.dataset.v); });
    document.querySelectorAll('#ifLocs .chip.on').forEach(function(c){ locs.push(c.dataset.v); });
    var data = {
      firstName:document.getElementById("ifFirst").value.trim(),
      lastName:document.getElementById("ifLast").value.trim(),
      phone:document.getElementById("ifPhone").value.trim(),
      avatar:document.getElementById("ifAvatar").value.trim()||"🧑‍🏫",
      experience:+document.getElementById("ifExp").value||1,
      bio:document.getElementById("ifBio").value.trim(),
      courses:courses, locations:locs
    };
    if(!data.firstName||!data.lastName){ toast(t("fillFields")); return; }
    if(v) data.id=v; else data.status="active";
    instructorService.save(data);
    closeModal(); toast(t("saved"));
    return;
  }
  if(act==="ins-del"){ if(confirm(t("del")+"?")){ instructorService.remove(v); toast(t("saved")); } return; }
  if(act==="ins-price"){ insPriceModal(v); return; }
  if(act==="ins-price-save"){
    var ins = instructorService.get(v);
    document.querySelectorAll("[data-price]").forEach(function(inp){
      var cid = inp.dataset.price;
      var dep = document.querySelector('[data-deposit="'+cid+'"]');
      ins.pricing[cid] = { price:+inp.value||0, deposit:dep?(+dep.value||0):0 };
    });
    commit(); closeModal(); toast(t("saved"));
    return;
  }
  if(act==="ins-perm"){ insPermModal(v); return; }
  if(act==="ins-perm-save"){
    var ins2 = instructorService.get(v);
    document.querySelectorAll("[data-perm]").forEach(function(cb){ ins2.permissions[cb.dataset.perm]=cb.checked; });
    commit(); closeModal(); toast(t("saved"));
    return;
  }

  /* ---- admin schedule ---- */
  if(act==="sch-toggle"){
    var ins3 = instructorService.get(v);
    ins3.schedule[el.dataset.d].working = !ins3.schedule[el.dataset.d].working;
    commit(); return;
  }
  if(act==="sch-save"){
    var ins4 = instructorService.get(v);
    document.querySelectorAll("[data-sch]").forEach(function(inp){
      var k=inp.dataset.sch, d=inp.dataset.d;
      var val = k==="duration" ? (+inp.value||90) : (inp.value||null);
      ins4.schedule[d][k]=val;
    });
    commit(); toast(t("saved")); return;
  }
  if(act==="blk-add"){
    var ins5 = instructorService.get(v);
    var d=document.getElementById("blkDate").value;
    if(!d){ toast(t("fillFields")); return; }
    ins5.blocks[d]=ins5.blocks[d]||[];
    ins5.blocks[d].push({ id:uid("blk"), start:document.getElementById("blkStart").value,
      end:document.getElementById("blkEnd").value, reason:document.getElementById("blkReason").value });
    commit(); toast(t("saved")); return;
  }
  if(act==="blk-del"){
    var ins6 = instructorService.get(v), d2=el.dataset.d, bid=el.dataset.b;
    if(bid.indexOf("off_")===0) delete ins6.dayOff[d2];
    else ins6.blocks[d2]=(ins6.blocks[d2]||[]).filter(function(x){return x.id!==bid;});
    commit(); return;
  }

  /* ---- admin courses / locations / customers ---- */
  if(act==="crs-form"){ crsFormModal(v||null); return; }
  if(act==="crs-save"){
    var c2={ name:document.getElementById("cfName").value.trim(),
      description:document.getElementById("cfDesc").value.trim(),
      category:document.getElementById("cfCat").value.trim(),
      lessons:+document.getElementById("cfLes").value||1,
      price:+document.getElementById("cfPrice").value||0,
      deposit:+document.getElementById("cfDep").value||0,
      duration:+document.getElementById("cfDur").value||90, active:true };
    if(!c2.name){ toast(t("fillFields")); return; }
    if(v) c2.id=v;
    courseService.save(c2); closeModal(); toast(t("saved")); return;
  }
  if(act==="crs-toggle"){ var cc=courseService.get(v); cc.active=!cc.active; commit(); return; }
  if(act==="crs-del"){ if(confirm(t("del")+"?")) courseService.remove(v); return; }

  if(act==="loc-form"){ locFormModal(v||null); return; }
  if(act==="loc-save"){
    var l2={ name:document.getElementById("lfName").value.trim(),
      address:document.getElementById("lfAddr").value.trim(),
      phone:document.getElementById("lfPhone").value.trim(),
      capacity:+document.getElementById("lfCap").value||1, active:true };
    if(!l2.name){ toast(t("fillFields")); return; }
    if(v) l2.id=v;
    locationService.save(l2); closeModal(); toast(t("saved")); return;
  }
  if(act==="loc-toggle"){ var ll=locationService.get(v); ll.active=!ll.active; commit(); return; }
  if(act==="loc-del"){ if(confirm(t("del")+"?")) locationService.remove(v); return; }

  if(act==="cst-form"){ cstFormModal(); return; }
  if(act==="cst-save"){
    var n2=document.getElementById("cufName").value.trim(), p2=document.getElementById("cufPhone").value.trim();
    if(!n2||!p2){ toast(t("fillFields")); return; }
    customerService.create({name:n2, phone:p2, telegram:document.getElementById("cufTg").value.trim()});
    commit(); closeModal(); toast(t("saved")); return;
  }
  if(act==="cst-view"){ cstViewModal(v); return; }

  if(act==="rev-status"){ reviewService.setStatus(v, el.dataset.s); toast(t("saved")); return; }

  /* ---- admin settings ---- */
  if(act==="st-save"){
    var pm={};
    document.querySelectorAll("[data-pm]").forEach(function(cb){ pm[cb.dataset.pm]=cb.checked; });
    settingsService.save({
      companyName:document.getElementById("stName").value.trim(),
      phone:document.getElementById("stPhone").value.trim(),
      telegram:document.getElementById("stTg").value.trim(),
      address:document.getElementById("stAddr").value.trim(),
      defaultDeposit:+document.getElementById("stDep").value||0,
      bookingDuration:+document.getElementById("stDur").value||90,
      cancellationPolicy:{ uz:document.getElementById("stPolUz").value, ru:document.getElementById("stPolRu").value },
      paymentMethods:pm
    });
    toast(t("saved")); return;
  }
  if(act==="reset-data"){
    if(confirm(t("resetConfirm"))){ storageService.reset(); render(); toast(t("saved")); }
    return;
  }

  /* ---- instructor panel ---- */
  if(act==="i-login"){ authService.loginInstructor(v); return; }
  if(act==="i-logout"){ authService.logoutInstructor(); return; }
  if(act==="i-sec"){ iState.section=v; iState.err=null; render(); return; }
  if(act==="i-bkf"){ iState.bkFilter=v; render(); return; }
  if(act==="i-complete"){
    var bb=bookingService.get(v);
    openModal(t("confirmComplete"),
      '<div class="summary-row"><span class="lbl">'+t("customer")+'</span><span class="val">'+esc(bb.customerName)+'</span></div>'+
      '<div class="summary-row"><span class="lbl">'+t("date")+'</span><span class="val">'+esc(bb.date)+' '+esc(bb.time)+'</span></div>'+
      '<button class="btn btn-lg" style="margin-top:1rem" data-act="i-complete-do" data-v="'+v+'">'+t("yesCompleted")+'</button>');
    return;
  }
  if(act==="i-complete-do"){ bookingService.setStatus(v,"completed"); closeModal(); toast(t("saved")); return; }
  if(act==="i-noshow"){
    var bb2=bookingService.get(v);
    openModal(t("confirmNoShow"),
      '<div class="summary-row"><span class="lbl">'+t("customer")+'</span><span class="val">'+esc(bb2.customerName)+'</span></div>'+
      '<div class="field" style="margin-top:.8rem"><label>'+t("blockReason")+'</label><input class="input" id="nsReason"></div>'+
      '<button class="btn btn-lg btn-danger" data-act="i-noshow-do" data-v="'+v+'">'+t("yesNoShow")+'</button>');
    return;
  }
  if(act==="i-noshow-do"){
    var r2=(document.getElementById("nsReason")||{}).value||"";
    bookingService.setStatus(v,"no_show",{noShowReason:r2}); closeModal(); toast(t("saved")); return;
  }
  if(act==="i-sch-toggle"){
    var me3=authService.instructor();
    me3.schedule[el.dataset.d].working=!me3.schedule[el.dataset.d].working;
    commit(); return;
  }
  if(act==="i-sch-save"){
    var me4=authService.instructor();
    var draft=JSON.parse(JSON.stringify(me4.schedule));
    document.querySelectorAll("[data-isch]").forEach(function(inp){
      var k=inp.dataset.isch, d=inp.dataset.d;
      draft[d][k] = k==="duration" ? (+inp.value||90) : (inp.value||null);
    });
    var err = scheduleService.validate(me4, draft);
    if(err){ iState.err=err; render(); return; }
    me4.schedule=draft; iState.err=null; commit(); toast(t("saved")); return;
  }
  if(act==="i-blk-add"){
    var me5=authService.instructor(), d3=document.getElementById("iBlkDate").value;
    if(!d3){ toast(t("fillFields")); return; }
    me5.blocks[d3]=me5.blocks[d3]||[];
    me5.blocks[d3].push({id:uid("blk"), start:document.getElementById("iBlkStart").value,
      end:document.getElementById("iBlkEnd").value, reason:""});
    commit(); toast(t("saved")); return;
  }
  if(act==="i-dayoff-add"){
    var me6=authService.instructor(), d4=document.getElementById("iBlkDate").value;
    if(!d4){ toast(t("fillFields")); return; }
    me6.dayOff[d4]=t("dayOff");
    commit(); toast(t("saved")); return;
  }
  if(act==="i-blk-del"){
    var me7=authService.instructor(), d5=el.dataset.d, bid2=el.dataset.b;
    if(bid2.indexOf("off_")===0) delete me7.dayOff[d5];
    else me7.blocks[d5]=(me7.blocks[d5]||[]).filter(function(x){return x.id!==bid2;});
    commit(); return;
  }
  if(act==="i-profile-save"){
    var me8=authService.instructor();
    me8.avatar=document.getElementById("ipAvatar").value.trim()||me8.avatar;
    me8.bio=document.getElementById("ipBio").value.trim();
    me8.telegram=document.getElementById("ipTg").value.trim();
    commit(); toast(t("saved")); return;
  }
});

/* ---- inputs (search / selects) ---- */
document.addEventListener("input", function(ev){
  var el = ev.target.closest("[data-act]");
  if(!el) return;
  if(el.dataset.act==="a-q"){
    aState.q = el.value;
    var pos = el.selectionStart;
    render();
    var again = document.querySelector('[data-act="a-q"]');
    if(again){ again.focus(); again.setSelectionRange(pos,pos); }
  }
});
document.addEventListener("change", function(ev){
  var el = ev.target.closest("[data-act]");
  if(!el) return;
  var act=el.dataset.act;
  if(act==="a-fstatus"){ aState.filterStatus=el.value; render(); }
  if(act==="a-fins"){ aState.filterIns=el.value; render(); }
  if(act==="a-sched-ins"){ aState.schedIns=el.value; render(); }
  if(act==="ins-status"){
    var i=instructorService.get(el.dataset.v); i.status=el.value; commit(); toast(t("saved"));
  }
  if(act==="pay-set"){ bookingService.setPayment(el.dataset.v, el.value); toast(t("saved")); }
});

/* ---- Esc closes modal ---- */
document.addEventListener("keydown", function(e){
  if(e.key==="Escape" && MODAL){ closeModal(); cState.bookingOpen=false; }
});

/* ============================================================
   12. BOOT
============================================================ */
(function boot(){
  DB = storageService.load();
  if(!DB){ DB = seed(); storageService.save(DB); }
  // migratsiya: eski saqlangan ma'lumotda yangi maydonlar bo'lmasligi mumkin
  if(!DB.session) DB.session={customerId:null,instructorId:null};
  if(!DB.reviews) DB.reviews=[];
  if(!DB.notifications) DB.notifications=[];
  DB.instructors.forEach(function(i){
    if(!i.blocks) i.blocks={};
    if(!i.dayOff) i.dayOff={};
    if(!i.pricing) i.pricing={};
    if(!i.permissions) i.permissions=defaultPerms();
    if(!i.adminBounds) i.adminBounds=weekBounds();
  });
  render();
})();
</script>
