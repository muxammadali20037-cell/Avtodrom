<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087443">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AVTODROM">
<title>AVTODROM — Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--green:#087443;--green2:#0b9254;--green3:#eaf8f1;--dark:#0d2119;--bg:#f4f7f5;--card:#fff;--text:#142019;--muted:#718079;--line:#e1e9e4;--danger:#c93232;--warning:#b77a00;--blue:#2f63a8;--gold:#a16a00;--shadow:0 12px 35px rgba(20,40,30,.08);--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}a{text-decoration:none;color:inherit}
.app{min-height:100vh;padding-bottom:86px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:auto;height:68px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:950;letter-spacing:.02em;border:0;background:transparent;padding:0;color:inherit}
.logo-mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,var(--green),#075b37);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 7px 18px rgba(8,116,67,.25)}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:12px;display:grid;place-items:center;position:relative}
.langmenu{display:none;position:absolute;right:0;top:48px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-width:170px;z-index:70}
.langmenu.open{display:block}
.langmenu button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:#fff;text-align:left;padding:12px 14px;font-weight:800;font-size:13px}
.langmenu button:hover{background:#f3f7f5}
.langmenu button.on{background:var(--green3);color:var(--green)}
.dot{position:absolute;right:7px;top:6px;width:8px;height:8px;border-radius:50%;background:#e43c3c;border:2px solid #fff}
.container{max-width:1180px;margin:auto;padding:18px}
.hero{position:relative;overflow:hidden;border-radius:26px;min-height:320px;display:flex;align-items:center;background:linear-gradient(125deg,#0c271c,#0c6844 55%,#0b8d51);color:#fff;box-shadow:var(--shadow);margin-bottom:18px}
.hero-art{position:absolute;inset:0;z-index:0;pointer-events:none}
.hero-art svg{position:absolute;right:0;bottom:0;height:100%;width:auto;min-width:520px;opacity:.9}
.hero-photo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .5s}
.hero-photo.on{opacity:1}
.hero-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(8,32,22,.94) 0%,rgba(8,42,28,.78) 46%,rgba(8,52,34,.28) 100%)}
.hero-content{position:relative;z-index:2;padding:38px;max-width:640px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:900;opacity:.8}
.hero h1{font-size:clamp(28px,5vw,48px);line-height:1.04;margin:10px 0}
.hero p{color:#d4e8df;max-width:580px;font-size:15px;line-height:1.6;margin:0}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.primary{border:0;background:#fff;color:var(--green);border-radius:13px;padding:12px 17px;font-weight:900}
.primary.green{background:var(--green);color:#fff}
.secondary{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:13px;padding:11px 15px;font-weight:800}
.danger{border:1px solid #f0cfcf;background:#fff;color:var(--danger);border-radius:13px;padding:11px 15px;font-weight:800}
.ghost{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:13px;padding:11px 15px;font-weight:800}
.section{margin:25px 0}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:13px;flex-wrap:wrap}
.section-head h2{margin:0;font-size:21px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.feature{padding:17px}
.feature-icon{width:44px;height:44px;border-radius:13px;background:var(--green3);display:grid;place-items:center;font-size:20px;margin-bottom:13px}
.feature b{font-size:15px}.feature p{color:var(--muted);font-size:12px;line-height:1.5;margin:6px 0 0}
.instructor-card{overflow:hidden}
.instructor-head{height:100px;background:linear-gradient(135deg,#0c6844,#0b8d51);display:flex;align-items:center;gap:13px;padding:0 16px}
.ini{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:21px;font-weight:950;color:#fff;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.32);flex:none}
.instructor-head .nm{color:#fff;font-weight:900;font-size:16px;line-height:1.25}
.instructor-head .rt{color:#d6f0e3;font-size:12px;font-weight:800;margin-top:3px}
.instructor-body{padding:15px}
.meta{font-size:12px;color:var(--muted);line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0}
.tag{background:#f1f5f3;color:#496057;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}
.card-actions{display:flex;gap:7px;margin-top:13px}.card-actions>*{flex:1}
.booking-box{padding:18px}
.steps{display:flex;gap:6px;margin-bottom:18px}
.step{flex:1;text-align:center;font-size:10px;font-weight:900;color:var(--muted);padding:8px;border-radius:9px;background:#f3f6f4}
.step.active{background:var(--green3);color:var(--green)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:2px}
.field label{display:block;font-size:11px;font-weight:900;color:#53635b;margin-bottom:6px}
.field input,.field textarea,.field select,.search{width:100%;border:1px solid #d7e1dc;background:#fff;border-radius:12px;padding:12px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus,.search:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(8,116,67,.08)}
.full{grid-column:1/-1}
.courses{display:grid;gap:9px}
.course{border:1px solid #d7e1dc;border-radius:13px;padding:13px;display:flex;justify-content:space-between;align-items:center;gap:11px;text-align:left;background:#fff;width:100%}
.course.on{border-color:var(--green);background:#f3faf6;box-shadow:0 0 0 3px rgba(8,116,67,.07)}
.course b{display:block;font-size:14px}.course .sub{font-size:11px;color:var(--muted);margin-top:3px}
.course .price{font-weight:950;color:var(--green);white-space:nowrap;font-size:15px}
.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.time{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 5px;text-align:center;font-size:12px;font-weight:900}
.time.selected{background:var(--green);color:#fff;border-color:var(--green)}
.time.busy{text-decoration:line-through;color:#a5aea9;background:#f4f5f5}
.booking-summary{background:#f5faf7;border:1px solid #d8eee2;border-radius:14px;padding:14px;margin-top:14px;font-size:13px;line-height:1.7}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-size:11px;font-weight:900}
.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.booking-card{padding:15px}
.booking-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.status{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;background:#edf4f0;color:#216548}
.status.pending{background:#fff5d8;color:#9b6900}
.status.confirmed{background:#eaf2ff;color:#315c9b}
.status.in_progress{background:#e9f7ff;color:#176b91}
.status.completed{background:#eaf8f1;color:#176b4a}
.status.cancelled,.status.rejected{background:#fff0f0;color:#b42e2e}
.status.no_show{background:#f3eeee;color:#7b5555}
.booking-card h3{font-size:15px;margin:5px 0}
.booking-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.info{background:#f7f9f8;border-radius:10px;padding:9px}
.info span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:900}
.info b{display:block;font-size:12px;margin-top:3px}
.chat-shell{display:flex;flex-direction:column;min-height:520px;overflow:hidden}
.chat-head{padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:13px;background:#dcece3;display:grid;place-items:center;font-weight:900;flex:none}
.messages{flex:1;padding:15px;background:#f7faf8;min-height:340px;max-height:440px;overflow:auto}
.msg{max-width:78%;margin:7px 0;padding:9px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.msg.mine{margin-left:auto;background:var(--green);color:#fff;border-color:var(--green)}
.msg small{display:block;opacity:.65;font-size:9px;margin-top:4px}
.chat-compose{display:flex;gap:7px;padding:11px;border-top:1px solid var(--line)}
.chat-compose input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px}
.profile{padding:20px;display:grid;grid-template-columns:110px 1fr;gap:18px}
.profile-avatar{width:100px;height:100px;border-radius:28px;background:linear-gradient(135deg,#0c6844,#0b8d51);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:950}
.profile h2{margin:4px 0}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.profile-field{background:#f6f8f7;border-radius:11px;padding:10px}
.profile-field span{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}
.profile-field b{display:block;font-size:12px;margin-top:3px}
.location{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.map{min-height:210px;border-radius:16px;background:linear-gradient(135deg,#dfeae4,#eef5f1);display:grid;place-items:center;color:#527067;font-weight:900;text-align:center;padding:16px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom))}
.bottom-inner{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}
.bottom-btn{border:0;background:transparent;color:#718079;padding:7px 2px;font-size:9px;font-weight:900;position:relative}
.bottom-btn span{display:block;font-size:19px;margin-bottom:2px}
.bottom-btn.active{color:var(--green)}
.pill{position:absolute;top:2px;right:20%;background:#e43c3c;color:#fff;border-radius:99px;font-size:9px;padding:1px 5px;min-width:16px}
.modal{display:none;position:fixed;inset:0;background:rgba(5,20,13,.55);z-index:100;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-box{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0}
.modal-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:16px}.modal-body{padding:18px}
.close{border:0;background:#eef3f0;border-radius:9px;width:36px;height:36px;font-size:20px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(15px);background:var(--dark);color:#fff;padding:11px 15px;border-radius:12px;font-size:12px;font-weight:800;z-index:130;opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.drawer{position:fixed;inset:0;background:rgba(5,20,13,.45);z-index:90;display:none}
.drawer.show{display:block}
.drawer-box{position:absolute;right:0;top:0;bottom:0;width:min(360px,92%);background:#fff;padding:18px;overflow:auto}
.notification{padding:12px;border:1px solid var(--line);border-radius:13px;margin:8px 0}
.notification.unread{background:#eef8f2;border-color:#cfe8da}
.notification b{font-size:12px}.notification p{font-size:11px;color:var(--muted);margin:5px 0}
.empty{text-align:center;padding:34px;color:var(--muted);font-size:13px}
.alert{border-radius:13px;padding:12px 14px;font-size:13px;margin-bottom:12px;line-height:1.5}
.alert.err{background:#fff0ee;border:1px solid #ffd1cc;color:#b42318}
.alert.info{background:#edf7fb;border:1px solid #d4e8f2;color:#216b9a}
.alert.ok{background:#edf8f2;border:1px solid #cfe8da;color:var(--green)}
.skeleton{height:118px;border-radius:15px;background:linear-gradient(90deg,#eef2ef 25%,#f7f9f8 50%,#eef2ef 75%);background-size:200% 100%;animation:load 1.2s infinite}
@keyframes load{to{background-position:-200% 0}}
.stars{display:flex;gap:8px;font-size:32px}
.stars button{border:0;background:transparent;color:#d5dfda;padding:0;line-height:1}
.stars button.on{color:var(--gold)}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){
 .container{padding:12px}.hero{min-height:340px;border-radius:20px}.hero-content{padding:26px 20px}
 .hero-scrim{background:linear-gradient(180deg,rgba(8,32,22,.62) 0%,rgba(8,38,26,.9) 62%,rgba(8,46,30,.97) 100%)}
 .hero-art svg{right:-70px;height:74%;min-width:440px;opacity:.75}
 .grid{grid-template-columns:1fr}.form-grid,.location{grid-template-columns:1fr}.full{grid-column:auto}
 .time-grid{grid-template-columns:repeat(3,1fr)}.booking-info{grid-template-columns:1fr 1fr}
 .profile{grid-template-columns:80px 1fr;padding:15px}.profile-avatar{width:75px;height:75px;border-radius:22px;font-size:26px}.profile-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="topbar-inner">
  <button class="logo" id="logoBtn"><span class="logo-mark">🚗</span><span data-i18n="brand"></span></button>
  <div class="top-actions">
    <div style="position:relative">
      <button class="icon-btn" id="langBtn" aria-label="Til / Язык" style="width:auto;padding:0 12px;font-weight:900"><span id="langLabel">UZ</span></button>
      <div class="langmenu" id="langMenu">
        <button data-lang="uz">🇺🇿 <span data-i18n="lang_uz"></span></button>
        <button data-lang="ru">🇷🇺 <span data-i18n="lang_ru"></span></button>
      </div>
    </div>
    <button class="icon-btn" id="notifBtn" aria-label="Bildirishnomalar">🔔<i id="notifDot" class="dot hide"></i></button>
    <button class="icon-btn" id="profileBtn" id2="" aria-label="Profil" title="" data-i18n-title="nav_profile">👤</button>
  </div>
</div></header>

<main class="container">
<div id="globalAlert"></div>

<section id="home" class="view">
  <div class="hero">
    <div class="hero-art">
      <div id="heroPhoto" class="hero-photo"></div>
      <svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <defs><linearGradient id="trk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a5c3a"/><stop offset="1" stop-color="#063f28"/></linearGradient></defs>
        <ellipse cx="300" cy="215" rx="235" ry="118" fill="url(#trk)" opacity=".85"/>
        <ellipse cx="300" cy="215" rx="235" ry="118" fill="none" stroke="#7fe3b4" stroke-opacity=".28" stroke-width="2"/>
        <ellipse cx="300" cy="215" rx="150" ry="72" fill="none" stroke="#eafff5" stroke-opacity=".38" stroke-width="3" stroke-dasharray="16 18" stroke-linecap="round"/>
        <ellipse cx="300" cy="215" rx="70" ry="32" fill="#0b8d51" opacity=".2"/>
        <g fill="#ffb347"><path d="M148 176l7 17h-14z"/><path d="M300 128l7 17h-14z"/><path d="M452 176l7 17h-14z"/><path d="M300 302l7 17h-14z"/><path d="M196 272l7 17h-14z"/><path d="M404 272l7 17h-14z"/></g>
        <g transform="translate(258 176)"><rect x="0" y="10" width="84" height="26" rx="11" fill="#f2fbf6"/><path d="M16 12h44l14 -12h-44z" fill="#cfeadd"/><circle cx="22" cy="38" r="8" fill="#123326"/><circle cx="66" cy="38" r="8" fill="#123326"/></g>
      </svg>
    </div>
    <div class="hero-scrim"></div>
    <div class="hero-content">
      <div class="eyebrow" data-i18n="hero_eyebrow"></div>
      <h1 id="heroTitle"></h1>
      <p data-i18n="hero_sub"></p>
      <div class="hero-actions">
        <button class="primary" data-go="book" data-i18n="hero_book"></button>
        <button class="ghost" data-go="instructors" data-i18n="hero_instructors"></button>
      </div>
    </div>
  </div>

  <div id="reviewBanner" class="hide"></div>

  <div class="section">
    <div class="section-head"><div><h2 data-i18n="next_h"></h2><p data-i18n="next_p"></p></div></div>
    <div id="nextBooking" class="card" style="padding:16px"><div class="empty">Yuklanmoqda…</div></div>
  </div>

  <div class="section">
    <div class="section-head"><div><h2 data-i18n="why_h"></h2><p data-i18n="why_p"></p></div></div>
    <div class="grid">
      <div class="card feature"><div class="feature-icon">👨‍🏫</div><b data-i18n="f1_t"></b><p data-i18n="f1_p"></p></div>
      <div class="card feature"><div class="feature-icon">⚡</div><b data-i18n="f2_t"></b><p data-i18n="f2_p"></p></div>
      <div class="card feature"><div class="feature-icon">💬</div><b data-i18n="f3_t"></b><p data-i18n="f3_p"></p></div>
    </div>
  </div>

  <div class="section">
    <div class="section-head"><div><h2 data-i18n="ins_h"></h2><p data-i18n="ins_p"></p></div><button class="secondary" data-go="instructors" data-i18n="ins_all"></button></div>
    <div id="homeInstructors" class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>

  <div class="section hide" id="mediaSection">
    <div class="section-head"><div><h2 id="mediaTitle" data-i18n="media_h"></h2><p data-i18n="media_p"></p></div></div>
    <div class="card" style="padding:14px"><video id="mediaVideo" controls playsinline style="width:100%;border-radius:13px"></video></div>
  </div>

  <div class="section card location">
    <div>
      <div class="eyebrow" style="color:var(--green)" data-i18n="addr_eyebrow"></div>
      <h2 style="margin:6px 0" id="locName">AVTODROM</h2>
      <p class="meta" id="addressText" data-i18n="addr_none"></p>
      <div class="card-actions"><button class="primary green" id="mapBtn" data-i18n="addr_map"></button><button class="secondary" id="callBtn" data-i18n="addr_call"></button></div>
    </div>
    <div class="map">📍 AVTODROM<br><small style="font-weight:600">Toshkent</small></div>
  </div>
</section>

<section id="instructors" class="view hide">
  <div class="section-head"><div><h2 data-i18n="ins_title"></h2><p data-i18n="ins_sub"></p></div></div>
  <input id="instructorSearch" class="search" data-i18n-ph="ins_search">
  <div id="instructorList" class="grid" style="margin-top:13px"></div>
</section>

<section id="book" class="view hide">
  <div class="section-head"><div><h2 data-i18n="book_h"></h2><p data-i18n="book_p"></p></div></div>
  <div class="card booking-box">
    <div class="steps"><div id="step1" class="step active" data-i18n="s1"></div><div id="step2" class="step" data-i18n="s2"></div><div id="step3" class="step" data-i18n="s3"></div><div id="step4" class="step" data-i18n="s4"></div></div>
    <div id="bookAlert"></div>
    <div class="field full" style="margin-bottom:14px"><label data-i18n="l_course"></label><div id="courseList" class="courses"><div class="skeleton" style="height:60px"></div></div></div>
    <div class="form-grid">
      <div class="field full"><label data-i18n="l_instructor"></label><select id="bookInstructor"><option value="" data-i18n="loading"></option></select></div>
      <div class="field"><label data-i18n="l_date"></label><input id="bookDate" type="date"></div>
      <div class="field"><label data-i18n="l_note"></label><input id="bookNote" data-i18n-ph="ph_note"></div>

  LANG = String(tg?.initDataUnsafe?.user?.language_code || '').startsWith('ru') ? 'ru' : 'uz';
}
function t(key, params) {
  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.uz[key] ?? key;
  if (params) for (const k in params) s = s.replace(`{${k}}`, params[k]);
  return s;
}
const LOCALE = () => (LANG === 'ru' ? 'ru-RU' : 'uz-UZ');

function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); el.setAttribute('aria-label', t(el.dataset.i18nTitle)); });
  $('langLabel').textContent = LANG.toUpperCase();
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
}
function setLang(l) {
  if (l !== 'uz' && l !== 'ru') return;
  LANG = l; localStorage.setItem('avtodrom_lang', l);
  applyLang(); rerenderAll();
  $('langMenu').classList.remove('open');
}

async function api(path, opt = {}) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), 15000);
  try {
    const headers = { Accept:'application/json', 'Content-Type':'application/json', ...(opt.headers||{}) };
    if (INIT_DATA) headers['X-Telegram-Init-Data'] = INIT_DATA;
    const r = await fetch(path, { cache:'no-store', ...opt, signal:c.signal, headers });
    const txt = await r.text(); let d = {};
    try { d = txt ? JSON.parse(txt) : {}; }
    catch { throw new Error(t('notjson',{code:r.status,body:txt.slice(0,70)})); }
    if (!r.ok) throw new Error(d.error || d.message || `HTTP ${r.status}`);
    return d;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error(t('timeout'));
    if (e instanceof TypeError) throw new Error(t('net_err'));
    throw e;
  } finally { clearTimeout(t); }
}

const todayTk = () => new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
const tkDT = (d,t) => { const m=String(t).match(/^(\d{2}):(\d{2})$/); return m ? new Date(`${d}T${m[1]}:${m[2]}:00+05:00`) : null; };
const fDate = v => { if(!v) return '—'; const d=new Date(v); return isNaN(d)?'—':d.toLocaleDateString(LOCALE(),{timeZone:TZ,day:'2-digit',month:'short',year:'numeric'}); };
const fTime = v => { if(!v) return '—'; const d=new Date(v); return isNaN(d)?'—':d.toLocaleTimeString(LOCALE(),{timeZone:TZ,hour:'2-digit',minute:'2-digit'}); };
const fFull = v => v ? `${fDate(v)} · ${fTime(v)}` : '—';
const iName = x => { const p=x?.profile||x||{}; return [p.first_name,p.last_name].filter(Boolean).join(' ')||p.full_name||x?.full_name||t('ins_default'); };
const initials = n => { const p=String(n||'').trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'👤'; };
const stLabel = s => t('st_'+s) !== 'st_'+s ? t('st_'+s) : s;

function toast(t){ const x=$('toast'); x.textContent=t; x.classList.add('show'); clearTimeout(window.__t); window.__t=setTimeout(()=>x.classList.remove('show'),2800); }
function alertBox(el,msg,kind='err'){ $(el).innerHTML = msg?`<div class="alert ${kind}">${esc(msg)}</div>`:''; }
function openModal(t,h){ $('modalTitle').textContent=t; $('modalBody').innerHTML=h; $('modal').classList.add('show'); }
function closeModal(){ $('modal').classList.remove('show'); }
$('modalClose').onclick=closeModal;
$('modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };
$('drawerClose').onclick=()=>$('drawer').classList.remove('show');
$('drawer').onclick=e=>{ if(e.target.id==='drawer') $('drawer').classList.remove('show'); };

function go(sec){
  const ok=['home','instructors','book','bookings','chat','profile'];
  if(!ok.includes(sec)) sec='home';
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hide',v.id!==sec));
  document.querySelectorAll('.bottom-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===sec));
  history.replaceState(null,'','#'+sec);
  window.scrollTo({top:0,behavior:'smooth'});
  if(sec==='bookings') loadBookings();
  if(sec==='book'){ if(!S.courses.length) loadCourses(); loadInstructors(); }
  if(sec==='chat') loadMessages(true);
}
document.querySelectorAll('.bottom-btn').forEach(b=>b.onclick=()=>go(b.dataset.nav));
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
$('logoBtn').onclick=()=>go('home');
$('profileBtn').onclick=()=>go('profile');

/* ---------------- Bo'sh vaqt ---------------- */
function slots(){ const a=[]; for(let h=8;h<21;h++) for(let m=0;m<60;m+=30) a.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')); return a; }
async function onBookingChange(){
  updateSteps();
  const date=$('bookDate').value, ins=$('bookInstructor').value;
  S.busy=[];
  if(date&&ins){
    try{ const d=await api(`/api/instructors/${encodeURIComponent(ins)}/availability?date=${encodeURIComponent(date)}`); S.busy=d.busy||[]; }
    catch(e){ /* yuborishda backend baribir tekshiradi */ }
  }
  renderTimes(); updateSummary();
}
function renderTimes(){
  const box=$('timeGrid'), date=$('bookDate').value, ins=$('bookInstructor').value;
  const c=S.courses.find(x=>x.id===S.course);
  if(!date||!ins||!c){ box.innerHTML=''; $('availabilityHint').textContent=t('hint_pick'); return; }
  const dur=c.duration_minutes, now=Date.now();
  box.innerHTML=slots().map(t=>{
    const st=tkDT(date,t), en=new Date(st.getTime()+dur*60000);
    const clash=S.busy.some(b=>new Date(b.start_at)<en && new Date(b.end_at)>st);
    const off=clash||st.getTime()<now;
    return `<button type="button" class="time ${S.time===t?'selected':''} ${off?'busy':''}" ${off?'disabled':''} data-time="${t}">${t}</button>`;
  }).join('');
  box.querySelectorAll('.time:not([disabled])').forEach(b=>b.onclick=()=>{ S.time=b.dataset.time; renderTimes(); updateSummary(); updateSteps(); });
  const free=box.querySelectorAll('.time:not([disabled])').length;
  $('availabilityHint').textContent = free ? t('hint_free',{date:fDate(date),n:free}) : t('hint_none');
}
function updateSteps(){
  $('step1').classList.toggle('active',!!S.course);
  $('step2').classList.toggle('active',!!$('bookInstructor').value);
  $('step3').classList.toggle('active',!!$('bookDate').value);
  $('step4').classList.toggle('active',!!S.time);
}
function updateSummary(){
  const c=S.courses.find(x=>x.id===S.course);
  const i=S.instructors.find(x=>String(x.id)===String($('bookInstructor').value));
  const d=$('bookDate').value;
  if(!c&&!i&&!S.time){ $('bookingSummary').textContent=t('sum_placeholder'); return; }
  $('bookingSummary').innerHTML=`<b>${esc(t('sum_title'))}</b><br>
    📚 ${c?esc(c.name)+' · '+esc(c.duration_minutes)+' '+t('minutes'):t('sum_nocourse')}<br>
    👨‍🏫 ${i?esc(iName(i)):esc(t('sum_noins'))}<br>
    📅 ${d?esc(fDate(d)):'—'} · 🕐 ${S.time?esc(S.time):esc(t('sum_notime'))}<br>
    💵 <b>${c?money(c.price):'—'}</b>`;
}
$('bookDate').onchange=()=>{ S.time=''; onBookingChange(); };
$('bookInstructor').onchange=()=>{ S.time=''; onBookingChange(); };

$('submitBooking').onclick=async()=>{
  alertBox('bookAlert','');
  if(!S.profile){ alertBox('bookAlert',t('err_noprofile')); return; }
  if(!S.profile.first_name||!S.profile.last_name||!S.profile.phone){ go('profile'); toast(t('err_fillprofile')); return; }
  if(!S.course){ alertBox('bookAlert',t('err_nocourse')); return; }
  if(!$('bookInstructor').value){ alertBox('bookAlert',t('err_noins')); return; }
  if(!$('bookDate').value||!S.time){ alertBox('bookAlert',t('err_nodate')); return; }
  const b=$('submitBooking'); b.disabled=true; b.textContent=t('submitting');
  try{
    await api('/api/bookings',{method:'POST',body:JSON.stringify({
      instructor_id:$('bookInstructor').value, course_id:S.course,
      start_at:tkDT($('bookDate').value,S.time).toISOString(),
      customer_note:$('bookNote').value.trim()||null })});
    $('bookNote').value=''; S.time=''; S.course=null; renderCourses();
    await loadBookings(); toast(t('ok_booked')); go('bookings');
  }catch(e){ alertBox('bookAlert',e.message); }
  finally{ b.disabled=false; b.textContent=t('submit'); }
};

function renderBookings(){
  const box=$('bookingList');

  if(!rows.length){
    box.innerHTML=`<div class="card empty">${esc(t('my_empty'))}<br><br><button class="primary green" id="emptyBook">${esc(t('next_book'))}</button></div>`;
    $('emptyBook')?.addEventListener('click',()=>go('book')); return;
  }
  box.innerHTML=rows.map(b=>{
    const st=b.status||'pending';
    const mins=b.course?.duration_minutes||Math.round((new Date(b.end_at)-new Date(b.start_at))/60000)||0;
    const canCancel=['pending','confirmed'].includes(st), canReview=st==='completed'&&!b.reviewed;
    return `<article class="card booking-card">
      <div class="booking-row">
        <div><span class="status ${esc(st)}">${esc(stLabel(st))}</span><h3>${esc(b.course?.name||t('lesson'))}</h3></div>
        <b style="color:var(--green);white-space:nowrap">${b.course?.price!=null?esc(money(b.course.price)):''}</b></div>
      <div class="booking-info">
        <div class="info"><span>${esc(t('instructor'))}</span><b>${esc(iName(b.instructor))}</b></div>
        <div class="info"><span>${esc(t('date'))}</span><b>${esc(fDate(b.start_at))}</b></div>
        <div class="info"><span>${esc(t('time'))}</span><b>${esc(fTime(b.start_at))} · ${esc(mins)}${esc(t('min_short'))}</b></div></div>
      ${b.customer_note?`<p class="meta" style="margin:11px 0 0">💬 ${esc(b.customer_note)}</p>`:''}
      ${b.cancellation_reason?`<p class="meta" style="margin:8px 0 0">ℹ️ ${esc(b.cancellation_reason)}</p>`:''}
      ${(canCancel||canReview)?`<div class="card-actions">
        ${canCancel?`<button class="danger" data-cancel="${esc(b.id)}">${esc(t('cancel'))}</button>`:''}
        ${canReview?`<button class="primary green" data-review="${esc(b.id)}">${esc(t('rate'))}</button>`:''}</div>`:''}
    </article>`;
  }).join('');
  box.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelBooking(b.dataset.cancel));
  box.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>openReview(b.dataset.review));
}
function renderNext(){
  const now=Date.now();
  const n=S.bookings.filter(b=>['pending','confirmed','in_progress'].includes(b.status)&&new Date(b.end_at)>now)
    .sort((a,b)=>new Date(a.start_at)-new Date(b.start_at))[0];
  $('nextBooking').innerHTML = n
    ? `<div class="booking-row"><div><span class="status ${esc(n.status)}">${esc(stLabel(n.status))}</span>
       <h3 style="margin:7px 0 0">${esc(n.course?.name||t('lesson'))}</h3>
       <div class="meta" style="margin-top:5px">👨‍🏫 ${esc(iName(n.instructor))}</div></div>
       <div style="text-align:right"><b style="font-size:15px">${esc(fDate(n.start_at))}</b><div class="meta">${esc(fTime(n.start_at))}</div></div></div>`
    : `<div class="empty">${esc(t('next_empty'))}<br><br><button class="primary green" id="nbBook">${esc(t('next_book'))}</button></div>`;
  $('nbBook')?.addEventListener('click',()=>go('book'));
}
async function cancelBooking(id){
  if(!confirm(t('confirm_cancel'))) return;
  try{ await api(`/api/bookings/${encodeURIComponent(id)}/cancel`,{method:'PATCH',body:JSON.stringify({})}); toast(t('ok_cancelled')); await loadBookings(); }

}
function openNotifications(){
  $('notifications').innerHTML = S.notifications.length
    ? S.notifications.map(n=>`<div class="notification ${n.is_read?'':'unread'}"><b>${esc(n.title||'AVTODROM')}</b><p>${esc(n.message||n.body||'')}</p><small class="meta">${esc(fFull(n.created_at))}</small></div>`).join('')
    : `<div class="empty">${esc(t('notif_empty'))}</div>`;
  $('drawer').classList.add('show');
}
$('notifBtn').onclick=openNotifications;
$('profileNotifBtn').onclick=openNotifications;

async function loadMedia(){
  try{
    const d=await api('/api/content'); const media=d.media||[];
    const img=media.find(x=>x.key==='home_image'&&x.public_url);
    if(img){ const el=$('heroPhoto'), pre=new Image();
      pre.onload=()=>{ el.style.backgroundImage=`url("${img.public_url}")`; el.classList.add('on'); }; pre.src=img.public_url; }
    const v=media.find(x=>x.key==='guide_video'&&x.public_url);
    if(!v) return;
    $('mediaSection').classList.remove('hide');
    $('mediaTitle').textContent=v.title||'Video qo‘llanma';
    $('mediaVideo').src=v.public_url;
  }catch(e){ /* media ixtiyoriy */ }
}
async function loadSettings(){
  try{
    const d=await api('/api/settings'); S.settings=d.settings||{};
    const loc=S.settings.location||{};
    if(loc.name) $('locName').textContent=loc.name;
    const parts=[loc.address||S.settings.address, S.settings.working_hours].filter(Boolean);
    if(parts.length) $('addressText').textContent=parts.join(' · ');
    if(S.settings.booking_enabled===false){
      $('submitBooking').disabled=true;
      alertBox('bookAlert',t('booking_off'),'info');
    }
  }catch(e){ /* sozlama ixtiyoriy */ }
}
$('mapBtn').onclick=()=>{
  const loc=S.settings?.location||{};
  if(loc.google_url) return window.open(loc.google_url,'_blank','noopener');
  const lat=Number(loc.latitude), lng=Number(loc.longitude);
  const q=(Number.isFinite(lat)&&Number.isFinite(lng))?`${lat},${lng}`:(loc.address||S.settings?.address||'Avtodrom Tashkent');
  window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),'_blank','noopener');
};
$('callBtn').onclick=()=>{
  const p=S.settings?.contact_phone;
  if(p) location.href='tel:'+String(p).replace(/[^+\d]/g,'');
  else toast(t('addr_nophone'));
};

/* ---------------- Til almashtirish ---------------- */
/* Til o'zgarganda: statik matnlar applyLang() bilan, dinamik ro'yxatlar
   qayta render qilinadi. Serverga qayta so'rov yuborilmaydi. */
function rerenderAll(){
  renderHomeInstructors(); renderInstructors(); fillInstructorSelect();
  if(S.courses.length) renderCourses();
  renderTimes(); updateSummary();
  renderBookings(); renderNext(); renderReviewBanner();
  renderMessages(false); renderProfile();
  const loc=S.settings?.location||{};
  const parts=[loc.address||S.settings?.address, S.settings?.working_hours].filter(Boolean);
  $('addressText').textContent = parts.length ? parts.join(' · ') : t('addr_none');
}
$('langBtn').onclick=e=>{ e.stopPropagation(); $('langMenu').classList.toggle('open'); };
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.addEventListener('click',e=>{ if(!e.target.closest('#langBtn,#langMenu')) $('langMenu').classList.remove('open'); });

/* ---------------- Boot ---------------- */
async function boot(){
  applyLang();
  $('bookDate').min=todayTk(); $('bookDate').value=todayTk();
  await loadMe();
  await Promise.allSettled([loadSettings(),loadCourses(),loadInstructors(),loadBookings(),loadNotifications(),loadMedia(),loadMessages(false)]);
  go(location.hash.slice(1)||'home');
}
setInterval(()=>{
  if(!S.profile) return;
  if($('modal').classList.contains('show')) return;
  if(document.activeElement===$('chatInput')) return;
  loadBookings(); loadNotifications(); loadMessages(false);
},25000);
boot();
</script>
</body>
</html>
