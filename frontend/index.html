<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVTODROM — Foydalanuvchi</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{margin:0;background:#f5f7f6;color:#14221b;font:14px Arial}.app{max-width:540px;margin:auto;min-height:100vh;background:#fff}.top{padding:14px 16px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;gap:7px}.brand{font-weight:900;font-size:19px}.actions{display:flex;gap:6px}.btn{border:1px solid #d8e1dc;background:#fff;border-radius:10px;padding:11px 13px;font-weight:800}.primary{background:#087443;color:#fff;border-color:#087443}.content{padding:16px 16px 80px}.page{display:none}.page.active{display:block}.card{border:1px solid #e1e8e4;border-radius:15px;padding:15px;margin:12px 0}.field{display:grid;gap:5px;margin:10px 0}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d8e1dc;border-radius:9px;box-sizing:border-box;font:inherit}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.nav button{border:0;background:none;padding:9px 4px;font-size:11px}.status{padding:5px 8px;border-radius:99px;background:#eef7f1;display:inline-block;font-weight:800}.err{background:#fff0ef;color:#a32118;padding:10px;border-radius:9px}.muted{color:#6e7b74}.ai{position:fixed;right:18px;bottom:70px;border:0;border-radius:99px;background:#087443;color:white;padding:13px;font-weight:900}.chat{position:fixed;right:16px;bottom:125px;width:min(390px,calc(100% - 32px));height:430px;background:#fff;border:1px solid #ddd;border-radius:18px;box-shadow:0 10px 40px #0002;display:none;z-index:10}.chat.open{display:flex;flex-direction:column}.chathead{padding:12px;background:#087443;color:#fff;border-radius:18px 18px 0 0}.messages{flex:1;overflow:auto;padding:10px}.msg{padding:9px 11px;border-radius:12px;margin:6px 0;max-width:85%;background:#f1f5f3}.mine{margin-left:auto;background:#087443;color:#fff}.chatinput{display:flex;padding:8px;gap:6px}.chatinput input{flex:1;padding:10px;border:1px solid #ddd;border-radius:9px}.lang{position:relative}.langmenu{display:none;position:absolute;right:16px;top:58px;background:#fff;border:1px solid #ddd;border-radius:12px;box-shadow:0 8px 30px #0002;z-index:20;overflow:hidden}.langmenu.open{display:block}.langmenu button{display:block;border:0;background:#fff;padding:11px 16px;width:150px;text-align:left}</style></head><body><div class="app"><header class="top"><div class="brand">🚗 AVTODROM</div><div class="actions"><button id="langBtn" class="btn" onclick="toggleLang()">UZ</button><button class="btn" onclick="toggleAI()">🤖 <span data-i18n="help">Yordam</span></button></div><div id="langMenu" class="langmenu"><button onclick="setLang('uz')">🇺🇿 O‘zbekcha</button><button onclick="setLang('ru')">🇷🇺 Русский</button></div></header><main class="content"><section id="home" class="page active"><div class="card"><h2 id="hello">Xush kelibsiz!</h2><p data-i18n="home_desc">Real bronlaringiz va bildirishnomalaringiz shu yerda.</p><button class="btn primary" style="width:100%" onclick="show('book')" data-i18n="book_lesson">Dars bron qilish</button></div><div class="card"><b data-i18n="notifications">Bildirishnomalar</b><div id="notifications" class="muted">Yuklanmoqda...</div></div></section><section id="book" class="page"><h2 data-i18n="book_lesson">Dars bron qilish</h2><div id="bookError"></div><div class="card"><div class="field"><label data-i18n="instructor">Instruktor</label><select id="instructor"></select></div><div class="field"><label data-i18n="date_time">Sana va vaqt</label><input id="start" type="datetime-local"></div><div class="field"><label data-i18n="duration">Dars davomiyligi</label><select id="duration"><option value="30" data-i18n="min30">30 daqiqa</option><option value="60" data-i18n="min60">60 daqiqa</option><option value="90" data-i18n="min90">90 daqiqa</option></select></div><div class="field"><label data-i18n="note">Izoh</label><textarea id="note" rows="3"></textarea></div><button class="btn primary" style="width:100%" onclick="createBooking()" data-i18n="send_booking">Bron yuborish</button></div></section><section id="bookings" class="page"><h2 data-i18n="my_bookings">Bronlarim</h2><div id="bookingList">Yuklanmoqda...</div></section><section id="profile" class="page"><h2 data-i18n="my_profile">Profilim</h2><div class="card"><div class="field"><label data-i18n="first_name">Ism *</label><input id="first"></div><div class="field"><label data-i18n="last_name">Familiya *</label><input id="last"></div><div class="field"><label data-i18n="phone">Telefon *</label><input id="phone" placeholder="+998 90 123 45 67"></div><button class="btn primary" onclick="saveProfile()" data-i18n="save">Saqlash</button></div></section></main><nav class="nav"><button onclick="show('home')">🏠<br><span data-i18n="home">Bosh sahifa</span></button><button onclick="show('book')">＋<br><span data-i18n="book">Bron</span></button><button onclick="show('bookings')">📋<br><span data-i18n="my_bookings">Bronlarim</span></button><button onclick="show('profile')">👤<br><span data-i18n="profile">Profil</span></button></nav></div><button class="ai" onclick="toggleAI()">🤖 AI</button><div id="chat" class="chat"><div class="chathead"><b data-i18n="ai_title">AVTODROM AI yordamchi</b><button style="float:right;background:none;border:0;color:#fff;font-size:20px" onclick="toggleAI()">×</button></div><div id="messages" class="messages"><div class="msg" data-i18n="ai_welcome">Assalomu alaykum! Savolingizni yozing.</div></div><div class="chatinput"><input id="q" data-i18n-placeholder="question" placeholder="Savolingiz..." onkeydown="if(event.key==='Enter')sendQ()"><button class="btn primary" onclick="sendQ()" data-i18n="send">Yuborish</button></div></div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const API=window.AVTODROM_API_URL||location.origin,initData=tg?.initData||'';let profile=null;const T={uz:{help:'Yordam',home_desc:'Real bronlaringiz va bildirishnomalaringiz shu yerda.',book_lesson:'Dars bron qilish',notifications:'Bildirishnomalar',instructor:'Instruktor',date_time:'Sana va vaqt',duration:'Dars davomiyligi',min30:'30 daqiqa',min60:'60 daqiqa',min90:'90 daqiqa',note:'Izoh',send_booking:'Bron yuborish',my_bookings:'Bronlarim',my_profile:'Profilim',first_name:'Ism *',last_name:'Familiya *',phone:'Telefon *',save:'Saqlash',home:'Bosh sahifa',book:'Bron',profile:'Profil',ai_title:'AVTODROM AI yordamchi',ai_welcome:'Assalomu alaykum! Savolingizni yozing.',question:'Savolingiz...',send:'Yuborish',welcome:'Xush kelibsiz!',no_notifications:'Hozircha bildirishnoma yo‘q.',no_bookings:'Hozircha bronlar yo‘q.',no_instructors:'Tasdiqlangan instruktor yo‘q',profile_required:'Avval profilni to‘ldiring.',choose:'Instruktor va sana-vaqtni tanlang',sent:'Bron yuborildi. Admin tasdiqlashini kuting.',saved:'Profil saqlandi',telegram:'Telegram orqali Mini Appni botdan oching.',pending:'Tasdiqlash kutilmoqda',confirmed:'Tasdiqlangan',in_progress:'Dars jarayonida',completed:'Tugagan',cancelled:'Bekor qilingan',no_show:'Kelmagan',ai_booking:'Bron bo‘limida Admin tasdiqlagan faol instruktorlar chiqadi. Sana va vaqtni tanlab bron yuboring.',ai_instructor:'Instruktor Admin tomonidan tasdiqlangan bo‘lishi kerak.',ai_status:'Broningiz holatini Bronlarim bo‘limida ko‘rasiz.',ai_cancel:'Bronni bekor qilish uchun Admin bilan bog‘laning.',ai_default:'Savolingiz qabul qilindi. Operator bilan bog‘lanish uchun Admin xizmatidan foydalaning.'},ru:{help:'Помощь',home_desc:'Здесь находятся ваши бронирования и уведомления.',book_lesson:'Забронировать занятие',notifications:'Уведомления',instructor:'Инструктор',date_time:'Дата и время',duration:'Продолжительность занятия',min30:'30 минут',min60:'60 минут',min90:'90 минут',note:'Комментарий',send_booking:'Отправить бронь',my_bookings:'Мои бронирования',my_profile:'Мой профиль',first_name:'Имя *',last_name:'Фамилия *',phone:'Телефон *',save:'Сохранить',home:'Главная',book:'Бронь',profile:'Профиль',ai_title:'AI-помощник AVTODROM',ai_welcome:'Здравствуйте! Напишите ваш вопрос.',question:'Ваш вопрос...',send:'Отправить',welcome:'Добро пожаловать!',no_notifications:'Уведомлений пока нет.',no_bookings:'Бронирований пока нет.',no_instructors:'Подтверждённых инструкторов нет',profile_required:'Сначала заполните профиль.',choose:'Выберите инструктора и дату/время',sent:'Бронь отправлена. Ожидайте подтверждения администратора.',saved:'Профиль сохранён',telegram:'Откройте Mini App через Telegram-бота.',pending:'Ожидает подтверждения',confirmed:'Подтверждено',in_progress:'Занятие идёт',completed:'Завершено',cancelled:'Отменено',no_show:'Не пришёл',ai_booking:'В разделе бронирования отображаются активные инструкторы, подтверждённые администратором. Выберите дату и время и отправьте бронь.',ai_instructor:'Инструктор должен быть подтверждён администратором.',ai_status:'Статус бронирования смотрите в разделе «Мои бронирования».',ai_cancel:'Для отмены бронирования свяжитесь с администратором.',ai_default:'Вопрос принят. Для связи с оператором воспользуйтесь службой администратора.'}};let lang=localStorage.getItem('avtodrom_lang')||'uz',t=k=>T[lang][k]||k;function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=t(e.dataset.i18nPlaceholder));langBtn.textContent=lang.toUpperCase();if(profile)hello.textContent=t('welcome')+', '+(profile.first_name||t('profile'))+'!';loadNotifications()}function setLang(x){lang=x;localStorage.setItem('avtodrom_lang',x);langMenu.classList.remove('open');applyLang()}function toggleLang(){langMenu.classList.toggle('open')}function headers(){return{'Content-Type':'application/json','X-Telegram-Init-Data':initData}}async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{...headers(),...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Server xatosi');return d}async function boot(){applyLang();try{const d=await api('/api/me');profile=d.profile;hello.textContent=t('welcome')+', '+(profile.first_name||t('profile'))+'!';first.value=profile.first_name||'';last.value=profile.last_name||'';phone.value=profile.phone||'';loadNotifications()}catch(e){document.querySelector('.content').innerHTML='<div class="card err">'+t('telegram')+'</div>'}}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='book')loadInstructors();if(id==='bookings')loadBookings();if(id==='home')loadNotifications()}async function loadInstructors(){try{const d=await api('/api/instructors');instructor.innerHTML=d.instructors.length?d.instructors.map(x=>`<option value="${x.id}">${x.profile?.first_name||''} ${x.profile?.last_name||''} — ${x.profile?.phone||''}</option>`).join(''):`<option value="">${t('no_instructors')}</option>`}catch(e){bookError.innerHTML='<div class="err">'+e.message+'</div>'}}async function createBooking(){try{bookError.innerHTML='';if(!profile?.first_name||!profile?.last_name||!profile?.phone){show('profile');alert(t('profile_required'));return}if(!start.value||!instructor.value)throw Error(t('choose'));const s=new Date(start.value),e=new Date(s.getTime()+Number(duration.value)*60000);await api('/api/bookings',{method:'POST',body:JSON.stringify({instructor_id:instructor.value,start_at:s.toISOString(),end_at:e.toISOString(),customer_note:note.value})});alert(t('sent'));show('bookings');loadBookings()}catch(e){bookError.innerHTML='<div class="err">'+e.message+'</div>'}}function statusText(s){return({pending:t('pending'),confirmed:t('confirmed'),in_progress:t('in_progress'),completed:t('completed'),cancelled:t('cancelled'),no_show:t('no_show')})[s]||s}async function loadBookings(){try{const d=await api('/api/bookings');bookingList.innerHTML=d.bookings.length?d.bookings.map(b=>`<div class="card"><b>${new Date(b.start_at).toLocaleString(lang==='ru'?'ru-RU':'uz-UZ')}</b><p>👨‍🏫 ${b.instructor?.profile?.first_name||t('instructor')} ${b.instructor?.profile?.last_name||''}</p><p>📞 ${b.instructor?.profile?.phone||''}</p><span class="status">${statusText(b.status)}</span></div>`).join(''):`<div class="card muted">${t('no_bookings')}</div>`}catch(e){bookingList.innerHTML='<div class="err">'+e.message+'</div>'}}async function loadNotifications(){try{const d=await api('/api/notifications');notifications.innerHTML=d.notifications.length?d.notifications.slice(0,5).map(n=>`<div class="card"><b>${n.title}</b><p>${n.body}</p></div>`).join(''):'<span>'+t('no_notifications')+'</span>'}catch(e){notifications.textContent=e.message}}async function saveProfile(){try{const d=await api('/api/me',{method:'PATCH',body:JSON.stringify({first_name:first.value,last_name:last.value,phone:phone.value})});profile=d.profile;hello.textContent=t('welcome')+', '+(profile.first_name||t('profile'))+'!';alert(t('saved'))}catch(e){alert(e.message)}}function toggleAI(){chat.classList.toggle('open')}function addMsg(x,c){const e=document.createElement('div');e.className='msg '+c;e.textContent=x;messages.appendChild(e);messages.scrollTop=messages.scrollHeight}function sendQ(){const x=q.value.trim();if(!x)return;addMsg(x,'mine');q.value='';setTimeout(()=>addMsg(answer(x),''),200)}function answer(x){const s=x.toLowerCase();if(s.includes('bron')||s.includes('бро'))return t('ai_booking');if(s.includes('instruktor')||s.includes('инструкт'))return t('ai_instructor');if(s.includes('holat')||s.includes('статус'))return t('ai_status');if(s.includes('bekor')||s.includes('отмен'))return t('ai_cancel');return t('ai_default')}boot();</script></body></html>
