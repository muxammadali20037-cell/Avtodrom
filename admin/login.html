<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087443"><title>AVTODROM INDEX — Admin Login</title><style>:root{--g:#087443;--bg:#f3f6f4;--t:#132019;--m:#718078;--line:#dfe7e1;--red:#b42318;--shadow:0 18px 55px rgba(15,40,25,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#eaf7ef,#f5f8f6);font-family:Arial,system-ui,sans-serif;color:var(--t);display:grid;place-items:center;padding:18px}.box{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.logo{width:62px;height:62px;border-radius:18px;background:var(--g);display:grid;place-items:center;color:#fff;font-size:29px;margin-bottom:16px}.box h1{margin:0 0 6px;font-size:25px}.box p{margin:0 0 20px;color:var(--m);font-size:13px;line-height:1.5}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:13px;font-weight:800}.field input{height:48px;border:1px solid var(--line);border-radius:11px;padding:0 13px;font-size:15px;outline:0;width:100%}.field input:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(8,116,67,.1)}button{width:100%;height:48px;border:0;border-radius:11px;background:var(--g);color:#fff;font-weight:900;font-size:14px;cursor:pointer;margin-top:7px}button:disabled{opacity:.6}.error{display:none;background:#fff0ef;color:var(--red);border:1px solid #f0cfca;border-radius:11px;padding:11px;font-size:12px;margin:10px 0}.error.show{display:block}.hint{text-align:center;color:var(--m);font-size:11px;margin-top:13px}</style></head><body><form class="box" id="form"><div class="logo">AI</div><h1>AVTODROM INDEX</h1><p>Administrator paneliga xavfsiz kirish.</p><div id="error" class="error"></div><div class="field"><label>Login</label><input id="login" autocomplete="username" required></div><div class="field"><label>Parol</label><input id="password" type="password" autocomplete="current-password" required></div><button id="submit">Kirish</button><div class="hint">Sessiya 12 soatgacha saqlanadi.</div></form><script>const $=id=>document.getElementById(id);const DASH='/admin/dashboard-v2.html';async function check(){try{const r=await fetch('/api/admin/me',{credentials:'include',cache:'no-store'});if(r.ok)location.replace(DASH)}catch{}}check();$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('submit').textContent='Tekshirilmoqda...';$('error').classList.remove('show');try{const r=await fetch('/api/admin/login',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({login:$('login').value.trim(),password:$('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||'Login yoki parol noto‘g‘ri.');location.replace(DASH)}catch(e){$('error').textContent=e.message||'Kirishda xatolik';$('error').classList.add('show')}finally{$('submit').disabled=false;$('submit').textContent='Kirish'}});</script></body></html>
