<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Avtodrom — Foydalanuvchi</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#f3faf6;--card:#fff;--green:#198754;--green2:#126b43;--text:#173128;--muted:#6b8176;--line:#d9ebe1;--soft:#e8f5ee}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fff,var(--bg));color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:620px;margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;gap:10px;align-items:center;font-weight:900}.logo{width:42px;height:42px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 12px rgba(25,135,84,.055)}h1{font-size:25px;margin:0 0 5px}h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px;margin:9px 0}.field.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);font-weight:700}input,select,textarea{width:100%;border:1px solid var(--line);background:#fbfefc;border-radius:11px;padding:12px;color:var(--text);outline:none}button{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:var(--green2);color:#fff;width:100%;margin-top:8px}.ghost{background:var(--soft);color:var(--green2)}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--green2)}.chip.active{background:var(--green);color:#fff}.booking{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:9px}.row{display:flex;justify-content:space-between;gap:12px}.status{color:var(--green2);font-weight:800}.nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(590px,calc(100% - 20px));background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.nav button{background:transparent;color:var(--muted)}.nav button.active{background:var(--soft);color:var(--green2)}.hidden{display:none}.notice{background:var(--soft);border-radius:13px;padding:12px;margin-top:10px;color:var(--green2);font-weight:700}.error{color:#b33d3d;font-size:13px;margin-top:8px}
</style></head><body><main><div class="top"><div class="brand"><div class="logo">A</div><div>AVTODROM<div class="muted" style="font-size:11px">Foydalanuvchi Mini App</div></div></div><button class="ghost" id="tg">Telegram</button></div>
<section id="home"><div class="card"><h1>Haydovchilik mashg‘ulotini bron qiling</h1><div class="muted">Depozitsiz. Instruktor, avtomobil va bo‘sh vaqtni tanlang.</div></div><div class="card"><h2>Instruktor</h2><div id="instructors" class="chips"><button class="chip">Yuklanmoqda...</button></div><h2 style="margin-top:18px">Avtomobil</h2><div id="cars" class="chips"><button class="chip">Yuklanmoqda...</button></div><div class="grid"><div class="field"><label>Sana</label><input id="date" type="date"></div><div class="field"><label>Boshlanish</label><input id="start" type="time"></div><div class="field"><label>Tugash</label><input id="end" type="time"></div><div class="field full"><label>Izoh</label><textarea id="note" rows="2" placeholder="Qo‘shimcha izoh (ixtiyoriy)"></textarea></div></div><button class="primary" onclick="book()">Bron qilish</button><div id="msg"></div></div></section>
<section id="bookings" class="hidden"><div class="card"><h2>Mening bronlarim</h2><div id="list">Yuklanmoqda...</div></div></section>
<section id="profile" class="hidden"><div class="card"><h2>Profil</h2><div id="me">Yuklanmoqda...</div></div></section></main><nav class="nav"><button class="active" onclick="tab('home',this)">🏠 Bosh sahifa</button><button onclick="tab('bookings',this)">📅 Bronlar</button><button onclick="tab('profile',this)">👤 Profil</button></nav>
<script>
const API=localStorage.getItem('AVTODROM_API')||'';const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const headers=()=>({'Content-Type':'application/json','x-telegram-init-data':tg?.initData||''});let selectedInstructor='',selectedCar='';
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...headers(),...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Server xatosi');return j}
function tab(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='bookings')loadBookings();if(id==='profile')loadMe()}
function choose(type,id,b){if(type==='instructor')selectedInstructor=id;else selectedCar=id;b.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function renderButtons(el,items,type){el.innerHTML='';items.forEach(x=>{const b=document.createElement('button');b.className='chip';b.textContent=x.full_name||x.name||x.model||x.plate_number;b.onclick=()=>choose(type,x.id,b);el.appendChild(b)})}
async function loadCatalog(){try{const a=await api('/api/catalog/instructors');renderButtons(document.getElementById('instructors'),a.instructors||[], 'instructor');const c=await api('/api/catalog/cars');renderButtons(document.getElementById('cars'),c.cars||[],'car')}catch(e){document.getElementById('msg').innerHTML='<div class="error">'+e.message+'</div>'}}
async function book(){const d=document.getElementById('date').value,s=document.getElementById('start').value,e=document.getElementById('end').value;if(!d||!s||!e)return msg('Sana va vaqtni kiriting.');try{const j=await api('/api/bookings',{method:'POST',body:JSON.stringify({instructor_id:selectedInstructor||undefined,car_id:selectedCar||undefined,start_at:new Date(d+'T'+s).toISOString(),end_at:new Date(d+'T'+e).toISOString(),customer_note:document.getElementById('note').value})});msg('✅ Bron yaratildi. Admin/instruktor tasdiqlashini kutmoqda.');loadBookings()}catch(x){msg('❌ '+x.message)}}
function msg(x){document.getElementById('msg').innerHTML='<div class="notice">'+x+'</div>'}
async function loadBookings(){try{const j=await api('/api/bookings');const el=document.getElementById('list');el.innerHTML='';(j.bookings||[]).forEach(x=>{const d=document.createElement('div');d.className='booking';d.innerHTML='<div class="row"><b>'+new Date(x.start_at).toLocaleString('uz-UZ')+'</b><span class="status">'+x.status+'</span></div><div class="muted">'+(x.instructor?.full_name||'Instruktor tanlanmagan')+' · '+(x.car?.model||x.car?.plate_number||'Avtomobil tanlanmagan')+'</div>';el.appendChild(d)});if(!el.innerHTML)el.innerHTML='<div class="muted">Hozircha bronlar yo‘q.</div>'}catch(e){document.getElementById('list').innerHTML='<div class="error">'+e.message+'</div>'}}
async function loadMe(){try{const j=await api('/api/me');const p=j.profile||{};document.getElementById('me').innerHTML='<b>'+(p.first_name||'')+' '+(p.last_name||'')+'</b><p class="muted">@'+(p.username||'—')+'</p><div class="notice">Telefon: '+(p.phone||'Kiritilmagan')+'</div>'}catch(e){document.getElementById('me').innerHTML='<div class="error">'+e.message+'</div>'}}
const today=new Date();document.getElementById('date').value=today.toISOString().slice(0,10);loadCatalog();loadBookings();loadMe();
</script></body></html>
