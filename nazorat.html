<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#232883">
<title>Nazorat — instruktorlar</title>
<style>
/* =========================================================================
   NAZORAT PANELI — hamma instruktor bitta havolada (faqat ko'rish)
   Ma'lumot: GET /api/control-view?k=<maxfiy kalit>&d=YYYY-MM-DD
   Havolani admin panel → «Nazorat paneli» beradi va yangilaydi.
   ========================================================================= */
:root{
  color-scheme:light;
  --accent:#2b2f8f;--accent-soft:#eceefb;--on-accent:#fff;
  --bg:#f1f3f8;--card:#fff;--card-2:#f4f5fa;--line:rgba(20,24,51,.10);--grid:rgba(20,24,51,.08);
  --text:#141833;--text-2:#4a5068;--hint:#6b7188;
  --hero:linear-gradient(140deg,#0f1340 0%,#232883 55%,#3a40ae 100%);
  --shadow:0 1px 2px rgba(16,20,48,.04),0 6px 20px rgba(16,20,48,.06);
  /* holatlar (rang + belgi + matn — hech qachon faqat rang) */
  --s-good:#0ca30c;--s-good-soft:#e5f6e5;--s-good-ink:#0b6b0b;
  --s-warn:#fab219;--s-warn-soft:#fff4d6;--s-warn-ink:#7a5200;
  --s-crit:#d03b3b;--s-crit-soft:#fdeeee;--s-crit-ink:#a32626;
  --s-conf:#2a78d6;--s-conf-soft:#e6f0fb;--s-conf-ink:#1c5cab;
  --s-done:#9aa0b0;--s-done-soft:#eef0f4;--s-done-ink:#4a5068;
  --s-own:#6250d6;--s-own-soft:#efedfb;--s-own-ink:#4a3aa7;
  --tl-open:#ffffff;--tl-closed:#e7e9f1;--tl-hatch:rgba(20,24,51,.10);
  --bar:#2a78d6;--bar-hi:#1c5cab;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --accent:#8f95ff;--accent-soft:#252a52;--on-accent:#0f1220;
    --bg:#0f1220;--card:#181c2e;--card-2:#1f2438;--line:rgba(255,255,255,.10);--grid:rgba(255,255,255,.08);
    --text:#eef0f8;--text-2:#c4c8da;--hint:#9aa1b8;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    --s-good-soft:#163a1c;--s-good-ink:#7ee08a;--s-warn-soft:#3a2f10;--s-warn-ink:#ffd36b;
    --s-crit-soft:#3d1c20;--s-crit-ink:#ff9a9a;--s-conf:#3987e5;--s-conf-soft:#18294a;--s-conf-ink:#9ec5f4;
    --s-done:#6b7188;--s-done-soft:#262b40;--s-done-ink:#c4c8da;--s-own:#9085e9;--s-own-soft:#2a2440;--s-own-ink:#c9bdf0;
    --tl-open:#2a3050;--tl-closed:#1a1e30;--tl-hatch:rgba(255,255,255,.07);
    --bar:#3987e5;--bar-hi:#86b6ef;
  }
}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- yuqori qism ---------- */
.top{background:var(--hero);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 4px 18px rgba(10,14,50,.25)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;opacity:.75}
.brand h1{margin:1px 0 0;font-size:21px;letter-spacing:-.3px;line-height:1.2}
.live{font-size:12.5px;opacity:.9;display:flex;align-items:center;gap:7px;white-space:nowrap;padding-bottom:3px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.dot.off{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.bar{max-width:1180px;margin:0 auto;padding:0 16px 10px;display:flex;align-items:center;gap:8px}
.bar .nav{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;font-weight:700;display:grid;place-items:center;flex:none}
.bar .nav:active{background:rgba(255,255,255,.24)}
.day{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;justify-content:center;height:40px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.10);cursor:pointer}
.day b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day small{font-size:11.5px;opacity:.8;white-space:nowrap}
.day input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0}
.bar .today{height:40px;padding:0 12px;border-radius:12px;background:#fff;color:#232883;font-weight:800;font-size:13.5px;flex:none}

.bar{max-width:1180px;margin:0 auto;padding:0 16px 12px;display:flex;align-items:center;gap:8px}
.bar .nav{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;font-weight:700;display:grid;place-items:center;flex:none}
.bar .today{height:40px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-weight:800;font-size:13.5px;flex:none}
.bar .see{height:40px;padding:0 14px;border-radius:12px;background:#fff;color:#232883;font-weight:850;font-size:14px;flex:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
@media (max-width:560px){.bar{flex-wrap:wrap}.bar .day{flex:1 1 calc(100% - 96px)}.bar .see{flex:1 1 100%;justify-content:center}}

.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 50px;transition:opacity .15s}
.wrap.busy{opacity:.6}
.layout{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.free{position:sticky;top:132px}}
.panel{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:16.5px;letter-spacing:-.2px;flex:1;min-width:0}
.panel-h small{color:var(--hint);font-size:12.5px;font-weight:650}
.search{width:100%;height:42px;padding:0 14px;border:0;border-bottom:1px solid var(--line);background:var(--card);outline:none;font-size:15px;color:var(--text)}
.ir{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;text-align:left;min-height:58px}
.ir + .ir{border-top:1px solid var(--line)}
.ir:hover{background:var(--card-2)}
.ir:active{background:var(--accent-soft)}
.ir .ava{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:850;font-size:13.5px;flex:none}
.ir .nm{flex:1;min-width:0;font-weight:750;font-size:15.5px;line-height:1.25;word-break:break-word}
.ir .nm small{display:block;font-weight:600;font-size:12px;color:var(--hint);margin-top:1px}
.cnt{flex:none;min-width:30px;height:26px;padding:0 9px;border-radius:13px;background:var(--accent);color:var(--on-accent);font-weight:850;font-size:13.5px;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.cnt.z{background:var(--card-2);color:var(--hint)}
.cnt.off{background:var(--card-2);color:var(--hint);font-size:12px;font-weight:750}
.chev{color:var(--hint);flex:none;font-size:18px;margin-left:-4px}
.free .panel-h{background:var(--s-good-soft)}
.free .panel-h h2{color:var(--s-good-ink)}
.free .note{padding:9px 16px;font-size:12.5px;color:var(--text-2);border-bottom:1px solid var(--line)}
.fr{display:flex;align-items:center;gap:10px;padding:10px 16px;width:100%;text-align:left}
.fr + .fr{border-top:1px solid var(--line)}
.fr:hover{background:var(--card-2)}
.fr .gd{width:10px;height:10px;border-radius:50%;background:var(--s-good);box-shadow:0 0 0 3px var(--s-good-soft);flex:none}
.fr .nm{flex:1;min-width:0;font-weight:750;font-size:14.5px;line-height:1.25}
.fr .nm small{display:block;font-weight:600;font-size:12px;color:var(--hint)}
.fr a{flex:none;width:34px;height:34px;border-radius:10px;background:var(--card-2);display:grid;place-items:center;text-decoration:none;font-size:15px}
.empty-s{padding:18px 16px;color:var(--hint);font-size:13.5px;text-align:center}
.foot{color:var(--hint);font-size:12px;text-align:center;margin-top:16px}

/* oyna: Excel bron */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,8,26,.55);display:flex;align-items:stretch;justify-content:center}
.ov-box{background:var(--bg);width:100%;max-width:1400px;display:flex;flex-direction:column;min-height:0}
@media (min-width:900px){.ov{padding:24px}.ov-box{border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}}
.ov-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--hero);color:#fff;flex:none}
.ov-h .tt{flex:1;min-width:0}
.ov-h h2{margin:0;font-size:17px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-h small{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-h .x{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;font-size:18px;font-weight:800;flex:none}
.ov-h .dl{height:40px;padding:0 12px;border-radius:12px;background:#107c41;color:#fff;font-weight:800;font-size:13.5px;flex:none;white-space:nowrap}
.ov-b{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px}
.ov-b .xg-scroll{flex:1;max-height:none}
.ov-lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text-2);padding:0 4px 8px;flex:none}
.ov-lg span{display:inline-flex;align-items:center;gap:5px}
.ov-lg i{width:14px;height:9px;border-radius:3px;display:inline-block}
.one .xg td.xc{min-width:0;max-width:none;width:auto}
.one .xg thead tr.n th{min-width:0}
.one table.xg{width:100%}
.msg{max-width:440px;margin:60px auto;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:26px 22px;text-align:center}
.msg .ic{font-size:40px}
.msg h2{margin:8px 0 6px;font-size:20px}
.msg p{color:var(--text-2);margin:0 0 14px}
.msg button{height:46px;padding:0 20px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:800}
.empty{text-align:center;color:var(--hint);padding:40px 10px}
.sk{height:120px;border-radius:20px;background:linear-gradient(90deg,var(--card) 0%,var(--card-2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
/* ---------- Excel ko'rinishi (admin «Excel bron» bilan bir xil ranglar) ---------- */
.xl-bar{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.xl-bar > div{flex:1;min-width:220px}
.dl{height:44px;padding:0 16px;border-radius:13px;background:#107c41;color:#fff;font-weight:800;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;flex:none}
.dl:active{filter:brightness(.92)}
.xg-scroll{overflow:auto;max-height:calc(100vh - 170px);border-radius:16px;background:var(--card);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
table.xg{border-collapse:separate;border-spacing:0;font-size:13px;color:#05081a;min-width:100%}
.xg th,.xg td{border-right:1px solid #9aa1b4;border-bottom:1px solid #9aa1b4;padding:0}
.xg thead th{position:sticky;z-index:3;text-align:center;font-weight:850}
.xg thead tr.g th{top:0;height:26px;color:#fff;font-size:12px;letter-spacing:.06em}
.xg thead tr.n th{top:26px;height:44px;font-size:13px;text-transform:uppercase;padding:4px 8px;line-height:1.2}
.xg thead tr.n th small{display:block;text-transform:none;font-weight:750;font-size:12px;opacity:.85}
.xg thead tr.s th{top:70px;height:24px;font-size:11.5px;font-weight:750;background:#f4f5fa;color:#30364f}
.xg th.hc,.xg td.hc{position:sticky;left:0;z-index:2;background:#e5484d;color:#fff;font-weight:850;font-size:15px;text-align:center;min-width:64px;width:64px;border-right:2px solid #05081a}
.xg thead th.hc{z-index:5;background:#c62f35}
.xg td.hc small{display:block;font-size:10.5px;font-weight:700;opacity:.9}
.xg tr.now td.hc{background:#05081a}
.xg tr.now td.hc::after{content:'hozir';display:block;font-size:10px;font-weight:800;color:#fbbf24}
.xg td.xc{min-width:168px;max-width:240px;height:62px;vertical-align:top;background:var(--cb);position:relative}
.xg thead tr.n th{min-width:168px}
.xg td.xc.gs,.xg th.gs{border-left:3px solid #05081a}
.xg tr.past td.xc{opacity:.62}
.xg td.xc > div{padding:5px 7px 6px;display:flex;flex-direction:column;gap:1px;height:100%}
.xg .xt{font-weight:850;font-size:15px;line-height:1.2;word-break:break-word}
.xg .xn{font-weight:750;font-size:12.5px;line-height:1.25}
.xg .xn a{color:inherit;text-decoration:none}
.xg .xs{font-size:11.5px;font-weight:650;color:#30364f;line-height:1.3}
.xg .xw{font-size:11px;font-weight:750;color:#1b1e66;line-height:1.3;margin-top:auto;padding-top:2px}
.xg .xr{font-size:11px;font-weight:800;color:#30364f}
.xg td.bk{box-shadow:inset 4px 0 0 #2b2f8f}
.xg td.bk.app{box-shadow:inset 4px 0 0 #d92d35}
.xg td.bk.s-in_progress{box-shadow:inset 4px 0 0 #0ca30c,inset 0 0 0 2px #0ca30c}
.xg td.bk.s-no_show .xt{text-decoration:line-through;text-decoration-thickness:2px}
.xg .st{display:inline-block;font-size:10.5px;font-weight:850;padding:1px 5px;border-radius:5px;margin-right:3px;vertical-align:1px}
.xg .st.in_progress{background:#0ca30c;color:#fff}.xg .st.no_show{background:#d03b3b;color:#fff}
.xg .st.completed{background:#5b6378;color:#fff}.xg .st.pending{background:#fab219;color:#05081a}.xg .st.confirmed{background:#2a78d6;color:#fff}
.xg td.multi > div{gap:4px}
.xg td.multi .it{background:rgba(255,255,255,.55);border-radius:6px;padding:3px 5px;display:flex;flex-direction:column;gap:1px}
.xg td.multi .xt{font-size:13.5px}.xg td.multi .xw{margin-top:0}
.xg td.nt{background:#e2e5ec;box-shadow:inset 4px 0 0 #5b6378}
.xg td.nt .xt{color:#1f2440}
.xg td.ow{background:#e4e7ee;background-image:repeating-linear-gradient(45deg,rgba(98,80,214,.18) 0 2px,transparent 2px 7px)}
.xg td.of{background:#ece7f8}
.xg td.cl{background:#e9ebf1;background-image:repeating-linear-gradient(135deg,rgba(20,24,51,.07) 0 2px,transparent 2px 7px)}
.xg td.ow > div,.xg td.of > div,.xg td.cl > div{align-items:center;justify-content:center;color:#5b6378;font-weight:750;font-size:12px}
.xg tfoot td{position:sticky;bottom:0;background:#f4f5fa;font-weight:800;font-size:12px;text-align:center;padding:6px 4px;z-index:2;color:#30364f}
.xg tfoot td.hc{z-index:4;background:#c62f35;color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .xg-scroll{background:#d9dce6}}
@media (max-width:520px){.xg td.xc,.xg thead tr.n th{min-width:146px;max-width:146px}.xg .xt{font-size:14px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><small>AVTODROM · NAZORAT</small><h1>Instruktorlar</h1></div>
    <div class="live"><i class="dot" id="dot"></i><span id="upd">yuklanmoqda…</span></div>
  </div>
  <div class="bar">
    <button class="nav" id="prev" aria-label="Oldingi kun">‹</button>
    <label class="day" title="Kunni tanlash"><b id="dayT">…</b><small id="daySub">kunni tanlash uchun bosing</small><input type="date" id="dayIn" aria-label="Kun"></label>
    <button class="nav" id="next" aria-label="Keyingi kun">›</button>
    <button class="today hidden" id="todayBtn">Bugun</button>
    <button class="see" id="allBtn">📋 Bronlarni ko‘rish</button>
  </div>
</header>

<main class="wrap" id="main">
  <div id="fail" class="hidden"></div>
  <div class="layout" id="lay">
    <section class="panel">
      <div class="panel-h"><h2>Hamma instruktorlar</h2><small id="listSub"></small></div>
      <input class="search" id="q" type="search" placeholder="Ism bo‘yicha qidirish" autocomplete="off" aria-label="Qidirish">
      <div id="list"><div class="empty-s">Yuklanmoqda…</div></div>
    </section>
    <aside class="panel free" id="free"></aside>
  </div>
  <p class="foot">Instruktorni bosing — uning Excel bron jadvali ochiladi · ma’lumot o‘zi yangilanadi · havolani begonalarga bermang</p>
</main>

<div class="ov hidden" id="ov" role="dialog" aria-modal="true">
  <div class="ov-box">
    <div class="ov-h"><div class="tt"><h2 id="ovT"></h2><small id="ovS"></small></div>
      <button class="dl" id="ovDl">⬇ Excel</button><button class="x" id="ovX" aria-label="Yopish">✕</button></div>
    <div class="ov-b" id="ovB">
      <div class="ov-lg"><span><i style="background:#2b2f8f"></i>ko‘k chiziq — Excel bron</span><span><i style="background:#d92d35"></i>qizil — Mini App, kassa, qo‘lda</span><span><i style="background:#0ca30c"></i>▶ darsda</span><span><i style="background:#d03b3b"></i>✕ kelmagan</span></div>
      <div class="xg-scroll" id="xgS"><table class="xg" id="xg"></table></div>
    </div>
  </div>
</div>
<script>
/* XL — brauzerda .xlsx yasash (admin panelning xl.js bilan bir xil) */
const XL = (() => {
  const enc = new TextEncoder();
  let CRC = null;
  function crc32(u8){
    if (!CRC) { CRC = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; CRC[n] = c >>> 0; } }
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  /** ZIP (siqmasdan — «stored»). Excel buni bemalol ochadi. */
  function zip(files){
    const parts = [], central = [];
    let off = 0;
    const d = new Date(), dt = ((d.getFullYear() - 1980) << 25) | ((d.getMonth() + 1) << 21) | (d.getDate() << 16) | (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    for (const f of files) {
      const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      const crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint32(10, dt, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint32(12, dt, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true);
      ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, off, true);
      central.push(new Uint8Array(ch.buffer), name);
      off += 30 + name.length + data.length;
    }
    const csize = central.reduce((a, x) => a + x.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, csize, true); end.setUint32(16, off, true);

  const gRow = `<tr class="g"><th class="hc" rowspan="3">Soat</th>${G.groups.map(g => { const gs = ci > 0; ci += g.n; return `<th colspan="${g.n}" class="${gs ? 'gs' : ''}" style="background:${grpColor(g.g)}">${esc(g.g)} TOIFA</th>`; }).join('')}</tr>`;
  const nRow = `<tr class="n">${G.cols.map(x => `<th class="${x.gs ? 'gs' : ''}" style="background:${x.color}">${esc(x.i.name)}${x.i.phone ? `<small>${esc(prettyTel(x.i.phone))}</small>` : ''}</th>`).join('')}</tr>`;
  const sRow = `<tr class="s">${G.cols.map(x => `<th class="${x.gs ? 'gs' : ''}">${x.i.day.off ? '🌙 dam' : `${x.i.stats.bron} bron · ${x.i.stats.load}%`}</th>`).join('')}</tr>`;
  const body = G.H.map((h, r) => `<tr class="${nowH != null && h < nowH ? 'past' : ''} ${h === nowH ? 'now' : ''}"><td class="hc">${h}:00</td>${G.cols.map(x => {
    const cell = x.cells[r], gs = x.gs ? ' gs' : '';
    if (cell.k === 'skip') return '';
    if (cell.k === 'bk') {
      const multi = cell.items.length > 1, b = cell.items[0];
      const cls = `xc bk${multi ? ' multi' : ''} s-${esc(b.status)}${b.sheet ? '' : ' app'}${gs}`;
      const inner = multi ? cell.items.map(it => `<div class="it">${xlItem(it, d, false)}</div>`).join('')
        : `${cell.span > 1 ? `<span class="xr">${fmtHm(b.start)}–${fmtHm(b.end)} · ${dur(b.min)}</span>` : (dayMin(b.start, d.date) % 60 || b.min < 60 ? `<span class="xr">${fmtHm(b.start)}–${fmtHm(b.end)}</span>` : '')}${xlItem(b, d, true)}`;
      return `<td class="${cls}" ${cell.span > 1 ? `rowspan="${cell.span}"` : ''} style="--cb:${tintHex(x.color, 0.9)}"><div>${inner}</div></td>`;
    }
    if (cell.k === 'note') return `<td class="xc nt${gs}"><div><span class="xt">${esc(cell.note.t)}</span>${cell.note.by ? `<span class="xw">✍ ${esc(cell.note.by)}${cell.note.at ? ' · ' + esc(whenShort(cell.note.at, d.date)) : ''}</span>` : ''}</div></td>`;
    if (cell.k === 'own') return `<td class="xc ow${gs}"><div>🔒 yopiq</div></td>`;
    if (cell.k === 'off') return `<td class="xc of${gs}"><div>dam</div></td>`;
    if (cell.k === 'cl') return `<td class="xc cl${gs}"><div>${cell.mid ? 'tanaffus' : '—'}</div></td>`;
    return `<td class="xc${gs}" style="--cb:${tintHex(x.color, 0.16)}"><div></div></td>`;
  }).join('')}</tr>`).join('');
  const foot = `<tfoot><tr><td class="hc">Jami</td>${G.cols.map(x => `<td class="${x.gs ? 'gs' : ''}">${x.i.stats.bron} bron · ${hrs(x.i.stats.booked_min)} s</td>`).join('')}</tr></tfoot>`;
  $('xg').innerHTML = `<thead>${gRow}${nRow}${sRow}</thead><tbody>${body}</tbody>${foot}`;
  if (nowH != null && !S.xlScrolled) {
    S.xlScrolled = true;
    const tr = $('xg').querySelector('tr.now'), box = $('xgS'), th = $('xg').tHead;
    const prev = tr?.previousElementSibling || tr;
    if (tr && box) box.scrollTop = Math.max(0, prev.offsetTop - (th ? th.offsetHeight : 0));
  }
}
/** Yuklab olinadigan .xlsx — ekrandagi jadval bilan bir xil */
function downloadXlsx(only){
  const d = S.data; if (!d || typeof XL === 'undefined') return;
  const G0 = sheetGrid(d);
  const G = only ? { ...G0, cols: G0.cols.filter(x => x.i.id === only).map(x => ({ ...x, gs: false })) } : G0;
  if (only && G.cols[0]) G.groups = [{ g: G.cols[0].i.group, n: 1 }];
  const n = G.cols.length, rows = [], merges = [];
  if (!n) return;
  const INK = '05081A', SEP = { left: '05081A', lstyle: 'thick' };
  const hex = c => c.replace('#', '').toUpperCase();
  rows.push({ h: 30, cells: [{ v: `Excel bron — ${dayHead(d.date)} (${WDF[wdOf(d.date)]})`, st: { bold: true, size: 16, color: '1B1E66', grid: 'FFFFFF' } }] }); merges.push(`A1:${XL.col(n)}1`);
  const g = [{ v: 'Soat', st: { fill: 'C62F35', bold: true, size: 13, color: 'FFFFFF', align: 'center' } }]; let ci = 1;
  for (const x of G.groups) {
    for (let k = 0; k < x.n; k++) g[ci + k] = { v: k ? '' : `${x.g} toifa`.toUpperCase(), st: { fill: hex(grpColor(x.g)), bold: true, size: 12, color: 'FFFFFF', align: 'center', ...(ci > 1 ? SEP : {}) } };
    if (x.n > 1) merges.push(`${XL.col(ci)}2:${XL.col(ci + x.n - 1)}2`); ci += x.n;
  }
  rows.push({ h: 22, cells: g });
  rows.push({ h: 34, cells: [{ v: '', st: { fill: 'C62F35' } }, ...G.cols.map(x => ({ v: x.i.name.toUpperCase(), st: { fill: hex(x.color), bold: true, size: 12, color: INK, align: 'center', wrap: true, ...(x.gs ? SEP : {}) } }))] });
  rows.push({ h: 22, cells: [{ v: '', st: { fill: 'C62F35' } }, ...G.cols.map(x => ({ v: [x.i.phone ? prettyTel(x.i.phone) : '', x.i.day.off ? 'dam' : `${x.i.stats.bron} bron · ${x.i.stats.load}%`].filter(Boolean).join(' · '), st: { fill: hex(tintHex(x.color, 0.6)), bold: true, size: 11, color: INK, align: 'center', ...(x.gs ? SEP : {}) } }))] });
  merges.push('A2:A4');
  const R0 = rows.length;
  const grid = G.H.map(h => [{ v: `${h}:00`, st: { fill: 'E5484D', bold: true, size: 14, color: 'FFFFFF', align: 'center', grid: 'F3A3A6' } }]);
  const txt = b => [b.t || (b.phone ? prettyTel(b.phone) : b.name), b.t || b.phone ? b.name : '',
    [b.status !== 'confirmed' ? (BS[b.status] || ['', b.status])[1] : '', b.code, b.cat ? b.cat + ' toifa' : '', dur(b.min), b.paid ? 'to‘langan' : ''].filter(Boolean).join(' · '),
    whoTxt(b, d.date)].filter(Boolean).join('\n');
  G.cols.forEach((x, c) => {
    const base = { bold: true, size: 11, color: INK, wrap: true, indent: 1, ...(x.gs ? SEP : {}) };
    G.H.forEach((h, r) => {
      const cell = x.cells[r];
      let v = '', st = { ...base, fill: hex(tintHex(x.color, 0.16)) };
      if (cell.k === 'skip') { st = null; }
      else if (cell.k === 'bk') {
        const b = cell.items[0];
        v = cell.items.length > 1 ? cell.items.map(it => `${fmtHm(it.start)}–${fmtHm(it.end)} ${txt(it)}`).join('\n\n')
          : `${cell.span > 1 || dayMin(b.start, d.date) % 60 || b.min < 60 ? `${fmtHm(b.start)}–${fmtHm(b.end)}\n` : ''}${txt(b)}`;
        st = { ...base, fill: hex(tintHex(x.color, 0.9)), left: b.status === 'in_progress' ? '0CA30C' : b.sheet ? '2B2F8F' : 'D92D35' };
        if (cell.span > 1) merges.push(`${XL.col(c + 1)}${R0 + r + 1}:${XL.col(c + 1)}${R0 + r + cell.span}`);
      }
      else if (cell.k === 'note') { v = `${cell.note.t}${cell.note.by ? '\n✍ ' + cell.note.by : ''}`; st = { ...base, fill: 'E2E5EC', left: '5B6378', color: '1F2440' }; }
      else if (cell.k === 'own') { v = 'yopiq'; st = { ...base, fill: 'E4E7EE', color: '4B5368', align: 'center' }; }
      else if (cell.k === 'off') { v = 'dam'; st = { ...base, fill: 'ECE7F8', color: '5E4D8F', align: 'center', bold: false }; }
      else if (cell.k === 'cl') { v = cell.mid ? 'tanaffus' : '—'; st = { ...base, fill: 'E9EBF1', color: '5B6378', align: 'center', bold: false }; }
      grid[r][c + 1] = st ? { v, st } : { v: '', st: grid[r - 1]?.[c + 1]?.st || base };
    });
  });
  grid.forEach(cells => rows.push({ h: 64, cells }));
  rows.push({ h: 8, cells: [] });
  rows.push({ h: 20, cells: [{ v: `Nazorat paneli · yuklab olindi ${fmtHms(new Date())}. Katakda: kimga, telefon, holat, kod, toifa, davomiylik va kim yozgani. Chap chiziq: ko‘k — Excel bron, qizil — Mini App / kassa / qo‘lda, yashil — darsda.`, st: { size: 11, color: '4B5368', grid: 'FFFFFF' } }] });
  merges.push(`A${rows.length}:${XL.col(n)}${rows.length}`);
  const blob = XL.book([{ name: 'Excel bron', rows, merges, cols: [9, ...Array(n).fill(31)], freeze: { x: 1, y: 4 } }]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `excel-bron-${only ? (G.cols[0]?.i.name || 'instruktor').replace(/[^\p{L}\d]+/gu, '-') + '-' : ''}${d.date}.xlsx`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}


/* ---------- server ---------- */
async function load(quiet){
  if (!K) return fail('Havola to‘liq emas', 'Havolada maxfiy kalit yo‘q. Admin panel → «Nazorat paneli» dan havolani qayta nusxalang.');
  const seq = ++S.seq;
  if (!quiet) $('main').classList.add('busy');
  try{
    const r = await fetch(`/api/control-view?k=${encodeURIComponent(K)}${S.d ? `&d=${S.d}` : ''}`, { cache: 'no-store', headers: { Accept: 'application/json' } });
    let d = {}; try { d = await r.json(); } catch { /* bo'sh */ }
    if (seq !== S.seq) return;
    if (r.status === 403) return fail('Havola ishlamaydi', d.error || 'Havola eskirgan yoki noto‘g‘ri.');
    if (!r.ok || d.ok === false) throw Error(d.error || `Xato (${r.status})`);
    S.data = d; S.d = d.date; S.last = Date.now();
    $('dot').classList.remove('off');
    $('fail').classList.add('hidden'); $('lay').classList.remove('hidden');
    paint();
  }catch(e){
    if (seq !== S.seq) return;
    $('dot').classList.add('off');
    $('upd').textContent = S.data ? 'aloqa yo‘q — eski ma’lumot' : 'aloqa yo‘q';
    if (!S.data) fail('Ma’lumot yuklanmadi', e.message || 'Internetni tekshiring', true);
  }finally{ if (seq === S.seq) $('main').classList.remove('busy'); }
}
function fail(title, text, retry){
  $('lay').classList.add('hidden');
  const f = $('fail'); f.classList.remove('hidden');
  f.innerHTML = `<div class="msg"><div class="ic">${retry ? '📡' : '🔒'}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${retry ? '<button id="retry">Qayta urinish</button>' : ''}</div>`;
  if (retry) $('retry').onclick = () => load();
  $('upd').textContent = '—';
}
function syncUrl(){
  const u = new URL(location.href);
  if (S.d && S.d !== ymdNow()) u.searchParams.set('d', S.d); else u.searchParams.delete('d');
  history.replaceState(history.state, '', u.toString());
}
function setDay(ymd){
  S.d = ymd; S.xlScrolled = false;
  if (S.data && S.data.date !== ymd) $('dayT').textContent = dayHead(ymd);
  syncUrl(); load();
}

/* ---------- chizish ---------- */
/** Excel bron tartibi: toifa guruhi, keyin ism */
const ordered = d => [...d.instructors].sort((a, b) => a.categories.join(', ').localeCompare(b.categories.join(', ')) || a.name.localeCompare(b.name, 'uz'));
function paint(){
  const d = S.data; if (!d) return;
  $('dayT').textContent = dayHead(d.date);
  $('daySub').textContent = `${rel(d.date) ? WDF[wdOf(d.date)] + ' · ' : ''}jami ${d.stats.bron} bron · ${d.stats.instructors} instruktor`;
  $('dayIn').value = d.date;
  $('todayBtn').classList.toggle('hidden', d.date === d.today);
  $('upd').textContent = `Yangilandi ${fmtHms(new Date())}`;
  paintList(); paintFree();
  if (S.ov) paintOv();
}
function paintList(){
  const d = S.data, q = S.q.trim().toLowerCase();
  const all = ordered(d);
  const list = all.filter(i => !q || i.name.toLowerCase().includes(q));
  $('listSub').textContent = `${all.length} ta · ${rel(d.date) ? rel(d.date).toLowerCase() : dd(d.date)} bronlari`;
  $('list').innerHTML = list.length ? list.map(i => {
    const n = i.stats.bron, off = i.day.off && !n;
    return `<button class="ir" data-ins="${esc(i.id)}"><span class="ava">${esc(ini(i.name))}</span>
      <span class="nm">${esc(i.name)}${i.active ? '' : '<small>faol emas</small>'}</span>
      <span class="cnt ${off ? 'off' : n ? '' : 'z'}" title="${off ? 'dam olish kuni' : n + ' ta bron'}">${off ? 'dam' : n}</span><span class="chev">›</span></button>`;
  }).join('') : `<div class="empty-s">${all.length ? 'Topilmadi' : 'Instruktorlar yo‘q'}</div>`;
}
/** Hozir bo'sh: ish vaqtida, broni yo'q, chek urilmagan (darsda emas) */
function paintFree(){
  const d = S.data, box = $('free');
  if (d.date !== d.today) {
    box.innerHTML = `<div class="panel-h"><h2>🟢 Hozir bo‘sh</h2></div><div class="empty-s">Real vaqt faqat bugun uchun.<br><br><button class="see" id="goToday" style="height:40px;padding:0 14px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:800">Bugunga qaytish</button></div>`;
    $('goToday').onclick = () => setDay(ymdNow());
    return;
  }
  const free = ordered(d).filter(i => i.now?.state === 'free');
  box.innerHTML = `<div class="panel-h"><h2>🟢 Hozir bo‘sh</h2><small>${free.length} ta · ${fmtHm(d.now)}</small></div>
    <div class="note">Hozir ish vaqtida, broni yo‘q va chek urilmagan instruktorlar</div>
    ${free.length ? free.map(i => {
      const nx = i.now.next, t = tel(i.phone);
      const sub = nx ? `keyingi bron ${fmtHm(nx.start)} · ${minsTo(nx.start, d.now)}` : 'bugun boshqa broni yo‘q';
      return `<div class="fr" role="button" tabindex="0" data-ins="${esc(i.id)}"><i class="gd"></i><span class="nm">${esc(i.name)}<small>${esc(sub)}</small></span>${t ? `<a href="tel:${t}" aria-label="Qo‘ng‘iroq: ${esc(i.name)}" data-stop="1">📞</a>` : ''}</div>`;
    }).join('') : '<div class="empty-s">Hozir bo‘sh instruktor yo‘q — hammasi darsda, bronli yoki ish vaqtidan tashqarida.</div>'}`;
}
const minsTo = (iso, nowIso) => { const m = Math.max(0, Math.round((Date.parse(iso) - Date.parse(nowIso)) / 60000)), h = Math.floor(m / 60), r = m % 60; return m < 60 ? `${m} daqiqadan keyin` : r ? `${h} soat ${r} daqiqadan keyin` : `${h} soatdan keyin`; };

/* ---------- oyna: Excel bron (bitta instruktor yoki hammasi) ---------- */
function openOv(id){
  const was = !!S.ov;
  S.ov = id || 'all'; S.xlScrolled = false;
  if (!was) history.pushState({ ov: 1 }, '', location.href);
  $('ov').classList.remove('hidden'); document.body.style.overflow = 'hidden';
  paintOv();
  $('ovX').focus();
}
function closeOv(fromPop){
  if (!S.ov) return;
  S.ov = null; $('ov').classList.add('hidden'); document.body.style.overflow = '';
  if (!fromPop && history.state?.ov) history.back();
}
function paintOv(){
  const d = S.data; if (!d || !S.ov) return;
  const box = $('xgS'), y = box.scrollTop, x = box.scrollLeft;
  if (S.ov === 'all') {
    $('ovT').textContent = `Bronlar — ${dayHead(d.date)}`;
    $('ovS').textContent = `${d.stats.bron} bron · ${d.stats.instructors} instruktor${d.sheet?.updated_at ? ` · Excel oxirgi marta ${whenShort(d.sheet.updated_at, d.date)}${d.sheet.updated_by ? ' (' + d.sheet.updated_by + ')' : ''}` : ''}`;
    $('ovB').classList.remove('one');
    paintExcel();
  } else {
    const i = d.instructors.find(x => x.id === S.ov);
    if (!i) return closeOv();
    $('ovT').textContent = i.name;
    $('ovS').textContent = `${dayHead(d.date)} · ${i.stats.bron} bron${i.day.off ? ' · dam olish kuni' : i.day.open.length ? ' · ish vaqti ' + full(i.day.open) : ''}${i.phone ? ' · ' + prettyTel(i.phone) : ''}`;
    $('ovB').classList.add('one');
    paintExcel(i.id);
  }
  if (S.xlScrolled && (y || x)) { box.scrollTop = y; box.scrollLeft = x; }
}

/* ---------- bosishlar ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]')) return;
  const ins = e.target.closest('[data-ins]');
  if (ins && !ins.closest('#ov')) { openOv(ins.dataset.ins); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.ov) { e.preventDefault(); closeOv(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('fr')) { e.preventDefault(); openOv(e.target.dataset.ins); }
});
$('ov').addEventListener('click', e => { if (e.target === $('ov')) closeOv(); });
$('ovX').onclick = () => closeOv();
$('ovDl').onclick = () => { try { downloadXlsx(S.ov && S.ov !== 'all' ? S.ov : null); } catch (err) { alert('Excel fayl tayyorlanmadi: ' + (err?.message || err)); } };
$('allBtn').onclick = () => openOv('all');
window.addEventListener('popstate', () => { if (S.ov) closeOv(true); });
$('prev').onclick = () => setDay(addDays(S.data?.date || S.d || ymdNow(), -1));
$('next').onclick = () => setDay(addDays(S.data?.date || S.d || ymdNow(), 1));
$('todayBtn').onclick = () => setDay(ymdNow());
$('dayIn').onchange = e => { if (/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) setDay(e.target.value); };
let qT = 0;
$('q').addEventListener('input', e => { S.q = e.target.value; clearTimeout(qT); qT = setTimeout(() => S.data && paintList(), 100); });

/* ---------- jonli yangilanish (har 20 soniyada) ---------- */
setInterval(() => { if (!document.hidden && Date.now() - S.last > 19000) load(true); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - S.last > 10000) load(true); });
window.addEventListener('online', () => load(true));
let lastToday = ymdNow();
setInterval(() => { const t = ymdNow(); if (t !== lastToday) { if (S.d === lastToday) S.d = t; lastToday = t; load(true); } }, 60000);

load();
})();
