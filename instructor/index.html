<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Avtodrom — Instruktor</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#07111f;color:#eef5ff}button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;min-height:100vh;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:22px;font-weight:800}.badge{padding:7px 11px;border-radius:999px;background:#12345b;color:#80c7ff;font-size:12px}.hero,.card{background:#0d1b2e;border:1px solid #1b3452;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px #0003}.hero h1{margin:0 0 7px;font-size:25px}.muted{color:#91a7c0;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{background:#10243c;border-radius:14px;padding:13px}.stat b{display:block;font-size:23px;margin-bottom:3px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section-title h2{font-size:18px;margin:0}.booking{border:1px solid #1b3452;border-radius:16px;padding:15px;margin-bottom:10px;background:#0a1728}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.time{font-size:20px;font-weight:800}.status{font-size:12px;padding:6px 9px;border-radius:999px;background:#20334a}.pending{color:#ffd36e}.confirmed{color:#72e0a5}.in_progress{color:#70c7ff}.cancelled,.no_show{color:#ff8d8d}.completed{color:#b7a5ff}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions button{padding:9px 12px;border-radius:10px;background:#17385d;color:#fff}.actions .ok{background:#15734b}.actions .danger{background:#71313b}.empty{text-align:center;padding:24px;color:#8096ae}.nav{position:sticky;bottom:10px;background:#0d1b2eeb;border:1px solid #1b3452;border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.nav button{background:transparent;color:#9bb0c8;padding:10px;border-radius:12px}.nav button.active{background:#17385d;color:#fff}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#152a43;padding:12px 16px;border-radius:12px;display:none;z-index:5}.error{color:#ff9b9b}.loading{opacity:.65}
</style></head>
<body><main class="app">
<header class="top"><div class="brand">🚗 Avtodrom</div><div class="badge">INSTRUKTOR</div></header>
<section class="hero"><h1 id="name">Instruktor</h1><div class="muted" id="profile">Telegram orqali kirish tekshirilmoqda...</div><div class="stats"><div class="stat"><b id="today">0</b><span class="muted">Bugun</span></div><div class="stat"><b id="upcoming">0</b><span class="muted">Kutilmoqda</span></div><div class="stat"><b id="done">0</b><span class="muted">Yakunlangan</span></div></div></section>
<div class="section-title"><h2 id="title">Mashg‘ulotlar</h2><button id="refresh" class="badge">Yangilash</button></div>
<section id="list" class="card loading"><div class="empty">Yuklanmoqda...</div></section>
<nav class="nav"><button class="active" data-filter="all">📅 Barchasi</button><button data-filter="today">☀️ Bugun</button><button data-filter="notifications">🔔 Xabarlar</button></nav>
</main><div id="toast" class="toast"></div>
<script>
const API=window.AVTODROM_API_URL||'';let profile=null,bookings=[],filter='all';
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
function headers(){const h={'Content-Type':'application/json'};const init=tg?.initData;if(init)h['x-telegram-init-data']=init;return h}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Xatolik');return d}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
function statusText(s){return ({pending:'Kutilmoqda',confirmed:'Tasdiqlangan',in_progress:'Boshlangan',completed:'Yakunlangan',cancelled:'Bekor qilingan',no_show:'Kelmagan'})[s]||s}
function fmt(d){return new Date(d).toLocaleString('uz-UZ',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function render(){const list=document.getElementById('list');let arr=[...bookings];const now=new Date();if(filter==='today')arr=arr.filter(b=>new Date(b.start_at).toDateString()===now.toDateString());if(filter==='notifications'){list.innerHTML='<div class="empty">🔔 Notificationlar alohida bo‘lim sifatida ulanadi.</div>';return}if(!arr.length){list.innerHTML='<div class="empty">Hozircha mashg‘ulot yo‘q.</div>';return}list.innerHTML=arr.map(b=>{const customer=b.customer||{};const car=b.car||{};return `<article class="booking"><div class="row"><div><div class="time">${fmt(b.start_at)}</div><div class="muted">${fmt(b.start_at)} — ${fmt(b.end_at)}</div></div><span class="status ${b.status}">${statusText(b.status)}</span></div><div style="margin-top:10px"><b>👤 ${customer.first_name||'O‘quvchi'} ${customer.last_name||''}</b><div class="muted">🚗 ${car.model||'Avtomobil tanlanmagan'} ${car.plate_number||''}</div></div>${actions(b)}</article>`}).join('')}
function actions(b){if(['cancelled','completed','no_show'].includes(b.status))return '';let a='';if(b.status==='pending')a+=`<button class="ok" onclick="setStatus('${b.id}','confirmed')">✓ Tasdiqlash</button>`;if(b.status==='confirmed')a+=`<button class="ok" onclick="setStatus('${b.id}','in_progress')">▶ Boshlash</button>`;if(b.status==='in_progress')a+=`<button class="ok" onclick="setStatus('${b.id}','completed')">✓ Yakunlash</button>`;a+=`<button class="danger" onclick="setStatus('${b.id}','cancelled')">Bekor qilish</button>`;if(b.status==='confirmed')a+=`<button onclick="setStatus('${b.id}','no_show')">Kelmagan</button>`;return `<div class="actions">${a}</div>`}
async function load(){document.getElementById('list').classList.add('loading');try{const me=await api('/api/me');profile=me.profile;document.getElementById('name').textContent=((profile.first_name||'')+' '+(profile.last_name||'')).trim()||'Instruktor';document.getElementById('profile').textContent=profile.username?'@'+profile.username:'Instruktor profili';const d=await api('/api/bookings');bookings=d.bookings||[];const today=new Date().toDateString();document.getElementById('today').textContent=bookings.filter(b=>new Date(b.start_at).toDateString()===today).length;document.getElementById('upcoming').textContent=bookings.filter(b=>new Date(b.start_at)>new Date()&&!['cancelled','completed','no_show'].includes(b.status)).length;document.getElementById('done').textContent=bookings.filter(b=>b.status==='completed').length;render()}catch(e){document.getElementById('list').innerHTML='<div class="empty error">'+e.message+'<br><small>Telegram Mini App initData tekshirilishi kerak.</small></div>'}finally{document.getElementById('list').classList.remove('loading')}}
async function setStatus(id,status){try{await api('/api/bookings/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});toast('Bron holati yangilandi');await load()}catch(e){toast(e.message)}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});document.getElementById('refresh').onclick=load;load();setInterval(load,30000);
</script><script src="https://telegram.org/js/telegram-web-app.js"></script></body></html>
