<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVTODROM — Instruktor ro‘yxatdan o‘tish</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#14221b;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dfe7e2;border-radius:18px;padding:20px;box-shadow:0 8px 28px #0000000a}.logo{font-weight:900;font-size:21px;color:#087443;margin-bottom:18px}.logo span{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:#087443;color:#fff;margin-right:8px}.muted{color:#6d7b74}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;font-weight:800}.field input,.field textarea{width:100%;padding:12px;border:1px solid #d7e1db;border-radius:10px;font:inherit}.btn{width:100%;border:0;border-radius:11px;padding:13px;background:#087443;color:#fff;font-weight:900;font-size:15px}.error{background:#fff0ef;color:#a32319;padding:10px;border-radius:10px;margin:10px 0;display:none}.success{background:#eaf7f0;color:#087443;padding:13px;border-radius:10px;margin-top:14px;display:none}
</style></head>
<body><div class="wrap"><div class="logo"><span>A</span>AVTODROM</div><div class="card"><h2>👨‍🏫 Instruktor bo‘lish</h2><p class="muted">Arizangizni yuboring. Admin tasdiqlaganidan keyin Instructor Mini Appga kirishingiz mumkin.</p><div id="error" class="error"></div><form id="form"><div class="field"><label>Ism *</label><input id="firstName" required placeholder="Ismingiz"></div><div class="field"><label>Familiya *</label><input id="lastName" required placeholder="Familiyangiz"></div><div class="field"><label>Telefon raqami *</label><input id="phone" required placeholder="+998 90 123 45 67" inputmode="tel"></div><div class="field"><label>Tajriba (yil)</label><input id="experienceYears" type="number" min="0" max="60" placeholder="Masalan: 3"></div><div class="field"><label>O‘zingiz haqingizda</label><textarea id="message" rows="4" placeholder="Tajriba, toifa yoki qo‘shimcha ma’lumot..."></textarea></div><button class="btn" id="submit">📝 Ariza yuborish</button></form><div id="success" class="success">✅ Arizangiz yuborildi! Admin ko‘rib chiqadi. Tasdiqlangandan keyin Telegram orqali xabar keladi.</div></div></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const $=id=>document.getElementById(id); const error=$('error'); const success=$('success');
async function loadStatus(){try{const r=await fetch('/api/instructor/registration',{headers:{'x-telegram-init-data':tg?.initData||''}});const d=await r.json();if(d.ok&&d.registration?.status==='PENDING'){ $('form').style.display='none';success.style.display='block';success.textContent='⏳ Arizangiz allaqachon yuborilgan. Admin tasdiqlashini kuting.';}else if(d.ok&&d.registration?.status==='APPROVED'){location.href='./index.html';}}catch(e){}}
$('form').addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';const btn=$('submit');btn.disabled=true;btn.textContent='Yuborilmoqda...';try{const initData=tg?.initData||'';if(!initData)throw new Error('Telegram Mini App ichidan oching.');const body={firstName:$('firstName').value.trim(),lastName:$('lastName').value.trim(),phone:$('phone').value.trim(),experienceYears:$('experienceYears').value?Number($('experienceYears').value):null,message:$('message').value.trim()||null};const r=await fetch('/api/instructor/registration',{method:'POST',headers:{'content-type':'application/json','x-telegram-init-data':initData},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Ariza yuborilmadi');$('form').style.display='none';success.style.display='block';}catch(e){error.textContent='❌ '+e.message;error.style.display='block';btn.disabled=false;btn.textContent='📝 Ariza yuborish';}});loadStatus();
</script></body></html>
