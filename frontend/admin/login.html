<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16A34A">
<title>AVTODROM — Admin kirish</title>
<style>
:root{--g:#16A34A;--g2:#15803D;--bg:#F7FAF8;--t:#17201B;--m:#718078;--b:#DDE7E0;--r:#C62828}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(430px,100%);background:#fff;border:1px solid var(--b);border-radius:24px;padding:32px}
.logo{width:52px;height:52px;border-radius:15px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900;font-size:23px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 7px;letter-spacing:-.03em}
p{margin:0;color:var(--m);font-size:14px;line-height:1.5}
.field{margin-top:20px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.field input{width:100%;height:50px;border:1.5px solid var(--b);border-radius:12px;padding:0 14px;font-size:15px;outline:none;background:#fff}
.field input:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(22,163,74,.10)}
.btn{width:100%;height:52px;border:0;border-radius:13px;background:var(--g);color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:22px}
.btn:hover{background:var(--g2)}.btn:disabled{opacity:.6;cursor:wait}
.error{display:none;margin-top:14px;padding:11px 12px;border-radius:10px;background:#FFF1F1;color:var(--r);font-size:13px;font-weight:700;line-height:1.45}
.hint{margin-top:18px;text-align:center;font-size:12px;color:#8A958E}
.status{margin-top:12px;text-align:center;font-size:12px;color:#6B7A71;min-height:18px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">A</div>
  <h1>Admin panel</h1>
  <p>Chrome yoki Telegram ichidan kirish mumkin. Admin login va parolingizni kiriting.</p>
  <form id="form" autocomplete="on">
    <div class="field"><label for="login">Login</label><input id="login" name="username" autocomplete="username" required></div>
    <div class="field"><label for="password">Parol</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <div id="error" class="error"></div>
    <button id="btn" class="btn" type="submit">Kirish</button>
    <div id="status" class="status"></div>
  </form>
  <div class="hint">AVTODROM boshqaruv tizimi · xavfsiz admin sessiya</div>
</main>
<script>
(function(){
  const f=document.getElementById('form');
  const b=document.getElementById('btn');
  const e=document.getElementById('error');
  const s=document.getElementById('status');
  const SESSION_KEY='avtodrom_admin_master_session_v1';

  function setUiError(msg){e.textContent=msg||'Serverga ulanishda xatolik';e.style.display='block';}
  function clearError(){e.textContent='';e.style.display='none';}
  function setLocalAdminSession(){
    localStorage.setItem(SESSION_KEY,JSON.stringify({at:Date.now(),exp:Date.now()+8*60*60*1000,secondFactor:true,source:'server-login'}));
  }

  f.addEventListener('submit',async function(ev){
    ev.preventDefault();
    clearError();
    s.textContent='Server tekshirilmoqda...';
    b.disabled=true;b.textContent='Kirilmoqda...';
    try{
      const r=await fetch('/api/admin/login',{
        method:'POST',credentials:'include',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({login:document.getElementById('login').value.trim(),password:document.getElementById('password').value})
      });
      const text=await r.text();
      let d={};try{d=JSON.parse(text)}catch(_){ }
      if(!r.ok) throw new Error(d.error||d.message||('Server xatosi '+r.status));
      if(!d.ok) throw new Error(d.error||'Admin autentifikatsiyasi muvaffaqiyatsiz');
      setLocalAdminSession();
      s.textContent='Muvaffaqiyatli. Panel ochilmoqda...';
      window.location.replace('/admin/dashboard');
    }catch(err){
      setUiError(err&&err.message?err.message:'Serverga ulanishda xatolik');
      s.textContent='';
      b.disabled=false;b.textContent='Kirish';
    }
  });
})();
</script>
</body>
</html>
