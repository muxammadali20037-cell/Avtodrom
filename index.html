<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E3192">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AVTODROM">
<title>AVTODROM — Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{/* TASH INDEX AVTODROM — brend ranglari (logotipdan) */
 --brand:#2E3192;      /* asosiy navy */
 --brand2:#4348C4;     /* yorug'roq */
 --brand-soft:#EEF0FB; /* och fon */
 --dark:#12143A;
 --bg:#f4f5fa;--card:#fff;--text:#15173a;--muted:#6f739b;--line:#e2e4f2;
 --danger:#c93232;--warning:#b77a00;--blue:#2f63a8;--gold:#b8860b;
 --shadow:0 12px 35px rgba(20,25,80,.09);--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}a{text-decoration:none;color:inherit}
.app{min-height:100vh;padding-bottom:86px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:auto;height:68px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:950;letter-spacing:.02em;border:0;background:transparent;padding:0;color:inherit}
.logo-mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,var(--brand),#1B1E66);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 7px 18px rgba(46,49,146,.28)}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:12px;display:grid;place-items:center;position:relative}
.langmenu{display:none;position:absolute;right:0;top:48px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-width:170px;z-index:70}
.langmenu.open{display:block}
.langmenu button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:#fff;text-align:left;padding:12px 14px;font-weight:800;font-size:13px}
.langmenu button:hover{background:#f3f7f5}
.langmenu button.on{background:var(--brand-soft);color:var(--brand)}
.dot{position:absolute;right:7px;top:6px;width:8px;height:8px;border-radius:50%;background:#e43c3c;border:2px solid #fff}
.container{max-width:1180px;margin:auto;padding:18px}
.hero{position:relative;overflow:hidden;border-radius:26px;min-height:320px;display:flex;align-items:center;background:linear-gradient(135deg,#12143A 0%,#22267A 45%,#2E3192 100%);color:#fff;box-shadow:var(--shadow);margin-bottom:18px}
.hero-art{position:absolute;inset:0;z-index:0;pointer-events:none}
.hero-art svg{position:absolute;right:0;bottom:0;height:100%;width:auto;min-width:520px;opacity:.9}
.hero-photo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .5s}
.hero-photo.on{opacity:1}
.hero-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(14,16,52,.95) 0%,rgba(22,25,90,.82) 48%,rgba(46,49,146,.32) 100%)}
.hero-content{position:relative;z-index:2;padding:38px;max-width:640px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:900;opacity:.8}
.hero h1{font-size:clamp(28px,5vw,48px);line-height:1.04;margin:10px 0}
.hero p{color:#d4e8df;max-width:580px;font-size:15px;line-height:1.6;margin:0}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.primary{border:0;background:#fff;color:var(--brand);border-radius:13px;padding:12px 17px;font-weight:900}
.primary.solid{background:var(--brand);color:#fff}
.secondary{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:13px;padding:11px 15px;font-weight:800}
.danger{border:1px solid #f0cfcf;background:#fff;color:var(--danger);border-radius:13px;padding:11px 15px;font-weight:800}
.ghost{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:13px;padding:11px 15px;font-weight:800}
.section{margin:25px 0}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:13px;flex-wrap:wrap}
.section-head h2{margin:0;font-size:21px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.feature{padding:17px}
.feature-icon{width:44px;height:44px;border-radius:13px;background:var(--brand-soft);display:grid;place-items:center;font-size:20px;margin-bottom:13px}
.feature b{font-size:15px}.feature p{color:var(--muted);font-size:12px;line-height:1.5;margin:6px 0 0}
.instructor-card{overflow:hidden}
.instructor-head{height:100px;background:linear-gradient(135deg,#2E3192,#4348C4);display:flex;align-items:center;gap:13px;padding:0 16px}
.ini{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:21px;font-weight:950;color:#fff;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.32);flex:none}
.instructor-head .nm{color:#fff;font-weight:900;font-size:16px;line-height:1.25}
.instructor-head .rt{color:#d6f0e3;font-size:12px;font-weight:800;margin-top:3px}
.instructor-body{padding:15px}
.meta{font-size:12px;color:var(--muted);line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0}
.tag{background:#f1f5f3;color:#496057;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}
.card-actions{display:flex;gap:7px;margin-top:13px}.card-actions>*{flex:1}
.booking-box{padding:18px}
.steps{display:flex;gap:6px;margin-bottom:18px}
.step{flex:1;text-align:center;font-size:10px;font-weight:900;color:var(--muted);padding:8px;border-radius:9px;background:#f3f6f4}
.step.active{background:var(--brand-soft);color:var(--brand)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:2px}
.field label{display:block;font-size:11px;font-weight:900;color:#53635b;margin-bottom:6px}
.field input,.field textarea,.field select,.search{width:100%;border:1px solid #d7dae9;background:#fff;border-radius:12px;padding:12px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus,.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(46,49,146,.10)}
.full{grid-column:1/-1}
.courses{display:grid;gap:9px}
.course{border:1px solid #d7dae9;border-radius:13px;padding:13px;display:flex;justify-content:space-between;align-items:center;gap:11px;text-align:left;background:#fff;width:100%}
.course.on{border-color:var(--brand);background:#f4f5fd;box-shadow:0 0 0 3px rgba(46,49,146,.09)}
.course b{display:block;font-size:14px}.course .sub{font-size:11px;color:var(--muted);margin-top:3px}
.course .price{font-weight:950;color:var(--brand);white-space:nowrap;font-size:15px}
.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.time{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 5px;text-align:center;font-size:12px;font-weight:900}
.time.selected{background:var(--brand);color:#fff;border-color:var(--brand)}
.time.busy{text-decoration:line-through;color:#a5aea9;background:#f4f5f5}
.booking-summary{background:#f5f6fd;border:1px solid #dfe2f5;border-radius:14px;padding:14px;margin-top:14px;font-size:13px;line-height:1.7}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-size:11px;font-weight:900}
.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.booking-card{padding:15px}
.booking-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.status{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;background:#edf4f0;color:#216548}
.status.pending{background:#fff5d8;color:#9b6900}
.status.confirmed{background:#e9ebfb;color:#2E3192}
.status.in_progress{background:#e6ecff;color:#2a49a8}
.status.completed{background:#e4f6ec;color:#14764c}
.status.cancelled,.status.rejected{background:#fff0f0;color:#b42e2e}
.status.no_show{background:#f3eeee;color:#7b5555}
.booking-card h3{font-size:15px;margin:5px 0}
.booking-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.info{background:#f7f9f8;border-radius:10px;padding:9px}
.info span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:900}
.info b{display:block;font-size:12px;margin-top:3px}

.chat-head{padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:13px;background:#dcece3;display:grid;place-items:center;font-weight:900;flex:none}
.messages{flex:1;padding:15px;background:#f7faf8;min-height:340px;max-height:440px;overflow:auto}
.msg{max-width:78%;margin:7px 0;padding:9px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.msg.mine{margin-left:auto;background:var(--brand);color:#fff;border-color:var(--brand)}
.msg small{display:block;opacity:.65;font-size:9px;margin-top:4px}
.chat-compose{display:flex;gap:7px;padding:11px;border-top:1px solid var(--line)}
.chat-compose input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px}
.profile{padding:20px;display:grid;grid-template-columns:110px 1fr;gap:18px}
.profile-avatar{width:100px;height:100px;border-radius:28px;background:linear-gradient(135deg,#2E3192,#4348C4);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:950}
.profile h2{margin:4px 0}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.profile-field{background:#f6f8f7;border-radius:11px;padding:10px}
.profile-field span{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}
.profile-field b{display:block;font-size:12px;margin-top:3px}
.location{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.map{min-height:210px;border-radius:16px;background:linear-gradient(135deg,#dfeae4,#eef5f1);display:grid;place-items:center;color:#527067;font-weight:900;text-align:center;padding:16px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom))}
.bottom-inner{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}
.bottom-btn{border:0;background:transparent;color:#718079;padding:7px 2px;font-size:9px;font-weight:900;position:relative}
.bottom-btn span{display:block;font-size:19px;margin-bottom:2px}
.bottom-btn.active{color:var(--brand)}
.pill{position:absolute;top:2px;right:20%;background:#e43c3c;color:#fff;border-radius:99px;font-size:9px;padding:1px 5px;min-width:16px}
.modal{display:none;position:fixed;inset:0;background:rgba(5,20,13,.55);z-index:100;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-box{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0}
.modal-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:16px}.modal-body{padding:18px}
.close{border:0;background:#eef3f0;border-radius:9px;width:36px;height:36px;font-size:20px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(15px);background:var(--dark);color:#fff;padding:11px 15px;border-radius:12px;font-size:12px;font-weight:800;z-index:130;opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.drawer{position:fixed;inset:0;background:rgba(5,20,13,.45);z-index:90;display:none}
.drawer.show{display:block}
.drawer-box{position:absolute;right:0;top:0;bottom:0;width:min(360px,92%);background:#fff;padding:18px;overflow:auto}
.notification{padding:12px;border:1px solid var(--line);border-radius:13px;margin:8px 0}
.notification.unread{background:#eef8f2;border-color:#cfe8da}
.notification b{font-size:12px}.notification p{font-size:11px;color:var(--muted);margin:5px 0}
.empty{text-align:center;padding:34px;color:var(--muted);font-size:13px}
.alert{border-radius:13px;padding:12px 14px;font-size:13px;margin-bottom:12px;line-height:1.5}
.alert.err{background:#fff0ee;border:1px solid #ffd1cc;color:#b42318}
.alert.info{background:#edf7fb;border:1px solid #d4e8f2;color:#216b9a}
.alert.ok{background:#edf0fb;border:1px solid #d5daf3;color:var(--brand)}
.skeleton{height:118px;border-radius:15px;background:linear-gradient(90deg,#eef2ef 25%,#f7f9f8 50%,#eef2ef 75%);background-size:200% 100%;animation:load 1.2s infinite}
@keyframes load{to{background-position:-200% 0}}
.stars{display:flex;gap:8px;font-size:32px}
.stars button{border:0;background:transparent;color:#d5dfda;padding:0;line-height:1}
.stars button.on{color:var(--gold)}

/* --- Gerb --- */
.emblem{display:block;flex:none;object-fit:contain}
.emblem.sm{width:38px;height:38px}
.emblem.lg{width:92px;height:92px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.28))}
.logo{gap:11px}
.brandtxt{display:flex;flex-direction:column;line-height:1.05;text-align:left}
.brandtxt b{font-size:14px;font-weight:950;letter-spacing:.04em}
.brandtxt i{font-style:normal;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.16em}
/* --- Hero jonli fon --- */
.heroTop{display:flex;align-items:center;gap:18px;margin-bottom:14px}
.heroBrand{margin:6px 0 0;font-size:clamp(26px,5.2vw,44px);line-height:.98;font-weight:950;letter-spacing:.01em}
.heroBrand span{display:block;font-size:.62em;letter-spacing:.22em;opacity:.85;font-weight:800;margin-top:4px}
.heroHi{color:#cfd3f5;margin:0 0 14px;font-size:15px}
.road{position:absolute;left:-10%;right:-10%;bottom:0;height:46%;
 background:linear-gradient(180deg,transparent,rgba(0,0,0,.35));
 transform:perspective(320px) rotateX(58deg);transform-origin:bottom;overflow:hidden}
.road span{position:absolute;left:50%;width:8px;height:52px;border-radius:4px;background:rgba(255,255,255,.55);
 transform:translateX(-50%);animation:dash 2.4s linear infinite}
.road span:nth-child(1){animation-delay:0s}.road span:nth-child(2){animation-delay:.48s}
.road span:nth-child(3){animation-delay:.96s}.road span:nth-child(4){animation-delay:1.44s}
.road span:nth-child(5){animation-delay:1.92s}
@keyframes dash{from{top:-60px;opacity:0}12%{opacity:1}to{top:100%;opacity:.15}}
.glowdots{position:absolute;inset:0;
 background:radial-gradient(160px 90px at 82% 28%,rgba(120,130,255,.28),transparent 70%),
            radial-gradient(120px 70px at 18% 70%,rgba(90,100,230,.22),transparent 70%)}
/* --- Aylanuvchi reklama --- */
.ad{min-height:56px;display:flex;align-items:center;margin:0 0 6px}
.ad .slide{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.12);
 border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:11px 14px;backdrop-filter:blur(6px);
 animation:adIn .45s ease both;max-width:100%}
.ad .ico{font-size:20px;flex:none}
.ad b{display:block;font-size:14px;line-height:1.2}
.ad small{display:block;color:#cfd3f5;font-size:12px;margin-top:2px}
@keyframes adIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.road span{animation:none;opacity:.25}.ad .slide{animation:none}}
@media(max-width:680px){.heroTop{gap:13px}.emblem.lg{width:66px;height:66px}}

.ptable{display:grid;gap:8px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#f7f8fd;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.prow b{display:block;font-size:14px}
.prow span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pcell{font-weight:950;color:var(--brand);white-space:nowrap;font-size:15px}
details.faq{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden}
details.faq summary{cursor:pointer;padding:14px 16px;font-weight:800;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";font-size:20px;font-weight:400;color:var(--brand);flex:none}
details.faq[open] summary::after{content:"−"}
details.faq[open] summary{border-bottom:1px solid var(--line)}
.faqa{padding:13px 16px;font-size:13.5px;line-height:1.6;color:#41456e;white-space:pre-line}

.fac{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fac .f{display:flex;gap:11px;align-items:flex-start;background:#f7f8fd;border:1px solid var(--line);border-radius:13px;padding:12px}
.fac .f i{font-style:normal;font-size:20px;flex:none;line-height:1.1}
.fac .f b{display:block;font-size:13.5px;line-height:1.25}
.fac .f span{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
@media(max-width:680px){.fac{grid-template-columns:1fr}}
/* Qo'llanma */
.tour{display:none;position:fixed;inset:0;background:rgba(10,12,40,.72);z-index:200;align-items:center;justify-content:center;padding:16px}
.tour.on{display:flex}
.tbox{background:#fff;border-radius:22px;width:min(440px,100%);max-height:92vh;overflow:auto;padding:24px;text-align:center}
.tico{font-size:52px;line-height:1;margin-bottom:14px}
.tbox h3{margin:0 0 8px;font-size:20px}
.tbox p{margin:0;color:var(--muted);font-size:14px;line-height:1.6;white-space:pre-line}
.tdots{display:flex;gap:6px;justify-content:center;margin:20px 0 16px}
.tdots i{width:7px;height:7px;border-radius:50%;background:#d7dae9;transition:.2s}
.tdots i.on{background:var(--brand);width:20px;border-radius:4px}
.tnav{display:flex;gap:9px}
.tnav button{flex:1;border-radius:12px;padding:12px;font-weight:800;border:1px solid var(--line);background:#fff}
.tnav .go{background:var(--brand);border-color:var(--brand);color:#fff}
.tskip{border:0;background:transparent;color:var(--muted);font-size:12.5px;margin-top:12px;text-decoration:underline}

.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal button{position:relative;padding:0;border:0;border-radius:13px;overflow:hidden;aspect-ratio:1;background:#e8eaf6;cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .vid::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:#fff;background:rgba(10,12,40,.35);text-shadow:0 2px 8px rgba(0,0,0,.5)}
@media(max-width:680px){.gal{grid-template-columns:repeat(2,1fr);gap:7px}}
.lb{display:none;position:fixed;inset:0;background:rgba(6,8,26,.96);z-index:220;align-items:center;justify-content:center}
.lb.on{display:flex}
.lbwrap{max-width:96vw;max-height:82vh;display:grid;place-items:center}
.lbwrap img,.lbwrap video{max-width:96vw;max-height:82vh;border-radius:12px;display:block}
.lbx{position:absolute;top:14px;right:16px;z-index:2;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:26px;line-height:1}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:30px;line-height:1}
.lbprev{left:10px}.lbnext{right:10px}
.lbcap{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#dfe2f5;font-size:13px;padding:0 20px}

.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hours button{border:1.5px solid #d7dae9;background:#fff;border-radius:13px;padding:13px 4px;font-weight:900;
 font-size:15px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.hours button small{font-size:10px;font-weight:700;color:var(--muted)}
.hours button.on{border-color:var(--brand);background:#f2f4fd;color:var(--brand);box-shadow:0 0 0 3px rgba(46,49,146,.09)}
.hours button.on small{color:var(--brand)}
.hours button:disabled{opacity:.4;cursor:not-allowed}

.insrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;
 border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;cursor:pointer;font:inherit}
.insrow:active{background:#f7f8fd}
.insrow img.ini{object-fit:cover}
.insitem img.ini{object-fit:cover}
.insrow .ini{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
 background:var(--soft,#EEF0FB);color:var(--brand);font-weight:900;font-size:14px}
.insrow .txt{flex:1;min-width:0}
.insrow .txt b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insrow .txt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.insrow .go{color:var(--muted);font-size:20px;flex:none}

.insitem{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:9px}
.insitem .top{display:flex;align-items:center;gap:11px}
.insitem .ini{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;
 background:var(--soft,#EEF0FB);color:var(--brand);font-weight:900;font-size:14px}
.insitem .txt{flex:1;min-width:0}
.insitem .txt b{display:block;font-size:15px}
.insitem .txt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.insitem .bio{margin:9px 0 0;font-size:13px;color:#4a4f7a;line-height:1.45;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.insitem .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.insitem .acts button{height:42px;border-radius:11px;font-size:14px;font-weight:800}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){
 .container{padding:12px}.hero{min-height:340px;border-radius:20px}.hero-content{padding:26px 20px}
 .hero-scrim{background:linear-gradient(180deg,rgba(14,16,52,.55) 0%,rgba(18,21,70,.9) 60%,rgba(24,27,92,.97) 100%)}
 .hero-art svg{right:-70px;height:74%;min-width:440px;opacity:.75}
 .grid{grid-template-columns:1fr}.form-grid,.location{grid-template-columns:1fr}.full{grid-column:auto}
 .time-grid{grid-template-columns:repeat(3,1fr)}.booking-info{grid-template-columns:1fr 1fr}
 .profile{grid-template-columns:80px 1fr;padding:15px}.profile-avatar{width:75px;height:75px;border-radius:22px;font-size:26px}.profile-grid{grid-template-columns:1fr}
}
</style>

let LANG = localStorage.getItem('avtodrom_lang');
if (LANG !== 'uz' && LANG !== 'ru') {
  // Telegram foydalanuvchi tilidan taxmin qilamiz
  LANG = String(tg?.initDataUnsafe?.user?.language_code || '').startsWith('ru') ? 'ru' : 'uz';
}
function t(key, params) {
  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.uz[key] ?? key;
  if (params) for (const k in params) s = s.replace(`{${k}}`, params[k]);
  return s;
}
const LOCALE = () => (LANG === 'ru' ? 'ru-RU' : 'uz-UZ');

function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); el.setAttribute('aria-label', t(el.dataset.i18nTitle)); });
  $('langLabel').textContent = LANG.toUpperCase();
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
}
function setLang(l) {
  if (l !== 'uz' && l !== 'ru') return;
  LANG = l; localStorage.setItem('avtodrom_lang', l);
  applyLang(); rerenderAll();
  $('langMenu').classList.remove('open');
}

/* Xato matnini har qanday shakldan chiqarib oladi.
   Vercel 404 javobi {"error":{"code":"NOT_FOUND","message":"..."}} ko'rinishida
   keladi — avval bu foydalanuvchiga "[object Object]" bo'lib ko'rinardi. */
function errText(d, status, path) {
  const pick = v => {
    if (!v) return '';
    if (typeof v === 'string') return v;
    if (typeof v === 'object') return v.message || v.error || v.code || '';
    return String(v);
  };
  const msg = pick(d?.error) || pick(d?.message) || pick(d?.details);
  if (msg) return msg;
  if (status === 404) return `Manzil topilmadi (404): ${path}`;
  if (status === 405) return `Bu amal qo‘llab-quvvatlanmaydi (405): ${path}`;
  return `Server xatosi: ${status}`;
}

async function api(path, opt = {}) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), 15000);
  try {
    const headers = { Accept:'application/json', 'Content-Type':'application/json', ...(opt.headers||{}) };
    if (INIT_DATA) headers['X-Telegram-Init-Data'] = INIT_DATA;
    const r = await fetch(path, { cache:'no-store', ...opt, signal:c.signal, headers });
    const txt = await r.text(); let d = {};
    try { d = txt ? JSON.parse(txt) : {}; }
    catch { throw new Error(t('notjson',{code:r.status,body:txt.slice(0,70)})); }
    if (!r.ok) throw new Error(errText(d, r.status, path));
    return d;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error(t('timeout'));
    if (e instanceof TypeError) throw new Error(t('net_err'));
    throw e;
  } finally { clearTimeout(t); }
}

const todayTk = () => new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
const tkDT = (d,t) => { const m=String(t).match(/^(\d{2}):(\d{2})$/); return m ? new Date(`${d}T${m[1]}:${m[2]}:00+05:00`) : null; };
const fDate = v => { if(!v) return '—'; const d=new Date(v); return isNaN(d)?'—':d.toLocaleDateString(LOCALE(),{timeZone:TZ,day:'2-digit',month:'short',year:'numeric'}); };
const fTime = v => { if(!v) return '—'; const d=new Date(v); return isNaN(d)?'—':d.toLocaleTimeString(LOCALE(),{timeZone:TZ,hour:'2-digit',minute:'2-digit'}); };
const fFull = v => v ? `${fDate(v)} · ${fTime(v)}` : '—';
const iName = x => { const p=x?.profile||x||{}; return [p.first_name,p.last_name].filter(Boolean).join(' ')||p.full_name||x?.full_name||t('ins_default'); };
const initials = n => { const p=String(n||'').trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'👤'; };

/** Davomiylikni odam tilida: 60→"1 soat", 90→"1 soat 30 daqiqa", 120→"2 soat" */
function fmtDur(min){
  const m = Number(min) || 0;
  const h = Math.floor(m / 60), r = m % 60;
  if (!h) return `${r} ${t('minutes')}`;
  return r ? `${h} ${t('hours')} ${r} ${t('minutes')}` : `${h} ${t('hours')}`;
}

function go(sec){
  const ok=['home','instructors','book','bookings','faq','profile'];
  if(!ok.includes(sec)) sec='home';
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hide',v.id!==sec));
  document.querySelectorAll('.bottom-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===sec));
  history.replaceState(null,'','#'+sec);
  window.scrollTo({top:0,behavior:'smooth'});
  if(sec==='bookings') loadBookings();
  if(sec==='book'){ if(!S.courses.length) loadCourses(); loadInstructors(); }
  if(sec==='faq') renderFaq();
}
document.querySelectorAll('.bottom-btn').forEach(b=>b.onclick=()=>go(b.dataset.nav));

function instructorRow(x){
  const name = iName(x);
  const bits = [];
  if (x.experience_years) bits.push(t('ins_years', { n: x.experience_years }));
  bits.push(`★ ${Number(x.rating || 0).toFixed(1)}`);
  const av = x.avatar_url
    ? `<img class="ini" src="${esc(x.avatar_url)}" alt="">`
    : `<span class="ini">${esc(initials(name))}</span>`;
  return `<button class="insrow" data-ins-detail="${esc(x.id)}">
    ${av}
    <span class="txt"><b>${esc(name)}</b><small>${esc(bits.join(' · '))}</small></span>
    <span class="go">›</span>
  </button>`;
}

/* -------- Necha soat? --------
   Kurs — bir birlik (odatda 1 soat). Mijoz nechta birlik olishini tanlaydi.
   Davomiylik ham, narx ham shu songa ko'paytiriladi. Yakuniy hisobni
   backend qayta bajaradi — bu yer faqat ko'rsatish uchun. */
const HOUR_OPTIONS = [1, 2, 3, 4];

function unitMinutes(){
  const c = S.courses.find(x => x.id === S.course);
  return Number(c?.duration_minutes || 60);
}
function totalMinutes(){ return unitMinutes() * (S.hours || 1); }
function totalPrice(){
  const c = S.courses.find(x => x.id === S.course);
  return Number(c?.price || 0) * (S.hours || 1);
}
/** Ish vaqtidan uzun variantlar o'chiriladi. */
function maxHoursAllowed(){
  const { start, end } = workRange();
  const unit = unitMinutes();
  return Math.max(1, Math.min(HOUR_OPTIONS[HOUR_OPTIONS.length - 1], Math.floor((end - start) / unit)));
}
function renderHours(){
  const box = $('hourPick'); if (!box) return;
  const c = S.courses.find(x => x.id === S.course);
  const limit = maxHoursAllowed();
  if (S.hours > limit) S.hours = limit;
  box.innerHTML = HOUR_OPTIONS.map(h => {
    const off = h > limit;
    const sub = c ? money(Number(c.price || 0) * h) : fmtDur(unitMinutes() * h);
    return `<button type="button" data-h="${h}" class="${S.hours === h ? 'on' : ''}" ${off ? 'disabled' : ''}>
      ${h} ${esc(t('hours'))}<small>${esc(sub)}</small></button>`;
  }).join('');
  box.querySelectorAll('[data-h]:not([disabled])').forEach(b => b.onclick = () => {
    S.hours = Number(b.dataset.h); S.time = '';
    renderHours(); onBookingChange();
  });
  $('hoursHint').textContent = c
    ? t('hours_hint', { dur: fmtDur(totalMinutes()), sum: money(totalPrice()) })
    : t('hours_pick_course');
}

/* ---------------- Bo'sh vaqt ---------------- */
/* Bo'sh vaqt jadvali — ish vaqti admin sozlamasidan (standart 07:00–19:00).
   Qadam ham sozlanadi (standart 60 daqiqa = butun soatlar: 07:00, 08:00, …). */
function hhmmToMin(v,def){ const m=String(v||'').match(/^(\d{1,2}):(\d{2})$/); return m?(+m[1]*60+ +m[2]):def; }
function workRange(){
  return {
    start: hhmmToMin(S.settings?.work_start,7*60),
    end:   hhmmToMin(S.settings?.work_end,19*60),
    step:  Math.max(15, Number(S.settings?.slot_step_min)||60),
  };
}
function slots(){
  const {start,end,step}=workRange(), a=[];
  for(let m=start;m<end;m+=step) a.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));
  return a;
}
async function onBookingChange(){
  updateSteps();
  const date=$('bookDate').value, ins=$('bookInstructor').value;
  S.busy=[];
  if(date&&ins){
    try{ const d=await api(`/api/instructors/${encodeURIComponent(ins)}/availability?date=${encodeURIComponent(date)}`); S.busy=d.busy||[]; }
    catch(e){ /* yuborishda backend baribir tekshiradi */ }
  }
  renderTimes(); updateSummary();
}
function renderTimes(){
  const box=$('timeGrid'), date=$('bookDate').value, ins=$('bookInstructor').value;
  const c=S.courses.find(x=>x.id===S.course);
  if(!date||!ins||!c){ box.innerHTML=''; $('availabilityHint').textContent=t('hint_pick'); return; }
  const dur=totalMinutes(), now=Date.now();
  const {end:closeMin}=workRange();
  box.innerHTML=slots().map(t=>{
    const st=tkDT(date,t), en=new Date(st.getTime()+dur*60000);
    const clash=S.busy.some(b=>new Date(b.start_at)<en && new Date(b.end_at)>st);
    // Dars ish vaqti tugagandan keyin tugamasin
    const startMin=hhmmToMin(t,0), pastClose=startMin+dur>closeMin;
    const off=clash||pastClose||st.getTime()<now;
    return `<button type="button" class="time ${S.time===t?'selected':''} ${off?'busy':''}" ${off?'disabled':''} data-time="${t}">${t}</button>`;
  }).join('');
  box.querySelectorAll('.time:not([disabled])').forEach(b=>b.onclick=()=>{ S.time=b.dataset.time; renderTimes(); updateSummary(); updateSteps(); });
  const free=box.querySelectorAll('.time:not([disabled])').length;
  $('availabilityHint').textContent = free ? t('hint_free',{date:fDate(date),n:free}) : t('hint_none');
}
function updateSteps(){
  $('step1').classList.toggle('active',!!S.course);
  $('step2').classList.toggle('active',!!S.course);
  $('step3').classList.toggle('active',!!$('bookInstructor').value && !!$('bookDate').value);
  $('step4').classList.toggle('active',!!S.time);
}
/** Xulosa uchun matn: kurs birligi 60 daqiqa bo'lsa oddiy «4 soat»,
    aks holda takrorlamay «4 × 90 daq = 6 soat». */
function durLabel(){
  const unit = unitMinutes(), h = S.hours || 1, tot = fmtDur(totalMinutes());
  if (unit === 60) return `${h} ${t('hours')}`;
  return `${h} × ${fmtDur(unit)} = ${tot}`;
}

function updateSummary(){
  const c=S.courses.find(x=>x.id===S.course);
  const i=S.instructors.find(x=>String(x.id)===String($('bookInstructor').value));
  const d=$('bookDate').value;
  if(!c&&!i&&!S.time){ $('bookingSummary').textContent=t('sum_placeholder'); return; }
  $('bookingSummary').innerHTML=`<b>${esc(t('sum_title'))}</b><br>
    📚 ${c?esc(c.name)+' · '+esc(durLabel()):esc(t('sum_nocourse'))}<br>

    📅 ${d?esc(fDate(d)):'—'} · 🕐 ${S.time?esc(S.time):esc(t('sum_notime'))}<br>
    💵 <b>${c?money(totalPrice()):'—'}</b>`;
}

  openModal(t('cancel_title'),`
    <div class="alert ${willRequest?'info':'err'}" style="margin-top:0">${esc(willRequest?t('cancel_note_request'):t('cancel_note_direct'))}</div>
    <div class="field"><label>${esc(t('cancel_reason'))} *</label>
      <textarea id="cxReason" rows="3" placeholder="${esc(t('cancel_ph'))}"></textarea></div>
    <div id="cxAlert"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="secondary" style="flex:1" id="cxBack">${esc(t('cancel_back'))}</button>
      <button class="danger" style="flex:1" id="cxSend">${esc(willRequest?t('cancel_send_request'):t('cancel_confirm'))}</button>
    </div>`);
  $('cxBack').onclick=closeModal;
  $('cxSend').onclick=async()=>{
    const reason=$('cxReason').value.trim();

    try{

      closeModal();
      toast(d.mode==='requested'?t('cancel_sent'):t('ok_cancelled'));
      await loadBookings();
    }catch(e){ alertBox('cxAlert',e.message); }
    finally{ $('cxSend').disabled=false; }
  };
}

/* =========================================================================
   INDEX AVTODROM BO'LIMI
   Matn va sharoitlar ro'yxati admin sozlamalaridan keladi (`about_text`,
   `facilities`). Sozlanmagan bo'lsa — standart ro'yxat ishlatiladi.
   Standart ro'yxatdagi har bir band tekshirilgan fakt: maydonchadagi
   belgilar/svetoforlar, maydonchaning imtihonga tayyorlov uchun jihozlanishi va ish vaqti.
   ========================================================================= */
function parseFacilities(raw){
  // Admin bir qatorda bitta band yozadi:  🚦 Sarlavha | Tavsif
  if (Array.isArray(raw)) return raw;
  return String(raw || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const [left, ...rest] = line.split('|');
    const head = left.trim();
    const m = head.match(/^(\p{Extended_Pictographic}[\uFE0F\u200D\p{Extended_Pictographic}]*)\s*(.*)$/u);
    return { icon: m ? m[1] : '•', title: m ? m[2] : head, text: rest.join('|').trim() };
  });
}
function defaultFacilities(){
  const ws = S.settings?.work_start || '07:00', we = S.settings?.work_end || '19:00';
  return [
    { icon:'🚦', title:t('fac_signs_t'),  text:t('fac_signs_x') },
    { icon:'🛣️', title:t('fac_marks_t'),  text:t('fac_marks_x') },
    { icon:'🅿️', title:t('fac_park_t'),   text:t('fac_park_x') },
    { icon:'🏛️', title:t('fac_exam_t'),   text:t('fac_exam_x') },
    { icon:'👨‍🏫', title:t('fac_instr_t'), text:t('fac_instr_x') },
    { icon:'🕖', title:t('fac_hours_t'),  text:`${ws} — ${we}` },
  ];
}
function renderAbout(){
  const txt = $('aboutText'), box = $('facilities');
  if (!txt || !box) return;
  txt.textContent = S.settings?.about_text || t('about_default');
  const list = parseFacilities(S.settings?.facilities);
  const items = list.length ? list : defaultFacilities();
  box.innerHTML = items.map(f => `
    <div class="f"><i>${esc(f.icon || '•')}</i>
      <div><b>${esc(f.title || '')}</b>${f.text ? `<span>${esc(f.text)}</span>` : ''}</div>
    </div>`).join('');
}

/* =========================================================================
   BIRINCHI KIRISHDA QO'LLANMA
   Video emas: interfeys o'zgarsa eskirmaydi, ikkala tilda avtomatik ishlaydi
   va Telegram ichida darhol ochiladi. Bir marta ko'rsatiladi, keyin
   «Savollar» bo'limidan qayta ochish mumkin.
   ========================================================================= */
const TOUR_KEY = 'avtodrom_tour_v1';
const TOUR = [
  { ico:'🚗', t:'tour1_t', x:'tour1_x' },
  { ico:'📚', t:'tour2_t', x:'tour2_x' },
  { ico:'👨‍🏫', t:'tour3_t', x:'tour3_x' },
  { ico:'🕐', t:'tour4_t', x:'tour4_x' },
  { ico:'⏰', t:'tour5_t', x:'tour5_x' },
  { ico:'⭐', t:'tour6_t', x:'tour6_x' },
];
let tourStep = 0;

function renderTour(){
  const s0 = TOUR[tourStep];
  $('tIco').textContent = s0.ico;
  $('tTitle').textContent = t(s0.t);
  $('tText').textContent = t(s0.x);
  $('tDots').innerHTML = TOUR.map((_, i) => `<i class="${i === tourStep ? 'on' : ''}"></i>`).join('');
  $('tPrev').style.visibility = tourStep === 0 ? 'hidden' : 'visible';
  $('tNext').textContent = tourStep === TOUR.length - 1 ? t('tour_start') : t('tour_next');
}
function openTour(step = 0){ tourStep = step; renderTour(); $('tour').classList.add('on'); }
function closeTour(){
  $('tour').classList.remove('on');
  try { localStorage.setItem(TOUR_KEY, '1'); } catch (e) {}
}
$('tNext').onclick = () => { if (tourStep < TOUR.length - 1) { tourStep++; renderTour(); } else { closeTour(); go('book'); } };
$('tPrev').onclick = () => { if (tourStep > 0) { tourStep--; renderTour(); } };
$('tSkip').onclick = closeTour;
$('tour').onclick = e => { if (e.target.id === 'tour') closeTour(); };

function maybeOpenTour(){
  let seen = false;
  try { seen = localStorage.getItem(TOUR_KEY) === '1'; } catch (e) {}
  if (!seen) openTour(0);
}


/* =========================================================================
   AVTODROM GALEREYASI
   Admin yuklagan rasm va videolar (`gallery_*` kalitli media).
   Bosilganda to'liq ekranda ochiladi; strelkalar va klaviatura bilan aylanadi.
   Videolar faqat ochilganda yuklanadi (preload=none) — Mini App tez qolsin.
   ========================================================================= */
let lbIndex = 0;

function renderGallery(){
  const box = $('gallery'), sec = $('gallerySection');
  if (!box || !sec) return;
  const items = S.gallery || [];
  if (!items.length) { sec.classList.add('hide'); return; }
  sec.classList.remove('hide');
  $('galCount').textContent = t('gal_count', { n: items.length });
  box.innerHTML = items.map((m, i) => {
    const isVid = m.media_type === 'video';
    return `<button data-gi="${i}" class="${isVid ? 'vid' : ''}" aria-label="${esc(m.title || '')}">
      ${isVid
        ? `<video src="${esc(m.public_url)}#t=0.5" muted playsinline preload="metadata"></video>`
        : `<img src="${esc(m.public_url)}" alt="${esc(m.title || 'AVTODROM')}" loading="lazy">`}
    </button>`;
  }).join('');
  box.querySelectorAll('[data-gi]').forEach(b => b.onclick = () => openLightbox(Number(b.dataset.gi)));
}

function renderLightbox(){
  const items = S.gallery || [];
  const m = items[lbIndex];
  if (!m) return;
  $('lbWrap').innerHTML = m.media_type === 'video'
    ? `<video src="${esc(m.public_url)}" controls autoplay playsinline preload="none"></video>`
    : `<img src="${esc(m.public_url)}" alt="${esc(m.title || 'AVTODROM')}">`;
  $('lbCap').textContent = `${m.title || ''}${items.length > 1 ? `  ·  ${lbIndex + 1}/${items.length}` : ''}`;
  const many = items.length > 1;
  $('lbPrev').style.display = many ? '' : 'none';
  $('lbNext').style.display = many ? '' : 'none';
}
function openLightbox(i){ lbIndex = i; renderLightbox(); $('lightbox').classList.add('on'); }
function closeLightbox(){
  $('lightbox').classList.remove('on');
  $('lbWrap').innerHTML = '';   // videoni to'xtatadi
}
function stepLightbox(d){
  const n = (S.gallery || []).length; if (!n) return;
  lbIndex = (lbIndex + d + n) % n; renderLightbox();
}
$('lbClose').onclick = closeLightbox;
$('lbPrev').onclick = () => stepLightbox(-1);
$('lbNext').onclick = () => stepLightbox(1);
$('lightbox').onclick = e => { if (e.target.id === 'lightbox') closeLightbox(); };
document.addEventListener('keydown', e => {
  if (!$('lightbox').classList.contains('on')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') stepLightbox(-1);
  if (e.key === 'ArrowRight') stepLightbox(1);
});

/* ---------------- Profil ---------------- */
async function loadMe(){
  try{
    const d=await api('/api/me');
    S.profile=d.profile||null;   // MUHIM: backend {profile} qaytaradi, {user} EMAS
    renderProfile(); alertBox('globalAlert','');
  }catch(e){
    S.profile=null;
    alertBox('globalAlert', IS_TG?t('prof_err',{msg:e.message}):t('browser_mode'), IS_TG?'err':'info');
  }
}
function renderProfile(){
  const u=S.profile;
  if(!u){ $('profileName').textContent=t('prof_failed'); $('profileSub').textContent=t('prof_opentg'); return; }
  const full=[u.first_name,u.last_name].filter(Boolean).join(' ')||u.full_name||'Foydalanuvchi';
  $('profileName').textContent=full;
  $('profileAvatar').textContent=initials(full);
  $('profileSub').textContent=u.phone?t('prof_filled'):t('prof_fill');
  $('profilePhone').textContent=u.phone||'—';
  $('profileTelegram').textContent=u.telegram_id||'—';
  $('heroTitle').textContent=u.first_name?t('hero_hi',{name:u.first_name}):t('hero_title');
  renderProfileStats();
}
function renderProfileStats(){
  $('profileTotal').textContent=S.bookings.length;
  $('profileDone').textContent=S.bookings.filter(b=>b.status==='completed').length;
}
$('editProfileBtn').onclick=()=>{
  const u=S.profile||{};
  openModal(t('edit_title'),`
    <div class="field"><label>${esc(t('f_first'))}</label><input id="pFirst" value="${esc(u.first_name||'')}"></div>
    <div class="field"><label>${esc(t('f_last'))}</label><input id="pLast" value="${esc(u.last_name||'')}"></div>
    <div class="field"><label>${esc(t('f_phone'))}</label><input id="pPhone" value="${esc(u.phone||'')}" placeholder="+998901234567"></div>
    <div id="pAlert"></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="secondary" style="flex:1" id="pCancel">${esc(t('rev_cancel'))}</button><button class="primary solid" style="flex:1" id="pSave">${esc(t('save'))}</button></div>`);
  $('pCancel').onclick=closeModal;
  $('pSave').onclick=async()=>{
    alertBox('pAlert','');
    const first=$('pFirst').value.trim(), last=$('pLast').value.trim(), phone=$('pPhone').value.trim();
    if(!first||!last||!phone){ alertBox('pAlert',t('req_all')); return; }
    $('pSave').disabled=true;
    try{
      const d=await api('/api/me',{method:'PATCH',body:JSON.stringify({first_name:first,last_name:last,phone})});
      S.profile=d.profile||S.profile; renderProfile(); closeModal(); toast(t('ok_saved'));
    }catch(e){ alertBox('pAlert',e.message); }
    finally{ $('pSave').disabled=false; }
  };
};

/* ---------------- Bildirishnoma / media / sozlama ---------------- */
async function loadNotifications(){
  try{
    const d=await api('/api/notifications'); S.notifications=d.notifications||[];
    $('notifDot').classList.toggle('hide', !S.notifications.some(n=>!n.is_read));
  }catch(e){ S.notifications=[]; }
}
function openNotifications(){
  $('notifications').innerHTML = S.notifications.length
    ? S.notifications.map(n=>`<div class="notification ${n.is_read?'':'unread'}"><b>${esc(n.title||'AVTODROM')}</b><p>${esc(n.message||n.body||'')}</p><small class="meta">${esc(fFull(n.created_at))}</small></div>`).join('')
    : `<div class="empty">${esc(t('notif_empty'))}</div>`;
  $('drawer').classList.add('show');
}
$('notifBtn').onclick=openNotifications;
$('profileNotifBtn').onclick=openNotifications;

async function loadMedia(){
  try{
    const d=await api('/api/content'); const media=d.media||[];
    const img=media.find(x=>x.key==='home_image'&&x.public_url);
    if(img){ const el=$('heroPhoto'), pre=new Image();
      pre.onload=()=>{ el.style.backgroundImage=`url("${img.public_url}")`; el.classList.add('on'); }; pre.src=img.public_url; }
    S.gallery=media.filter(x=>String(x.key||'').startsWith('gallery_')&&x.public_url)
      .sort((a,b)=>(a.sort_order??0)-(b.sort_order??0));
    renderGallery();
    const lp=media.find(x=>x.key==='location_image'&&x.public_url);
    if(lp){ S.locationPhoto=lp.public_url; renderLocationBox(); }
    const v=media.find(x=>x.key==='guide_video'&&x.public_url);
    if(!v) return;
    $('mediaSection').classList.remove('hide');
    $('mediaTitle').textContent=v.title||'Video qo‘llanma';
    $('mediaVideo').src=v.public_url;
  }catch(e){ /* media ixtiyoriy */ }
}
async function loadSettings(){
  try{
    const d=await api('/api/settings'); S.settings=d.settings||{};
    const loc=S.settings.location||{};
    if(loc.name) $('locName').textContent=loc.name;
    const parts=[loc.address||S.settings.address, S.settings.working_hours].filter(Boolean);
    if(parts.length) $('addressText').textContent=parts.join(' · ');
    if(S.settings.booking_enabled===false){
      $('submitBooking').disabled=true;
      alertBox('bookAlert',t('booking_off'),'info');
    }
  }catch(e){ /* sozlama ixtiyoriy */ }
}
$('mapBtn').onclick=()=>{
  const loc=S.settings?.location||{};
  if(loc.google_url) return window.open(loc.google_url,'_blank','noopener');
  const lat=Number(loc.latitude), lng=Number(loc.longitude);
  const q=(Number.isFinite(lat)&&Number.isFinite(lng))?`${lat},${lng}`:(loc.address||S.settings?.address||'Avtodrom Tashkent');
  window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),'_blank','noopener');
};
$('callBtn').onclick=()=>{
  const p=S.settings?.contact_phone;
  if(p) location.href='tel:'+String(p).replace(/[^+\d]/g,'');
  else toast(t('addr_nophone'));
};


/* =========================================================================
   HERO — JONLI REKLAMA
   Slaydlar o'ylab topilmaydi: bazadagi haqiqiy kurslar, narxlar, instruktor
   soni, o'rtacha reyting va ish vaqtidan hosil qilinadi. Ma'lumot bo'lmasa
   o'sha slayd umuman ko'rsatilmaydi.
   ========================================================================= */
let adTimer = null, adIndex = 0;

function buildAdSlides(){
  const out = [];
  for (const c of (S.courses || []).slice(0, 3)) {
    out.push({ ico:'📚', title:`${c.name} · ${fmtDur(c.duration_minutes)}`, sub:money(c.price) });
  }
  const ins = S.instructors || [];
  if (ins.length) {
    const rated = ins.filter(i => Number(i.rating) > 0);
    const avg = rated.length ? (rated.reduce((a,i)=>a+Number(i.rating),0)/rated.length) : 0;
    out.push({
      ico:'👨‍🏫',
      title: t('ad_instructors', { n: ins.length }),
      sub: avg ? `★ ${avg.toFixed(1)} ${t('ad_avg')}` : t('ins_verified'),
    });
  }
  const ws = S.settings?.work_start, we = S.settings?.work_end;
  if (ws && we) out.push({ ico:'🕖', title:t('ad_hours'), sub:`${ws} — ${we}` });
  const loc = S.settings?.location || {};
  const addr = loc.address || S.settings?.address;
  if (addr) out.push({ ico:'📍', title: loc.name || 'TASH INDEX AVTODROM', sub: addr });
  return out;
}

function renderAd(){
  const box = $('adRotator'); if (!box) return;
  const slides = buildAdSlides();
  if (!slides.length) { box.innerHTML = `<div class="slide"><span class="ico">🚗</span><div><b>TASH INDEX AVTODROM</b><small>${esc(t('hero_sub'))}</small></div></div>`; return; }
  if (adIndex >= slides.length) adIndex = 0;
  const s0 = slides[adIndex];
  box.innerHTML = `<div class="slide"><span class="ico">${s0.ico}</span><div><b>${esc(s0.title)}</b><small>${esc(s0.sub)}</small></div></div>`;
  clearTimeout(adTimer);
  if (slides.length > 1 && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    adTimer = setTimeout(() => { adIndex = (adIndex + 1) % slides.length; renderAd(); }, 4200);
  }
}

/* ---------------- Til almashtirish ---------------- */
/* Til o'zgarganda: statik matnlar applyLang() bilan, dinamik ro'yxatlar
   qayta render qilinadi. Serverga qayta so'rov yuborilmaydi. */
function rerenderAll(){
  renderHomeInstructors(); renderInstructors(); fillInstructorSelect();
  if(S.courses.length) renderCourses();
  renderTimes(); updateSummary();
  renderBookings(); renderNext(); renderReviewBanner();
  renderProfile(); renderFaq(); renderAbout(); renderGallery(); if($('tour').classList.contains('on')) renderTour(); adIndex=0; renderAd();
  const loc=S.settings?.location||{};
  const parts=[loc.address||S.settings?.address, S.settings?.working_hours].filter(Boolean);
  $('addressText').textContent = parts.length ? parts.join(' · ') : t('addr_none');
}
$('langBtn').onclick=e=>{ e.stopPropagation(); $('langMenu').classList.toggle('open'); };
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.addEventListener('click',e=>{ if(!e.target.closest('#langBtn,#langMenu')) $('langMenu').classList.remove('open'); });

/* ---------------- Boot ---------------- */
async function boot(){
  applyLang();
  renderAd(); renderFaq(); renderAbout();   // zaxira mazmun darhol ko'rinsin
  $('bookDate').min=todayTk(); $('bookDate').value=todayTk();
  await loadMe();
  await Promise.allSettled([loadSettings(),loadCourses(),loadInstructors(),loadBookings(),loadNotifications(),loadMedia()]);
  go(location.hash.slice(1)||'home');
  maybeOpenTour();
}
setInterval(()=>{
  if(!S.profile) return;
  if($('modal').classList.contains('show')) return;
  loadBookings(); loadNotifications();
},25000);
boot();
</script>
