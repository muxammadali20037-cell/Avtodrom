ACT.wzissue = async el => {
  const W = CO;
  if (!regOk()) { toast('Kassa ochilmagan — qayta kiring', true); return render(); }
  if (!W.booking) {
    const q = W.q.trim();
    if (!W.name.trim() && q && !/\d{4,}/.test(q)) W.name = q;
    if (!W.phone.trim() && /^\+?[\d\s()-]{7,}$/.test(q)) W.phone = q;
    W.name = W.name.trim(); W.phone = W.phone.trim();
    const miss = coMissing(W)[0];
    if (miss) { toast(miss[1], true); coScrollTo(miss[0]); if (miss[0] === 'cust') setTimeout(() => $('wzName')?.focus(), 350); return; }
  }
  const total = totalOf(W);
  if (!(total > 0)) return toast('Summani kiriting', true);
  const { cash, card } = payParts(W);
  if (cash + card !== total) return toast(`Naqd + karta = ${nf(cash + card)}, jami esa ${nf(total)}`, true);
  if (W.manual != null && !priceTokOk()) { W.manual = null; W.priceEdit = false; coPatch('pay', ['pay']); return toast('Narx paroli muddati tugadi — narx avtomatikka qaytdi. Qayta o‘zgartirish uchun parolni kiriting.', true); }
  const body = { register_token: S.reg.t, amount: total, cash_amount: cash, card_amount: card, category: W.cat, duration_minutes: W.min };
  if (priceTokOk()) body.price_token = S.priceTok.t;
  if (W.booking) {
    body.booking_id = W.booking.id;
    body.duration_minutes = Number(W.booking.duration_minutes) || W.min;
    if (W.payPkg && pkgUnpaid(W).length > 1) body.pay_package = true;
  } else {
    const course = courseFor(W.cat);
    if (!course) return toast(`${W.cat} toifa uchun mashg‘ulot topilmadi (Kengaytirilgan panel → Mashg‘ulotlar)`, true);
    if (W.sess.some(x => !x.t)) return toast('Vaqtni tanlang', true);
    const at = W.sess.map(sessAt);
    /* Instruktor ixtiyoriy — tanlanmasa chekni kim ursa, dars o'shaniki */
    Object.assign(body, { full_name: W.name, phone: W.phone, customer_id: W.customer?.id || null, instructor_id: W.ins?.id || null,

  try{

    const list = d.receipts?.length ? d.receipts : [d.receipt];
    CO_reset();
    toast(list.length > 1 ? `${list.length} ta chek chiqarildi` : 'Chek chiqarildi');

const coHtml = {};
function coSwap(el, key, html){

  const t = document.createElement('template'); t.innerHTML = html.trim();

}

/* ---------- joyida yangilash ----------
   Faqat berilgan bo'limlar almashtiriladi. «anchor» — bosilgan bo'lim:
   uning sarlavhasi ekranda qayerda bo'lsa, o'sha joyda qoladi. */
const CO_SECS = { cat: coCatSec, dur: coDurSec, now: coNowSec, time: coTimeSec, ins: coInsSec, pay: coPaySec };

function coScrollBy(d){ if (d) window.scrollTo({ top: window.scrollY + d, behavior: 'instant' }); }
function coPatch(anchor, keys){
  const W = CO, form = document.querySelector('.co-form');
  if (!form || S.routeName !== 'issue' || W.booking) return coRender();
  const a0 = anchor ? $('co-' + anchor)?.getBoundingClientRect().top : null;
  coNowSync(W);
  const changed = new Set();
  for (const k of new Set(keys)) {
    const fn = CO_SECS[k]; if (!fn) continue;
    const html = fn(W), el = $('co-' + k);
    if (el) { if (!html) { el.remove(); delete coHtml[k]; } else if (coSwap(el, k, html)) changed.add(k); }
    else if (html) {
      const prev = CO_ORDER.slice(0, CO_ORDER.indexOf(k)).reverse().map(x => $('co-' + x)).find(Boolean);
      if (prev) prev.insertAdjacentHTML('afterend', html); else form.insertAdjacentHTML('afterbegin', html);
      const n = $('co-' + k); if (n) n.dataset.v0 = '1';

  if (changed.has('pay')) payBind(W);

  const a1 = anchor ? $('co-' + anchor)?.getBoundingClientRect().top : null;

    if (a0 < 64) coScrollBy(a1 - 76);          // sarlavha ekrandan chiqib ketgan edi — ko'rinadigan joyga

/* =========================================================================
   DAVR TANLASH — BARCHA hisobotlar uchun bitta: Kun · Hafta · Oy · Yil · Oraliq
   «12 dan 28 gacha» — Oraliq: «Dan» va «Gacha» sanalari. Kun/hafta/oy/yil
   strelkalar bilan oldinga-orqaga suriladi, o'rtadagi sanani bosib
   istalgan kunni tanlash mumkin. Serverga doim from/to (ikkala kun kiradi).
   ========================================================================= */
const PER_L = [['day', 'Kun'], ['week', 'Hafta'], ['month', 'Oy'], ['year', 'Yil'], ['range', 'Oraliq']];
const PERS = {};
const perReg = (k, st, load) => { PERS[k] = { st, load }; };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const curYear = () => Number(kToday().slice(0, 4));
function monthStart(d, n = 0){ let [y, m] = ymdParts(d); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}-01`; }
function perBounds(st){
  const d = st.date || kToday();
  const [y] = ymdParts(d);
  switch (st.per) {
    case 'week': { const a = dayAdd(d, -((wdOf(d) + 6) % 7)); return [a, dayAdd(a, 6)]; }
    case 'month': return [monthStart(d), dayAdd(monthStart(d, 1), -1)];
    case 'year': return [`${y}-01-01`, `${y}-12-31`];
    case 'range': { const a = st.from || d, b = st.to || d; return a <= b ? [a, b] : [b, a]; }
    default: return [d, d];
  }
}
const perQS = st => { const [a, b] = perBounds(st); return `from=${a}&to=${b}`; };
const perDays = st => { const [a, b] = perBounds(st); return Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 864e5) + 1; };
function dayText(d, withWd){
  const t = kToday(), [y, m, dd] = ymdParts(d);
  const base = `${dd}-${MONF[m - 1]}${y !== curYear() ? ' ' + y : ''}`;
  if (d === t) return `Bugun, ${base}`;
  if (d === dayAdd(t, -1)) return `Kecha, ${base}`;
  return withWd ? `${base}, ${WDF[wdOf(d)]}` : base;
}
function rngText(a, b){
  if (a === b) return dayText(a);
  const [y1, m1, d1] = ymdParts(a), [y2, m2, d2] = ymdParts(b), yy = y1 !== curYear() ? ' ' + y1 : '';
  if (y1 === y2 && m1 === m2) return `${d1}–${d2}-${MONF[m1 - 1]}${yy}`;
  if (y1 === y2) return `${d1}-${MONF[m1 - 1]} – ${d2}-${MONF[m2 - 1]}${yy}`;
  return `${d1}.${pad(m1)}.${y1} – ${d2}.${pad(m2)}.${y2}`;
}
function perTitle(st){
  const [a, b] = perBounds(st), [y, m] = ymdParts(a);
  if (st.per === 'month') return `${cap(MONF[m - 1])} ${y}`;
  if (st.per === 'year') return `${y}-yil`;
  if (st.per === 'day') return dayText(a, true);
  return rngText(a, b);
}
function perStep(st, n){
  const d = st.date || kToday();
  if (st.per === 'week') return dayAdd(d, 7 * n);
  if (st.per === 'month') return monthStart(d, n);
  if (st.per === 'year') return `${ymdParts(d)[0] + n}-01-01`;
  return dayAdd(d, n);
}
function perHtml(k){

ACT.perset = el => {

  if (v === 'range') {

/* Davr bo'yicha ustunlar kalitlari: har kun (bo'sh kunlar ham — 0 bilan),
   62 kundan uzun bo'lsa — har oy. Bugundan keyingi kunlar chizilmaydi. */
function spanKeys(st){
  const [a, b] = perBounds(st), end = b > kToday() ? kToday() : b;
  if (end < a) return [];
  const n = Math.round((Date.parse(end + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 864e5) + 1;
  const out = [];
  if (n > 62) { for (let m = a.slice(0, 7); m <= end.slice(0, 7); m = monthStart(m + '-01', 1).slice(0, 7)) out.push(m); }
  else for (let i = 0; i < n; i++) out.push(dayAdd(a, i));
  return out;
}
const keyLabel = k => k.length === 7 ? MONS[Number(k.slice(5, 7)) - 1] : String(Number(k.slice(8)));
const keyTitle = k => k.length === 7 ? `${cap(MONF[Number(k.slice(5, 7)) - 1])} ${k.slice(0, 4)}` : dayText(k);
/* Kunlar/oylar bo'yicha ustunli diagramma */
function dayBars(days, key, st, fmt = nf){
  const keys = spanKeys(st); if (!keys.length) return '';
  const monthly = keys[0].length === 7, m = new Map();
  for (const d of days) { const k = monthly ? d.day.slice(0, 7) : d.day; m.set(k, (m.get(k) || 0) + (Number(d[key]) || 0)); }
  const max = Math.max(...keys.map(k => m.get(k) || 0), 1), step = Math.ceil(keys.length / 16);
  return `<div class="bars">${keys.map((k, i) => {
    const v = m.get(k) || 0;
    return `<div title="${esc(keyTitle(k))} — ${esc(fmt(v))}"><i class="${v ? '' : 'z'}" style="height:${Math.max(3, Math.round(v / max * 100))}%"></i><span>${i % step ? '' : esc(keyLabel(k))}</span></div>`;
  }).join('')}</div>`;
}

function irSorted(){

/* Kunlar/oylar bo'yicha: yashil — avtoshkola, ko'k — pullik */
function stackBars(days, st){
  const keys = spanKeys(st); if (!keys.length) return '';
  const monthly = keys[0].length === 7, m = new Map();
  for (const d of days) {
    const k = monthly ? d.day.slice(0, 7) : d.day;
    const x = m.get(k) || { s: 0, p: 0 }; x.s += Number(d.school) || 0; x.p += Number(d.paid) || 0; m.set(k, x);
  }
  const val = k => m.get(k) || { s: 0, p: 0 };
  const max = Math.max(...keys.map(k => val(k).s + val(k).p), 1), step = Math.ceil(keys.length / 16);
  return `<div class="bars stk">${keys.map((k, i) => {
    const v = val(k), tot = v.s + v.p;
    return `<div title="${esc(keyTitle(k))} — avtoshkola ${v.s}, pullik ${v.p}"><i class="${tot ? '' : 'z'}" style="height:${Math.max(3, Math.round(tot / max * 100))}%"><u style="height:${tot ? Math.round(v.s / tot * 100) : 0}%"></u></i><span>${i % step ? '' : esc(keyLabel(k))}</span></div>`;
  }).join('')}</div>
  <div class="lgd"><span><i style="background:#16a34a"></i>Avtoshkola</span><span><i style="background:var(--accent)"></i>Pullik</span></div>`;
}

/* =========================================================================
   O'QUVCHINI QAYTARISH — instruktor «sotuvchi» (faqat administrator).

   Davr — birinchi dars sanasi bo'yicha (har dushanba o'tgan haftani ko'rish).

const RT = { per: 'week', date: kToday(), from: '', to: '', d: null, seq: 0, filter: '', q: '', did: '' };
perReg('rt', RT, () => { RT.d = null; if ($('rtBody')) { $('rtBody').innerHTML = skel(4); loadRetention(); } });
const RT_ST = { returned: ['Qaytdi', 'ok'], waiting: ['Kutilmoqda', 'info'], moved: ['Boshqaga o‘tdi', 'warn'], lost: ['Qaytmadi', 'bad'] };
const rtRate = r => r === null || r === undefined ? '—' : `${String(r).replace('.', ',')}%`;
const rtCls = r => r === null || r === undefined ? '' : r >= 70 ? 'rt-good' : r >= 40 ? 'rt-mid' : 'rt-bad';
const rtBar = r => `<i class="rt-bar"><u class="${rtCls(r)}" style="width:${Math.max(0, Math.min(100, Number(r) || 0))}%"></u></i>`;
const rtRule = () => `<div class="note info rt-rule">${I('refresh', 18)}<span><b>Qoida:</b> yangi pullik o‘quvchining birinchi darsi kimga tushsa — o‘sha instruktor <b>jalb qilgan</b>.

/* =========================================================================
   ISH GRAFIGI — har instruktor qaysi kun, soat nechdan nechgacha ishlaydi,
   qachon tushlik / tanaffus / dam. Instruktor panelidagi «Bo‘sh vaqtlarim»
   kabi: soatni bosing — yopiladi yoki ochiladi.
     · Haftalik grafik — har hafta takrorlanadi (Du … Yak)
     · Sana bo‘yicha  — aniq bir kunga alohida (bayram, ta’til, qisqa kun)
   Grafikdan tashqari vaqtga Mini App, operator, kassa bron qila olmaydi.
   ========================================================================= */
const WP = { list: null, d: null, id: '', tab: 'week', wd: 1, date: '', drafts: {}, seq: 0, lseq: 0 };
const WP_WD = [1, 2, 3, 4, 5, 6, 0];   // Du … Yak
const wpClone = o => JSON.parse(JSON.stringify(o ?? null));
const wpM = t => toMin(t) ?? 0;
const wpHm = m => m >= 1440 ? '24:00' : fromMin(m);
const wpRanges = spec => (spec?.closed || []).map(([a, b]) => [wpM(a), wpM(b)]).filter(([a, b]) => b > a);
function wpMerge(list){
  const s = list.filter(([a, b]) => b > a).map(([a, b]) => [Math.max(0, a), Math.min(1440, b)]).sort((x, y) => x[0] - y[0]);
  const out = [];
  for (const r of s) { const l = out[out.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else out.push([r[0], r[1]]); }
  return out;
}
function wpSub(list, [a, z]){
  const out = [];
  for (const [x, y] of list) { if (y <= a || x >= z) out.push([x, y]); else { if (x < a) out.push([x, a]); if (y > z) out.push([z, y]); } }
  return out;
}
const wpSet = (spec, ranges) => { spec.closed = wpMerge(ranges).map(([a, b]) => [wpHm(a), wpHm(b)]); };
const wpWork = d => ({ ws: wpM((d || WP.d || WP.list)?.work_start || '07:00'), we: wpM((d || WP.d || WP.list)?.work_end || '19:00'), st: Math.max(15, Number((d || WP.d || WP.list)?.slot_step_min) || 60) });
function wpSlots(d){ const { ws, we, st } = wpWork(d); const out = []; for (let m = ws; m + st <= we; m += st) out.push([m, m + st]); return out; }
const wpShut = (spec, a, z) => !!spec && (spec.off || wpRanges(spec).some(([x, y]) => x < z && y > a));
/** Ochiq oraliqlar (ish vaqti ichida). */
function wpOpen(spec, d){
  if (spec?.off) return [];
  const out = [];
  for (const [a, z] of wpSlots(d)) {
    if (wpShut(spec, a, z)) continue;
    const l = out[out.length - 1];
    if (l && l[1] === a) l[1] = z; else out.push([a, z]);
  }
  return out;
}
const wpOpenMin = (spec, d) => wpOpen(spec, d).reduce((s, [a, z]) => s + z - a, 0);
function wpDesc(spec, d){
  const o = wpOpen(spec, d);
  if (!o.length) return 'Dam olish kuni';
  return o.map(([a, z]) => `${wpHm(a)}–${wpHm(z)}`).join(', ');
}
/** Ro'yxatdagi qisqa ko'rinish: «9–17» (tanaffus bo'lsa nuqta bilan) yoki «dam». */
function wpShort(spec, d){
  const o = wpOpen(spec, d);
  if (!o.length) return { t: 'dam', c: 'off' };
  const h = m => (m % 60 ? wpHm(m) : String(m / 60));
  return { t: `${h(o[0][0])}–${h(o[o.length - 1][1])}${o.length > 1 ? ' ·' : ''}`, c: spec ? '' : 'def' };
}
const wpHours = m => { const h = m / 60; return Number.isInteger(h) ? `${h}` : h.toFixed(1).replace('.', ','); };

/* ---------- qoralama: saqlangungacha xotirada (boshqa sahifaga o'tsa ham yo'qolmaydi) ---------- */
const wpBase = () => WP.d?.schedule || { week: {}, dates: {} };
const wpCur = () => WP.drafts[WP.id] || wpBase();
const wpDirty = (id = WP.id) => !!WP.drafts[id];
function wpEdit(fn){
  const s = wpClone(wpCur()); s.week = s.week || {}; s.dates = s.dates || {};
  fn(s);
  WP.drafts[WP.id] = JSON.stringify(s) === JSON.stringify(wpBase()) ? undefined : s;
  if (!WP.drafts[WP.id]) delete WP.drafts[WP.id];
  wpPaint();
}
const wpWeekSpec = (s, w) => s.week?.[String(w)] || null;
const wpDateSpec = (s, day) => s.dates?.[day] || wpWeekSpec(s, wdOf(day));

/* =========================== RO'YXAT =========================== */
function vGrafik(arg){
  if (arg) return vWpEdit(arg);
  $('view').innerHTML = `<div class="view">
    <div class="note info" style="display:flex;gap:10px;align-items:flex-start">${I('clock', 20)}<span>Har instruktor qaysi kun, soat <b>nechdan nechgacha</b> ishlashi va <b>tanaffusini</b> belgilang. Grafikdan tashqari vaqtga mijoz (Mini App), operator va kassa <b>bron qila olmaydi</b>.</span></div>
    <div id="wpList" class="sec" style="margin-top:12px">${skel(4)}</div></div>`;
  wpLoadList();
}
async function wpLoadList(quiet){
  const seq = ++WP.lseq;
  try {
    const d = await api('/api/admin/work-schedules');
    if (seq !== WP.lseq) return;
    WP.list = d; wpPaintList();
  } catch (e) { if (!quiet && $('wpList')) $('wpList').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}
function wpPaintList(){
  const box = $('wpList'); if (!box || !WP.list) return;
  const L = WP.list, rows = L.instructors || [];
  if (!rows.length) { box.innerHTML = emptyHtml('users', 'Instruktor yo‘q', 'Instruktorlar bo‘limida qo‘shing yoki arizani tasdiqlang.'); return; }
  const todayWd = wdOf(L.today || kToday());
  box.innerHTML = `<div class="wp-legend"><span><i class="wk"></i>ish vaqti</span><span><i class="def"></i>grafik qo‘yilmagan — to‘liq kun</span><span><i class="off"></i>dam</span><span>· — tanaffus bor</span></div>
    <div class="list">${rows.map(i => {
      const s = WP.drafts[i.id] || i.schedule;
      const has = !!(s && (Object.keys(s.week || {}).length || Object.keys(s.dates || {}).length));
      const cells = WP_WD.map(w => { const x = wpShort(s ? wpWeekSpec(s, w) : null, L);
        return `<span class="wp-c ${x.c} ${w === todayWd ? 'td' : ''}"><em>${WDS[w]}</em><b>${esc(x.t)}</b></span>`; }).join('');
      return `<button class="row wp-row" data-go="grafik/${esc(i.id)}">
        <span class="ava" style="${i.active ? '' : 'opacity:.45'}">${esc(ini(i.name))}</span>
        <span class="tx"><b>${esc(i.name)}${wpDirty(i.id) ? ' <span class="pill warn">saqlanmagan</span>' : ''}${i.active ? '' : ' <span class="pill">o‘chirilgan</span>'}</b>
          <small>${esc((i.categories || []).join(', '))} toifa · ${has ? 'grafik bor' : 'grafik qo‘yilmagan'}</small>
          <span class="wp-week">${cells}</span></span>${I('chev')}</button>`;
    }).join('')}</div>`;
}

/* =========================== TAHRIRLASH =========================== */
function vWpEdit(id){
  if (WP.id !== id) { WP.d = null; WP.id = id; WP.tab = 'week'; WP.wd = wdOf(kToday()); WP.date = kToday(); }
  $('view').innerHTML = `<div class="view"><div id="wpHead"></div><div id="wpBody">${skel(5)}</div><div id="wpSave"></div></div>`;
  $('view').className = 'wrap has-bar';
  if (WP.d && String(WP.d.instructor?.id) === id) wpPaint();
  wpLoad(id);
}
async function wpLoad(id, quiet){
  const seq = ++WP.seq;
  try {
    const d = await api(`/api/admin/instructors/${encodeURIComponent(id)}/work-schedule?days=14`);
    if (seq !== WP.seq || WP.id !== id) return;
    const same = quiet && WP.d && JSON.stringify(WP.d) === JSON.stringify(d);
    WP.d = d;
    if (!WP.date || WP.date < d.today) WP.date = d.today;
    if (!same) wpPaint();
  } catch (e) { if (!quiet && $('wpBody')) $('wpBody').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}
function wpPaint(){
  const d = WP.d; if (!d || !$('wpBody')) return;
  const s = wpCur(), ins = d.instructor || {};
  const todaySpec = wpDateSpec(s, d.today);
  $('tbTitle').textContent = `Ish grafigi — ${ins.name || ''}`;
  $('wpHead').innerHTML = `<div class="card wp-head"><span class="ava lg">${esc(ini(ins.name))}</span>
    <div class="tx"><b>${esc(ins.name || 'Instruktor')}</b><small>${esc((ins.categories || []).join(', '))} toifa${ins.phone ? ' · ' + esc(ins.phone) : ''}</small>
      <span class="wp-today">${I('clock', 15)} Bugun: <b>${esc(wpDesc(todaySpec, d))}</b></span></div></div>
    <div class="seg" style="margin-top:12px"><button class="${WP.tab === 'week' ? 'on' : ''}" data-act="wptab" data-v="week">Haftalik grafik</button>
      <button class="${WP.tab === 'date' ? 'on' : ''}" data-act="wptab" data-v="date">Sana bo‘yicha${Object.keys(s.dates || {}).length ? `<span class="n" style="background:var(--accent)">${Object.keys(s.dates).length}</span>` : ''}</button></div>`;
  $('wpBody').innerHTML = WP.tab === 'week' ? wpWeekHtml(s) : wpDateHtml(s);
  const dirty = wpDirty();
  $('wpSave').innerHTML = `<div class="wp-save ${dirty ? 'on' : ''}"><div class="wp-save-in">
    <span class="tx"><b>${dirty ? 'O‘zgarishlar saqlanmagan' : 'Hammasi saqlangan'}</b><small>${dirty ? 'Saqlang — Mini App, operator va kassa yangi grafik bo‘yicha ishlaydi' : 'Mijozlar shu grafik bo‘yicha bron qiladi'}</small></span>
    ${dirty ? `<button class="btn btn-soft" data-act="wpreset">Bekor</button>` : ''}
    <button class="btn btn-primary" data-act="wpsave" ${dirty ? '' : 'disabled'}>${I('check', 19, 2.4)} Saqlash</button></div></div>`;
}

/* ---------- soatlar ro'yxati ---------- */
function wpSlotHtml(spec, a, z, extra = {}){
  const time = `<span class="h">${wpHm(a)}<small>– ${wpHm(z)}</small></span>`;
  if (extra.bk) {
    const b = extra.bk, warn = wpShut(spec, a, z);
    return `<div class="wp-slot bk ${warn ? 'warn' : ''}">${time}<span class="s"><b>Bron · ${esc(b.customer_name)}</b>
      <small>${esc((ST[b.status] || [b.status])[0])}${warn ? ' · ⚠ grafikdan tashqarida — mijoz bilan kelishing' : ' · yopib bo‘lmaydi'}</small></span></div>`;
  }
  if (extra.past) return `<div class="wp-slot past">${time}<span class="s"><b>O‘tib ketdi</b></span></div>`;
  if (spec?.off) return `<div class="wp-slot shut dis">${time}<span class="s"><b>Dam olish kuni</b><small>Kun yoqilmagan</small></span><span class="sw"></span></div>`;
  if (extra.own && !wpShut(spec, a, z)) return `<button class="wp-slot own" data-act="wpown" data-a="${a}" data-z="${z}">${time}<span class="s"><b>Instruktor o‘zi yopgan</b><small>Bosing — ochish</small></span>${I('lock', 18)}</button>`;
  const shut = wpShut(spec, a, z);
  return `<button class="wp-slot ${shut ? 'shut' : 'open'}" data-act="wptog" data-a="${a}" data-z="${z}" aria-pressed="${!shut}">${time}
    <span class="s"><b>${shut ? 'Dam / tanaffus' : 'Ishlaydi'}</b><small>${shut ? 'Bron qilib bo‘lmaydi' : 'Mijoz bron qila oladi'}</small></span><span class="sw ${shut ? '' : 'on'}"></span></button>`;
}
function wpSumHtml(spec){
  const all = wpSlots().length * wpWork().st, open = wpOpenMin(spec);
  return `<div class="wp-sum"><div class="f"><b>${wpHours(open)}</b>soat ishlaydi</div><div class="c"><b>${wpHours(spec?.off ? all : all - open)}</b>soat dam</div></div>`;
}
function wpQuickHtml(spec){
  const o = wpOpen(spec), { ws, we, st } = wpWork();
  const from = o.length ? o[0][0] : ws, to = o.length ? o[o.length - 1][1] : we;
  const opts = (lo, hi, cur) => { let h = ''; for (let m = lo; m <= hi; m += st) h += `<option value="${m}" ${m === cur ? 'selected' : ''}>${wpHm(m)}</option>`; return h; };
  return `<div class="wp-quick"><label><span>Ishga keladi</span><select class="input" id="wpFrom">${opts(ws, we - st, from)}</select></label>
    <label><span>Ketadi</span><select class="input" id="wpTo">${opts(ws + st, we, to)}</select></label>
    <button class="btn btn-soft" data-act="wpapply">${I('check', 18, 2.4)} Qo‘llash</button></div>`;
}

/* ---------- HAFTALIK ---------- */
function wpWeekHtml(s){
  const w = WP.wd, spec = wpWeekSpec(s, w);
  const chips = WP_WD.map(x => { const sh = wpShort(wpWeekSpec(s, x));
    return `<button class="chip wp-day ${x === w ? 'on' : ''} ${sh.c}" data-act="wpwd" data-v="${x}">${WDS[x]}<small>${esc(sh.t)}</small></button>`; }).join('');
  return `<div class="chips" style="margin-top:12px">${chips}</div>
    <div class="card" style="margin-top:10px">
      <div class="wp-dayhead"><div><h2>${esc(cap(WDF[w]))}</h2><span class="muted">${esc(spec ? wpDesc(spec) : 'Grafik qo‘yilmagan — to‘liq ish kuni')}</span></div>
        <button class="wp-onoff" data-act="wpoff"><span>${spec?.off ? 'Dam olish kuni' : 'Ish kuni'}</span><span class="sw ${spec?.off ? '' : 'on'}"></span></button></div>
      ${spec?.off ? '' : wpQuickHtml(spec)}
      ${wpSumHtml(spec)}
      <div class="wp-acts"><button class="btn btn-soft btn-sm" data-act="wpall" data-v="open">🔓 Hammasini ochish</button>
        <button class="btn btn-soft btn-sm" data-act="wpcopy">📋 Boshqa kunlarga</button></div>
      <p class="muted wp-hint">Soatni bosing — <b>yopiladi</b> (tanaffus, dam) yoki <b>ochiladi</b>. Har ${esc(cap(WDF[w]))} shunday bo‘ladi.</p>
      <div class="wp-slots">${wpSlots().map(([a, z]) => wpSlotHtml(spec, a, z)).join('')}</div>
    </div>`;
}

/* ---------- SANA BO'YICHA ---------- */
function wpDateHtml(s){
  const d = WP.d, day = WP.date, own = s.dates?.[day], spec = wpDateSpec(s, day);
  const days = Array.from({ length: d.days || 14 }, (_, i) => dayAdd(d.today, i));
  const chips = days.map((x, i) => { const sp = wpDateSpec(s, x), sh = wpShort(sp);
    return `<button class="chip wp-day ${x === day ? 'on' : ''} ${sh.c}" data-act="wpdate" data-v="${x}">${i === 0 ? 'Bugun' : i === 1 ? 'Ertaga' : WDS[wdOf(x)]}<small>${esc(Number(x.slice(8)) + ' ' + MONS[Number(x.slice(5, 7)) - 1])}${s.dates?.[x] ? ' ●' : ''}</small></button>`; }).join('');
  const d0 = atTk(day, '00:00').getTime();
  const rel = iso => (Date.parse(iso) - d0) / 60000;
  const bks = (d.bookings || []).filter(b => rel(b.end_at) > 0 && rel(b.start_at) < 1440);
  const ownBl = (d.blocks || []).filter(b => rel(b.end_at) > 0 && rel(b.start_at) < 1440);
  const nowMin = day === d.today ? toMin(nowHM()) : -1;
  const slots = wpSlots().map(([a, z]) => {
    const bk = bks.find(b => rel(b.start_at) < z && rel(b.end_at) > a);
    const ownB = ownBl.some(b => rel(b.start_at) < z && rel(b.end_at) > a);
    return wpSlotHtml(spec, a, z, { bk, own: ownB, past: !bk && z <= nowMin });
  }).join('');
  return `<div class="chips" style="margin-top:12px">${chips}</div>
    <div class="card" style="margin-top:10px">
      <div class="wp-dayhead"><div><h2>${esc(dayTitle(day))}</h2>
        <span class="muted">${esc(wpDesc(spec))}</span>
        <div style="margin-top:6px">${own ? `<span class="pill acc">Shu sana uchun alohida</span> <button class="link" data-act="wpdreset" style="font-size:13px">Haftalik grafikka qaytarish</button>`
          : `<span class="pill">Haftalik grafik bo‘yicha (${esc(WDF[wdOf(day)])})</span>`}</div></div>
        <button class="wp-onoff" data-act="wpdoff"><span>${spec?.off ? 'Dam olish kuni' : 'Ish kuni'}</span><span class="sw ${spec?.off ? '' : 'on'}"></span></button></div>
      ${wpSumHtml(spec)}
      <div class="wp-acts"><button class="btn btn-soft btn-sm" data-act="wpdall" data-v="open">🔓 Hammasini ochish</button>
        <button class="btn btn-soft btn-sm" data-act="wpdall" data-v="shut">🔒 Kunni yopish</button></div>
      <p class="muted wp-hint">Faqat <b>${esc(dayLabel(day))}</b> uchun o‘zgaradi (masalan, ta’til yoki qisqa kun). Bron bor soatni yopib bo‘lmaydi.</p>
      <div class="wp-slots">${slots}</div>
    </div>`;
}

/* ---------- amallar ---------- */
const wpWeekEdit = fn => wpEdit(s => { const k = String(WP.wd); const spec = s.week[k] || { off: false, closed: [] }; fn(spec, s); s.week[k] = spec; });
const wpDayEdit = fn => wpEdit(s => {
  const day = WP.date;
  const spec = s.dates[day] || wpClone(wpWeekSpec(s, wdOf(day))) || { off: false, closed: [] };
  fn(spec, s); s.dates[day] = spec;
});
/** Shu kunning bron bor soatlari (daqiqa) — yopilmasin. */
function wpBusyRanges(day){
  const d0 = atTk(day, '00:00').getTime();
  return (WP.d?.bookings || []).filter(b => ['pending', 'confirmed', 'in_progress'].includes(b.status))
    .map(b => [(Date.parse(b.start_at) - d0) / 60000, (Date.parse(b.end_at) - d0) / 60000]).filter(([a, z]) => z > 0 && a < 1440);
}
ACT.wptab = el => { WP.tab = el.dataset.v; wpPaint(); };
ACT.wpwd = el => { WP.wd = Number(el.dataset.v); wpPaint(); };
ACT.wpdate = el => { WP.date = el.dataset.v; wpPaint(); };
ACT.wptog = el => {
  const a = Number(el.dataset.a), z = Number(el.dataset.z);
  const tog = spec => { const r = wpRanges(spec); wpSet(spec, wpShut(spec, a, z) ? wpSub(r, [a, z]) : [...r, [a, z]]); };
  if (WP.tab === 'week') wpWeekEdit(tog); else wpDayEdit(tog);
};
ACT.wpoff = () => wpWeekEdit(spec => { spec.off = !spec.off; });
ACT.wpdoff = () => {
  const busy = wpBusyRanges(WP.date);
  const spec = wpDateSpec(wpCur(), WP.date);
  if (!spec?.off && busy.length) { toast('Bu kunda bron bor — butun kunni dam qilib bo‘lmaydi. Bron yo‘q soatlarni yoping.', true); return; }
  wpDayEdit(sp => { sp.off = !sp.off; });
};
ACT.wpall = el => wpWeekEdit(spec => { spec.off = false; if (el.dataset.v === 'open') spec.closed = []; });
ACT.wpdall = el => {
  const busy = wpBusyRanges(WP.date);
  wpDayEdit(spec => {
    spec.off = false;
    if (el.dataset.v === 'open') { spec.closed = []; return; }
    let r = [[0, 1440]];
    for (const b of busy) r = wpSub(r, b);
    wpSet(spec, r);
  });
  if (el.dataset.v === 'shut') toast(busy.length ? 'Kun yopildi (bron bor soatlardan tashqari). Ishlaydigan soatni bosib oching.' : 'Kun yopildi. Ishlaydigan soatni bosib oching.');
};
ACT.wpapply = () => {
  const from = Number($('wpFrom').value), to = Number($('wpTo').value);
  if (!(to > from)) { toast('Ketish vaqti kelish vaqtidan keyin bo‘lsin', true); return; }
  wpWeekEdit(spec => {
    spec.off = false;
    const inner = wpRanges(spec).filter(([a, z]) => z > from && a < to).map(([a, z]) => [Math.max(a, from), Math.min(z, to)]);
    wpSet(spec, [[0, from], [to, 1440], ...inner]);
  });
  toast(`${cap(WDF[WP.wd])}: ${wpHm(from)} dan ${wpHm(to)} gacha`);
};
ACT.wpdreset = () => wpEdit(s => { delete s.dates[WP.date]; });
ACT.wpreset = async () => {
  const ok = await ask({ title: 'O‘zgarishlar bekor qilinsinmi?', text: 'Saqlanmagan o‘zgarishlar o‘chadi, oxirgi saqlangan grafik qaytadi.', ok: 'Bekor qilish', danger: true });
  if (!ok) return;
  delete WP.drafts[WP.id]; wpPaint();
};

/* Boshqa kunlarga nusxalash */
WP.copy = new Set();
ACT.wpcopy = () => {
  const s = wpCur(), spec = wpWeekSpec(s, WP.wd);
  WP.copy = new Set();
  const paint = () => {
    $('wpCopyDays').innerHTML = WP_WD.filter(x => x !== WP.wd).map(x => `<button class="chip ${WP.copy.has(x) ? 'on' : ''}" data-act="wpcpk" data-v="${x}">${WDS[x]}</button>`).join('');
    $('wpCopyGo').disabled = !WP.copy.size;
  };
  openSheet(`<h3>Boshqa kunlarga nusxalash</h3>
    <p class="lead">${esc(cap(WDF[WP.wd]))} grafigi — <b>${esc(spec ? wpDesc(spec) : 'to‘liq ish kuni')}</b> — qaysi kunlarga ham qo‘yilsin?</p>
    <div class="wp-copy" id="wpCopyDays"></div>
    <div class="grid2" style="margin-top:12px"><button class="btn btn-soft btn-sm" data-act="wpcpq" data-v="work">Du–Sha (ish kunlari)</button><button class="btn btn-soft btn-sm" data-act="wpcpq" data-v="all">Hamma kunlar</button></div>
    <button class="btn btn-primary" id="wpCopyGo" data-act="wpcpgo" style="margin-top:14px">Nusxalash</button>`);
  WP.copyPaint = paint; paint();
};
ACT.wpcpk = el => { const v = Number(el.dataset.v); WP.copy.has(v) ? WP.copy.delete(v) : WP.copy.add(v); WP.copyPaint?.(); };
ACT.wpcpq = el => { WP.copy = new Set(WP_WD.filter(x => x !== WP.wd && (el.dataset.v === 'all' || x !== 0))); WP.copyPaint?.(); };
ACT.wpcpgo = () => {
  const src = wpClone(wpWeekSpec(wpCur(), WP.wd)) || { off: false, closed: [] };
  const n = WP.copy.size;
  wpEdit(s => { for (const x of WP.copy) s.week[String(x)] = wpClone(src); });
  closeSheet();
  toast(`${n} ta kunga nusxalandi — saqlashni unutmang`);
};

/* Instruktor o'zi yopgan soatni admin ochadi (darhol saqlanadi) */
ACT.wpown = async el => {
  const a = Number(el.dataset.a), z = Number(el.dataset.z), day = WP.date, d = WP.d;
  const ok = await ask({ title: `${wpHm(a)}–${wpHm(z)} ochilsinmi?`, text: `${d.instructor?.name || 'Instruktor'} bu soatni o‘zi yopgan. Ochsangiz — mijozlar bron qila oladi.`, ok: 'Ochish' });
  if (!ok) return;
  const d0 = atTk(day, '00:00').getTime();
  let r = (d.blocks || []).map(b => [(Date.parse(b.start_at) - d0) / 60000, (Date.parse(b.end_at) - d0) / 60000]).filter(([x, y]) => y > 0 && x < 1440);
  r = wpSub(wpMerge(r), [a, z]);
  try {
    await api(`/api/admin/instructors/${encodeURIComponent(d.instructor.id)}/blocks`, { method: 'PUT',
      body: JSON.stringify({ date: day, slots: r.map(([x, y]) => ({ from: wpHm(Math.max(0, x)), to: wpHm(Math.min(1440, y)) })) }) });
    toast(`${wpHm(a)} ochildi`);
    wpLoad(d.instructor.id, true);
  } catch (e) { fail(e); }
};

/* Saqlash */
ACT.wpsave = async el => {
  const s = WP.drafts[WP.id]; if (!s) return;
  busyBtn(el, true, 'Saqlanmoqda');
  try {
    const r = await api(`/api/admin/instructors/${encodeURIComponent(WP.id)}/work-schedule`, { method: 'PUT', body: JSON.stringify({ week: s.week || {}, dates: s.dates || {} }) });
    WP.d.schedule = r.schedule; delete WP.drafts[WP.id];
    SCHC.clear();
    if (WP.list) { const it = (WP.list.instructors || []).find(x => String(x.id) === String(WP.id)); if (it) it.schedule = r.schedule; }
    wpPaint();
    toast('Grafik saqlandi');
    const c = r.conflicts || [];
    if (c.length) openSheet(`<h3>${c.length} ta bron grafikdan tashqarida qoldi</h3>
      <p class="lead">Bronlar o‘zgarmadi. Mijoz bilan kelishib, vaqtini o‘zgartiring yoki boshqa instruktorga o‘tkazing.</p>
      <div class="list">${c.map(b => `<div class="row"><span class="ic">${I('clock', 19)}</span><span class="tx"><b>${esc(whenText(b.start_at))} · ${esc(b.customer_name)}</b>
        <small>${esc((ST[b.status] || [b.status])[0])}${b.customer_phone ? ' · ' + esc(b.customer_phone) : ''}</small></span>${b.customer_phone ? `<a class="icon-btn" href="${telHref(b.customer_phone)}" aria-label="Qo‘ng‘iroq">${I('phone', 18)}</a>` : ''}</div>`).join('')}</div>
      <button class="btn btn-primary" data-go="bookings/all" style="margin-top:14px">Bronlarga o‘tish</button>`);
  } catch (e) { fail(e); }
  finally { busyBtn(el, false); }
};
/* =========================================================================
   EXCEL BRON — adminlar o'rgangan Excel jadvali, panelning o'zida
   Ustun — instruktor (ismi, telefoni), qator — soat 6:00 … 21:00.
   Katakka yozing va «Saqlash»ni bosing:
     · telefon raqam — haqiqiy bron (kod bilan), kassa uni raqam yoki kod
       bo'yicha topadi; bir ustunda ketma-ket soatlarga bir xil raqam —
       bitta uzun bron;
     · raqamsiz yozuv (BAND, ism, izoh) — shu soat band, Mini App, operator
       va kassa u vaqtga bron qila olmaydi.
   Klaviatura xuddi Excel'dagidek: strelkalar, Enter, Tab, Delete, F2,
   Ctrl+C / Ctrl+V (Excel'dan nusxa olib qo'yish), Ctrl+Z, Ctrl+S.
   Kassa jadvalni faqat ko'radi.
   ========================================================================= */
const XB = { date: kToday(), d: null, seq: 0, drafts: {}, sel: null, anchor: null, edit: null, undo: [], saving: false };
const XB_PAL = ['#fde047', '#86efac', '#cbd5e1', '#fdba74', '#93c5fd', '#a5b4fc', '#f9a8d4', '#5eead4', '#c4b5fd', '#fcd34d', '#7dd3fc', '#bef264'];
const XB_SRC = { app: 'Mini App', admin: 'Qo‘lda bron', walk_in: 'Kassa', school: 'Avtoshkola' };
const XB_TAG = { app: 'App', admin: 'Qo‘lda', walk_in: 'Kassa', school: 'Maktab' };
const xbDigits = p => String(p || '').replace(/\D/g, '').slice(-9);
const xbTint = (hex, k = 0.32) => {
  const n = parseInt(hex.slice(1), 16), mix = c => Math.round(c * k + 255 * (1 - k));
  return `rgb(${mix(n >> 16 & 255)},${mix(n >> 8 & 255)},${mix(n & 255)})`;
};
/** Server bilan bir xil qoida: «994188549», «99-313-56-26», «50 150 05 08», «+998 90 …» */
function xbPhone(text){
  const s = String(text || ''), g = [...s.matchAll(/\d+/g)].map(m => ({ d: m[0], a: m.index, z: m.index + m[0].length }));
  const runs = []; let cur = [];
  g.forEach((x, i) => { if (i && !/^[\s\-.()]{1,3}$/.test(s.slice(g[i - 1].z, x.a))) { runs.push(cur); cur = []; } cur.push(x.d); });
  if (cur.length) runs.push(cur);
  for (const run of runs) for (let i = 0; i < run.length; i++) {
    let d = '', local = null;
    for (let j = i; j < run.length; j++) { d += run[j]; if (d.length === 9 && !local) local = d; if (d.length === 12 && d.startsWith('998')) return '+' + d; if (d.length > 12) break; }
    if (local) return '+998' + local;
  }
  return null;
}
const xbShortPhone = p => { const m = /(\d{2})(\d{3})(\d{2})(\d{2})$/.exec(String(p || '').replace(/\D/g, '')); return m ? `${m[1]} ${m[2]} ${m[3]} ${m[4]}` : String(p || ''); };
const xbDr = () => (XB.drafts[XB.date] = XB.drafts[XB.date] || {});
const xbDirtyN = () => Object.keys(XB.drafts[XB.date] || {}).length;
const xbAllDirty = () => Object.values(XB.drafts).reduce((a, x) => a + Object.keys(x || {}).length, 0);
const xbKey = (r, c) => `${XB.d.instructors[c].id}|${String(XB.d.hours[r]).padStart(2, '0')}`;
const xbSrv = key => XB.d?.cells?.[key] || null;
const xbSrvText = key => { const c = xbSrv(key); return c && (c.k === 'sheet' || c.k === 'note') ? c.t || '' : ''; };
const xbText = key => { const d = (XB.drafts[XB.date] || {})[key]; return d ? d.t : xbSrvText(key); };
const xbEndMs = r => atTk(XB.d.date, pad(XB.d.hours[r]) + ':00').getTime() + 3600e3;
const xbPast = r => xbEndMs(r) <= Date.now();
function xbCanEdit(r, c){
  if (!XB.d?.can_edit || xbPast(r)) return false;
  const s = xbSrv(xbKey(r, c));
  return !(s && s.lock);
}

async function xbLoad(silent = false){
  if (!$('xbGrid')) return;
  if (silent && (XB.edit || XB.saving)) return;
  const seq = ++XB.seq, date = XB.date;
  try{
    const d = await api('/api/admin/booking-sheet?date=' + date);
    if (seq !== XB.seq || date !== XB.date || !$('xbGrid')) return;
    if (silent && (XB.edit || XB.saving)) return;
    XB.d = d;
    xbPaint();
  }catch(e){ if (seq === XB.seq && $('xbGrid') && !silent) $('xbGrid').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}
function xbGroups(){
  const out = [];
  for (const i of XB.d.instructors) { const l = out[out.length - 1]; if (l && l.g === i.group) l.n++; else out.push({ g: i.group, n: 1 }); }
  return out;
}
/** Katak ko'rinishi: klasslar, rang, izoh va ichi */
function xbCellParts(r, c){
  const key = xbKey(r, c), s = xbSrv(key), dr = (XB.drafts[XB.date] || {})[key];
  const past = xbPast(r), col = XB_PAL[c % XB_PAL.length];
  const cls = ['xc'];
  let inner = '', bg = xbTint(col, 0.22);
  if (dr) {
    cls.push('dirty');
    const ph = dr.t ? xbPhone(dr.t) : null;
    inner = dr.t ? `<span class="xt">${esc(dr.t)}</span><i class="xg ${ph ? 'bron' : ''}">${ph ? 'bron' : 'band'}</i>` : `<span class="xt muted">o‘chiriladi</span>`;
  } else if (s && (s.k === 'sheet' || s.k === 'note')) {
    const live = s.k === 'sheet';
    cls.push(live ? 'sb' : 'sn');
    if (s.e) cls.push('err');
    if (s.lock) cls.push('lk');
    const tag = live ? `<i class="xg bron">${esc(s.bk?.code || 'bron')}${s.bk?.paid ? ' ✓' : ''}</i>`
      : s.bk && s.bk.status === 'cancelled' ? '<i class="xg">bekor</i>' : '';
    inner = `<span class="xt">${esc(s.t)}</span>${tag}`;
  } else if (s && s.k === 'bk') {
    cls.push('ob', 'lk');
    const b = s.bk;
    inner = `<span class="xt">${esc(b.phone ? xbDigits(b.phone) : b.name)}</span><i class="xg">${esc(XB_TAG[b.src] || 'Bron')}</i>`;
  } else if (s && s.k === 'own') { cls.push('ow', 'lk'); inner = '<span class="xt">yopiq</span>'; }
  else if (s && s.k === 'off') { cls.push('of', 'lk'); inner = '<span class="xt">dam</span>'; }
  if (inner.includes('class="xg')) cls.push('tg');
  if (past) cls.push('past');
  if (XB.d.can_edit && !xbCanEdit(r, c)) cls.push('ro');
  const sel = XB.sel, an = XB.anchor || sel;
  if (sel) {
    const r0 = Math.min(sel.r, an.r), r1 = Math.max(sel.r, an.r), c0 = Math.min(sel.c, an.c), c1 = Math.max(sel.c, an.c);
    if (r >= r0 && r <= r1 && c >= c0 && c <= c1) cls.push('sel');
    if (sel.r === r && sel.c === c) cls.push('act');
  }
  return { cls, bg, title: s?.e || '', inner };
}
function xbCellHtml(r, c){
  const p = xbCellParts(r, c);
  return `<td class="${p.cls.join(' ')}" data-r="${r}" data-c="${c}" style="--cb:${p.bg}"${p.title ? ` title="${esc(p.title)}"` : ''}>${p.inner}</td>`;
}
const xbTd = (r, c) => $('xbTab')?.tBodies[0]?.rows[r]?.cells[c + 1] || null;
/** Kataklarni JOYIDA yangilaydi — DOM tuguni almashmaydi, shuning uchun
    bosish / ikki marta bosish (telefonda — yana bosish) buzilmaydi. */
function xbPatch(keys = null){
  const tab = $('xbTab'); if (!tab || !XB.d) return;
  tab.querySelectorAll('td.xc').forEach(td => {
    const r = Number(td.dataset.r), c = Number(td.dataset.c);
    if (keys && !keys.has(xbKey(r, c))) return;
    const p = xbCellParts(r, c), cls = p.cls.join(' ');
    if (td.className !== cls) td.className = cls;
    if (td._h !== p.inner) { td.innerHTML = p.inner; td._h = p.inner; }
    if ((td.title || '') !== p.title) td.title = p.title;
  });
}
/** Tanlovni belgilaydi (faqat klasslar) */
function xbMarkSel(){
  const tab = $('xbTab'); if (!tab) return;
  tab.querySelectorAll('td.xc.sel, td.xc.act').forEach(td => td.classList.remove('sel', 'act'));
  const R = xbRange(); if (!R) return;
  for (let r = R.r0; r <= R.r1; r++) for (let c = R.c0; c <= R.c1; c++) xbTd(r, c)?.classList.add('sel');
  xbTd(XB.sel.r, XB.sel.c)?.classList.add('act');
}

/* ---------- tanlash va tahrirlash ---------- */
function xbSelect(r, c, extend = false){
  const d = XB.d; if (!d) return;
  r = Math.max(0, Math.min(d.hours.length - 1, r)); c = Math.max(0, Math.min(d.instructors.length - 1, c));
  if (!extend || !XB.sel) XB.anchor = { r, c };
  else if (!XB.anchor) XB.anchor = { ...XB.sel };
  XB.sel = { r, c };
  xbMarkSel();
  xbBar();
  const td = xbTd(r, c);
  if (td) {
    /* Katak yopishqoq sarlavha va soat ustuni ostida qolmasin */
    const w = $('xbWrap'), head = $('xbTab').tHead.offsetHeight, left = $('xbTab').querySelector('th.xb-h').offsetWidth;
    if (td.offsetTop - head < w.scrollTop) w.scrollTop = td.offsetTop - head;
    else if (td.offsetTop + td.offsetHeight > w.scrollTop + w.clientHeight) w.scrollTop = td.offsetTop + td.offsetHeight - w.clientHeight;
    if (td.offsetLeft - left < w.scrollLeft) w.scrollLeft = td.offsetLeft - left;
    else if (td.offsetLeft + td.offsetWidth > w.scrollLeft + w.clientWidth) w.scrollLeft = td.offsetLeft + td.offsetWidth - w.clientWidth;
  }
}
function xbRange(){
  const s = XB.sel, a = XB.anchor || s; if (!s) return null;
  return { r0: Math.min(s.r, a.r), r1: Math.max(s.r, a.r), c0: Math.min(s.c, a.c), c1: Math.max(s.c, a.c) };
}
/** Kataklarga yozadi (qoralama). list: [{ r, c, t }]. Yozib bo'lmaydiganlari tashlab o'tiladi. */
function xbSet(list, quiet = false){
  const dr = xbDr(), step = [];
  let skipped = 0;
  for (const { r, c, t: raw } of list) {
    if (!xbCanEdit(r, c)) { skipped++; continue; }
    const key = xbKey(r, c), t = String(raw ?? '').replace(/\s+/g, ' ').trim().slice(0, 80);
    if (t === xbText(key)) continue;
    step.push({ key, before: dr[key] ? { ...dr[key] } : null });
    const srv = xbSrvText(key);
    if (t === srv) delete dr[key];
    else dr[key] = { t, prev: dr[key] ? dr[key].prev : srv };
  }
  if (step.length) { XB.undo.push({ date: XB.date, step }); if (XB.undo.length > 100) XB.undo.shift(); }
  if (!Object.keys(dr).length) delete XB.drafts[XB.date];
  if (skipped && !quiet) toast(`${skipped} ta katakka yozib bo‘lmaydi (bron, yopiq, dam yoki o‘tgan vaqt)`, true);
  xbPatch(new Set(step.map(x => x.key))); xbBar(); xbSaveBar();
  return step.length;
}
function xbUndo(){
  const u = XB.undo.pop(); if (!u) return toast('Qaytaradigan amal yo‘q');
  if (u.date !== XB.date) { XB.undo.push(u); return toast('Bu amal boshqa kunda — o‘sha kunni oching', true); }
  const dr = xbDr();
  for (const { key, before } of u.step.reverse()) { if (before) dr[key] = before; else delete dr[key]; }
  if (!Object.keys(dr).length) delete XB.drafts[XB.date];
  xbPatch(new Set(u.step.map(x => x.key))); xbBar(); xbSaveBar();
}
function xbEdit(initial = null){
  const s = XB.sel; if (!s) return;
  if (!xbCanEdit(s.r, s.c)) {
    const c = xbSrv(xbKey(s.r, s.c));
    if (XB.d.can_edit) toast(xbPast(s.r) ? 'Bu soat o‘tib ketgan' : c?.lock === 'bk' ? 'Bu soatda boshqa bron bor — avval uni bekor qiling' : c?.lock === 'own' ? 'Instruktor bu soatni o‘zi yopgan' : c?.lock === 'off' ? 'Ish grafigi bo‘yicha dam' : 'To‘langan yoki boshlangan bron — o‘zgartirib bo‘lmaydi', true);
    return;
  }
  const td = xbTd(s.r, s.c), ed = $('xbEd');
  if (!td || !ed) return;
  XB.edit = { r: s.r, c: s.c, typed: initial !== null };
  const tab = $('xbTab');
  ed.style.left = (td.offsetLeft + tab.offsetLeft) + 'px'; ed.style.top = (td.offsetTop + tab.offsetTop) + 'px';
  ed.style.width = Math.max(td.offsetWidth, 150) + 'px'; ed.style.height = td.offsetHeight + 'px';
  ed.value = initial !== null ? initial : xbText(xbKey(s.r, s.c));
  ed.classList.remove('hidden');
  ed.focus({ preventScroll: true });
  const n = ed.value.length; ed.setSelectionRange(n, n);
}
function xbCommit(move = null){
  const e = XB.edit, ed = $('xbEd'); if (!e || !ed) return;
  XB.edit = null;
  const v = ed.value;
  ed.classList.add('hidden'); ed.value = '';
  xbSet([{ r: e.r, c: e.c, t: v }]);
  $('xbWrap')?.focus({ preventScroll: true });
  if (move) xbSelect(e.r + move[0], e.c + move[1]);
}
function xbCancel(){
  const ed = $('xbEd'); XB.edit = null;
  if (ed) { ed.classList.add('hidden'); ed.value = ''; }
  $('xbWrap')?.focus({ preventScroll: true });
}
function xbBind(wrap){
  let downAt = null;
  wrap.addEventListener('mousedown', e => {
    const td = e.target.closest('td.xc'); if (!td || e.target.id === 'xbEd') return;
    if (XB.edit) xbCommit();
    const r = Number(td.dataset.r), c = Number(td.dataset.c);
    const again = XB.sel && XB.sel.r === r && XB.sel.c === c && !e.shiftKey;
    e.preventDefault();
    wrap.focus({ preventScroll: true });
    xbSelect(r, c, e.shiftKey);
    downAt = again ? { r, c } : null;
  });

  wrap.addEventListener('click', e => {

    if (e.target.id === 'xbEd') return;
    if (!XB.d) return;
    const s = XB.sel || { r: 0, c: 0 }, mod = e.ctrlKey || e.metaKey;
    const mv = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (mv) { e.preventDefault(); if (!XB.sel) return xbSelect(0, 0); return xbSelect(s.r + mv[0], s.c + mv[1], e.shiftKey); }
    if (e.key === 'Tab') { e.preventDefault(); return xbSelect(s.r, s.c + (e.shiftKey ? -1 : 1)); }
    if (e.key === 'Enter') { e.preventDefault(); if (!XB.sel) return xbSelect(0, 0); return e.shiftKey ? xbSelect(s.r - 1, s.c) : xbEdit(); }
    if (e.key === 'F2') { e.preventDefault(); return xbEdit(); }
    if (e.key === 'Escape' && XB.anchor && (XB.anchor.r !== s.r || XB.anchor.c !== s.c)) { e.preventDefault(); return xbSelect(s.r, s.c); }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      const R = xbRange(); if (!R) return;
      const list = [];

      return xbSet(list, list.length > 1);
    }
    if (mod && (e.key === 'z' || e.key === 'Z' || e.key === 'я')) { e.preventDefault(); return xbUndo(); }
    if (mod && (e.key === 's' || e.key === 'S' || e.key === 'ы')) { e.preventDefault(); return ACT.xbsave(); }
    if (!mod && !e.altKey && e.key.length === 1 && XB.sel) { e.preventDefault(); return xbEdit(e.key); }
  });
  const ed = $('xbEd');
  ed.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); return xbCommit([e.shiftKey ? -1 : 1, 0]); }
    if (e.key === 'Tab') { e.preventDefault(); return xbCommit([0, e.shiftKey ? -1 : 1]); }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); return xbCancel(); }
    if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') || (XB.edit?.typed && (e.key === 'ArrowLeft' || e.key === 'ArrowRight'))) {
      e.preventDefault();
      const mv = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
      return xbCommit(mv);
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); xbCommit(); return ACT.xbsave(); }
  });
  ed.addEventListener('blur', () => { if (XB.edit) xbCommit(); });
}

/** Jadval modeli — ekran ham, Excel ham shundan chiziladi. */
function schModel(){
  const d = SCH.d, step = SCH.step;
  let a = toMin(d.work_start) ?? 420, b = toMin(d.work_end) ?? 1140;
  for (const x of d.bookings) {
    const s = Math.floor((Date.parse(x.start_at) - schAt(d.date, 0)) / 60000), e = Math.ceil((Date.parse(x.end_at) - schAt(d.date, 0)) / 60000);
    if (s >= 0 && s < a) a = Math.floor(s / 60) * 60;
    if (e <= 1440 && e > b) b = Math.ceil(e / 60) * 60;
  }
  a = Math.floor(a / step) * step; b = Math.ceil(b / step) * step;
  const slots = []; for (let m = a; m < b; m += step) slots.push(m);
  const now = Date.now();
  const rows = d.instructors.map(ins => {
    const bk = d.bookings.filter(x => String(x.instructor_id) === String(ins.id));
    const bl = d.blocks.filter(x => String(x.instructor_id) === String(ins.id));
    const cells = slots.map(m => {
      const s = schAt(d.date, m), e = s + step * 60000;
      let best = null, bestOv = 0;
      for (const x of bk) { const ov = Math.min(e, Date.parse(x.end_at)) - Math.max(s, Date.parse(x.start_at)); if (ov > bestOv) { best = x; bestOv = ov; } }
      if (best) return { kind: 'b', key: 'b' + best.id, b: best, s, e };
      const blk = bl.find(x => Date.parse(x.start_at) < e && Date.parse(x.end_at) > s);
      if (blk) return blk.off ? { kind: 'o', key: 'o' + blk.start_at, s, e }
        : blk.sheet ? { kind: 'x', key: 'x' + blk.start_at, s, e, text: blk.text || '' } : { kind: 'k', key: 'k' + blk.start_at, s, e };
      return { kind: e <= now ? 'p' : 'f', key: '', s, e };
    });
    const spans = [];
    for (const c of cells) { const last = spans[spans.length - 1]; if (last && c.key && last.key === c.key) { last.n++; last.e = c.e; continue; } spans.push({ ...c, n: 1 }); }
    const busyMin = bk.reduce((acc, x) => acc + Math.max(0, Math.min(schAt(d.date, b), Date.parse(x.end_at)) - Math.max(schAt(d.date, a), Date.parse(x.start_at))) / 60000, 0);
    const freeMin = cells.filter(c => c.kind === 'f').length * step;
    return { ins, spans, busyMin, freeMin, count: bk.length };
  });
  return { slots, rows, step, a, b };
}
const schHours = m => { const h = m / 60; return Number.isInteger(h) ? `${h}` : h.toFixed(1).replace('.', ','); };
function paintSchedule(){
  const d = SCH.d; if (!d || !$('schGrid')) return;

  const M = schModel();
  const tot = M.rows.reduce((o, r) => ({ busy: o.busy + r.busyMin, free: o.free + r.freeMin, n: o.n + r.count }), { busy: 0, free: 0, n: 0 });
  const cap = M.rows.length * (M.b - M.a);
  $('schKpi').innerHTML = `<div class="kpis"><div class="kpi"><span>Bronlar</span><b>${tot.n}</b><small>${M.rows.length} instruktor</small></div>
    <div class="kpi"><span>Band</span><b class="bad-t">${schHours(tot.busy)} soat</b><small>${cap ? Math.round(tot.busy / cap * 100) : 0}% bandlik</small></div>

  const perHour = 60 / M.step;
  const head = M.slots.filter(m => m % 60 === 0 || m === M.a).map(m => {
    const span = Math.min(m % 60 === 0 ? perHour : (60 - m % 60) / M.step, (M.b - m) / M.step);
    return `<th colspan="${span}">${fromMin(m)}</th>`;
  }).join('');
  const body = M.rows.map(r => {
    const tds = r.spans.map(c => {
      const w = `colspan="${c.n}"`;
      if (c.kind === 'b') {
        const st = SCH_ST[c.b.status] || SCH_ST.confirmed;
        return `<td ${w} class="sb ${st.c}" data-act="schbk" data-id="${esc(c.b.id)}"><div><b>${esc(c.b.customer_name)}</b><small>${esc(hm(c.b.start_at))}–${esc(hm(c.b.end_at))}${c.b.package ? ` · paket ${esc(c.b.package.n)}/${esc(c.b.package.of)}` : ''}${c.b.is_paid ? ' · ✓' : ''}</small></div></td>`;

      if (c.kind === 'x') return `<td ${w} class="sx" data-act="schx" title="Excel bron: ${esc(c.text)}">${esc(c.text)}</td>`;
      if (c.kind === 'o') return `<td ${w} class="so" title="Ish grafigi bo‘yicha ishlamaydi">${c.n * M.step >= 60 ? 'dam' : ''}</td>`;
      if (c.kind === 'p') return `<td class="sp"></td>`;
      return `<td class="sf" data-act="schfree" data-id="${esc(r.ins.id)}" data-t="${c.s}" title="${esc(r.ins.name)} · ${esc(hm(new Date(c.s)))} — bo‘sh"></td>`;

  totRow[n + 1] = { v: Math.round(tb / 6) / 10, s: 13 }; totRow[n + 2] = { v: Math.round(tf / 6) / 10, s: 13 };
  rows.push({ h: 20, cells: totRow });
  const sheet1 = { name: 'Jadval', rows, merges, cols: [30, ...Array(n).fill(M.step === 30 ? 7.5 : 12), 11, 11], freeze: { x: 1, y: 4 } };
  const insName = new Map(d.instructors.map(i => [String(i.id), i.name]));
  const list = [...d.bookings].sort((a, b) => (insName.get(String(a.instructor_id)) || '').localeCompare(insName.get(String(b.instructor_id)) || '', 'uz') || a.start_at.localeCompare(b.start_at));
  const r2 = [
    { h: 22, cells: [{ v: `Bronlar — ${dayTitle(d.date)}`, s: 1 }] },
    { h: 20, cells: ['Instruktor', 'Boshlanish', 'Tugash', 'Davomiylik', 'Mijoz', 'Telefon', 'Toifa', 'Holat', 'Kod', 'Paket', 'To‘lov'].map(v => ({ v, s: 2 })) },
    ...list.map(b => ({ cells: [
      { v: insName.get(String(b.instructor_id)) || '—', s: 12 }, { v: hm(b.start_at), s: 13 }, { v: hm(b.end_at), s: 13 },
      { v: fmtDur(b.minutes), s: 12 }, { v: b.customer_name, s: 12 }, { v: b.customer_phone || '', s: 12 }, { v: b.category || '', s: 13 },
      { v: (SCH_ST[b.status] || { t: b.status }).t, s: STY[b.status] || 12 }, { v: b.pickup_code || '', s: 12 },
      { v: b.package ? `${b.package.n}/${b.package.of}` : '', s: 13 }, { v: b.is_paid ? 'To‘langan' : '—', s: 12 },
    ] })),
  ];
  if (!list.length) r2.push({ cells: [{ v: 'Bu kunda bron yo‘q', s: 14 }] });
  const sheet2 = { name: 'Bronlar', rows: r2, merges: ['A1:K1'], cols: [24, 11, 10, 12, 24, 16, 7, 14, 12, 8, 12], freeze: { x: 0, y: 2 } };
  const blob = XL.book([sheet1, sheet2]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `instruktorlar-jadvali-${d.date}.xlsx`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Excel fayl yuklab olindi');
};

async function loadBookings(quiet){
  if (!$('bkList')) return;
  const seq = ++BK.seq;
  try{
    if (BK.tab === 'cancels') {
      const d = await api('/api/admin/cancellation-requests');
      if (seq !== BK.seq) return;
      BK.cx = d.requests || []; S.counts.cancels = BK.cx.length; paintNav();
      return paintCancels();
    }
    let url;
    if (BK.tab === 'new') url = '/api/admin/bookings?status=pending&per_page=100&order=asc';
    else {
      const p = new URLSearchParams({ per_page: '30', page: String(quiet ? 1 : BK.page) });
      if (BK.q.trim()) p.set('q', BK.q.trim());
      if (BK.day) { p.set('from', BK.day); p.set('to', BK.day); p.set('order', 'asc'); }
      if (BK.status) p.set('status', BK.status);
      url = '/api/admin/bookings?' + p;
    }
    const d = await api(url);
    if (seq !== BK.seq) return;
    const rows = d.bookings || [];
    if (BK.tab === 'all' && BK.page > 1 && !quiet) BK.rows = [...(BK.rows || []), ...rows];
    else { BK.rows = rows; if (quiet) BK.page = 1; }
    BK.more = !!d.has_more; BK.total = Number(d.total) || rows.length;
    if (BK.tab === 'new') { S.counts.pending = BK.total; paintNav(); }
    paintBookings();
  }catch(e){ if (seq === BK.seq && !quiet && $('bkList')) $('bkList').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}

ACT.bkgrp = async el => {

    const r = await ask({ title: ids.length > 1 ? `${ids.length} ta mashg‘ulotni rad etamizmi?` : 'Bronni rad etamizmi?', text: 'Mijozga xabar boradi. Sababini yozsangiz — u ham ko‘radi.', ok: 'Rad etish', danger: true, input: { placeholder: 'Sabab (ixtiyoriy): masalan, bu vaqtda instruktor yo‘q' } });

  try { for (const id of ids) { await setStatus(id, v, reason); ok++; } toast(v === 'confirmed' ? 'Tasdiqlandi — mijozga xabar ketdi' : 'Rad etildi'); }
  catch (e) { fail(e); }

const CH = { threads: null, msgs: null, seq: 0, sending: false };
function vChat(uid){
  if (!uid) {
    $('view').innerHTML = `<div class="view"><div id="chList">${skel(4)}</div></div>`;
    loadThreads(); return;
  }
  const t = (CH.threads || []).find(x => String(x.user_id) === uid);

  $('tbSub').textContent = t?.user?.phone || 'Mijozlar chati';
  $('view').innerHTML = `<div class="view"><div class="msgs" id="chMsgs"><div class="sk"></div></div></div>
    <div class="composer"><div class="composer-in"><textarea id="chIn" rows="1" placeholder="Javob yozing…"></textarea>
      <button class="send" data-act="chsend" aria-label="Yuborish">${I('send', 20, 2.2)}</button></div></div>`;
  const inp = $('chIn');
  inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(140, inp.scrollHeight) + 'px'; });

async function loadThreads(quiet){
  try{

    box.innerHTML = `<div class="list">${CH.threads.map(t => `<button class="row" data-go="chat/${esc(t.user_id)}"><span class="ava">${esc(ini(t.user?.full_name))}</span>

  }catch(e){ if (!quiet && $('chList')) $('chList').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }

async function loadMsgs(uid){
  const seq = ++CH.seq;
  try{
    const d = await api(`/api/admin/support/${encodeURIComponent(uid)}`);
    if (seq !== CH.seq || S.routeArg !== uid) return;
    const box = $('chMsgs'); if (!box) return;
    const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
    const was = CH.msgs?.length || 0;
    CH.msgs = d.messages || [];
    box.innerHTML = CH.msgs.length ? CH.msgs.map(m => `<div class="msg ${m.sender === 'admin' ? 'out' : 'in'}">${esc(m.body)}<small>${esc(whenText(m.created_at))}</small></div>`).join('')

    if (!was || atBottom || CH.msgs.length > was) window.scrollTo(0, document.body.scrollHeight);
    refreshCounts();

ACT.tgadd = async el => {

  if (!/^-?\d{5,16}$/.test(v)) { toast('Chat ID raqam bo‘lsin. Uni bilish uchun admin botga /start yozing.', true); inp.focus(); return; }
  busyBtn(el, true, 'Tekshirilmoqda');
  try { await post('/api/admin/telegram-admins', { chat_id: v }); inp.value = ''; toast('Qo‘shildi — o‘sha chatga tasdiq xabari yuborildi'); loadTg(); }
  catch (e) { fail(e); }
  finally { busyBtn(el, false); }
};
ACT.tgtoggle = async el => {
  const on = el.dataset.on !== '1';
  el.classList.toggle('on', on);
  try { await post(`/api/admin/telegram-admins/${encodeURIComponent(el.dataset.id)}`, { is_active: on }, 'PATCH'); toast(on ? 'Yoqildi — xabarlar keladi' : 'O‘chirildi — xabar kelmaydi'); loadTg(); }
  catch (e) { el.classList.toggle('on', !on); fail(e); }
};
ACT.tgdel = async el => {
  const ok = await ask({ title: 'Chat ro‘yxatdan olinsinmi?', text: 'Bu chatga yangi bron xabarlari bormaydi. Keyin qayta qo‘shish mumkin.', ok: 'Olib tashlash', danger: true });
  if (!ok) return;
  try { await api(`/api/admin/telegram-admins/${encodeURIComponent(el.dataset.id)}`, { method: 'DELETE' }); toast('Olib tashlandi'); loadTg(); }
  catch (e) { fail(e); }
};
ACT.tgtest = async el => {
  busyBtn(el, true, 'Yuborilmoqda');
  try { const r = await post('/api/admin/telegram-admins/test', {}); toast(`Sinov xabari ${nf(r.sent)} ta chatga yuborildi`); }
  catch (e) { fail(e); }
  finally { busyBtn(el, false); }
};
/* Eslatma tizimi holati: bot, jadval, oxirgi tekshiruv, vaqti o'tgan ochiq bronlar */
async function loadRemStat(){
  const el = $('remStat'); if (!el) return;
  el.innerHTML = '<div class="sk" style="min-height:44px"></div>';
  try{
    const d = await api('/api/admin/reminder-check');
    if (!$('remStat')) return;
    $('remStat').innerHTML = `<div class="note ${d.ready ? 'ok' : 'warn'}" style="font-size:13.5px">${esc(d.summary || '')}</div>
      <div class="rem-checks">${(d.checks || []).map(c => `<div class="rem-c"><i class="${c.ok ? 'ok' : 'bad'}">${c.ok ? I('check', 12, 3) : '!'}</i><span><b>${esc(c.name)}</b><small>${esc(c.detail || '')}</small></span></div>`).join('')}</div>`;
  }catch(e){ if ($('remStat')) $('remStat').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}
ACT.remcheck = async el => {
  busyBtn(el, true, 'Tekshirilmoqda');
  try{
    const r = await post('/api/admin/reminder-test', {});
    const x = r.result || {};
    toast(`Tekshirildi: ${nf(x.sent)} ta eslatma yuborildi, ${nf(x.late_closed)} ta kechikkan bron yopildi`);
    loadRemStat(); refreshCounts();
  }catch(e){ fail(e); }
  finally{ busyBtn(el, false); }
};
ACT.prbook = () => $('pr-on').classList.toggle('on');
ACT.prsave = async el => {
  const num = id => Math.round(Number(String($(id).value).replace(/\D/g, '')) || 0);
  const vals = {};
  for (const c of ['A', 'B', 'C']) {
    vals['half_' + c.toLowerCase()] = num(`pr-half-${c}`); vals['rate_' + c.toLowerCase()] = num(`pr-hour-${c}`);
    if (!(vals['half_' + c.toLowerCase()] > 0) || !(vals['rate_' + c.toLowerCase()] > 0)) return toast(`${c} toifa narxlari musbat son bo‘lsin`, true);
  }
  vals.paket5_b = num('pr-pkg');
  vals.krug_price = num('pr-krug');
  vals.krug_min = num('pr-krug-min');
  if (vals.krug_min < 15 || vals.krug_min > 60) return toast('1 krug davomiyligi 15 dan 60 daqiqagacha bo‘lsin', true);
  const ws = $('pr-ws').value || '07:00', we = $('pr-we').value || '19:00';
  if (ws >= we) return toast('Ish boshlanishi tugashidan oldin bo‘lsin', true);
  vals.work_start = ws; vals.work_end = we;
  vals.booking_enabled = $('pr-on').classList.contains('on');
  const remList = [...new Set(String($('pr-rem').value).split(/[^\d]+/).filter(Boolean).map(Number))].sort((a, b) => b - a);
  if (!remList.length || remList.length > 5 || remList.some(n => n < 5 || n > 720)) return toast('Eslatma vaqtlari: 1–5 ta son, har biri 5 dan 720 daqiqagacha (masalan: 60, 30, 20)', true);
  vals.reminder_minutes = remList;
  vals.late_cancel_min = num('pr-late');
  if (vals.late_cancel_min > 180) return toast('Kechikish 0 dan 180 daqiqagacha bo‘lsin', true);
  busyBtn(el, true, 'Saqlanmoqda');
  let saved = 0;
  const OFF = [false, 'false', 0, '0', 'off', 'no'];
  const same = (k, v) => {
    const cur = sv(k);
    if (Array.isArray(v)) { const c = Array.isArray(cur) ? cur : String(cur || '').split(/[^\d]+/).filter(Boolean); return c.map(Number).join(',') === v.join(','); }
    if (typeof v === 'boolean') return (cur === null ? true : !OFF.includes(cur)) === v;
    if (typeof v === 'number') return cur !== null && cur !== '' && Number(cur) === v;
    return String(cur || '').slice(0, 5) === v;
  };
  try{
    for (const [k, v] of Object.entries(vals)) {
      if (same(k, v)) continue;
      await api('/api/admin/settings/' + k, { method: 'PUT', body: JSON.stringify({ value: { value: v } }) });
      S.set[k] = { value: v }; saved++;
    }
    toast(saved ? 'Saqlandi — ilova va kassada darhol yangilandi' : 'O‘zgarish yo‘q');
    SCHC.clear();
    if (saved) loadRemStat();
  }catch(e){ fail(e); }
  finally{ busyBtn(el, false); }
};

/* =========================================================================
   XODIMLAR — kassir, operator, administrator
   ========================================================================= */
const SF = { list: null, regs: [] };
function vStaff(){
  $('view').innerHTML = `<div class="view"><button class="btn btn-primary" data-act="sfnew">${I('plus', 20, 2.3)} Yangi xodim</button>
    <div id="sfList" class="sec" style="margin-top:14px">${skel(4)}</div></div>`;
  loadStaff();
}
async function loadStaff(quiet){
  try{
    const d = await api('/api/admin/staff');
    SF.list = d.staff || []; SF.regs = d.registers || [];
    paintStaff();
  }catch(e){ if (!quiet && $('sfList')) $('sfList').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}
function paintStaff(){
  const box = $('sfList'); if (!box || !SF.list) return;
  if (!SF.list.length) { box.innerHTML = emptyHtml('key', 'Xodim yo‘q', 'Kassir va operatorlarni qo‘shing.'); return; }
  box.innerHTML = `<div class="list">${SF.list.map(x => `<button class="row" data-act="sfopen" data-id="${esc(x.id)}"><span class="ava" style="${x.is_active === false ? 'opacity:.45' : ''}">${esc(ini(x.full_name || x.login))}</span>
    <span class="tx"><b>${esc(x.full_name || x.login)}</b><small>${esc(x.login)} · ${esc(ROLE_UZ[x.role] || x.role)}${x.register ? ' · ' + esc(x.register.code) : ''}${x.last_login_at ? ' · kirgan: ' + esc(whenText(x.last_login_at)) : ''}</small></span>
    <span class="rt">${x.is_active === false ? '<span class="pill bad">o‘chiq</span>' : '<span class="pill ok">faol</span>'}</span></button>`).join('')}</div>`;
}
function staffForm(x){
  const r = x?.role || 'cashier';
  return `<label class="field"><span>Ism familiya</span><input class="input" id="sfName" value="${esc(x?.full_name || '')}" placeholder="Masalan: Karimova Dilfuza"></label>
    ${x ? '' : `<label class="field"><span>Login</span><input class="input" id="sfLogin" autocapitalize="none" spellcheck="false" placeholder="kassa3"></label>`}
    <label class="field"><span>${x ? 'Yangi parol (o‘zgartirmasangiz bo‘sh qoldiring)' : 'Parol'}</span><input class="input" id="sfPass" type="text" autocomplete="new-password" placeholder="kamida 4 belgi"></label>
    <div class="field"><span>Rol</span><div class="seg" id="sfRole">${[['cashier', 'Kassir'], ['operator', 'Operator'], ['admin', 'Admin']].map(([k, l]) => `<button type="button" class="${r === k ? 'on' : ''}" data-act="sfrole" data-v="${k}">${l}</button>`).join('')}</div></div>
    <div class="field ${r === 'cashier' ? '' : 'hidden'}" id="sfRegBox"><span>Kassa</span><div class="seg" id="sfReg">${SF.regs.map(g => `<button type="button" class="${String(x?.register_id || SF.regs[0]?.id) === String(g.id) ? 'on' : ''}" data-act="sfreg" data-v="${esc(g.id)}">${esc(g.code)}</button>`).join('')}</div></div>`;
}
ACT.sfrole = el => { document.querySelectorAll('#sfRole button').forEach(b => b.classList.toggle('on', b === el)); $('sfRegBox').classList.toggle('hidden', el.dataset.v !== 'cashier'); };
ACT.sfreg = el => document.querySelectorAll('#sfReg button').forEach(b => b.classList.toggle('on', b === el));
const sfVal = () => ({ role: document.querySelector('#sfRole .on')?.dataset.v || 'cashier', register_id: document.querySelector('#sfReg .on')?.dataset.v || null });
ACT.sfnew = () => {
  openSheet(`<h3>Yangi xodim</h3><p class="lead">Login va parolni xodimga bering — u shu bilan kiradi.</p>${staffForm(null)}
    <button class="btn btn-primary" style="margin-top:16px" data-act="sfcreate">Qo‘shish</button>`);
};
ACT.sfcreate = async el => {
  const v = sfVal();
  const body = { full_name: $('sfName').value.trim(), login: $('sfLogin').value.trim(), password: $('sfPass').value, role: v.role, register_id: v.role === 'cashier' ? v.register_id : null };
  busyBtn(el, true);
  try { await post('/api/admin/staff', body); closeSheet(); toast('Xodim qo‘shildi'); loadStaff(); }
  catch (e) { fail(e); busyBtn(el, false); }
};
ACT.sfopen = el => {
  const x = (SF.list || []).find(s => String(s.id) === el.dataset.id); if (!x) return;
  const self = String(x.login) === String(S.me?.login);
  openSheet(`<h3>${esc(x.full_name || x.login)}</h3><p class="lead">${esc(x.login)} · ${esc(ROLE_UZ[x.role] || x.role)}</p>${staffForm(x)}
    <button class="btn btn-primary" style="margin-top:16px" data-act="sfsave" data-id="${esc(x.id)}">Saqlash</button>
    ${self ? '' : `<button class="btn ${x.is_active === false ? 'btn-soft' : 'btn-danger'}" style="margin-top:10px" data-act="sfactive" data-id="${esc(x.id)}" data-v="${x.is_active === false ? '1' : '0'}">${x.is_active === false ? 'Qayta yoqish' : 'Kirishni o‘chirish'}</button>`}`);
};
ACT.sfsave = async el => {
  const v = sfVal(), body = { full_name: $('sfName').value.trim(), role: v.role, register_id: v.role === 'cashier' ? v.register_id : null };
  if ($('sfPass').value) body.password = $('sfPass').value;
  busyBtn(el, true);
  try { await api(`/api/admin/staff/${encodeURIComponent(el.dataset.id)}`, { method: 'PATCH', body: JSON.stringify(body) }); closeSheet(); toast('Saqlandi'); loadStaff(); }
  catch (e) { fail(e); busyBtn(el, false); }
};
ACT.sfactive = async el => {
  const on = el.dataset.v === '1';
  if (!on) { const ok = await ask({ title: 'Kirishni o‘chiramizmi?', text: 'Xodim panelga kira olmaydi. Keyin qayta yoqish mumkin.', ok: 'O‘chirish', danger: true }); if (!ok) return; }
  busyBtn(el, true);
  try { await api(`/api/admin/staff/${encodeURIComponent(el.dataset.id)}`, { method: 'PATCH', body: JSON.stringify({ is_active: on }) }); closeSheet(); toast(on ? 'Yoqildi' : 'O‘chirildi'); loadStaff(); }
  catch (e) { fail(e); busyBtn(el, false); }
};

/* =========================================================================
   ISHGA TUSHIRISH
   ========================================================================= */
(async function boot(){
  try{
    const me = await api('/api/admin/me');
    if (!location.hash) history.replaceState(null, '', '#/home');
    await enter(me);
  }catch(e){ showLogin(); }
})();
</script>
