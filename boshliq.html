<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="same-origin">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#232883">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AVTODROM BOSHQARUV">
<meta name="application-name" content="AVTODROM BOSHQARUV">
<link rel="manifest" href="/boshliq.webmanifest">
<link rel="apple-touch-icon" href="/boshliq-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/boshliq-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<title>AVTODROM BOSHQARUV</title>
<style>
/* =========================================================================
   AVTODROM BOSHQARUV — rahbar telefoni uchun ilova (iPhone: Ulashish → Ekranga qo'shish)
   Ma'lumot: GET /api/boss-data (token), kirish: maxfiy havola + PIN.
   Bosh oyna: Avtoshkola, Platniy, Avtodrom, Umumiy, Xarajatlar — har biri
   alohida oyna; ichidagi kategoriyalar (P1, P2, avtoshkola, instruktor,
   xarajat turi…) ham bosilsa o'z oynasida ochiladi.
   ========================================================================= */
:root{
  color-scheme:light;
  --bar:#232883;--bar-2:#0f1340;--on-bar:#fff;--on-bar-2:rgba(255,255,255,.72);
  --bg:#eef0f6;--card:#fff;--card-2:#f5f6fa;--ink:#14183a;--ink-2:#4a5068;--muted:#6b7188;
  --line:rgba(20,24,58,.09);--grid:rgba(20,24,58,.07);
  --good:#1b8356;--good-bg:#e6f5ee;--bad:#c03535;--bad-bg:#fdeeee;--warn:#8a5d00;--warn-bg:#fff4d6;--info:#1f5fbf;--info-bg:#e8f0fc;
  /* Uch qism — doimiy ranglar (rang ko'rlik uchun tekshirilgan juftlik) */
  --avd:#2a78d6;--paid:#eb6834;--school:#1baf7a;--exp:#14183a;--total:#232883;
  --avd-bg:#e9f1fc;--paid-bg:#fdefe8;--school-bg:#e5f6ef;--exp-bg:#eceef5;--total-bg:#eceefb;
  --shadow:0 1px 2px rgba(16,20,48,.05),0 8px 24px rgba(16,20,48,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bar:#171a52;--bar-2:#0b0d2b;
    --bg:#0f1016;--card:#191a22;--card-2:#21232d;--ink:#f0f0f4;--ink-2:#c3c4d0;--muted:#9a9cae;
    --line:rgba(255,255,255,.09);--grid:rgba(255,255,255,.07);
    --good:#5fd39b;--good-bg:#173126;--bad:#f07070;--bad-bg:#3a1f22;--warn:#f0c060;--warn-bg:#352b17;--info:#7db8f5;--info-bg:#1a2738;
    --avd:#3987e5;--paid:#d95926;--school:#199e70;--exp:#e6e7ef;--total:#8f95ff;
    --avd-bg:#18263a;--paid-bg:#33211a;--school-bg:#14302a;--exp-bg:#262833;--total-bg:#22244a;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bar:#171a52;--bar-2:#0b0d2b;
  --bg:#0f1016;--card:#191a22;--card-2:#21232d;--ink:#f0f0f4;--ink-2:#c3c4d0;--muted:#9a9cae;
  --line:rgba(255,255,255,.09);--grid:rgba(255,255,255,.07);
  --good:#5fd39b;--good-bg:#173126;--bad:#f07070;--bad-bg:#3a1f22;--warn:#f0c060;--warn-bg:#352b17;--info:#7db8f5;--info-bg:#1a2738;
  --avd:#3987e5;--paid:#d95926;--school:#199e70;--exp:#e6e7ef;--total:#8f95ff;
  --avd-bg:#18263a;--paid-bg:#33211a;--school-bg:#14302a;--exp-bg:#262833;--total-bg:#22244a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.4 Barlow,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--avd);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.num{font-family:"Barlow Semi Condensed",Barlow,-apple-system,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
small{font-size:13px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bar-2);z-index:30}

/* ---------- ilova paneli ---------- */
.bar{background:linear-gradient(160deg,var(--bar) 0%,var(--bar-2) 100%);color:var(--on-bar);padding:calc(env(safe-area-inset-top) + 10px) 16px 12px}
.bar-top{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;min-height:44px}
.brand{flex:1;min-width:0}
.hlogo{width:40px;height:40px;border-radius:50%;background:#fff;flex:none;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.brand b{display:block;font-size:19px;font-weight:700;letter-spacing:.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;color:var(--on-bar-2);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;flex:none}
.ibtn:active{background:rgba(255,255,255,.24)}
.ibtn svg{width:20px;height:20px}
.ibtn.back svg{width:22px;height:22px}
.ibtn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.periods{position:sticky;top:env(safe-area-inset-top);z-index:20;background:var(--bar-2);padding:8px 16px 10px}
.periods-in{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;max-width:760px;margin:0 auto}
.periods-in::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 11px;border-radius:999px;color:var(--on-bar-2);font-weight:600;font-size:15px;background:rgba(255,255,255,.08)}
.chip.on{background:#fff;color:#14183a}

main{max-width:760px;margin:0 auto;padding:14px 12px 24px}
main.fwd{animation:inR .22s ease-out}
main.bck{animation:inL .22s ease-out}
@keyframes inR{from{opacity:.3;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:.3;transform:translateX(-28px)}to{opacity:1;transform:none}}

/* ---------- bosh oyna: bo'lim kartalari ---------- */
.home{display:grid;gap:10px}
.sc{display:grid;grid-template-columns:6px 1fr;width:100%;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-align:left}
.sc:active{transform:scale(.99)}
.sc .sw{border-radius:0}
.sc-in{padding:14px 14px 12px}
.sc-h{display:flex;align-items:center;gap:8px}
.sc-h b{font-size:19px;font-weight:700;flex:1}
.sc-h svg{width:20px;height:20px;color:var(--muted);flex:none}
.sc-sub{color:var(--muted);font-size:14px;margin-top:1px}
.sc-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:8px}
.sc-v b{display:block;font-size:30px;font-weight:600;line-height:1.05}
.sc-v span{display:block;font-size:14px;margin-top:3px;color:var(--muted)}
.spark{width:132px;height:42px;flex:none}
.spark rect{rx:1.5}
.home-h{margin:14px 4px 2px;font-size:15px;color:var(--muted);font-weight:600}
.sw-school{background:var(--school)}.sw-paid{background:var(--paid)}.sw-avd{background:var(--avd)}
.sw-total{background:linear-gradient(180deg,var(--school) 0 33%,var(--paid) 33% 66%,var(--avd) 66%)}
.sw-exp{background:var(--exp)}

.alerts{margin-top:12px;display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;font-size:15px;line-height:1.35}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.info{background:var(--info-bg);color:var(--info)}

/* ---------- bo'lim oynasi ---------- */
.ttl{display:flex;gap:10px;align-items:flex-start;padding:2px 4px 12px}
.ttl i{width:10px;align-self:stretch;min-height:26px;border-radius:4px;flex:none}
.ttl h1{margin:0;font-size:26px;font-weight:700;line-height:1.1}
.ttl p{margin:4px 0 0;color:var(--muted);font-size:14.5px;line-height:1.35}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card+.card,.card+.tiles,.tiles+.card,.card+.navs,.navs+.card,.regs+.card,.card+.regs,.regs+.navs,.tiles+.navs{margin-top:10px}
.hero-num{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.hero-num b{font-size:44px;font-weight:600;line-height:1}
.hero-num span{font-size:17px;color:var(--ink-2);font-weight:500}
.hero-lbl{color:var(--ink-2);font-size:15px;margin-bottom:6px}
.hero-sub{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.4}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.delta.flat{color:var(--muted)}
.delta.up.bad-up{color:var(--bad)}.delta.down.bad-up{color:var(--good)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;min-width:0}
.tile .l{color:var(--ink-2);font-size:14px}
.tile .v{font-size:25px;font-weight:600;line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.35}
.tile.flag{background:var(--warn-bg)}.tile.flag .l,.tile.flag .s{color:var(--warn)}
.tile.badc{background:var(--bad-bg)}.tile.badc .l,.tile.badc .s,.tile.badc .v{color:var(--bad)}

/* kategoriyalar ro'yxati — bosilsa o'z oynasi */
.navs-h{margin:18px 4px 8px;font-size:15px;color:var(--muted);font-weight:600}
.navs{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.nav{display:grid;grid-template-columns:40px 1fr auto 16px;gap:12px;align-items:center;width:100%;padding:12px 12px 12px 14px;border-top:1px solid var(--line)}
.nav:first-child{border-top:0}
.nav:active{background:var(--card-2)}
.nav .ni{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--c)}
.nav .ni svg{width:21px;height:21px}
.nav .nt{min-width:0}
.nav .nt b{display:block;font-size:16.5px;font-weight:600;line-height:1.2}
.nav .nt small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px;line-height:1.3}
.nav .nv{font-weight:600;font-size:16px;text-align:right;white-space:nowrap}
.nav .nv small{display:block;font-weight:500;color:var(--muted)}
.nav .ch{width:16px;height:16px;color:var(--muted)}
.c-school{--c:var(--school);--tint:var(--school-bg)}.c-paid{--c:var(--paid);--tint:var(--paid-bg)}.c-avd{--c:var(--avd);--tint:var(--avd-bg)}
.c-total{--c:var(--total);--tint:var(--total-bg)}.c-exp{--c:var(--exp);--tint:var(--exp-bg)}
.c-warn{--c:var(--warn);--tint:var(--warn-bg)}.c-bad{--c:var(--bad);--tint:var(--bad-bg)}

.blk h3{margin:0 0 10px;font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.blk h3 small{color:var(--muted);font-weight:500}
.explain{color:var(--muted);font-size:14px;line-height:1.4;margin:-4px 0 10px}
.empty{color:var(--muted);font-size:15px;padding:4px 0}
.err{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:12px 14px;font-size:15px}
.err b{display:block;margin-bottom:2px}

/* qatorlar */
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center;width:100%}
.row:first-child{border-top:0;padding-top:2px}
button.row:active{background:var(--card-2)}
.row .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .nm small{display:block;color:var(--muted);font-weight:400;margin-top:1px;white-space:normal}
.row .am{text-align:right;font-weight:600;white-space:nowrap}
.row .am small{display:block;color:var(--muted);font-weight:500}
.row .am .go{display:inline-block;color:var(--muted);margin-left:4px}
.row .bar-t{grid-column:1/-1;height:6px;border-radius:3px;background:var(--card-2);overflow:hidden;margin-top:3px}
.row .bar-t u{display:block;height:100%;border-radius:3px}
.more{margin-top:8px;color:var(--avd);font-weight:600;font-size:15px;padding:6px 0}

.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:var(--card-2);border-radius:12px;padding:10px 12px;min-width:0}
.kv span{display:block;color:var(--ink-2);font-size:13px}
.kv b{display:block;font-size:21px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv div.warn{background:var(--warn-bg)}.kv div.warn span,.kv div.warn b{color:var(--warn)}
.kv div.bad{background:var(--bad-bg)}.kv div.bad span,.kv div.bad b{color:var(--bad)}

.split{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--card)}
.split i{display:block;height:100%;min-width:3px}
.legend{display:grid;gap:8px;margin-top:12px}
.lg{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;font-size:15px;width:100%}
.lg i{width:12px;height:12px;border-radius:3px}
.lg b{font-weight:600}
.lg small{color:var(--muted);margin-left:6px;font-weight:500}
.lgs{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 6px;font-size:14px;color:var(--ink-2)}
.lgs span{display:inline-flex;align-items:center;gap:6px}
.lgs i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* kassa P1/P2 */
.regs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reg{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;min-width:0;text-align:left;width:100%}
.reg:active{transform:scale(.99)}
.reg-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.reg-h b{font-size:20px;font-weight:700}
.reg .v{font-size:24px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg .s{color:var(--ink-2);font-size:13px;line-height:1.45;margin-top:2px}
.reg .open{display:flex;align-items:center;gap:4px;color:var(--avd);font-weight:600;font-size:13px;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--card-2);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--good-bg);color:var(--good)}
.pill.on::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card-2);border-radius:12px;padding:9px 10px;min-width:0}
.stats span{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats b{display:block;font-size:22px;font-weight:600}

/* O'zbek davlat raqami */
.plate{display:inline-flex;align-items:stretch;height:28px;border:2px solid #14183a;border-radius:5px;background:#fff;color:#14183a;
  font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-weight:700;font-size:17px;line-height:24px;letter-spacing:.02em;overflow:hidden;white-space:nowrap;max-width:100%}
.plate .rg{padding:0 6px;border-right:2px solid #14183a;font-weight:700}
.plate .nb{padding:0 7px}
.plate .uz{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 4px 0 2px;font-style:normal;font-size:8px;line-height:9px;color:#1a6fb5;font-weight:700}
.plate .uz::before{content:"";width:12px;height:8px;margin-bottom:1px;border-radius:1px;
  background:linear-gradient(#1eb3e6 0 33%,#fff 33% 38%,#e53935 38% 43%,#fff 43% 57%,#e53935 57% 62%,#fff 62% 67%,#1eb53a 67%)}
.plate.free{padding:0 8px;font-size:15px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0;padding-top:2px}
.prow .mid{color:var(--muted);font-size:13px;min-width:0}
.prow .am{text-align:right;font-weight:600;white-space:nowrap}
.prow .am2{text-align:right;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.debt{color:var(--bad)}

/* jonli */
.live{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.live:first-child{border-top:0;padding-top:2px}
.live .tm{font-weight:600;font-size:19px;text-align:right;white-space:nowrap}
.live .tm small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.live .who{min-width:0;font-size:15px}
.live .who small{display:block;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px var(--good-bg)}
.dot.off{background:var(--muted);box-shadow:0 0 0 4px var(--card-2)}

/* grafik */
.chart{position:relative;margin-top:2px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ro{min-height:22px;font-size:14px;color:var(--ink-2);margin-bottom:6px;line-height:1.35}
.chart .ro b{color:var(--ink);font-weight:600}
.ax{fill:var(--muted);font-size:11px;font-family:Barlow,sans-serif}
.gl{stroke:var(--grid);stroke-width:1}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.tbl th,.tbl td{text-align:right;padding:6px 4px;border-top:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:500}
.lnk{color:var(--avd);font-weight:600;font-size:14px}

.foot{max-width:760px;margin:6px auto 0;padding:0 16px 28px;color:var(--muted);font-size:13px;text-align:center;line-height:1.6}
.foot button{color:var(--avd);font-weight:600;font-size:14px;padding:6px 10px}
.sk{background:linear-gradient(90deg,var(--card-2),var(--card),var(--card-2));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- kirish (PIN) ---------- */
.lock{position:fixed;inset:0;z-index:60;background:linear-gradient(165deg,var(--bar) 0%,var(--bar-2) 70%);color:#fff;display:flex;flex-direction:column;
  align-items:center;padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 20px);overflow-y:auto}
.lock>*{flex-shrink:0}
.lock .logo{width:92px;height:92px;border-radius:50%;background:#fff;padding:3px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.lock h1{margin:14px 0 4px;font-size:25px;font-weight:700;text-align:center}
.lock p{margin:0;color:rgba(255,255,255,.75);text-align:center;font-size:16px;max-width:320px}
.dots{display:flex;gap:14px;margin:22px 0 6px;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.dots i.on{background:#fff;border-color:#fff}
.lock .msg{min-height:22px;color:#ffb4b4;font-weight:600;font-size:15px;text-align:center;margin-bottom:6px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px 24px}
.pad button{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:30px;font-weight:500;text-align:center}
.pad button:active{background:rgba(255,255,255,.3)}
.pad button.txt{background:none;font-size:16px;font-weight:600}
.pad svg{width:26px;height:26px;margin:auto}
.lock .go{margin-top:18px;height:52px;min-width:220px;border-radius:14px;background:#fff;color:#14183a;font-weight:700;font-size:17px;text-align:center}
.lock .go[disabled]{opacity:.4}
.lock .note{margin-top:22px;background:rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;max-width:340px;font-size:15px;line-height:1.45}
.lock .note b{display:block;margin-bottom:4px}
.lock.shake .dots{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.inst{display:flex;gap:12px;align-items:center;background:var(--info-bg);color:var(--info);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px;line-height:1.4}
.inst svg{width:22px;height:22px;flex:none}
.inst .x{margin-left:auto;font-size:22px;line-height:1;padding:4px 6px;color:inherit}
.share-i{display:inline-block;width:16px;height:16px;vertical-align:-3px}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(10,12,30,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h3{margin:0 0 12px;font-size:19px}
.sheet label{display:block;font-size:14px;color:var(--ink-2);margin:10px 0 4px}
.sheet input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);padding:0 12px;font-size:17px}
.sheet .acts{display:flex;gap:10px;margin-top:16px}
.sheet .acts button{flex:1;height:48px;border-radius:12px;font-weight:700;font-size:16px;background:var(--card-2);text-align:center}
.sheet .acts button.pri{background:var(--bar);color:#fff}

@media (max-height:700px){.lock .logo{width:64px;height:64px}.pad{grid-template-columns:repeat(3,64px);gap:10px 22px}.pad button{width:64px;height:64px;font-size:26px}}
@media (min-width:640px){
  .tiles{grid-template-columns:repeat(3,1fr)}
  .kv{grid-template-columns:repeat(4,1fr)}
  .hero-num b{font-size:52px}
  .home{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* Oxirgi 8 ta davr saqlanadi — telefon xotirasi to'lib qolmasin */
function cachePut(key, val){
  let keys = []; try { keys = JSON.parse(LS.get('boss_cache_keys') || '[]'); } catch {}
  keys = [key, ...keys.filter(k => k !== key)];
  for (const old of keys.slice(8)) LS.del(old);
  LS.set('boss_cache_keys', JSON.stringify(keys.slice(0, 8)));
  LS.set(key, val);
}
function clearCache(){
  try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.startsWith('boss_cache')) localStorage.removeItem(k); } } catch {}
}

/* Havola kaliti: manzildan (birinchi ochilganda), keyin xotiradan.
   iPhone «Ekranga qo'shish»da aynan shu manzil (kalit bilan) saqlanadi. */
(() => {
  const k = new URLSearchParams(location.search).get('k');
  if (k && /^[\w-]{20,64}$/.test(k)) {
    if (LS.get('boss_k') !== k) { LS.del('boss_token'); clearCache(); }
    LS.set('boss_k', k);
  }
  S.k = LS.get('boss_k') || '';
  S.token = LS.get('boss_token') || '';
  const c = LS.get('boss_custom');
  if (c) { try { const x = JSON.parse(c), ok = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v || '')); if (ok(x.from) && ok(x.to)) { S.from = x.from; S.to = x.to; } } catch {} }
  if (S.per === 'custom' && !(S.from && S.to)) S.per = 'today';
})();

   Sana, son, matn
   ====================================================================== */
const MONTHS = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'];
const WD = ['yakshanba', 'dushanba', 'seshanba', 'chorshanba', 'payshanba', 'juma', 'shanba'];
const tkNow = () => new Date(Date.now() + 5 * 3600e3);
const today = () => tkNow().toISOString().slice(0, 10);
const addDays = (ymd, n) => new Date(new Date(ymd + 'T00:00:00Z').getTime() + n * 864e5).toISOString().slice(0, 10);
const ymdParts = ymd => ymd.split('-').map(Number);
const dayName = ymd => { const [, m, d] = ymdParts(ymd); return `${d}-${MONTHS[m - 1]}`; };
const wdName = ymd => WD[new Date(ymd + 'T00:00:00Z').getUTCDay()];
const hm = iso => { const d = new Date(new Date(iso).getTime() + 5 * 3600e3); return `${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`; };
const tkYmd = iso => new Date(new Date(iso).getTime() + 5 * 3600e3).toISOString().slice(0, 10);

const PERIODS = [
  { id: 'today', name: 'Bugun' }, { id: 'yday', name: 'Kecha' }, { id: 'week', name: 'Hafta' },
  { id: 'month', name: 'Oy' }, { id: 'year', name: 'Yil' }, { id: 'custom', name: 'Davr' },
];
function range(per){
  const t = today();
  if (per === 'yday') { const y = addDays(t, -1); return { from: y, to: y }; }
  if (per === 'week') { const dow = (new Date(t + 'T00:00:00Z').getUTCDay() + 6) % 7; return { from: addDays(t, -dow), to: t }; }
  if (per === 'month') return { from: t.slice(0, 8) + '01', to: t };
  if (per === 'year') return { from: t.slice(0, 5) + '01-01', to: t };
  if (per === 'custom' && S.from && S.to) return { from: S.from, to: S.to };
  return { from: t, to: t };
}
function rangeTitle(r){
  if (r.from === r.to) {
    const t = today();
    const pre = r.from === t ? 'Bugun, ' : r.from === addDays(t, -1) ? 'Kecha, ' : '';
    return `${pre}${dayName(r.from)}, ${wdName(r.from)}`;
  }
  const [fy] = ymdParts(r.from), [ty] = ymdParts(r.to);
  return `${dayName(r.from)}${fy !== ty ? ' ' + fy : ''} — ${dayName(r.to)} ${ty}`;
}
const days = r => Math.round((new Date(r.to + 'T00:00:00Z') - new Date(r.from + 'T00:00:00Z')) / 864e5) + 1;
function cmpWord(r, partial){
  if (r.from === r.to) return r.from === today() ? (partial ? 'kechaning shu vaqtiga nisbatan' : 'kechaga nisbatan') : 'oldingi kunga nisbatan';
  return partial ? `oldingi ${days(r)} kunning shu nuqtasiga nisbatan` : `oldingi ${days(r)} kunga nisbatan`;
}

const nf = v => String(Math.round(Number(v) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const money = v => `${nf(v)} so‘m`;
function compact(v){
  const n = Math.abs(Number(v) || 0), s = v < 0 ? '−' : '';
  if (n >= 1e9) return `${s}${(n / 1e9).toFixed(1).replace('.', ',').replace(',0', '')} mlrd`;
  if (n >= 1e6) return `${s}${(n / 1e6).toFixed(n >= 1e8 ? 0 : 1).replace('.', ',').replace(',0', '')} mln`;
  if (n >= 1e3) return `${s}${Math.round(n / 1e3)} ming`;
  return `${s}${Math.round(n)}`;
}
function dur(min){
  min = Math.round(Number(min) || 0);
  if (min < 60) return `${min} daq`;
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${nf(h)} soat ${m} daq` : `${nf(h)} soat`;
}
/* plitalar uchun qisqa: 45 daq, 1,5 soat, 12 soat */
function durShort(min){
  min = Math.round(Number(min) || 0);
  if (min < 60) return `${min} daq`;
  const h = min / 60;
  return `${h >= 10 ? nf(Math.round(h)) : String(Math.round(h * 10) / 10).replace('.', ',')} soat`;
}
const pctOf = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const pct = (a, b) => (!b ? (a ? 100 : 0) : Math.round(((a - b) / Math.abs(b)) * 100));
function delta(v, opt = {}){
  const n = Number(v) || 0;
  if (!n) return `<span class="delta flat">o‘zgarishsiz</span>`;
  const up = n > 0;
  return `<span class="delta ${up ? 'up' : 'down'}${opt.badUp ? ' bad-up' : ''}">${up ? '▲' : '▼'} ${Math.abs(n)}%</span>`;
}

/* ======================================================================
   Tarmoq
   ====================================================================== */
async function api(path, opt = {}){
  const headers = { Accept: 'application/json' };
  if (opt.body) headers['Content-Type'] = 'application/json';
  if (opt.auth && S.token) headers.Authorization = `Bearer ${S.token}`;
  let r;
  try { r = await fetch(path, { method: opt.method || 'GET', headers, body: opt.body ? JSON.stringify(opt.body) : undefined, cache: 'no-store' }); }
  catch { const e = new Error('Internet yo‘q yoki server javob bermadi'); e.offline = true; throw e; }
  let d = null; try { d = await r.json(); } catch {}
  if (!r.ok || !d || d.ok === false) {
    const e = new Error(r.status === 429 ? 'Juda ko‘p urinish — 15 daqiqadan keyin qayta urining' : (d && d.error) || `Server javobi: ${r.status}`);
    e.status = r.status; e.data = d; throw e;
  }
  return d;
}

let pin = '';
const SVG_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-7 7 7 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m18 9-6 6M12 9l6 6"/></svg>';
function paintPad(){
  $('dots').innerHTML = Array.from({ length: Math.max(4, pin.length) }, (_, i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join('');
  $('btnGo').disabled = pin.length < 4;
}
function buildPad(){
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clr', '0', 'del'];
  $('pad').innerHTML = keys.map(k => k === 'del' ? `<button data-k="del" aria-label="O‘chirish">${SVG_BACK}</button>`
    : k === 'clr' ? `<button class="txt" data-k="clr">Tozalash</button>` : `<button data-k="${k}">${k}</button>`).join('');
  $('pad').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const k = b.dataset.k;
    if (k === 'del') pin = pin.slice(0, -1); else if (k === 'clr') pin = ''; else if (pin.length < 8) pin += k;
    $('lockMsg').textContent = ''; paintPad();
  };
  document.addEventListener('keydown', e => {
    if ($('lock').classList.contains('hidden')) return;
    if (/^\d$/.test(e.key) && pin.length < 8) { pin += e.key; paintPad(); }
    else if (e.key === 'Backspace') { pin = pin.slice(0, -1); paintPad(); }
    else if (e.key === 'Enter' && pin.length >= 4) login();
  });
  $('btnGo').onclick = login;
  paintPad();
}
function showLock(opts = {}){
  $('appRoot').classList.add('hidden');
  $('lock').classList.remove('hidden');
  $('lockTitle').textContent = opts.title || 'AVTODROM BOSHQARUV';
  $('lockText').textContent = opts.text || 'PIN kodni kiriting';
  const noPad = !!opts.noPad;
  $('pad').classList.toggle('hidden', noPad); $('dots').classList.toggle('hidden', noPad); $('btnGo').classList.toggle('hidden', noPad);
  $('lockMsg').textContent = opts.msg || '';
  const note = opts.note || (isIOS() && !isStandalone() ? installNoteHtml() : '');
  $('lockNote').innerHTML = note; $('lockNote').classList.toggle('hidden', !note);
  pin = ''; paintPad();
}
const LINK_DEAD = { title: 'Havola eskirgan', text: 'Admin paneldan yangi havolani oling va shu telefonda oching.', noPad: true };
async function login(){
  if (pin.length < 4) return;
  $('btnGo').disabled = true; $('lockMsg').textContent = '';
  try {
    const d = await api('/api/boss-login', { method: 'POST', body: { k: S.k, pin } });
    S.token = d.token; LS.set('boss_token', d.token);
    pin = ''; $('lock').classList.add('hidden'); startApp();
  } catch (e) {
    pin = ''; paintPad();
    $('lockMsg').textContent = e.message;
    $('lock').classList.remove('shake'); void $('lock').offsetWidth; $('lock').classList.add('shake');
    if (e.status === 403) { clearCache(); showLock(LINK_DEAD); }
  }
}
async function boot(){
  $('lockLogo').src = $('hdrLogo').src;
  buildPad();
  if (!S.k) return showLock({ title: 'Havola kerak', text: 'Bu ilova admin paneldagi maxfiy havola orqali ochiladi: Boshqaruv → Boshqaruv ilovasi.', noPad: true });
  if (S.token) return startApp();
  try {
    const h = await api('/api/boss-hello', { method: 'POST', body: { k: S.k } });
    if (!h.pin_set) return showLock({ title: 'PIN qo‘yilmagan', text: 'Administrator admin panelda PIN qo‘ygandan keyin shu yerdan kirasiz.', noPad: true });
    showLock();
  } catch (e) {
    if (e.status === 403) { clearCache(); LS.del('boss_token'); return showLock(LINK_DEAD); }
    showLock({ msg: e.message });
  }
}
function logout(){
  LS.del('boss_token'); S.token = ''; S.d = null; clearCache();
  showLock();
}

const isStandalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

/* ======================================================================
   Yo'nalish (oynalar): #/paid/plates, #/avd/reg/<id> …
   ====================================================================== */
/* Yo'l bo'laklari alohida kodlanadi: «Ta'mir/ehtiyot» kabi nom bitta bo'lak bo'lib qoladi */
const route = () => (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(x => { try { return decodeURIComponent(x); } catch { return x; } });
const seg = v => encodeURIComponent(String(v ?? ''));
let navDepth = 0;
function go(path){
  S.scroll[location.hash || '#/'] = scrollY;
  navDepth++;
  history.pushState({ d: navDepth }, '', '#/' + path);
  paint(false, null, 'fwd');
  scrollTo(0, 0);
}
function goBack(){
  if (navDepth > 0) { history.back(); return; }
  /* Ilova to'g'ridan ichki oynadan ochilgan bo'lsa — bir pog'ona yuqoriga */
  const p = route(); p.pop();
  if (p.length === 2 && ['s', 'reg', 'ins', 'cat'].includes(p[1])) p.pop();
  history.replaceState(null, '', '#/' + p.map(seg).join('/'));
  paint(false, null, 'bck'); scrollTo(0, 0);
}
addEventListener('popstate', () => {
  navDepth = Math.max(0, navDepth - 1);
  paint(false, null, 'bck');
  const y = S.scroll[location.hash || '#/'];
  scrollTo(0, y || 0);
});
$('btnBack').onclick = goBack;

function paintPeriods(){
  $('periods').innerHTML = PERIODS.map(p => `<button class="chip ${S.per === p.id ? 'on' : ''}" data-p="${p.id}">${p.name}</button>`).join('');
}
$('periods').onclick = e => {
  const b = e.target.closest('[data-p]'); if (!b) return;
  if (b.dataset.p === 'custom') return openCustom();
  S.per = b.dataset.p; LS.set('boss_per', S.per); paintPeriods(); showRangeNow(); load();
};
/* Davr almashganda eski raqamlar yangi sana ostida qolmasin: saqlangani bo'lsa — o'sha, bo'lmasa — kutish */
function showRangeNow(){
  const r = range(S.per);
  const c = LS.get(`boss_cache:${r.from}:${r.to}`);
  S.d = null;
  if (c) { try { S.d = JSON.parse(c); } catch {} }
  $('hdrDate').textContent = rangeTitle(r);
  if (S.d) paint(true); else { $('main').innerHTML = skeleton(); $('foot').innerHTML = ''; }
}
$('btnRefresh').onclick = () => load(true);

function startApp(){
  $('lock').classList.add('hidden');
  $('appRoot').classList.remove('hidden');
  paintPeriods();
  const r = range(S.per);
  const cached = LS.get(`boss_cache:${r.from}:${r.to}`);
  if (cached) { try { S.d = JSON.parse(cached); paint(true); } catch {} }
  if (!S.d) $('main').innerHTML = skeleton();
  load();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/boshliq-sw.js', { scope: '/boshliq' }).catch(() => {});
}
function skeleton(){
  return `<div class="sk" style="height:132px"></div><div class="sk" style="height:132px;margin-top:10px"></div><div class="sk" style="height:132px;margin-top:10px"></div>`;
}

async function load(){
  const r = range(S.per);
  $('hdrDate').textContent = rangeTitle(r);
  const seq = ++S.seq;
  S.loading = true; $('btnRefresh').classList.add('spin');
  try {
    const d = await api(`/api/boss-data?from=${r.from}&to=${r.to}`, { auth: true });
    if (seq !== S.seq) return;
    if (d.session?.token) { S.token = d.session.token; LS.set('boss_token', d.session.token); }
    delete d.session;
    S.d = d; S.d._fetched = Date.now(); S.d._range = r;
    cachePut(`boss_cache:${r.from}:${r.to}`, JSON.stringify(S.d));
    paint();
  } catch (e) {
    if (seq !== S.seq) return;
    if (e.status === 401) { LS.del('boss_token'); S.token = ''; S.d = null; clearCache(); return showLock({ msg: 'Qayta kiring' }); }
    if (S.d && S.d._range && S.d._range.from === r.from && S.d._range.to === r.to) paint(true, e.message);
    else $('main').innerHTML = `<div class="err"><b>Ma’lumot yuklanmadi</b>${esc(e.message)}</div>`;
  } finally {
    if (seq === S.seq) { S.loading = false; $('btnRefresh').classList.remove('spin'); }
  }
}
setInterval(() => { if (!document.hidden && S.token && !$('appRoot').classList.contains('hidden') && range(S.per).to === today()) load(); }, 120000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.token && !$('appRoot').classList.contains('hidden')) load(); });

function openCustom(){
  const r = S.from && S.to ? { from: S.from, to: S.to } : range('month');
  $('sheetRoot').innerHTML = `<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-label="Davr tanlash">
    <h3>Davrni tanlang</h3>
    <label for="cFrom">Boshlanishi</label><input type="date" id="cFrom" value="${esc(r.from)}" max="${today()}">
    <label for="cTo">Oxiri</label><input type="date" id="cTo" value="${esc(r.to)}" max="${today()}">
    <div class="acts"><button id="cCancel">Bekor qilish</button><button class="pri" id="cOk">Ko‘rsatish</button></div></div></div>`;
  const close = () => { $('sheetRoot').innerHTML = ''; };
  $('sheetBg').onclick = e => { if (e.target.id === 'sheetBg') close(); };
  $('cCancel').onclick = close;
  $('cOk').onclick = () => {
    let a = $('cFrom').value, b = $('cTo').value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(a) || !/^\d{4}-\d{2}-\d{2}$/.test(b)) return;
    if (a > b) [a, b] = [b, a];
    S.from = a; S.to = b; S.per = 'custom';
    LS.set('boss_custom', JSON.stringify({ from: a, to: b })); LS.set('boss_per', 'custom');
    close(); paintPeriods(); showRangeNow(); load();
  };
}

function list(id, items, row, limit = 6){
  if (!items || !items.length) return '';
  const open = !!S.open[id];
  const shown = open ? items : items.slice(0, limit);
  let h = shown.map(row).join('');
  if (items.length > limit) h += `<button class="more" data-more="${esc(id)}">${open ? 'Kamroq ko‘rsatish' : `Hammasini ko‘rsatish (${items.length})`}</button>`;
  return h;
}
function rankRow(color, max){
  return x => {
    const tag = x.go ? 'button' : 'div';
    return `<${tag} class="row"${x.go ? ` data-go="${esc(x.go)}"` : ''}><div class="nm">${esc(x.name)}${x.sub ? `<small>${x.sub}</small>` : ''}</div>
    <div class="am num">${esc(x.val)}${x.go ? `<span class="go">›</span>` : ''}${x.val2 ? `<small>${esc(x.val2)}</small>` : ''}</div>
    <div class="bar-t"><u style="width:${max && x.v > 0 ? Math.max(2, Math.round((x.v / max) * 100)) : 0}%;background:${color}"></u></div></${tag}>`;
  };
}
function rank(id, items, color, limit = 8){
  const max = Math.max(0, ...items.map(x => x.v));
  return list(id, items, rankRow(color, max), limit);
}
const blk = (title, body, extra = '', explain = '') => `<div class="card blk"><h3>${title}${extra ? `<small>${extra}</small>` : ''}</h3>${explain ? `<p class="explain">${explain}</p>` : ''}${body || '<div class="empty">Bu davrda yozuv yo‘q.</div>'}</div>`;
const tile = (l, v, s = '', cls = '') => `<div class="tile ${cls}"><div class="l">${l}</div><div class="v num">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
const kvc = (l, v, cls = '') => `<div class="${cls}"><span>${l}</span><b class="num">${v}</b></div>`;
const tiles = arr => `<div class="tiles">${arr.join('')}</div>`;
function hero(label, value, unit, d, sub, opt = {}){
  return `<div class="card"><div class="hero-lbl">${label}</div>
    <div class="hero-num"><b class="num">${value}</b>${unit ? `<span>${unit}</span>` : ''}</div>
    <div class="hero-sub">${d !== null && d !== undefined ? `${delta(d, opt)} ${esc(opt.cmp || '')}` : ''}${sub ? `<div style="margin-top:4px">${sub}</div>` : ''}</div>${opt.extra || ''}</div>`;
}
function title(cls, name, text){
  return `<div class="ttl"><i class="sw-${cls}"></i><div><h1>${esc(name)}</h1>${text ? `<p>${text}</p>` : ''}</div></div>`;
}

function a12Err(a12){

/* O'zbekiston davlat raqami */
function plate(raw){
  const s = String(raw || '').toUpperCase().replace(/\s+/g, ' ').trim();
  const t = s.replace(/[\s-]/g, '');
  let m = t.match(/^(\d{2})([A-Z])(\d{3})([A-Z]{2})$/);
  if (m) return plateBox(m[1], `${m[2]} ${m[3]} ${m[4]}`);
  m = t.match(/^(\d{2})(\d{3})([A-Z]{3})$/);
  if (m) return plateBox(m[1], `${m[2]} ${m[3]}`);
  return `<span class="plate free">${esc(s || '—')}</span>`;
}
const plateBox = (rg, nb) => `<span class="plate" aria-label="${esc(rg + ' ' + nb)}"><b class="rg">${esc(rg)}</b><span class="nb">${esc(nb)}</span><i class="uz">UZ</i></span>`;

/* ---------- vaqt o'qi: davrning hamma kalitlari ---------- */
function keysOf(d){
  let ks = Array.isArray(d.keys) && d.keys.length ? d.keys : (d.combined?.series || []).map(x => x.key);
  if (d.bucket === 'hour') {
    const has = new Set();
    for (const s of [d.combined?.series || []]) s.forEach(x => { if (x.avtodrom || x.paid || x.school) has.add(Number(String(x.key).slice(0, 2))); });
    const hs = [...has];
    const lo = Math.min(7, ...hs), hi = Math.max(20, ...hs);
    ks = ks.filter(k => { const h = Number(String(k).slice(0, 2)); return h >= lo && h <= hi; });
  }
  return ks;
}
/* Qatorlarni kalitlarga moslaydi: [{key, …}] → [qiymat, …] */
const align = (keys, rows, f) => { const m = new Map((rows || []).map(r => [String(r.key), r])); return keys.map(k => { const r = m.get(String(k)); return r ? Number(f(r)) || 0 : 0; }); };
function keyFmt(bucket){
  if (bucket === 'hour') return { short: k => String(k).slice(0, 2), long: k => String(k) };
  if (bucket === 'month') return { short: k => MONTHS[Number(String(k).slice(5, 7)) - 1].slice(0, 3), long: k => `${MONTHS[Number(String(k).slice(5, 7)) - 1]} ${String(k).slice(0, 4)}` };
  return { short: k => String(Number(String(k).slice(8, 10))), long: k => `${dayName(k)}, ${wdName(k)}` };
}

/* ---------- mitti grafik (bosh oyna kartalari) ---------- */
function spark(values, color){
  const n = values.length; if (!n || !values.some(v => v > 0)) return `<svg class="spark" viewBox="0 0 132 42" aria-hidden="true"><line x1="0" x2="132" y1="40" y2="40" stroke="var(--grid)"/></svg>`;
  const max = Math.max(...values), w = 132 / n, bw = Math.max(1.5, Math.min(8, w * .64));
  return `<svg class="spark" viewBox="0 0 132 42" aria-hidden="true">${values.map((v, i) => { const h = v > 0 ? Math.max(2, (v / max) * 38) : 0; return h ? `<rect x="${(w * i + (w - bw) / 2).toFixed(1)}" y="${(40 - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${color}"/>` : ''; }).join('')}<line x1="0" x2="132" y1="40.5" y2="40.5" stroke="var(--grid)"/></svg>`;
}

/* ---------- ustunli grafik (bitta o'q) ---------- */
let chartSeq = 0;
const CHARTS = {};
function columns(o){
  /* o: { keys, series:[{name,color,values}], line:{name,values}, fmtKey, fmtKeyLong, unit:'som'|'n', unitName } */
  const id = 'c' + (++chartSeq);
  CHARTS[id] = o;
  const n = o.keys.length;
  const W = 340, H = 168, L = 34, B = 22, T = 8, iw = W - L - 4, ih = H - B - T;
  const stackMax = Math.max(0, ...o.keys.map((_, i) => o.series.reduce((a, s) => a + (s.values[i] || 0), 0)));
  const lineMax = o.line ? Math.max(0, ...o.line.values) : 0;
  const raw = Math.max(stackMax, lineMax);
  /* Sanoq (dars, bron) — butun sonli bo'linmalar: 0, 1, 2, 3 */
  const max = o.unit === 'som' ? niceMax(raw) : Math.max(3, Math.ceil(niceMax(raw) / 3) * 3);
  const slot = iw / Math.max(1, n), bw = Math.max(3, Math.min(22, slot * 0.62));
  const y = v => T + ih - (max ? (v / max) * ih : 0);
  const tick = v => o.unit === 'som' ? compact(v).replace(' ming', 'k').replace(' mln', 'M').replace(' mlrd', 'B') : nf(v);
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = (max / 3) * i, yy = y(v); g += `<line class="gl" x1="${L}" x2="${W - 4}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L - 5}" y="${yy + 3.5}" text-anchor="end">${i ? tick(o.unit === 'som' ? v : Math.round(v)) : '0'}</text>`; }
  let bars = '';
  o.keys.forEach((k, i) => {
    const cx = L + slot * i + slot / 2;
    let acc = 0;
    const segs = o.series.map(s => ({ v: s.values[i] || 0, c: s.color })).filter(s => s.v > 0);
    segs.forEach((s, j) => {
      const y0 = y(acc), y1 = y(acc + s.v); acc += s.v;
      const top = j === segs.length - 1;
      const h = Math.max(1, y0 - y1 - (j ? 2 : 0));
      bars += top ? `<path d="${roundTop(cx - bw / 2, y1, bw, h, Math.min(4, bw / 2, h))}" fill="${s.c}"/>` : `<rect x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${h}" fill="${s.c}"/>`;
    });
    bars += `<rect x="${L + slot * i}" y="${T}" width="${slot}" height="${ih}" fill="transparent" data-ci="${i}"/>`;
  });
  let line = '';
  if (o.line && o.line.values.some(v => v > 0)) {
    const pts = o.line.values.map((v, i) => `${(L + slot * i + slot / 2).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    line = `<polyline points="${pts}" fill="none" stroke="var(--exp)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>`;
    o.line.values.forEach((v, i) => { if (v > 0) line += `<circle cx="${L + slot * i + slot / 2}" cy="${y(v)}" r="3.5" fill="var(--exp)" stroke="var(--card)" stroke-width="2"/>`; });
  }
  const step = Math.ceil(n / 7);
  let ax = '';
  o.keys.forEach((k, i) => { if (i % step === 0) ax += `<text class="ax" x="${L + slot * i + slot / 2}" y="${H - 6}" text-anchor="middle">${esc(o.fmtKey(k))}</text>`; });
  const lg = o.series.length > 1 || o.line ? `<div class="lgs">${o.series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}${o.line ? `<span><i style="background:var(--exp);height:3px"></i>${esc(o.line.name)}</span>` : ''}</div>` : '';
  return `${lg}<div class="chart" data-chart="${id}"><div class="ro" id="${id}ro">${o.hint || 'Ustunni bosing — qiymati shu yerda chiqadi'}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || 'Grafik')}">${g}${bars}${line}${ax}</svg></div>`;
}
function roundTop(x, y, w, h, r){ return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function niceMax(v){
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
  return (m <= 1.5 ? 1.5 : m <= 3 ? 3 : m <= 6 ? 6 : 10) * p;
}
function chartTap(el, i){
  const o = CHARTS[el.dataset.chart]; if (!o) return;
  const f = v => o.unit === 'som' ? money(v) : `${nf(v)} ${o.unitName || ''}`.trim();
  const fc = v => o.unit === 'som' ? compact(v) : nf(v);
  const parts = o.series.map(s => ({ name: s.name, v: s.values[i] || 0 }));
  const sum = parts.reduce((a, x) => a + x.v, 0);
  let t = `<b>${esc(o.fmtKeyLong ? o.fmtKeyLong(o.keys[i]) : o.fmtKey(o.keys[i]))}</b> — ${f(sum)}`;
  if (o.series.length > 1) t += ` (${parts.filter(x => x.v).map(x => `${esc(x.name)} ${fc(x.v)}`).join(', ') || 'yozuv yo‘q'})`;
  if (o.line) t += `; ${esc(o.line.name)}: ${money(o.line.values[i] || 0)}`;
  $(el.dataset.chart + 'ro').innerHTML = t;
}
/* Dinamika kartasi: grafik + jadval ko'rinishi */
function trend(id, d, ttl, series, opt = {}){
  const keys = keysOf(d), fk = keyFmt(d.bucket);
  if (keys.length < 2) return '';
  const ser = series(keys);
  if (!ser.some(s => s.values.some(v => v > 0)) && !(opt.line && opt.line.values.some(v => v > 0))) {
    return blk(ttl, '<div class="empty">Bu davrda yozuv yo‘q.</div>');
  }
  const tbl = S.tables[id];
  const o = { title: ttl, keys, series: ser, line: opt.line || null, unit: opt.unit || 'som', unitName: opt.unitName, fmtKey: fk.short, fmtKeyLong: fk.long };
  const f = v => o.unit === 'som' ? compact(v) : nf(v);
  const body = tbl ? `<table class="tbl"><tr><th>${d.bucket === 'hour' ? 'Soat' : d.bucket === 'month' ? 'Oy' : 'Kun'}</th>${ser.map(s => `<th>${esc(s.name)}</th>`).join('')}${o.line ? `<th>${esc(o.line.name)}</th>` : ''}</tr>
    ${keys.map((k, i) => `<tr><td>${esc(fk.long(k))}</td>${ser.map(s => `<td class="num">${f(s.values[i])}</td>`).join('')}${o.line ? `<td class="num">${f(o.line.values[i])}</td>` : ''}</tr>`).join('')}</table>` : columns(o);
  return `<div class="card blk"><h3>${ttl}<button class="lnk" data-table="${esc(id)}">${tbl ? 'Grafik' : 'Jadval'}</button></h3>${opt.explain ? `<p class="explain">${opt.explain}</p>` : ''}${body}</div>`;
}
function hourChart(d, ttl, rows, valFn, color, unit, unitName){
  if (!rows || !rows.some(r => valFn(r) > 0)) return '';
  const hs = rows.filter(r => valFn(r) > 0).map(r => Number(r.hour));
  const lo = Math.min(7, ...hs), hi = Math.max(20, ...hs), ks = [];
  for (let h = lo; h <= hi; h++) ks.push(h);
  const m = new Map(rows.map(r => [Number(r.hour), r]));
  return blk(ttl, columns({ title: ttl, keys: ks, unit, unitName, series: [{ name: ttl, color, values: ks.map(h => valFn(m.get(h) || {}) || 0) }],
    fmtKey: k => String(k).padStart(2, '0'), fmtKeyLong: k => `${String(k).padStart(2, '0')}:00`, hint: 'Qaysi soatda ko‘p — ustunni bosing' }));
}
function liveRow(ttl, sub, x){
  const frozen = x.status !== 'active';
  return `<div class="live"><i class="dot ${frozen ? 'off' : ''}"></i><div class="who">${esc(ttl)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>
    <div class="tm num">${dur(x.minutes)}<small>${frozen ? 'to‘xtatilgan' : x.planned_minutes ? `${dur(x.planned_minutes)} dan` : `${hm(x.started_at)} dan`}</small></div></div>`;
}
const ALERT_I = { warn: IC.alert, bad: IC.alert, info: IC.info };
function alertsBlock(list){
  if (!list || !list.length) return '';
  return `<div class="alerts">${list.map(a => { const lv = a.level === 'bad' ? 'bad' : a.level === 'warn' ? 'warn' : 'info'; return `<div class="alert ${lv}">${ALERT_I[lv]}<div>${esc(a.text)}</div></div>`; }).join('')}</div>`;
}

};
function screen(d){
  const r = d._range || range(S.per);
  const cmp = cmpWord(r, !!d.combined?.compare?.partial);
  const ctx = { d, r, cmp, a12: d.avtodrom12 || {}, avd: d.avtodrom || {}, c: d.combined || {} };

  if (!sec || !SCREENS[sec]) return { title: null, html: homeScreen(ctx) };
