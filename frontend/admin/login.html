<!doctype html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16A34A"><title>AVTODROM — Admin kirish</title><style>:root{--g:#16A34A;--g2:#15803D;--bg:#F7FAF8;--t:#17201B;--m:#718078;--b:#DDE7E0;--r:#C62828}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);background:#fff;border:1px solid var(--b);border-radius:24px;padding:32px}.logo{width:48px;height:48px;border-radius:14px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;margin-bottom:22px}h1{font-size:28px;margin:0 0 7px}p{margin:0;color:var(--m);font-size:14px;line-height:1.5}.field{margin-top:20px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;height:50px;border:1.5px solid var(--b);border-radius:12px;padding:0 14px;font-size:15px;outline:none;background:#fff}.field input:focus{border-color:var(--g)}.btn{width:100%;height:52px;border:0;border-radius:13px;background:var(--g);color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:22px}.btn:disabled{opacity:.6}.error{display:none;margin-top:14px;padding:11px 12px;border-radius:10px;background:#FFF1F1;color:var(--r);font-size:13px;font-weight:700}.hint{margin-top:18px;text-align:center;font-size:12px;color:#8A958E}</style></head><body><main class="card"><div class="logo">A</div><h1>Admin panel</h1><p>Davom etish uchun admin login va parolingizni kiriting.</p><form id="form" autocomplete="on"><div class="field"><label for="login">Login</label><input id="login" name="username" autocomplete="username" required></div><div class="field"><label for="password">Parol</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><div id="error" class="error"></div><button id="btn" class="btn" type="submit">Kirish</button></form><div class="hint">AVTODROM boshqaruv tizimi</div></main><script>const f=document.getElementById('form'),b=document.getElementById('btn'),e=document.getElementById('error');f.addEventListener('submit',async x=>{x.preventDefault();e.style.display='none';b.disabled=true;b.textContent='Tekshirilmoqda...';try{const r=await fetch('/api/admin/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({login:document.getElementById('login').value.trim(),password:document.getElementById('password').value})});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}if(!r.ok)throw Error(d.error||d.message||('Server xatosi '+r.status));location.replace('/admin/')}catch(q){e.textContent=q.message||'Serverga ulanishda xatolik';e.style.display='block';b.disabled=false;b.textContent='Kirish'}});</script></body></html>
