<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16A34A">
<title>AVTODROM — Admin kirish</title>
<style>
:root{--green:#16A34A;--green2:#15803D;--bg:#F7FAF8;--text:#17201B;--muted:#718078;--border:#DDE7E0;--white:#fff;--red:#C62828}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(420px,100%);background:var(--white);border:1px solid var(--border);border-radius:24px;padding:32px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;margin-bottom:22px}
h1{font-size:28px;letter-spacing:-.04em;margin:0 0 7px}p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.field{margin-top:20px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;height:50px;border:1.5px solid var(--border);border-radius:12px;padding:0 14px;font-size:15px;outline:none;background:#fff;color:var(--text)}.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px #16a34a1c}.btn{width:100%;height:52px;border:0;border-radius:13px;background:var(--green);color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:22px}.btn:hover{background:var(--green2)}.btn:disabled{opacity:.6;cursor:wait}.error{display:none;margin-top:14px;padding:11px 12px;border-radius:10px;background:#FFF1F1;color:var(--red);font-size:13px;font-weight:700}.hint{margin-top:18px;text-align:center;font-size:12px;color:#8A958E}
</style>
</head>
<body>
<main class="card">
  <div class="logo">A</div>
  <h1>Admin panel</h1>
  <p>Davom etish uchun admin login va parolingizni kiriting.</p>
  <form id="form" autocomplete="on">
    <div class="field"><label for="login">Login</label><input id="login" name="username" autocomplete="username" required></div>
    <div class="field"><label for="password">Parol</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <div id="error" class="error"></div>
    <button id="btn" class="btn" type="submit">Kirish</button>
  </form>
  <div class="hint">AVTODROM boshqaruv tizimi</div>
</main>
<script>
const form=document.getElementById('form'),btn=document.getElementById('btn'),error=document.getElementById('error');
(async()=>{try{const r=await fetch('/api/admin/me',{credentials:'include'});if(r.ok)location.replace('/admin/');}catch{}})();
form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';btn.disabled=true;btn.textContent='Tekshirilmoqda...';try{const r=await fetch('/api/admin/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:document.getElementById('login').value,password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Login yoki parol noto‘g‘ri');location.replace('/admin/');}catch(err){error.textContent=err.message;error.style.display='block';btn.disabled=false;btn.textContent='Kirish';}});
</script>
</body>
</html>
