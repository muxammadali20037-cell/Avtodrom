<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ruxsat — Avtodrom</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg:var(--tg-theme-bg-color,#f4f6fb);--card:var(--tg-theme-secondary-bg-color,#fff);--tx:var(--tg-theme-text-color,#0f172a);--mut:var(--tg-theme-hint-color,#64748b);--btn:var(--tg-theme-button-color,#2563eb);--btx:var(--tg-theme-button-text-color,#fff)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  main{max-width:440px;margin:0 auto;padding:40px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
  .ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:42px;background:var(--card);box-shadow:0 6px 24px rgba(15,23,42,.08)}
  .ic.ok{background:#dcfce7}.ic.no{background:#fee2e2}.ic.wait{background:#e0e7ff}
  h1{font-size:22px;margin:6px 0 0}
  p{margin:0;color:var(--mut)}
  .sum{font-size:15px;background:var(--card);border-radius:14px;padding:12px 16px;width:100%;color:var(--tx)}
  .sum s{color:var(--mut)}
  button{appearance:none;border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;width:100%;background:var(--btn);color:var(--btx);cursor:pointer}
  button.soft{background:var(--card);color:var(--tx)}
  .spin{width:42px;height:42px;border:4px solid rgba(37,99,235,.2);border-top-color:#2563eb;border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .hidden{display:none}
</style>
</head>
<body>
<main>
  <div class="ic wait" id="ic"><div class="spin"></div></div>
  <h1 id="t">Yuborilmoqda…</h1>
  <p id="m">Qaroringiz kassaga yuborilmoqda.</p>
  <div class="sum hidden" id="sum"></div>
  <button id="retry" class="hidden">Qayta urinish</button>
  <button id="close" class="soft hidden">Yopish</button>
</main>
<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  try { tg && tg.ready(); tg && tg.expand(); } catch (e) {}
  var qs = new URLSearchParams(location.search);
  var id = qs.get('id') || '', d = qs.get('d') || '', s = qs.get('s') || '';
  var $ = function(x){ return document.getElementById(x); };
  var nf = function(v){ return String(Math.round(Number(v) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); };
  function show(kind, title, msg, data){
    var ic = $('ic');
    ic.className = 'ic ' + kind;
    ic.innerHTML = kind === 'ok' ? '✅' : kind === 'no' ? '❌' : kind === 'wait' ? '<div class="spin"></div>' : '⚠️';
    $('t').textContent = title; $('m').textContent = msg || '';
    if (data && data.total !== undefined) {
      $('sum').innerHTML = 'Narx: <s>' + nf(data.expected) + '</s> → <b>' + nf(data.total) + ' so‘m</b>' + (data.decided_by ? '<br><small>' + String(data.decided_by).replace(/[<>&]/g, '') + '</small>' : '');
      $('sum').classList.remove('hidden');
    }
    $('close').classList.toggle('hidden', !tg);
  }
  function send(){
    $('retry').classList.add('hidden');
    show('wait', 'Yuborilmoqda…', 'Qaroringiz kassaga yuborilmoqda.');
    if (!id || (d !== 'ok' && d !== 'no')) return show('err', 'Havola noto‘g‘ri', 'Admin botdagi xabar tugmasini qayta bosing.');
    var body = { id: id, d: d };
    if (tg && tg.initData) body.initData = tg.initData; else if (s) body.s = s;
    fetch('/api/price-ok', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(body), cache: 'no-store' })
      .then(function(r){ return r.json().catch(function(){ return { ok: false, error: 'Serverdan javob kelmadi' }; }); })
      .then(function(j){
        if (!j || j.ok === false) { $('retry').classList.remove('hidden'); return show('err', 'Bajarilmadi', (j && j.error) || 'Xato'); }
        var st = j.status;
        if (st === 'approved' || st === 'used') {
          show('ok', j.already ? 'Ruxsat allaqachon berilgan' : 'Ruxsat berildi', 'Kassir chekni hozir chiqaradi.', j);
          try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
        } else if (st === 'rejected') {
          show('no', j.already ? 'Allaqachon rad etilgan' : 'Rad etildi', 'Kassaga «rad etildi» deb yuborildi.', j);
        } else if (st === 'cancelled') {
          show('err', 'So‘rov bekor qilingan', 'Kassir bu so‘rovni bekor qildi.', j);
        } else if (st === 'expired') {
          show('err', 'Muddati o‘tgan', 'So‘rov 15 daqiqa ichida javobsiz qoldi. Kassir qayta so‘rashi kerak.', j);
        } else {
          show('err', 'Holat: ' + st, '', j);
        }
        if (tg && !j.already && (st === 'approved' || st === 'rejected')) setTimeout(function(){ try { tg.close(); } catch (e) {} }, 1800);
      })
      .catch(function(){ $('retry').classList.remove('hidden'); show('err', 'Internet yo‘q', 'Ulanishni tekshirib, qayta urinib ko‘ring.'); });
  }
  $('retry').onclick = send;
  $('close').onclick = function(){ try { tg.close(); } catch (e) {} };
  send();
})();
</script>
</body>
</html>
