<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Avtodrom — Admin</title>

<style>
:root{
  --bg:#f4f7f4;
  --card:#ffffff;
  --text:#17201a;
  --muted:#728078;
  --line:#dfe7e1;
  --green:#0d6338;
  --green2:#16834b;
  --danger:#b83232;
}

*{
  box-sizing:border-box;
}

html,
body{
  min-height:100%;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 10% 0,#e4f1e8 0,transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;
  place-items:center;
  padding:20px;
}

.login{
  width:min(430px,100%);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:30px;
  box-shadow:0 18px 55px rgba(15,40,25,.07);
}

.logo{
  width:58px;
  height:58px;
  display:grid;
  place-items:center;
  border-radius:17px;
  background:var(--green);
  color:#fff;
  font-size:25px;
  margin-bottom:20px;
}

.small{
  color:var(--green2);
  font-size:11px;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

h1{
  margin:7px 0;
  font-size:30px;
}

.desc{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin-bottom:24px;
}

.field{
  margin-bottom:15px;
}

label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:7px;
}

input{
  width:100%;
  height:48px;
  padding:0 13px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
  font-size:16px;
  color:var(--text);
  background:#fff;
}

input:focus{
  border-color:var(--green2);
  box-shadow:0 0 0 3px rgba(22,131,75,.10);
}

button{
  width:100%;
  height:50px;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:#fff;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
}

.error{
  display:none;
  margin:12px 0;
  padding:11px 12px;
  border-radius:10px;
  background:#fdeaea;
  color:var(--danger);
  font-size:13px;
}

.error.show{
  display:block;
}
</style>
</head>

<body>

<main class="login">

  <div class="logo">🚘</div>

  <div class="small">AVTODROM · ADMIN</div>

  <h1>Admin panel</h1>

  <div class="desc">
    Boshqaruv paneliga kirish uchun login va parolingizni kiriting.
  </div>

  <form id="loginForm">

    <div class="field">
      <label for="login">LOGIN</label>
      <input
        id="login"
        name="login"
        autocomplete="username"
        placeholder="Admin login"
        required
      >
    </div>

    <div class="field">
      <label for="password">PAROL</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Admin parol"
        required
      >
    </div>

    <div id="error" class="error"></div>

    <button id="submit" type="submit">
      Kirish
    </button>

  </form>

</main>

<script>
const form = document.getElementById("loginForm");
const login = document.getElementById("login");
const password = document.getElementById("password");
const button = document.getElementById("submit");
const error = document.getElementById("error");

function showError(text){
  error.textContent = text;
  error.classList.add("show");
}

function hideError(){
  error.textContent = "";
  error.classList.remove("show");
}

/*
 * Agar admin allaqachon login qilgan bo'lsa,
 * dashboardga o'tkazamiz.
 */
async function checkSession(){

  try{

    const response = await fetch("/api/admin/me",{
      method:"GET",
      credentials:"same-origin",
      cache:"no-store"
    });

    if(response.ok){

      const data = await response.json();

      if(data.ok){
        window.location.replace("/admin/dashboard.html");
      }

    }

  }catch(error){
    // Login oynasi ochiq qoladi.
  }

}

form.addEventListener("submit",async function(event){

  event.preventDefault();

  hideError();

  const loginValue = login.value.trim();
  const passwordValue = password.value;

  if(!loginValue || !passwordValue){

    showError("Login va parolni to‘liq kiriting.");

    return;
  }

  button.disabled = true;
  button.textContent = "Tekshirilmoqda...";

  try{

    const response = await fetch("/api/admin/login",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      credentials:"same-origin",

      body:JSON.stringify({
        login:loginValue,
        password:passwordValue
      })

    });

    let data = null;

    try{
      data = await response.json();
    }catch(e){}

    if(response.ok && data && data.ok){

      window.location.replace(
        data.redirect || "/admin/dashboard.html"
      );

      return;
    }

    if(response.status === 401){

      showError("Login yoki parol noto‘g‘ri.");

    }else if(response.status === 404){

      showError("Admin login API topilmadi. Vercel deploymentni tekshiring.");

    }else if(response.status === 500){

      if(data && data.error === "SERVER_NOT_CONFIGURED"){

        showError(
          "Admin server sozlamalari to‘liq emas. Vercel Environment Variables ni tekshiring."
        );

      }else{

        showError("Server xatosi. Birozdan so‘ng qayta urinib ko‘ring.");

      }

    }else{

      showError("Kirishda xato yuz berdi.");

    }

  }catch(error){

    showError(
      "Serverga ulanib bo‘lmadi. Internet yoki Vercel deploymentni tekshiring."
    );

  }finally{

    button.disabled = false;
    button.textContent = "Kirish";

  }

});

checkSession();
login.focus();
</script>

</body>
</html>
