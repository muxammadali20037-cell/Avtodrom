<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087f45">
<title>AVTODROM — Admin kirish</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7faf8;color:#142019}body{min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(440px,100%)}.card{background:#fff;border:1px solid #dfe9e2;border-radius:24px;padding:30px;box-shadow:0 20px 60px rgba(20,60,40,.08)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{width:52px;height:52px;border-radius:15px;background:#087f45;color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:900;color:#087f45;text-transform:uppercase}.title{font-size:30px;line-height:1.1;font-weight:850;margin:0 0 8px}.sub{font-size:14px;color:#718078;line-height:1.5;margin:0 0 24px}.field{margin:0 0 16px}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}.field input{width:100%;height:50px;border:1px solid #d7e2db;border-radius:12px;padding:0 14px;font-size:15px;background:#fff;outline:none}.field input:focus{border-color:#0b8f50;box-shadow:0 0 0 3px rgba(11,143,80,.1)}button{width:100%;height:52px;border:0;border-radius:12px;background:#087f45;color:#fff;font-weight:800;font-size:15px;cursor:pointer}button:hover{background:#066c3a}button:disabled{opacity:.55;cursor:wait}.error{display:none;margin:14px 0 0;padding:11px 12px;border-radius:10px;background:#fff0f0;color:#c62828;font-size:13px;font-weight:700}.status{text-align:center;min-height:18px;margin-top:12px;font-size:12px;color:#718078}.foot{text-align:center;margin-top:18px;color:#8a958e;font-size:11px}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<div class="brand"><div class="mark">A</div><div><div class="eyebrow">AVTODROM · ADMIN</div><div style="font-size:13px;color:#718078;margin-top:3px">Boshqaruv tizimi</div></div></div>
<h1 class="title">Admin panelga kirish</h1>
<p class="sub">Login va parol orqali kiring. Telegram akkaunti yoki Telegram Mini App tekshiruvi talab qilinmaydi.</p>
<form id="form" autocomplete="on">
<div class="field"><label for="login">Login</label><input id="login" name="username" autocomplete="username" required></div>
<div class="field"><label for="password">Parol</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<div id="error" class="error"></div><button id="btn" type="submit">Kirish</button><div id="status" class="status"></div>
</form><div class="foot">AVTODROM boshqaruv tizimi · xavfsiz admin sessiya</div>
</main></div>
<script>
const form=document.getElementById('form'),btn=document.getElementById('btn'),error=document.getElementById('error'),status=document.getElementById('status');
function fail(x){error.textContent=x||'Serverga ulanishda xatolik';error.style.display='block'}
form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';status.textContent='Server tekshirilmoqda...';btn.disabled=true;btn.textContent='Kirilmoqda...';try{const r=await fetch('/api/admin/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({login:document.getElementById('login').value.trim(),password:document.getElementById('password').value})});const text=await r.text();let d={};try{d=JSON.parse(text)}catch(_){}if(!r.ok||!d.ok)throw new Error(d.error||d.message||('Server xatosi '+r.status));status.textContent='Muvaffaqiyatli. Panel ochilmoqda...';window.location.replace('/admin/dashboard')}catch(err){fail(err.message);status.textContent='';btn.disabled=false;btn.textContent='Kirish'}});
</script>
</body>
</html>
