<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#232883">
<meta name="format-detection" content="telephone=no">
<title>TASH INDEX AVTODROM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* =========================================================================
   TASH INDEX AVTODROM — mijoz Mini App
   Rang: logotipdagi to'q ko'k (indigo).
   Telegram temasiga moslashadi (yorug' / qorong'i). Tashqi rasm yoki
   shrift yuklanmaydi — ilova tez ochiladi.
   ========================================================================= */
:root{
  --accent:#2b2f8f;--accent-press:#22257a;--accent-soft:#eceefb;--on-accent:#fff;
  --bg:#f1f3f8;--card:#fff;--card-2:#f4f5fa;--text:#141833;--hint:#6b7188;--line:rgba(20,24,51,.10);
  --danger:#d14343;--danger-soft:#fdeeee;--warn:#8a5d00;--warn-soft:#fff4d6;--info:#1f6fbf;--info-soft:#e8f2fc;
  --ok:#1b8356;--ok-soft:#e6f5ee;
  --star:#f5b400;
  --hero:linear-gradient(140deg,#0f1340 0%,#232883 55%,#3a40ae 100%);
  --shadow:0 1px 2px rgba(16,20,48,.04),0 6px 20px rgba(16,20,48,.06);
  --sb:env(safe-area-inset-bottom,0px);
  --nav-h:64px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --accent:#8a90fa;--accent-press:#767df2;--accent-soft:rgba(138,144,250,.16);--on-accent:#0a0c24;
  --bg:#0d0f18;--card:#161927;--card-2:#1e2233;--text:#e8eaf4;--hint:#8e94ab;--line:rgba(255,255,255,.09);
  --danger:#ff7070;--danger-soft:rgba(255,112,112,.13);--warn:#f2c14e;--warn-soft:rgba(242,193,78,.13);--info:#7cc0ff;--info-soft:rgba(124,192,255,.13);
  --ok:#4cd39a;--ok-soft:rgba(76,211,154,.14);
  --hero:linear-gradient(140deg,#0b0e30 0%,#1d2170 55%,#343aa0 100%);
  --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{overflow-x:hidden;font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px calc(var(--nav-h) + var(--sb) + 28px)}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.muted{color:var(--hint)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- sarlavha ---------- */
.top{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.mark{width:42px;height:42px;border-radius:13px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.logo{display:block;flex:none;width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;box-shadow:0 0 0 1px var(--line),0 2px 8px rgba(16,20,48,.08)}
.top .who{flex:1;min-width:0}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:13px;color:var(--hint)}
.icon-btn{width:44px;height:44px;border-radius:13px;background:var(--card);display:grid;place-items:center;position:relative;box-shadow:var(--shadow)}
.dot{position:absolute;top:9px;right:10px;min-width:9px;height:9px;border-radius:9px;background:var(--danger);box-shadow:0 0 0 2px var(--card)}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 14px}
.page-h h1{font-size:24px;margin:0;letter-spacing:-.5px}

/* ---------- umumiy ---------- */
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px}
.sec-h h2{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px}
.step{display:flex;align-items:center;gap:8px;margin:20px 2px 10px;font-size:15px;font-weight:700}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:800}
.step .opt{margin-left:auto;font-size:13px;font-weight:600;color:var(--accent)}
.link{color:var(--accent);font-weight:600;font-size:14px}
.note{padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.45}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.err{background:var(--danger-soft);color:var(--danger)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.ok{background:var(--accent-soft);color:var(--accent)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:15px;padding:0 18px;font-weight:700;font-size:16px;width:100%;transition:transform .08s,background .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:active{background:var(--accent-press)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-soft{background:var(--card-2);color:var(--text)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-sm{min-height:40px;font-size:14px;border-radius:12px;padding:0 14px;width:auto}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{flex:1}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- bosh sahifa ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px 20px;color:#fff;
  background:var(--hero)}
.hero::before{content:"";position:absolute;right:-50px;top:-70px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.20),transparent 68%)}
.hero>*{position:relative}
.hero .road{position:absolute;right:-8px;bottom:-4px;opacity:.14}
.hero .logo{position:absolute;right:16px;top:16px;width:76px;height:76px;padding:2px;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.hero small,.hero h2{max-width:calc(100% - 88px)}
.hero small{display:block;font-size:12px;font-weight:700;letter-spacing:.6px;opacity:.8;text-transform:uppercase}
.hero h2{position:relative;margin:6px 0 6px;font-size:24px;line-height:1.15;letter-spacing:-.5px;max-width:85%}
.hero p{position:relative;margin:0 0 16px;color:rgba(255,255,255,.85);font-size:14px;max-width:88%}
.btn-light{position:relative;background:#fff;color:#232883;font-weight:700;border-radius:14px;padding:13px 18px;display:inline-flex;align-items:center;gap:8px;font-size:15.5px}
.btn-light:active{transform:scale(.98)}

.next{display:block;width:100%;margin-top:14px;cursor:pointer}
.next .lbl{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--hint);text-transform:uppercase}
.next .when{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-top:6px}
.next .meta{color:var(--hint);font-size:14px;margin-top:2px}

.tariffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tariff{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.tariff b{display:block;font-size:26px;font-weight:800;line-height:1;color:var(--accent)}
.tariff .k{display:block;font-size:11.5px;color:var(--hint);margin-top:6px;font-weight:600}
.tariff .p{display:block;font-size:14px;font-weight:700;margin-top:6px}
.tariff .h{display:block;font-size:11.5px;color:var(--hint)}

.inst-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x proximity;scroll-padding:0 16px}
.inst-row::-webkit-scrollbar{display:none}
.icard{flex:none;width:148px;scroll-snap-align:start;background:var(--card);border-radius:18px;padding:14px 12px;text-align:center;box-shadow:var(--shadow)}
.icard .ava{margin:0 auto 10px;width:64px;height:64px;font-size:20px}
.icard b{display:block;font-size:14.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icard .r{font-size:13px;color:var(--hint);margin-top:3px}
.icard .cats{margin-top:8px;justify-content:center}

.list{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;min-height:58px}
.row + .row{border-top:1px solid var(--line)}
.row .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;font-size:15px}
.row .tx small{display:block;color:var(--hint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--hint)}
.row.danger .ic{background:var(--danger-soft);color:var(--danger)}

/* ---------- avatar, teglar ---------- */
.ava{width:40px;height:40px;border-radius:50%;background:var(--accent-soft) center/cover no-repeat;color:var(--accent);
  display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;overflow:hidden}
.cats{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--card-2);color:var(--hint)}
.tag.a{background:var(--accent-soft);color:var(--accent)}

/* ---------- bron ---------- */
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:3px 16px 5px;scroll-snap-type:x proximity;scroll-padding:0 16px}
.scroller::-webkit-scrollbar{display:none}
.day{flex:none;scroll-snap-align:start;width:60px;padding:9px 0 10px;border-radius:15px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);text-align:center}
.day .w{display:block;font-size:12px;color:var(--hint);font-weight:700}
.day .d{display:block;font-size:20px;font-weight:800;margin-top:1px}
.day .m{display:block;font-size:11.5px;color:var(--hint)}
.day.on{background:var(--accent);box-shadow:none;color:var(--on-accent)}
.day.on .w,.day.on .m{color:inherit;opacity:.85}

.times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.time{min-height:48px;border-radius:13px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:15.5px;font-variant-numeric:tabular-nums;text-align:center;transition:background .15s}
.time.on{background:var(--accent);color:var(--on-accent);box-shadow:none}
.time:disabled{color:var(--hint);opacity:.55;text-decoration:line-through;box-shadow:none;background:var(--card-2)}
.sk{border-radius:13px;min-height:48px;background:linear-gradient(90deg,var(--card-2) 25%,var(--card) 50%,var(--card-2) 75%);background-size:200% 100%;animation:sk 1.1s infinite linear}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

.field{display:block;margin-top:12px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--hint);margin:0 2px 6px}
.input{width:100%;min-height:50px;border-radius:14px;border:0;background:var(--card-2);padding:13px 14px;font-size:16px;outline:none;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .15s}
.view-book .input{background:var(--card)}
.input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
textarea.input{min-height:88px;resize:none;line-height:1.4}
.input::placeholder{color:var(--hint);opacity:.8}

.bar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--sb));z-index:30;padding:10px 12px 8px;
  background:linear-gradient(to top,var(--bg) 62%,transparent)}
.bar-in{max-width:536px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;
  padding:9px 9px 9px 16px;box-shadow:0 10px 32px rgba(0,0,0,.14)}
.bar .sum{flex:1;min-width:0}
.bar .sum b{display:block;font-size:18px;letter-spacing:-.3px;white-space:nowrap}
.bar .sum span{display:block;font-size:12.5px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .btn{width:auto;min-width:138px;min-height:50px}
@media (max-width:360px){
  .wrap{padding-left:12px;padding-right:12px}
  .scroller,.inst-row{margin:0 -12px;padding-left:12px;padding-right:12px;scroll-padding:0 12px}
  .bar .sum b{font-size:16px}.bar .btn{min-width:0;padding:0 14px;font-size:15px}
  .tariff b{font-size:24px}.tariff .p{font-size:12px}
  .opt{padding:13px}.opt .lt{width:46px;height:46px;font-size:23px}.opt .rt{font-size:14px}
  .wz-h{font-size:23px}
  .times{gap:6px}.time{font-size:14.5px}
}
.wrap.view-book{padding-bottom:calc(var(--nav-h) + var(--sb) + 112px)}


/* ---------- bron bosqichlari ---------- */
.wz-top{display:flex;align-items:center;gap:12px;padding:2px 0 14px}
.wz-back{width:42px;height:42px;border-radius:13px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.wz-back:active{transform:scale(.95)}
.wz-prog{flex:1;display:flex;gap:5px}
.wz-prog i{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .25s}
.wz-prog i.done{background:var(--accent)}
.wz-prog i.cur{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%)}
.wz-count{font-size:13px;font-weight:700;color:var(--hint);min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
.wz-h{font-size:26px;line-height:1.15;letter-spacing:-.6px;margin:4px 2px 6px}
.wz-sub{color:var(--hint);margin:0 2px 18px;font-size:14.5px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.crumbs button{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700}
.opt-list{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;border-radius:20px;background:var(--card);
  box-shadow:var(--shadow);text-align:left;transition:transform .1s,background .15s,box-shadow .15s}
.opt:active{transform:scale(.985)}
.opt.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.opt:disabled{opacity:.45}
.opt .lt{width:54px;height:54px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:27px;font-weight:800;flex:none}
.opt .lt.solid,.opt.on .lt{background:var(--accent);color:var(--on-accent)}
.opt .tx{flex:1;min-width:0}
.opt .tx b{display:block;font-size:17px;letter-spacing:-.2px}
.opt .tx small{display:block;color:var(--hint);font-size:13.5px;margin-top:2px}
.opt .tx small.car{display:flex;align-items:center;gap:5px}
.opt .rt{text-align:right;font-weight:800;font-size:15px;flex:none}
.opt .rt small{display:block;font-weight:600;color:var(--hint);font-size:12px}
.opt>svg{color:var(--hint)}
.opt.ins{padding:0;gap:0}
.opt-main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:13px 4px 13px 14px;text-align:left}
.info-btn{width:52px;align-self:stretch;display:grid;place-items:center;color:var(--hint);flex:none}
.ava.lg{width:54px;height:54px;font-size:18px}
.dur-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dur{padding:18px 16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);text-align:left;transition:transform .1s,background .15s,box-shadow .15s}
.dur:active{transform:scale(.97)}
.dur b{display:block;font-size:21px;letter-spacing:-.4px}
.dur small{display:block;color:var(--hint);font-weight:600;font-size:13.5px;margin-top:3px}
.dur.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.dur.on b,.dur.on small{color:var(--accent)}
.day-title{margin:16px 2px 10px;font-weight:700;font-size:15px}
.time small{display:block;font-size:11px;font-weight:600;color:var(--accent);margin-top:1px;text-decoration:none}
.time:disabled small{color:var(--hint)}
.time.on small{color:inherit;opacity:.85}
.switch-link{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:18px;padding:15px;border-radius:18px;
  border:1.5px dashed var(--line);color:var(--accent);font-weight:700;font-size:15px}
.sum-card{padding:4px 16px}
.sum-row{display:flex;align-items:center;gap:10px;width:100%;padding:14px 0;text-align:left;font-size:15px}
.sum-row + .sum-row{border-top:1px solid var(--line)}
.sum-row span{color:var(--hint);flex:none}
.sum-row b{flex:1;text-align:right;min-width:0}
.sum-row i{color:var(--hint);flex:none}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 12px;border-top:1.5px dashed var(--line)}
.sum-total span{font-weight:700}
.sum-total b{font-size:22px;color:var(--accent);letter-spacing:-.4px}
.done{padding-top:14px}
.slide-f{animation:slideF .24s cubic-bezier(.2,.8,.2,1)}
.slide-b{animation:slideB .24s cubic-bezier(.2,.8,.2,1)}
@keyframes slideF{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideB{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}

/* ---------- bronlarim ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:13px;padding:3px;margin-bottom:14px}
.seg button{min-height:38px;border-radius:10px;font-weight:700;font-size:14px;color:var(--hint)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bk{background:var(--card);border-radius:18px;padding:15px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.bk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bk-when{font-size:17px;font-weight:800;letter-spacing:-.3px}
.bk-meta{color:var(--hint);font-size:13.5px;margin-top:2px}
.bk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.bk-grid div{background:var(--card-2);border-radius:12px;padding:8px 10px}
.bk-grid span{display:block;font-size:11.5px;color:var(--hint);font-weight:600}
.bk-grid b{display:block;font-size:14px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;flex:none;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--card-2);color:var(--hint)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.confirmed{background:var(--info-soft);color:var(--info)}
.pill.in_progress{background:var(--ok-soft);color:var(--ok)}
.pill.completed{background:var(--card-2);color:var(--hint)}
.pill.cancelled,.pill.rejected,.pill.no_show{background:var(--danger-soft);color:var(--danger)}
.code{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--accent-soft);color:var(--accent);text-align:left}
.code .tx{flex:1;min-width:0}
.code small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;opacity:.85}
.code b{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:21px;letter-spacing:1.5px;line-height:1.2}
.bk .foot{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--hint)}
.empty{text-align:center;padding:34px 20px}
.empty .ill{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
.empty b{display:block;font-size:17px}
.empty p{color:var(--hint);margin:6px 0 16px}

/* ---------- yordam (chat) ---------- */
.chat-h{display:flex;align-items:center;gap:12px;padding:8px 2px 14px}
.chat-h .logo{width:46px;height:46px}
.chat-h b{display:block;font-size:17px}
.chat-h small{color:var(--hint);font-size:13px}
.msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:84px}
.msg{max-width:82%;padding:9px 12px 7px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;border-bottom-left-radius:6px}
.msg time{display:block;font-size:11px;opacity:.65;margin-top:2px;text-align:right}
.msg.sending{opacity:.6}
.day-sep{align-self:center;font-size:12px;color:var(--hint);background:var(--card);padding:3px 10px;border-radius:999px;margin:8px 0 2px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.quick button{padding:9px 13px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;font-weight:600}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--sb));z-index:30;padding:8px 12px;background:var(--bg)}
.composer-in{max-width:536px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer .input{flex:1;min-height:46px;max-height:120px;border-radius:23px;padding:12px 16px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.send{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4}

/* ---------- profil ---------- */
.pcard{display:flex;align-items:center;gap:14px}
.pcard .ava{width:64px;height:64px;font-size:22px}
.pcard b{display:block;font-size:19px;letter-spacing:-.3px}
.pcard small{display:block;color:var(--hint);font-size:14px}

/* ---------- pastki menyu ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--hint)}
.nav button.on{color:var(--accent)}
.nav .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}

/* ---------- pastdan chiquvchi oyna ---------- */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s;pointer-events:none}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;
  background:var(--card);border-radius:24px 24px 0 0;padding:8px 18px calc(20px + var(--sb));
  transform:translateY(105%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s;overscroll-behavior:contain}
.sheet.show{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--hint);opacity:.3;margin:4px auto 14px}
.sheet h3{margin:0 0 4px;font-size:20px;letter-spacing:-.3px}
.sheet .lead{color:var(--hint);margin:0 0 12px;font-size:14.5px}
.sheet .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;color:var(--hint)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:15px}
.kv + .kv{border-top:1px solid var(--line)}
.kv span{color:var(--hint)}
.kv b{text-align:right}
.big-ok{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:6px auto 12px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.code-big{margin:14px 0;padding:14px;border-radius:18px;border:2px dashed var(--accent);background:var(--accent-soft);text-align:center;color:var(--accent);width:100%}
.code-big small{display:block;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.code-big b{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:34px;letter-spacing:3px;margin:2px 0}
.code-big span{font-size:13px;font-weight:600}
.stars{display:flex;gap:8px;justify-content:center;margin:10px 0 4px}
.stars button{color:var(--line)}
.stars button.on{color:var(--star)}
.reasons{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.reasons button{padding:8px 12px;border-radius:12px;background:var(--card-2);font-size:14px;font-weight:600}
.reasons button.on{background:var(--accent-soft);color:var(--accent)}
.notes .n{padding:12px 0}
.notes .n + .n{border-top:1px solid var(--line)}
.notes .n b{display:block;font-size:15px}
.notes .n p{margin:3px 0 4px;color:var(--hint);font-size:14px;white-space:pre-line}
.notes .n time{font-size:12px;color:var(--hint)}
.notes .n.new b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-left:6px;vertical-align:middle}
.ins-hero{text-align:center;padding-top:6px}
.ins-hero .ava{width:86px;height:86px;font-size:28px;margin:0 auto 10px}
.ins-hero h3{margin:0}
.ins-hero .cats{justify-content:center;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:10px 6px;text-align:center}
.sheet .stats div{background:var(--card-2);box-shadow:none}
.stats b{display:block;font-size:17px}
.stats span{display:block;font-size:12px;color:var(--hint)}
.bio{white-space:pre-line;color:var(--text);font-size:14.5px;line-height:1.5;margin:0 0 14px}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));z-index:120;transform:translate(-50%,-16px);opacity:0;
  max-width:calc(100% - 32px);background:#161a3a;color:#fff;padding:12px 16px;border-radius:14px;font-size:14.5px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#b93434}

.fatal{min-height:88vh;display:grid;place-items:center;text-align:center;padding:24px}
.fatal .ill{width:76px;height:76px;border-radius:24px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 16px}
.fatal .logo.big{width:108px;height:108px;margin:0 auto 18px;padding:3px}
.fatal h2{margin:0 0 6px;font-size:21px}
.fatal p{color:var(--hint);margin:0 auto 18px;max-width:300px}

/* =========================================================================
   v3: kirish, katalog, «Avtodrom haqida», media ko'ruvchi, animatsiyalar
   ========================================================================= */
/* --- ochilish (splash) --- */
.splash{min-height:86vh;display:grid;place-items:center;text-align:center}
.splash .logo{width:112px;height:112px;margin:0 auto 16px;padding:3px;animation:breathe 1.6s ease-in-out infinite}
.splash b{display:block;font-size:18px;letter-spacing:.4px}
.splash small{color:var(--hint)}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(43,47,143,.35)}50%{transform:scale(1.04);box-shadow:0 0 0 16px rgba(43,47,143,0)}}

/* --- kirish: telefon va ism --- */
body.onb-mode .nav,body.onb-mode #dock{display:none}
body.onb-mode .wrap{padding-bottom:calc(120px + var(--sb))}
.onb{min-height:calc(100vh - 40px);display:flex;flex-direction:column;padding-top:10px}
.onb-logo{position:relative;width:96px;height:96px;margin:14px auto 18px}
.onb-logo .logo{width:96px;height:96px;padding:3px;position:relative;z-index:1}
.onb-logo::before,.onb-logo::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--accent);opacity:.0;animation:ring 2.4s ease-out infinite}
.onb-logo::after{animation-delay:1.2s}
@keyframes ring{0%{transform:scale(.85);opacity:.45}100%{transform:scale(1.35);opacity:0}}
.onb-dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.onb-dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .3s,background .3s}
.onb-dots i.on{width:26px;background:var(--accent)}
.onb h1{font-size:30px;line-height:1.1;letter-spacing:-.8px;margin:0 0 8px;text-align:center}
.onb .lead{color:var(--hint);text-align:center;margin:0 auto 26px;max-width:320px;font-size:15.5px}
.phone-box{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:6px 8px 6px 18px;
  box-shadow:inset 0 0 0 2px var(--line),var(--shadow);transition:box-shadow .2s}
.phone-box:focus-within{box-shadow:inset 0 0 0 2.5px var(--accent),0 8px 24px rgba(43,47,143,.14)}
.phone-box span{font-size:24px;font-weight:800;color:var(--hint);font-variant-numeric:tabular-nums}
.phone-box input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:26px;font-weight:800;letter-spacing:.5px;
  padding:14px 0;font-variant-numeric:tabular-nums}
.phone-box input::placeholder{color:var(--hint);opacity:.45}
.big-in{width:100%;border:0;outline:none;background:var(--card);border-radius:20px;padding:18px 18px;font-size:22px;font-weight:700;
  box-shadow:inset 0 0 0 2px var(--line),var(--shadow);transition:box-shadow .2s}
.big-in:focus{box-shadow:inset 0 0 0 2.5px var(--accent),0 8px 24px rgba(43,47,143,.14)}
.big-in + .big-in{margin-top:12px}
.or{display:flex;align-items:center;gap:12px;color:var(--hint);font-size:13px;margin:18px 4px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.btn-tg{background:var(--card);box-shadow:inset 0 0 0 2px var(--line);color:var(--text);min-height:58px;font-size:16px}
.onb-err{margin-top:12px}
.onb-foot{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px 16px calc(14px + var(--sb));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.onb-foot .btn{max-width:528px;margin:0 auto;min-height:58px;font-size:17px;border-radius:18px}
.hello{position:fixed;inset:0;z-index:150;display:grid;place-items:center;text-align:center;padding:24px;background:var(--hero);color:#fff;
  animation:helloIn .35s ease both}
.hello .logo{width:120px;height:120px;margin:0 auto 20px;padding:3px;animation:pop .6s cubic-bezier(.2,1.5,.4,1) both}
.hello h2{font-size:30px;margin:0 0 6px;letter-spacing:-.6px;animation:up .5s .15s both}
.hello p{margin:0;opacity:.85;animation:up .5s .25s both}
.hello.out{animation:helloOut .35s ease forwards}
@keyframes helloIn{from{opacity:0}to{opacity:1}}
@keyframes helloOut{to{opacity:0;visibility:hidden}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* --- bosh sahifa --- */
.top .who.brand h1{white-space:normal;font-size:16px;line-height:1.12;letter-spacing:.2px;font-weight:800;color:var(--accent)}
.top .me{width:44px;height:44px;border-radius:50%;overflow:hidden;box-shadow:var(--shadow);background:var(--accent-soft) center/cover;
  color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px}
.welcome{position:relative;overflow:hidden;border-radius:26px;min-height:216px;color:#fff;background:var(--hero);isolation:isolate}
.welcome-bg{position:absolute;inset:0;background:center/cover no-repeat;z-index:-2;animation:kb 20s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.18) translate(-2%,-3%)}}
.welcome-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,12,40,.15) 0%,rgba(10,12,40,.55) 55%,rgba(10,12,40,.88) 100%)}
.welcome.noimg .welcome-shade{background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.18),transparent 55%)}
.road3d{position:absolute;right:-30px;bottom:-40px;width:210px;height:260px;z-index:-1;transform:perspective(260px) rotateX(58deg);transform-origin:bottom;
  background:linear-gradient(90deg,transparent 0 12%,rgba(255,255,255,.10) 12% 88%,transparent 88%);border-radius:8px;opacity:.9}
.road3d::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:8px;margin-left:-4px;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.75) 0 26px,transparent 26px 52px);animation:dash .9s linear infinite}
.road3d::after{content:"";position:absolute;inset:0 12%;border-left:3px solid rgba(255,255,255,.35);border-right:3px solid rgba(255,255,255,.35)}
@keyframes dash{to{background-position:0 52px}}
.welcome-in{position:relative;padding:22px 20px 20px;display:flex;flex-direction:column;justify-content:flex-end;min-height:216px}
.welcome-in small{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;opacity:.85}
.welcome-in h2{margin:4px 0 4px;font-size:30px;line-height:1.08;letter-spacing:-.8px}
.welcome-in p{margin:0;font-size:15px;opacity:.9}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.2s ease-in-out 1s 2}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}

.ask{font-size:21px;font-weight:800;letter-spacing:-.4px;margin:22px 2px 12px}
.choices{display:grid;gap:12px}
.choice{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;min-height:112px;padding:18px;border-radius:24px;
  text-align:left;background:var(--card);box-shadow:var(--shadow);isolation:isolate;transition:transform .12s}
.choice:active{transform:scale(.98)}
.choice .ci{width:62px;height:62px;border-radius:19px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.choice b{display:block;font-size:22px;letter-spacing:-.5px;line-height:1.15}
.choice small{display:block;font-size:14px;margin-top:4px;color:var(--hint)}
.choice .go{margin-left:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.choice.main{background:var(--hero);color:#fff;box-shadow:0 14px 34px rgba(35,40,131,.35)}
.choice.main .ci{background:rgba(255,255,255,.16);color:#fff}
.choice.main small{color:rgba(255,255,255,.82)}
.choice.main .go{background:#fff;color:#232883;animation:nudge 1.8s ease-in-out infinite}
.choice.main::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;z-index:-1;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.choice.info{color:#fff;background:#1b1f55 center/cover no-repeat}
.choice.info::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,12,40,.92),rgba(10,12,40,.55))}
.choice.info .ci{background:rgba(255,255,255,.16);color:#fff}
.choice.info small{color:rgba(255,255,255,.82)}
.choice.info .go{background:rgba(255,255,255,.18);color:#fff}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);
  text-align:center;font-size:13.5px;font-weight:700;line-height:1.2;transition:transform .12s;position:relative}
.tile:active{transform:scale(.95)}
.tile .ti{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff}
.tile .n{position:absolute;top:8px;right:10px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;display:grid;place-items:center}
.t1{background:linear-gradient(135deg,#2b2f8f,#4a50c8)}.t2{background:linear-gradient(135deg,#0f7a8a,#1fb3a6)}
.t3{background:linear-gradient(135deg,#c2410c,#f59e0b)}.t4{background:linear-gradient(135deg,#7c3aed,#c084fc)}
.t5{background:linear-gradient(135deg,#0e7a4f,#34c27b)}.t6{background:linear-gradient(135deg,#be123c,#fb7185)}
.t7{background:linear-gradient(135deg,#1d4ed8,#60a5fa)}.t8{background:linear-gradient(135deg,#334155,#64748b)}
.t9{background:linear-gradient(135deg,#a16207,#eab308)}

/* --- chiqish animatsiyasi (ko'ringanda) --- */
.rv{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

/* --- «Avtodrom haqida» --- */
.cover{position:relative;margin:0 -16px;height:300px;overflow:hidden;background:var(--hero);color:#fff}
.cover-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.cover-track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:start;position:relative;background:center/cover no-repeat #141848}
.slide video{width:100%;height:100%;object-fit:cover;display:block}
.slide .play{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.92);color:#232883;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.cover-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(10,12,40,.35) 0%,transparent 30%,transparent 50%,rgba(10,12,40,.9) 100%)}
.cover-back{position:absolute;left:14px;top:12px;width:42px;height:42px;border-radius:13px;background:rgba(10,12,40,.45);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center}
.cover-cap{position:absolute;left:16px;right:16px;bottom:18px;display:flex;align-items:center;gap:12px;pointer-events:none}
.cover-cap .logo{width:56px;height:56px;padding:2px}
.cover-cap b{display:block;font-size:22px;letter-spacing:-.4px;line-height:1.1}
.cover-cap small{opacity:.85;font-size:13.5px}
.dots{position:absolute;right:16px;top:22px;display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.45);transition:width .3s,background .3s}
.dots i.on{width:20px;background:#fff}
.chipsnav{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:12px 16px;background:var(--bg)}
.chipsnav::-webkit-scrollbar{display:none}
.chipsnav button{flex:none;padding:9px 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px}
.chipsnav button.on{background:var(--accent);color:var(--on-accent)}
.about-txt{font-size:16px;line-height:1.6;margin:4px 2px 0}
.asec{margin-top:26px;scroll-margin-top:66px}
.asec>h2{font-size:21px;letter-spacing:-.4px;margin:0 2px 12px}
.stats4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow)}
.stat .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:10px}
.stat b{display:block;font-size:30px;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.stat span{display:block;color:var(--hint);font-size:13.5px;margin-top:4px}
.fac{display:grid;gap:10px}
.fac div{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.fac i{font-style:normal;font-size:24px;width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.fac b{display:block;font-size:15.5px}
.fac span{display:block;color:var(--hint);font-size:14px;margin-top:2px;line-height:1.45}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gal button{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--card-2) center/cover no-repeat}
.gal button:first-child{grid-column:span 2;grid-row:span 2}
.gal .vi{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,40,.28);color:#fff}
.gal .more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,40,.6);color:#fff;font-size:20px;font-weight:800}
.vid{border-radius:20px;overflow:hidden;background:#000;box-shadow:var(--shadow)}
.vid video{display:block;width:100%;aspect-ratio:16/9;max-height:60vh;background:#000;object-fit:contain}
.course{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.course div{padding:14px 10px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);text-align:center}
.course b{display:block;font-size:28px;color:var(--accent);line-height:1}
.course span{display:block;font-weight:800;margin-top:8px;font-size:15px}
.course small{display:block;color:var(--hint);font-size:12.5px;margin-top:2px}
.prc{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-bottom:10px}
.prc-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.prc-h .lt{width:48px;height:48px;border-radius:15px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.prc-h b{display:block;font-size:17px}
.prc-h small{color:var(--hint)}
.prow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.prow div{background:var(--card-2);border-radius:12px;padding:8px 4px;text-align:center}
.prow span{display:block;font-size:12px;color:var(--hint);font-weight:600}
.prow b{display:block;font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.ins-row2{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x proximity;scroll-padding:0 16px}
.ins-row2::-webkit-scrollbar{display:none}
.icard2{flex:none;width:210px;scroll-snap-align:start;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;text-align:left}
.icard2 .ava{width:58px;height:58px;font-size:19px;margin-bottom:10px}
.icard2 b{display:block;font-size:16px}
.icard2 small{display:block;color:var(--hint);font-size:13px;margin-top:2px}
.icard2 .cats{margin-top:8px}
.map{position:relative;height:210px;border-radius:20px;overflow:hidden;background:var(--hero);box-shadow:var(--shadow)}
.map iframe{width:100%;height:100%;border:0;display:block}
.map .ph{position:absolute;inset:0;background:center/cover no-repeat}
.map .pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);color:#fff;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,-118%)}}
.maprow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.maprow button{text-align:center;padding:12px 6px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:13.5px}
.callbtn{display:flex;align-items:center;gap:14px;margin-top:10px;padding:14px 16px;border-radius:18px;background:var(--ok-soft);color:var(--ok);text-decoration:none;font-weight:800}
.callbtn .ic{width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none;animation:ringing 2.4s ease-in-out infinite}
@keyframes ringing{0%,70%,100%{transform:rotate(0)}75%,85%,95%{transform:rotate(-12deg)}80%,90%{transform:rotate(12deg)}}
.callbtn small{display:block;font-weight:600;opacity:.85}
.faq{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:15px 16px;font-weight:700;font-size:15.5px}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{margin-left:auto;color:var(--hint);transition:transform .2s}
.faq[open] summary svg{transform:rotate(90deg)}
.faq p{margin:0;padding:0 16px 16px;color:var(--hint);white-space:pre-line;line-height:1.55}
.cta-big{margin-top:24px;min-height:62px;font-size:18px;border-radius:20px;box-shadow:0 14px 30px rgba(35,40,131,.3)}

/* --- media ko'ruvchi --- */
.viewer{position:fixed;inset:0;z-index:140;background:#05060f;color:#fff;display:flex;flex-direction:column;animation:helloIn .2s ease}
.viewer-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
.viewer-top b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.viewer-top span{opacity:.7;font-size:14px;font-variant-numeric:tabular-nums}
.viewer-x{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.viewer-stage{flex:1;display:grid;place-items:center;position:relative;overflow:hidden;touch-action:pan-y}
.viewer-stage img,.viewer-stage video{max-width:100%;max-height:100%;object-fit:contain;animation:fade .2s ease}
.viewer-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.viewer-nav.l{left:10px}.viewer-nav.r{right:10px}

/* --- pastki menyu: markazda katta «Bron» --- */
.nav button.fab{color:var(--accent)}
.nav .fab .fb{width:56px;height:56px;margin-top:-26px;border-radius:50%;background:var(--hero);color:#fff;display:grid;place-items:center;
  box-shadow:0 8px 22px rgba(35,40,131,.45),0 0 0 5px var(--card);transition:transform .15s}
.nav .fab:active .fb{transform:scale(.92)}
.nav .fab.on .fb{animation:pop .4s ease}

/* --- konfetti --- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:160;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;opacity:.95;animation:fall var(--t,2.2s) cubic-bezier(.25,.6,.5,1) forwards;animation-delay:var(--dl,0s)}
@keyframes fall{to{transform:translate(var(--x,0),110vh) rotate(var(--r,540deg));opacity:.9}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

let toastT = 0;
function toast(msg, isErr = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2800);
}
function hideToast() { clearTimeout(toastT); $('#toast').classList.remove('show'); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (x) {}
    ta.remove();
  }
  haptic.ok();
  toast(`${text} — nusxalandi`);
}

async function req(path, { method = 'GET', body, timeout = 15000 } = {}) {
  const init = String((tg && tg.initData) || '').trim();
  if (!init) { const e = new Error('NO_TG'); e.code = 'NO_TG'; throw e; }
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(path, {
      method, cache: 'no-store', signal: ctl.signal,
      headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': init },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    let d = {};
    try { d = await r.json(); } catch (e) {}
    if (!r.ok || d.ok === false) {
      const e = new Error(d.error || `Server xatosi (${r.status})`);
      e.status = r.status; e.code = d.code || ''; throw e;
    }
    return d;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Server javob bermadi. Internetni tekshiring.');
    if (e instanceof TypeError) throw new Error('Internet aloqasi yo‘q. Qayta urinib ko‘ring.');
    throw e;
  } finally { clearTimeout(timer); }
}

function normSettings(s) {
  const o = Object.assign({}, s || {});
  const hm = v => /^\d{1,2}:\d{2}/.test(String(v || '')) ? String(v).slice(0, 5).padStart(5, '0') : null;
  o.work_start = hm(o.work_start) || '07:00';
  o.work_end = hm(o.work_end) || '19:00';
  if (toMin(o.work_end) <= toMin(o.work_start)) { o.work_start = '07:00'; o.work_end = '19:00'; }
  o.step = clamp(Math.round(Number(o.slot_step_min) || 60), 15, 240);
  if (typeof o.location === 'string') { try { o.location = JSON.parse(o.location); } catch (e) { o.location = { address: o.location }; } }
  if (!o.location || typeof o.location !== 'object') o.location = {};
  const off = [false, 'false', 0, '0', 'off', 'no'];
  o.bookingOn = !off.includes(o.booking_enabled);
  return o;
}

const DEF_T = { A: { half: 200000, hour: 350000 }, B: { half: 150000, hour: 250000 }, C: { half: 250000, hour: 400000 } };
function tariff(cat) {
  const k = String(cat || 'B').toLowerCase(), d = DEF_T[cat] || DEF_T.B;
  const h = Number(S.settings['half_' + k]), r = Number(S.settings['rate_' + k]);
  return { half: h > 0 ? h : d.half, hour: r > 0 ? r : d.hour };
}
function priceOf(opt, hours) {
  if (!opt) return 0;
  const minutes = unitOf(opt) * hours;
  if (opt.cat) {
    const t = tariff(opt.cat), m = Math.max(1, Math.round(minutes));
    return m === 30 ? Math.round(t.half) : Math.round(t.hour * m / 60);
  }
  return Math.round(Number(opt.course.price || 0) * hours);
}
const unitOf = opt => Math.max(15, Number(opt && opt.course && opt.course.duration_minutes) || 60);

/* --- kategoriyalar: faol mashg'ulotlardan --- */
const CAT_INFO = { A: 'Mototsikl', B: 'Yengil avto', C: 'Yuk avto' };
function options() {
  const byCat = {}, other = [];
  for (const c of S.courses) {
    const k = String(c.category || '').toUpperCase();
    if (/^[ABC]$/.test(k)) (byCat[k] = byCat[k] || []).push(c); else other.push(c);
  }
  const pick = list => [...list].sort((a, b) =>
    ((Number(a.duration_minutes) === 60 ? 0 : 1) - (Number(b.duration_minutes) === 60 ? 0 : 1)) ||
    (Number(a.duration_minutes) - Number(b.duration_minutes)))[0];
  const out = ['A', 'B', 'C'].filter(k => byCat[k]).map(k => ({ key: k, cat: k, course: pick(byCat[k]), title: k, sub: CAT_INFO[k] }));
  other.forEach(c => out.push({ key: 'c:' + c.id, cat: '', course: c, title: c.name || 'Mashg‘ulot', sub: fmtDur(c.duration_minutes) }));
  return out;
}
const curOpt = () => options().find(o => o.key === B.key) || null;
const insName = i => (i && (i.full_name || [i.first_name, i.last_name].filter(Boolean).join(' '))) || 'Instruktor';
const insCats = i => (Array.isArray(i.categories) && i.categories.length ? i.categories : ['B']).map(x => String(x).toUpperCase());
function catInstructors(opt = curOpt()) {
  if (!opt) return [];
  return S.instructors.filter(i => !opt.cat || insCats(i).includes(opt.cat));
}
const safeUrl = u => /^https?:\/\//i.test(String(u || '')) ? String(u).replace(/["'()\\\s]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase().padStart(2, '0')) : '';
const avatar = (i, cls = '') => {

async function boot() {
  applyTheme();
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { if (ver('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.onEvent('themeChanged', applyTheme); } catch (e) {}
    try { tg.BackButton.onClick(onBack); } catch (e) {}
  }
  if (!tg || !String(tg.initData || '').trim()) return renderFatal('tg');

  renderShell();
  renderSplash();
  const t0 = Date.now();
  const [me, st, cs, ins, bks, ct] = await Promise.allSettled([
    api.me(), api.settings(), api.courses(), api.instructors(), api.bookings(), api.content(),
  ]);
  if (me.status === 'rejected') return renderFatal('auth', me.reason && me.reason.message);
  S.me = me.value.profile || me.value.user || {};
  S.settings = normSettings(st.status === 'fulfilled' ? st.value.settings : {});
  S.courses = cs.status === 'fulfilled' ? (cs.value.courses || []) : [];
  S.instructors = ins.status === 'fulfilled' ? (ins.value.instructors || []) : [];
  S.bookings = bks.status === 'fulfilled' ? (bks.value.bookings || []) : [];
  S.media = ct.status === 'fulfilled' ? (ct.value.media || []) : [];
  S.loadErr = [cs, ins].some(x => x.status === 'rejected') ? 'Ba’zi ma’lumotlar yuklanmadi. Ilovani yopib qayta oching.' : '';
  S.ready = true;
  B.phone = S.me.phone || '';

  /* Logotip bir lahza ko'rinib tursin — ilova "sakrab" ochilmasin */
  const wait = 650 - (Date.now() - t0);
  if (wait > 0) await new Promise(r => setTimeout(r, wait));

  /* Birinchi kirish: avval telefon, keyin ism */
  if (!S.me.phone && store.get('onb_skip') !== '1') return startOnb();

  /* Bot havolasidan kelgan bo'lsa: t.me/bot?startapp=book */
  const sp = String((tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '').toLowerCase();
  const first = VIEWS.find(v => v !== 'onb' && sp.startsWith(v)) || (location.hash.slice(1) || 'home');
  go(first, false);
  loadNotes();
}

function applyTheme() {
  const root = document.documentElement;
  const scheme = (tg && tg.colorScheme) || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  root.dataset.theme = scheme === 'dark' ? 'dark' : 'light';
  const p = (tg && tg.themeParams) || {};
  const set = (k, v) => v ? root.style.setProperty(k, v) : root.style.removeProperty(k);
  set('--bg', p.secondary_bg_color);
  set('--card', p.section_bg_color || p.bg_color);
  set('--card-2', p.secondary_bg_color);
  set('--text', p.text_color);
  set('--hint', p.hint_color || p.subtitle_text_color);
  try {
    if (tg && ver('6.1')) {
      tg.setHeaderColor('secondary_bg_color');
      tg.setBackgroundColor('secondary_bg_color');
    }
    if (tg && ver('7.10')) tg.setBottomBarColor('bg_color');
  } catch (e) {}
}

/* =========================================================================
   ANIMATSIYA: ko'ringanda chiqish va raqamlarni sanash
   ========================================================================= */
let revealObs = null;
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function enhance() {
  const els = [...document.querySelectorAll('#main .rv:not(.in)')];
  if (!('IntersectionObserver' in window) || reduceMotion()) {
    els.forEach(el => { el.classList.add('in'); countUp(el); });
    return;
  }
  if (!revealObs) revealObs = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    en.target.classList.add('in');
    countUp(en.target);
    revealObs.unobserve(en.target);
  }), { threshold: 0.08, rootMargin: '0px 0px -4% 0px' });
  els.forEach(el => revealObs.observe(el));
}
function countUp(root) {
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = Number(el.dataset.count) || 0, dec = Number(el.dataset.dec) || 0;
    if (reduceMotion()) { el.textContent = to.toFixed(dec); return; }
    const t0 = performance.now(), T = 1100;
    const step = now => {
      const k = Math.min(1, (now - t0) / T), e = 1 - Math.pow(1 - k, 3);
      el.textContent = (to * e).toFixed(dec);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function confetti() {
  if (reduceMotion()) return;
  const box = document.createElement('div');
  box.className = 'confetti';
  const colors = ['#2b2f8f', '#4a50c8', '#f5b400', '#34c27b', '#60a5fa', '#fb7185', '#ffffff'];
  box.innerHTML = Array.from({ length: 70 }, () => {
    const x = (Math.random() * 2 - 1) * 120, r = 360 + Math.random() * 720;
    return `<i style="left:${Math.random() * 100}%;background:${colors[Math.floor(Math.random() * colors.length)]};--x:${x}px;--r:${r}deg;--t:${1.8 + Math.random() * 1.4}s;--dl:${Math.random() * .35}s;transform:rotate(${Math.random() * 180}deg)"></i>`;
  }).join('');
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3800);
}

const phoneDigits = v => { let d = String(v || '').replace(/\D/g, ''); if (d.length > 9 && d.startsWith('998')) d = d.slice(3); return d.slice(0, 9); };
const phoneMask = d => [d.slice(0, 2), d.slice(2, 5), d.slice(5, 7), d.slice(7, 9)].filter(Boolean).join(' ');
function renderOnb() {

function onbNext() {
  const o = S.onb;
  o.err = '';
  if (S.onbStep === 1) {
    o.phone = phoneDigits(($('#onbPhone') || {}).value);
    if (o.phone.length !== 9) {
      o.err = 'Raqamni to‘liq kiriting: 90 123 45 67';
      haptic.err(); render(); const el = $('#onbPhone'); if (el) el.focus(); return;
    }
    haptic.tap(); S.onbStep = 2; S.onbDir = 'f'; render(); syncBack();
    setTimeout(() => { const el = $(o.first ? '#onbLast' : '#onbFirst'); if (el) el.focus(); }, 280);
    return;

async function saveOnb() {
  const o = S.onb;
  o.saving = true; render();
  try {
    const body = { first_name: o.first, last_name: o.last, phone: '+998' + o.phone };
    if (o.contact && o.contactPhone === o.phone) body.contact = o.contact;   // Telegram tasdiqlagan raqam
    const r = await api.saveMe(body);
    S.me = r.profile || r.user || Object.assign({}, S.me, { phone: '+998' + o.phone, first_name: o.first, last_name: o.last });
    if (r.linked) { const b = await api.bookings().catch(() => null); if (b) S.bookings = b.bookings || []; }
    B.phone = S.me.phone || '';
    haptic.ok();
    o.saving = false;
    sayHello();
  } catch (e) {
    o.saving = false;
    o.err = e.message;
    o.code = e.code || '';
    /* Raqam band bo'lsa — raqam ekraniga qaytamiz. Kassada ro'yxatdan o'tgan
       mijoz Telegram raqamini yuborib, eski hisobini ulaydi. */
    if (/^PHONE_/.test(o.code) || /telefon|raqam/i.test(e.message)) S.onbStep = 1;
    haptic.err(); render(); syncBack();
  }
}
/* Raqam band va Telegram orqali tasdiqlab bo'lmasa — mijoz to'xtab qolmasin.
   Ismni saqlaymiz, raqamni admin keyin ulaydi. Shu qurilmada qayta so'ramaymiz. */
async function onbSkip() {
  const o = S.onb;
  o.saving = true; render();
  try {
    const first = o.first || (S.me && S.me.first_name) || '';

  o.saving = false;
  store.set('onb_skip', '1');

function shareContact() {
  try {
    tg.requestContact((ok, res) => {
      const ph = ok && res && res.responseUnsafe && res.responseUnsafe.contact && res.responseUnsafe.contact.phone_number;
      if (ph) {

/* Muqova: rasmlar o'zi almashadi, nuqtalar ko'rsatib turadi */
let coverTimer = 0;
function initCover() {
  clearInterval(coverTimer);
  const tr = $('#coverTrack'), dots = $('#coverDots');
  if (!tr || !dots) return;
  const n = tr.children.length;
  const cur = () => Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth));
  tr.addEventListener('scroll', () => { const k = cur(); [...dots.children].forEach((d, i) => d.classList.toggle('on', i === k)); }, { passive: true });
  if (reduceMotion()) return;
  coverTimer = setInterval(() => {
    if (!document.body.contains(tr)) return clearInterval(coverTimer);
    if (document.hidden || viewerOpen()) return;
    tr.scrollTo({ left: ((cur() + 1) % n) * tr.clientWidth, behavior: 'smooth' });
  }, 4200);
}
/* Bo'limlar tugmasi: qaysi bo'lim ko'rinib turgan bo'lsa o'sha yonadi */
let navObs = null;
function initChipsNav() {
  if (navObs) navObs.disconnect();
  if (!('IntersectionObserver' in window)) return;
  navObs = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    document.querySelectorAll('#chipsnav button').forEach(b => {
      const on = b.dataset.v === e.target.id;
      b.classList.toggle('on', on);
      if (on) b.scrollIntoView({ inline: 'nearest', block: 'nearest' });
    });
  }), { rootMargin: '-30% 0px -60% 0px' });
  document.querySelectorAll('#main .asec').forEach(s => navObs.observe(s));
  const firstOn = () => { if (S.view !== 'about' || window.scrollY > 260) return;
    document.querySelectorAll('#chipsnav button').forEach((b, i) => b.classList.toggle('on', i === 0)); };
  window.removeEventListener('scroll', S.chipScroll || (() => {}));
  S.chipScroll = firstOn; window.addEventListener('scroll', firstOn, { passive: true }); firstOn();
}

const V = { list: [], i: 0 };
const viewerOpen = () => !!$('#viewer');
function openViewer(list, i) {
  if (!list.length) return;

  let el = $('#viewer');
  if (!el) {
    el = document.createElement('div');
    el.id = 'viewer'; el.className = 'viewer'; el.setAttribute('role', 'dialog');
    document.body.appendChild(el);
    let x0 = null;
    el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
    el.addEventListener('touchend', e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 50) viewerStep(dx < 0 ? 1 : -1);
    });

/* =========================================================================
   BRON QILISH — bosqichma-bosqich. Ilova o'zi yetaklaydi:
   har tanlovdan keyin keyingi bosqich O'ZI ochiladi.

   Vaqt bo'yicha (standart):
     toifa → necha soat → kun va vaqt → SHU VAQTDA BO'SH instruktorlar → tasdiq
   Instruktor bo'yicha:
     toifa → necha soat → instruktor → UNING bo'sh vaqtlari → tasdiq
   ========================================================================= */
const CAT_LONG = { A: 'Mototsikl', B: 'Yengil avtomobil', C: 'Yuk avtomobili' };
const stepsOf = () => B.mode === 'ins' ? ['cat', 'dur', 'ins', 'time', 'confirm'] : ['cat', 'dur', 'time', 'ins', 'confirm'];
const selIns = () => S.instructors.find(i => String(i.id) === String(B.ins)) || null;
const byRating = (a, b) => ((Number(b.rating) || 0) - (Number(a.rating) || 0)) || ((Number(b.total_reviews) || 0) - (Number(a.total_reviews) || 0));

/** Yangi bronni boshlash. key — toifa oldindan tanlangan bo'lsa, ins — instruktor. */
function startBook({ key = '', ins = '' } = {}) {
  Object.assign(B, {
    started: true, step: 'cat', mode: 'time', key: '', hours: 0, date: '', time: '', ins: '', auto: false,
    insLocked: false, note: '', showNote: false, busy: {}, loading: false, err: '', done: null, dir: 'f', advancing: false,
  });
  B.token++;
  const opts = options();
  if (ins && S.instructors.some(i => String(i.id) === String(ins))) {
    B.mode = 'ins'; B.ins = String(ins); B.insLocked = true;
    const can = opts.filter(o => catInstructors(o).some(i => String(i.id) === B.ins));
    if (!key && can.length === 1) key = can[0].key;
  }
  if (!key && opts.length === 1) key = opts[0].key;
  if (key && opts.some(o => o.key === key)) { B.key = key; B.step = 'dur'; }
}

function maxHours(opt) {
  if (!opt) return 1;
  const span = toMin(S.settings.work_end) - toMin(S.settings.work_start);
  return clamp(Math.floor(span / unitOf(opt)), 1, 8);
}
const dur = () => unitOf(curOpt()) * (B.hours || 1);
function slotsFor(date) {
  const st = toMin(S.settings.work_start), en = toMin(S.settings.work_end), step = S.settings.step, d = dur();
  const cut = Date.now() + 10 * 60000;   // 10 daqiqadan keyingi vaqtlar
  const out = [];
  for (let m = st; m + d <= en; m += step) {
    const t = fromMin(m);
    out.push({ t, past: at(date, t).getTime() < cut });
  }
  return out;
}
function firstOpenDay() {
  const t = ymd();
  return slotsFor(t).some(s => !s.past) ? t : addDays(t, 1);
}
/* Qaysi instruktorlarning bandligi kerak: vaqt bo'yicha — hammasi, instruktor bo'yicha — faqat tanlangani */
const candidates = () => (B.mode === 'ins' && B.ins) ? catInstructors().filter(i => String(i.id) === B.ins) : catInstructors();
function freeFor(time) {
  const s = at(B.date, time).getTime(), e = s + dur() * 60000;
  return candidates().filter(i => {
    const v = B.busy[i.id];
    return Array.isArray(v) && !v.some(([a, b]) => s < b && e > a);
  });
}
async function ensureBusy(force = false) {
  const list = candidates(), date = B.date, tok = ++B.token;
  if (!list.length) { B.loading = false; B.busy = {}; return renderTimes(); }
  const fresh = list.every(i => { const c = CACHE.get(i.id + '|' + date); return c && Date.now() - c.t < 45000; });
  if (!fresh || force) { B.loading = true; renderTimes(); }
  const res = await Promise.all(list.map(async i => {
    const k = i.id + '|' + date, c = CACHE.get(k);
    if (!force && c && Date.now() - c.t < 45000) return [i.id, c.v];
    try {
      const r = await api.busy(i.id, date);
      const v = (r.busy || []).map(x => [Date.parse(x.start_at), Date.parse(x.end_at)]).filter(x => x[0] && x[1]);
      CACHE.set(k, { t: Date.now(), v });
      return [i.id, v];
    } catch (e) { return [i.id, null]; }
  }));
  if (tok !== B.token) return;       // foydalanuvchi boshqa kunni tanlab bo'ldi
  B.busy = Object.fromEntries(res);
  B.loading = false;
  B.err = res.length && res.every(x => x[1] === null) ? 'Band vaqtlarni yuklab bo‘lmadi.' : '';
  if (B.step === 'time' && B.time && !(slotsFor(B.date).some(s => s.t === B.time && !s.past) && freeFor(B.time).length)) B.time = '';
  renderTimes();
}

async function submitBooking() {
  if (B.sending) return;

  if (!opt) return bookGo('cat', 'b');

  let phone = null;
  if (!S.me.phone) {

      const el = $('#phoneIn'); if (el) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      return;

  B.sending = true; renderBar();
  try {
    if (phone) {
      /* Raqam band bo'lsa ham bron to'xtamasin — admin raqamni keyin ulaydi */
      try {
        const r = await api.saveMe({ phone });
        S.me = r.profile || r.user || Object.assign({}, S.me, { phone });
      } catch (e) {
        if (!/^PHONE_/.test(e.code || '') && !/telefon|raqam/i.test(e.message)) throw e;
        B.phone = ''; store.set('onb_skip', '1');

    }
    const r = await api.book({
      instructor_id: who.id,
      course_id: opt.course.id,
      hours: B.hours,
      start_at: `${B.date}T${B.time}:00+05:00`,
      customer_note: B.note.trim() || undefined,
    });
    haptic.ok();
    CACHE.clear();
    const bk = r.booking || {};
    S.bookings = [bk, ...S.bookings.filter(x => x.id !== bk.id)];
    B.done = {
      code: bk.pickup_code || '',
      when: whenText(bk.start_at || `${B.date}T${B.time}:00+05:00`),
      cat: opt.cat ? `${opt.cat} — ${CAT_LONG[opt.cat]}` : opt.title,
      dur: fmtDur(bk.duration_minutes || dur()),
      ins: insName(who),
      price: bk.price || bk.total_price || priceOf(opt, B.hours),
    };
    B.sending = false;
    hideToast(); render(); window.scrollTo(0, 0); syncBack();
    refreshBookings();
  } catch (e) {
    haptic.err();

      CACHE.clear(); B.time = '';
      if (B.mode === 'time') { B.ins = ''; B.auto = false; }

  } finally {

  }
}

async function loadChat(silent) {

    const r = await api.support();

    S.msgsLoaded = true;

  }

async function sendChat(text) {
  text = String(text || '').trim();
  if (!text) return;
  const tmp = { body: text, sender: 'customer', created_at: new Date().toISOString(), _sending: true };
  S.msgs.push(tmp); S.msgsLoaded = true;
  $('#msgs').innerHTML = chatHtml(); scrollChat();
  const inp = $('#chatIn'); if (inp) { inp.value = ''; autoGrow(inp); $('#sendBtn').disabled = true; }
  try {
    const r = await api.send(text);
    Object.assign(tmp, r.message || {}, { _sending: false });
    haptic.tap();
  } catch (e) {
    S.msgs = S.msgs.filter(m => m !== tmp);
    toast(e.message, true);
    if (inp && !inp.value) inp.value = text;
  }
  if (S.view === 'support') { $('#msgs').innerHTML = chatHtml(); scrollChat(); }
}

/* =========================================================================
   HODISALAR — bitta tinglovchi
   ========================================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (e.target.id === 'sheetBg') closeSheet(); return; }
  const v = el.dataset.v, act = el.dataset.act;
  switch (act) {
    case 'go': if (sheetOpen()) closeSheet(); haptic.tap(); go(v); break;
    case 'about': haptic.tap(); go('about', true, v || ''); break;
    case 'jump': { const t = document.getElementById(v); if (t) { haptic.tap(); t.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' }); } break; }
    case 'gallery': haptic.tap(); openViewer(gallery(), Number(v) || 0); break;
    case 'viewer': haptic.tap(); openViewer(coverMedia(), Number(v) || 0); break;
    case 'vstep': viewerStep(Number(v)); break;
    case 'closeviewer': closeViewer(); break;
    case 'onbnext': onbNext(); break;
    case 'sharecontact': shareContact(); break;
    case 'onbskip': onbSkip(); break;
    case 'reload': location.reload(); break;
    case 'quickcat': haptic.tap(); startBook({ key: v }); go('book'); break;
    /* --- bron bosqichlari: tanlangach keyingisi o'zi ochiladi --- */
    case 'wzcat':
      if (el.disabled) break;
      if (B.key !== v) { B.key = v; B.hours = 0; B.time = ''; if (!B.insLocked) { B.ins = ''; B.auto = false; } }
      haptic.tap(); markOn(el); advance(); break;
    case 'wzdur':
      if (B.hours !== Number(v)) { B.hours = Number(v); B.time = ''; if (B.mode === 'time') { B.ins = ''; B.auto = false; } }
      haptic.tap(); markOn(el); advance(); break;
    case 'wzday': if (B.date !== v) { B.date = v; B.time = ''; haptic.tap(); render(); ensureBusy(); } break;
    case 'wztime':
      if (el.disabled) break;
      B.time = v; if (B.mode === 'time') { B.ins = ''; B.auto = false; }
      haptic.tap(); markOn(el); advance(); break;
    case 'wzins':
      if (v === 'auto') { const best = freeFor(B.time).sort(byRating)[0]; if (!best) break; B.ins = String(best.id); B.auto = true; }
      else { if (B.mode === 'ins' && B.ins !== v) B.time = ''; B.ins = v; B.auto = false; }
      haptic.tap(); markOn(el.closest('.opt') || el); advance(); break;
    case 'wzmode':
      haptic.tap(); B.mode = v; B.ins = ''; B.auto = false; B.insLocked = false; B.time = '';
      bookGo(v === 'ins' ? 'ins' : 'time'); break;
    case 'wzjump': haptic.tap(); bookGo(v, 'b'); break;
    case 'wzback': haptic.tap(); prevStep(); break;
    case 'wznew': haptic.tap(); startBook(); render(); window.scrollTo(0, 0); break;
    case 'retry': ensureBusy(true); break;
    case 'shownote': B.showNote = true; render(); setTimeout(() => { const n = $('#noteIn'); if (n) n.focus(); }, 30); break;
    case 'submit': submitBooking(); break;
    case 'gobookings': closeSheet(); S.bkTab = 'active'; go('bookings'); break;
    case 'tab': S.bkTab = v; haptic.tap(); render(); break;
    case 'refresh': haptic.tap(); refreshBookings().then(() => toast('Yangilandi')); break;
    case 'cancel': openCancel(v); break;
    case 'reason': { const t = $('#reasonIn'); if (t) t.value = v; document.querySelectorAll('.reasons button').forEach(b => b.classList.toggle('on', b === el)); haptic.tap(); break; }
    case 'docancel': doCancel(v, el); break;
    case 'review': openReview(v); break;
    case 'star': stars = Number(v); document.querySelectorAll('#stars button').forEach((b, n) => b.classList.toggle('on', n < stars)); haptic.tap(); break;
    case 'doreview': doReview(v, el); break;
    case 'copy': copyText(v); break;
    case 'notes': openNotes(); break;
    case 'location': openLocation(); break;
    case 'link': openLink(v); break;
    case 'ins': openInstructor(v); break;
    case 'bookwith': closeSheet(); startBook({ ins: v }); go('book'); break;
    case 'editme': openEditMe(); break;
    case 'saveme': saveMe(el); break;
    case 'send': { const t = $('#chatIn'); if (t) sendChat(t.value); break; }
    case 'quick': sendChat(v); break;
    case 'closesheet': closeSheet(); break;
  }
});

/* Tanlangan tugmani darhol belgilaymiz — keyingi bosqich ochilguncha ko'rinib turadi */
function markOn(el) {
  const box = el.parentElement;
  if (box) box.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
  el.classList.add('on');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && viewerOpen()) return closeViewer();
  if (viewerOpen() && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) return viewerStep(e.key === 'ArrowRight' ? 1 : -1);
  if (e.key === 'Enter' && S.view === 'onb' && e.target && /^onb/.test(e.target.id)) { e.preventDefault(); return onbNext(); }
  if (e.key === 'Escape' && sheetOpen()) closeSheet();
  if (e.target && e.target.id === 'chatIn' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(e.target.value); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'onbPhone') { const d = phoneDigits(t.value); S.onb.phone = d; t.value = phoneMask(d); if (d.length === 9) haptic.tap(); }
  if (/^onb/.test(t.id) && S.onb.err) { S.onb.err = ''; const e = $('.onb-err'); if (e) e.remove(); }
  if (t.id === 'onbFirst') S.onb.first = t.value;
  if (t.id === 'onbLast') S.onb.last = t.value;
  if (t.id === 'noteIn') B.note = t.value;
  if (t.id === 'phoneIn') B.phone = t.value;
  if (t.id === 'chatIn') { autoGrow(t); $('#sendBtn').disabled = !t.value.trim(); }
});
/* Ilovaga qaytganda — bronlar holatini yangilaymiz */
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !S.ready || S.view === 'onb') return;
  refreshBookings(); loadNotes();
  if (S.view === 'book' && B.step === 'time') ensureBusy(true);
});

boot().catch(e => renderFatal('auth', e && e.message));
})();
</script>
</body>
</html>
